<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | KlassKit</title>
  <link rel="icon" type="image/x-icon" href="../media/icon.ico" />
  <link rel="icon" type="image/webp" href="../media/icon.webp" />
  <link rel="apple-touch-icon" href="../media/icon-180.png" />
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#1ea7fd">

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.4"></script>
  <script defer src="../supabase.js"></script>
  <script src="https://unpkg.com/lucide@1.16.0"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="../css/tailwind.generated.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/api.css">

  <script src="../js/theme-init.js"></script>
  <script defer src="/js/analytics.js"></script>
</head>

<body class="min-h-screen flex items-center justify-center px-4 py-8 sm:p-6 selection:bg-orange selection:text-white relative">

  <main id="reset-card"
    style="--focus-accent: var(--color-orange, #ff7e33); --focus-shadow: rgb(var(--color-orange-rgb) / 0.25);"
    class="glass-card w-full max-w-[440px] p-6 sm:p-8 rounded-[2rem] animate-pop-in relative z-10">

    <div class="flex items-center justify-between gap-3 mb-6">
      <a href="../index.html?home=1" class="link-focus inline-flex items-center gap-2.5 text-left group">
        <img src="../media/icon.webp" alt="KlassKit"
          class="w-9 h-9 rounded-xl border-2 border-line object-contain bg-card p-0.5 shadow-hard-sm">
        <span class="font-heading font-bold text-lg uppercase tracking-tight text-ink group-hover:text-blue transition-colors">
          KlassKit
        </span>
      </a>
      <button id="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle dark mode" aria-pressed="false" title="Toggle dark mode"
        class="btn-chunky w-10 h-10 rounded-xl bg-card/90 text-ink dark:text-yellow-400 flex items-center justify-center shrink-0">
        <i data-lucide="moon" class="w-5 h-5 dark:hidden" aria-hidden="true"></i>
        <i data-lucide="sun" class="w-5 h-5 hidden dark:block" aria-hidden="true"></i>
      </button>
    </div>

    <div class="text-center mb-6">
      <div class="relative inline-block mb-3.5">
        <span class="absolute -top-1.5 -left-2 w-3.5 h-3.5 rounded-full bg-pink border-2 border-line" aria-hidden="true"></span>
        <span class="absolute -bottom-1 -right-2 w-3 h-3 rounded-full bg-blue border-2 border-line" aria-hidden="true"></span>
        <div
          class="w-16 h-16 sm:w-[72px] sm:h-[72px] bg-orange rounded-2xl border-[3px] border-line flex items-center justify-center mx-auto -rotate-3 hover:rotate-0 transition-transform shadow-hard dark:shadow-hard-dark">
          <i data-lucide="key-round" class="w-8 h-8 text-white" aria-hidden="true"></i>
        </div>
      </div>
      <div class="mb-2.5">
        <span class="api-status-pill bg-orange/15 border-orange text-orange-700 dark:text-orange-300">
          Account Recovery
        </span>
      </div>
      <h1 class="font-heading text-3xl sm:text-4xl font-bold text-ink uppercase tracking-tight leading-none">
        New Password
      </h1>
      <p class="text-ink-muted font-bold text-sm sm:text-base mt-2">
        Secure your KlassKit account
      </p>
    </div>

    <div id="recovery-loading" role="status" aria-live="polite"
      class="py-6 flex flex-col items-center justify-center gap-3 text-ink-muted font-bold text-sm">
      <i data-lucide="loader-2" class="w-6 h-6 animate-spin text-orange" aria-hidden="true"></i>
      <span>Verifying recovery link...</span>
    </div>

    <div id="recovery-invalid" class="hidden space-y-4">
      <div class="p-4 rounded-xl border-[3px] border-pink bg-pink/10 dark:bg-pink/15 text-pink-700 dark:text-pink-300 text-sm font-bold flex items-start gap-2.5 text-left animate-shake">
        <i data-lucide="alert-circle" class="w-5 h-5 shrink-0 mt-0.5" aria-hidden="true"></i>
        <span id="invalid-reason">Invalid or expired recovery link.</span>
      </div>

      <a href="../login.html?tab=forgot"
        class="btn-chunky w-full py-3.5 rounded-2xl bg-orange text-white font-heading font-bold text-base uppercase tracking-wider flex items-center justify-center gap-2">
        <i data-lucide="mail" class="w-5 h-5" aria-hidden="true"></i>
        <span>Request New Reset Link</span>
      </a>

      <a href="../login.html"
        class="btn-chunky w-full py-3 rounded-2xl bg-card text-ink font-heading font-bold text-sm uppercase tracking-wider flex items-center justify-center gap-2">
        <i data-lucide="log-in" class="w-4 h-4 text-blue" aria-hidden="true"></i>
        <span>Back to Sign In</span>
      </a>
    </div>

    <form id="resetForm" class="hidden space-y-4" novalidate>
      <div class="space-y-1.5">
        <label for="newPassword" class="block text-xs font-extrabold text-dark dark:text-slate-300 ml-1 uppercase tracking-wider">
          New Password
        </label>
        <div class="relative input-wrap">
          <i data-lucide="lock" class="input-icon pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 transition-colors" aria-hidden="true"></i>
          <input type="password" id="newPassword" autocomplete="new-password" minlength="6" required
            class="auth-input pl-12 pr-12" placeholder="••••••••" oninput="handlePasswordInput()">
          <button type="button" onclick="togglePasswordVisibility('newPassword', this)"
            aria-label="Show password" aria-pressed="false"
            class="pw-toggle absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 flex items-center justify-center rounded-full text-slate-400 hover:text-orange dark:hover:text-orange transition-colors">
            <i data-lucide="eye-off" class="w-5 h-5" aria-hidden="true"></i>
          </button>
        </div>

        <div id="strength-wrap" class="px-1 pt-1 space-y-1">
          <div id="strength-meter" class="grid grid-cols-4 gap-1.5" aria-hidden="true">
            <div class="strength-segment bg-slate-200 dark:bg-slate-700"></div>
            <div class="strength-segment bg-slate-200 dark:bg-slate-700"></div>
            <div class="strength-segment bg-slate-200 dark:bg-slate-700"></div>
            <div class="strength-segment bg-slate-200 dark:bg-slate-700"></div>
          </div>
          <p id="strength-label" class="text-[11px] font-extrabold text-slate-500 dark:text-slate-400">
            At least 6 characters
          </p>
        </div>
      </div>

      <div class="space-y-1.5">
        <label for="confirmPassword" class="block text-xs font-extrabold text-dark dark:text-slate-300 ml-1 uppercase tracking-wider">
          Confirm Password
        </label>
        <div class="relative input-wrap">
          <i data-lucide="shield-check" class="input-icon pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 transition-colors" aria-hidden="true"></i>
          <input type="password" id="confirmPassword" autocomplete="new-password" minlength="6" required
            class="auth-input pl-12 pr-12" placeholder="••••••••" oninput="checkPasswordMatch()">
          <button type="button" onclick="togglePasswordVisibility('confirmPassword', this)"
            aria-label="Show password" aria-pressed="false"
            class="pw-toggle absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 flex items-center justify-center rounded-full text-slate-400 hover:text-orange dark:hover:text-orange transition-colors">
            <i data-lucide="eye-off" class="w-5 h-5" aria-hidden="true"></i>
          </button>
        </div>
        <p id="password-match-msg" class="hidden items-center gap-1.5 text-xs font-extrabold ml-1"></p>
      </div>

      <div id="message" role="alert" aria-live="polite" class="hidden"></div>

      <button type="submit" id="submitBtn" data-icon="arrow-right"
        class="btn-chunky w-full py-3.5 rounded-2xl bg-orange text-white font-heading font-bold text-lg uppercase tracking-wider flex items-center justify-center gap-2">
        <span class="btn-label">Update Password</span>
        <span class="btn-icon inline-flex items-center justify-center">
          <i data-lucide="arrow-right" class="w-5 h-5" aria-hidden="true"></i>
        </span>
      </button>
    </form>

    <div id="recovery-success" class="hidden text-center space-y-5">
      <div class="p-4 rounded-2xl border-[3px] border-green bg-green/10 dark:bg-green/15 text-green-700 dark:text-green-300 space-y-1 animate-pop-in">
        <div class="flex items-center justify-center gap-2 font-heading font-bold text-lg uppercase tracking-tight">
          <i data-lucide="check-circle" class="w-5 h-5 shrink-0" aria-hidden="true"></i>
          <span>Password Updated!</span>
        </div>
        <p class="text-xs sm:text-sm font-bold opacity-90">
          Redirecting you to Sign In...
        </p>
      </div>

      <a href="../login.html"
        class="btn-chunky w-full py-3.5 rounded-2xl bg-green text-white font-heading font-bold text-lg uppercase tracking-wider flex items-center justify-center gap-2">
        <span>Sign In Now</span>
        <i data-lucide="log-in" class="w-5 h-5" aria-hidden="true"></i>
      </a>
    </div>

    <div class="mt-7 pt-5 border-t-2 border-line-muted/80 text-center">
      <a href="../login.html"
        class="link-focus group inline-flex items-center gap-2 text-sm font-extrabold text-ink-muted hover:text-blue dark:hover:text-blue transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4 transition-transform group-hover:-translate-x-1" aria-hidden="true"></i>
        <span>Back to Sign In</span>
      </a>
    </div>
  </main>

  <script>
    let currentViewState = 'loading';

    function refreshIcons() {
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    }

    function syncThemeToggleState() {
      const btn = document.getElementById('theme-toggle');
      if (btn) {
        btn.setAttribute('aria-pressed', String(document.documentElement.classList.contains('dark')));
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme_hub', JSON.stringify(isDark ? 'dark' : 'light'));
      syncThemeToggleState();
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input || !btn) return;
      const isVisible = input.type === 'text';

      input.type = isVisible ? 'password' : 'text';
      const newIcon = isVisible ? 'eye-off' : 'eye';
      btn.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
      btn.setAttribute('aria-pressed', String(!isVisible));
      btn.innerHTML = `<i data-lucide="${newIcon}" class="w-5 h-5" aria-hidden="true"></i>`;
      refreshIcons();
    }

    function updateStrengthMeter(password) {
      const segments = document.querySelectorAll('#strength-meter .strength-segment');
      const label = document.getElementById('strength-label');
      if (!segments.length || !label) return;

      const val = String(password || '');
      let score = 0;
      if (val.length >= 6) {
        score = 1;
        if (val.length >= 10) score++;
        if ((/[a-z]/.test(val) && /[A-Z]/.test(val)) || /\d/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;
      }

      const tiers = {
        0: { text: val.length > 0 ? 'Too short (use at least 6 characters)' : 'At least 6 characters', color: '', textClass: 'text-[11px] font-extrabold text-slate-500 dark:text-slate-400' },
        1: { text: 'Strength: Weak', color: 'bg-pink', textClass: 'text-[11px] font-extrabold text-pink-700 dark:text-pink-300' },
        2: { text: 'Strength: Fair', color: 'bg-orange', textClass: 'text-[11px] font-extrabold text-orange-700 dark:text-orange-300' },
        3: { text: 'Strength: Good', color: 'bg-blue', textClass: 'text-[11px] font-extrabold text-blue-700 dark:text-blue-300' },
        4: { text: 'Strength: Strong', color: 'bg-green', textClass: 'text-[11px] font-extrabold text-green-700 dark:text-green-300' }
      };

      const tier = tiers[score] || tiers[0];
      segments.forEach((seg, idx) => {
        seg.className = idx < score && tier.color
          ? `strength-segment ${tier.color}`
          : 'strength-segment bg-slate-200 dark:bg-slate-700';
      });
      label.className = tier.textClass;
      label.textContent = tier.text;
    }

    function checkPasswordMatch() {
      const pass = document.getElementById('newPassword');
      const confirm = document.getElementById('confirmPassword');
      const msg = document.getElementById('password-match-msg');
      if (!pass || !confirm || !msg) return;

      if (!confirm.value) {
        confirm.classList.remove('input-match', 'input-mismatch');
        msg.dataset.state = 'empty';
        msg.className = 'hidden items-center gap-1.5 text-xs font-extrabold ml-1';
        msg.textContent = '';
        return;
      }

      if (pass.value === confirm.value) {
        confirm.classList.add('input-match');
        confirm.classList.remove('input-mismatch');
        msg.className = 'flex items-center gap-1.5 text-xs font-extrabold ml-1 text-green-700 dark:text-green-300';
        if (msg.dataset.state !== 'match') {
          msg.dataset.state = 'match';
          msg.innerHTML = '<i data-lucide="check-circle" class="w-3.5 h-3.5 shrink-0" aria-hidden="true"></i><span>Passwords match!</span>';
          refreshIcons();
        }
      } else {
        confirm.classList.add('input-mismatch');
        confirm.classList.remove('input-match');
        msg.className = 'flex items-center gap-1.5 text-xs font-extrabold ml-1 text-pink-700 dark:text-pink-300';
        if (msg.dataset.state !== 'mismatch') {
          msg.dataset.state = 'mismatch';
          msg.innerHTML = '<i data-lucide="alert-circle" class="w-3.5 h-3.5 shrink-0" aria-hidden="true"></i><span>Passwords do not match</span>';
          refreshIcons();
        }
      }
    }

    function handlePasswordInput() {
      const pass = document.getElementById('newPassword');
      updateStrengthMeter(pass?.value || '');
      checkPasswordMatch();
    }

    function setViewState(nextState) {
      currentViewState = nextState;
      const loadingEl = document.getElementById('recovery-loading');
      const invalidEl = document.getElementById('recovery-invalid');
      const formEl = document.getElementById('resetForm');
      const successEl = document.getElementById('recovery-success');

      if (loadingEl) loadingEl.classList.toggle('hidden', nextState !== 'loading');
      if (invalidEl) invalidEl.classList.toggle('hidden', nextState !== 'invalid');
      if (formEl) formEl.classList.toggle('hidden', nextState !== 'form');
      if (successEl) successEl.classList.toggle('hidden', nextState !== 'success');
      refreshIcons();
    }

    function showResetForm() {
      if (currentViewState === 'success') return;
      setViewState('form');
    }

    function showInvalidState(reason) {
      if (currentViewState === 'success' || currentViewState === 'form') return;
      const reasonEl = document.getElementById('invalid-reason');
      if (reasonEl) reasonEl.textContent = reason;
      setViewState('invalid');
    }

    function scrubAuthUrl() {
      if (window.location.hash || window.location.search) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }

    function hideMessage() {
      const el = document.getElementById('message');
      if (!el) return;
      el.className = 'hidden';
      el.textContent = '';
    }

    function showFeedback(text, isError) {
      const el = document.getElementById('message');
      if (!el) return;

      el.className = isError
        ? 'p-3.5 rounded-xl border-[3px] border-pink bg-pink/10 dark:bg-pink/15 text-pink-700 dark:text-pink-300 text-sm font-bold flex items-center justify-center gap-2 animate-shake'
        : 'p-3.5 rounded-xl border-[3px] border-green bg-green/10 dark:bg-green/15 text-green-700 dark:text-green-300 text-sm font-bold flex items-center justify-center gap-2 animate-pop-in';

      el.textContent = '';
      const icon = document.createElement('i');
      icon.setAttribute('data-lucide', isError ? 'alert-circle' : 'check-circle');
      icon.className = 'w-4 h-4 shrink-0';
      icon.setAttribute('aria-hidden', 'true');

      const span = document.createElement('span');
      span.textContent = text;

      el.appendChild(icon);
      el.appendChild(span);
      refreshIcons();
    }

    function humanizeError(err) {
      const msg = typeof err === 'string' ? err : (err?.message || 'Unable to update password. Please try again.');
      const map = {
        'New password should be different from the old password.': 'Please choose a different password from your previous one.',
        'Auth session missing!': 'Your recovery session expired. Request a new reset link.'
      };
      return map[msg] ?? msg;
    }

    function setLoading(btn, loading, originalText) {
      if (!btn) return;
      btn.disabled = loading;
      btn.setAttribute('aria-busy', String(loading));

      const label = btn.querySelector('.btn-label');
      const iconWrap = btn.querySelector('.btn-icon');
      if (label) label.textContent = loading ? 'Updating...' : originalText;
      if (iconWrap) {
        const iconName = loading ? 'loader-2' : btn.dataset.icon;
        iconWrap.innerHTML = `<i data-lucide="${iconName}" class="w-5 h-5${loading ? ' animate-spin' : ''}" aria-hidden="true"></i>`;
      }
      refreshIcons();
    }

    window.addEventListener('load', async () => {
      const searchParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.substring(1));

      const err = hashParams.get('error') || searchParams.get('error');
      const errDesc = hashParams.get('error_description') || searchParams.get('error_description');
      const errCode = hashParams.get('error_code') || searchParams.get('error_code');

      if (err || errDesc || errCode) {
        showInvalidState(errDesc || 'This password reset link is invalid or has expired.');
        scrubAuthUrl();
        return;
      }

      if (typeof db === 'undefined') {
        showInvalidState('Authentication service unavailable. Please refresh and try again.');
        return;
      }

      if (db.auth && typeof db.auth.onAuthStateChange === 'function') {
        db.auth.onAuthStateChange((event, session) => {
          if (currentViewState === 'success') return;
          if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
            showResetForm();
            scrubAuthUrl();
          }
        });
      }

      const accessToken = hashParams.get('access_token') || searchParams.get('access_token');
      const refreshToken = hashParams.get('refresh_token') || searchParams.get('refresh_token');
      const code = searchParams.get('code');
      const hasAuthParams = Boolean(accessToken || refreshToken || code || window.location.hash);

      try {
        const { data: { session: existing } } = await db.auth.getSession();
        if (existing) {
          showResetForm();
          if (hasAuthParams) scrubAuthUrl();
          return;
        }

        if (accessToken && refreshToken) {
          const { error } = await db.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });
          if (error) {
            showInvalidState(error.message || 'This password reset link is invalid or has expired.');
            scrubAuthUrl();
            return;
          }
          showResetForm();
          scrubAuthUrl();
          return;
        }

        if (code && typeof db.auth.exchangeCodeForSession === 'function') {
          const { error } = await db.auth.exchangeCodeForSession(code);
          if (error) {
            showInvalidState(error.message || 'This password reset link is invalid or has expired.');
            scrubAuthUrl();
            return;
          }
          showResetForm();
          scrubAuthUrl();
          return;
        }

        if (typeof isSandbox === 'function' && isSandbox()) {
          showInvalidState('Password reset is unavailable in Sandbox Mode. Sign in with a KlassKit account to manage passwords.');
          return;
        }

        showInvalidState('This page requires a valid password reset link from your email.');
      } catch (errObj) {
        showInvalidState(humanizeError(errObj));
      }
    });

    const resetForm = document.getElementById('resetForm');
    if (resetForm) {
      resetForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const newPassword = document.getElementById('newPassword')?.value || '';
        const confirmPassword = document.getElementById('confirmPassword')?.value || '';
        const submitBtn = document.getElementById('submitBtn');

        if (!submitBtn || submitBtn.disabled) return;
        hideMessage();

        if (newPassword.length < 6) {
          showFeedback('Password must be at least 6 characters.', true);
          return;
        }
        if (newPassword !== confirmPassword) {
          showFeedback('Passwords do not match. Please try again.', true);
          return;
        }

        setLoading(submitBtn, true, 'Update Password');
        try {
          if (typeof updatePassword !== 'function') {
            throw new Error('Authentication service unavailable. Please refresh and try again.');
          }
          const { error } = await updatePassword(newPassword);
          if (error) {
            setLoading(submitBtn, false, 'Update Password');
            showFeedback(humanizeError(error), true);
            return;
          }

          setViewState('success');
          setTimeout(() => {
            window.location.href = '../login.html';
          }, 2500);
        } catch (errObj) {
          setLoading(submitBtn, false, 'Update Password');
          showFeedback(humanizeError(errObj), true);
        }
      });
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../sw.js')
          .then(reg => console.log('SW Registered!', reg))
          .catch(err => console.log('SW Reg error:', err));
      });
    }

    refreshIcons();
    syncThemeToggleState();
  </script>
</body>

</html>
