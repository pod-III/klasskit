<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 Server Error | KlassKit</title>
  <link rel="icon" type="image/x-icon" href="../media/icon.ico" />
  <link rel="icon" type="image/webp" href="../media/icon.webp" />
  <link rel="apple-touch-icon" href="../media/icon-180.png" />
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#1ea7fd">

  <script src="https://unpkg.com/lucide@1.16.0"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="../css/tailwind.generated.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/api.css">

  <script src="../js/theme-init.js"></script>
  <script defer src="/js/analytics.js"></script>
</head>

<body class="min-h-screen flex items-center justify-center px-4 py-8 sm:p-6 selection:bg-pink selection:text-white relative">

  <main class="glass-card w-full max-w-[460px] p-6 sm:p-8 rounded-[2rem] animate-pop-in relative z-10 text-center">
    <div class="flex items-center justify-between gap-3 mb-6">
      <a href="../index.html?home=1" class="link-focus inline-flex items-center gap-2.5 text-left group">
        <img src="../media/icon.webp" alt="KlassKit"
          class="w-9 h-9 rounded-xl border-2 border-line object-contain bg-card p-0.5 shadow-hard-sm">
        <span class="font-heading font-bold text-lg uppercase tracking-tight text-ink group-hover:text-blue transition-colors">
          KlassKit
        </span>
      </a>
      <button id="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle dark mode" aria-pressed="false" title="Toggle dark mode"
        class="btn-chunky w-10 h-10 rounded-xl bg-card/90 text-ink dark:text-yellow-400 flex items-center justify-center shrink-0">
        <i data-lucide="moon" class="w-5 h-5 dark:hidden" aria-hidden="true"></i>
        <i data-lucide="sun" class="w-5 h-5 hidden dark:block" aria-hidden="true"></i>
      </button>
    </div>

    <div class="relative inline-block mb-4">
      <span class="absolute -top-1.5 -left-2 w-3.5 h-3.5 rounded-full bg-blue border-2 border-line" aria-hidden="true"></span>
      <span class="absolute -bottom-1 -right-2 w-3 h-3 rounded-full bg-orange border-2 border-line" aria-hidden="true"></span>
      <div
        class="w-20 h-20 bg-pink rounded-2xl border-[3px] border-line flex items-center justify-center mx-auto -rotate-3 hover:rotate-0 transition-transform shadow-hard dark:shadow-hard-dark">
        <i data-lucide="wrench" class="w-10 h-10 text-white" aria-hidden="true"></i>
      </div>
    </div>

    <div class="mb-3">
      <span class="api-status-pill bg-pink/15 border-pink text-pink-700 dark:text-pink-300">
        Error 500 &bull; Server Issue
      </span>
    </div>

    <h1 class="font-heading text-3xl sm:text-4xl font-bold text-ink uppercase tracking-tight leading-tight">
      Under Maintenance
    </h1>

    <p class="text-ink-muted font-bold text-sm sm:text-base mt-2.5 leading-relaxed">
      We&apos;re tinkering under the hood to keep KlassKit running smoothly. Try refreshing in a moment.
    </p>

    <div class="rounded-2xl border-2 border-line-muted bg-surface-muted/80 p-3 flex items-center justify-between gap-3 text-left mt-5">
      <div class="flex items-center gap-2.5 min-w-0">
        <span id="network-dot" class="w-2.5 h-2.5 rounded-full bg-green shrink-0" aria-hidden="true"></span>
        <div class="min-w-0">
          <div class="text-[10px] font-black uppercase tracking-wider text-ink-muted">Connection</div>
          <div id="network-status" class="text-xs font-extrabold text-ink truncate">Checking...</div>
        </div>
      </div>
      <button id="copy-details-btn" type="button" onclick="copyDiagnostics()" aria-label="Copy error details"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border-2 border-line bg-card text-xs font-extrabold text-ink hover:border-blue dark:hover:border-blue transition-colors shrink-0 link-focus">
        <i data-lucide="copy" class="w-3.5 h-3.5" aria-hidden="true"></i>
        <span>Copy Details</span>
      </button>
    </div>

    <div class="mt-6 space-y-3">
      <button type="button" onclick="window.location.reload()"
        class="btn-chunky w-full py-3.5 rounded-2xl bg-blue text-white font-heading font-bold text-lg uppercase tracking-wider flex items-center justify-center gap-2">
        <span>Refresh Page</span>
        <i data-lucide="refresh-cw" class="w-5 h-5" aria-hidden="true"></i>
      </button>

      <div class="flex gap-3">
        <a href="../hub.html"
          class="btn-chunky flex-1 py-3 rounded-2xl bg-card text-ink font-heading font-bold text-sm uppercase tracking-wider flex items-center justify-center gap-2">
          <i data-lucide="layout-dashboard" class="w-4 h-4 text-blue" aria-hidden="true"></i>
          <span>Open Hub</span>
        </a>
        <button id="go-back-btn" type="button" onclick="history.back()"
          class="hidden btn-chunky flex-1 py-3 rounded-2xl bg-card text-ink font-heading font-bold text-sm uppercase tracking-wider items-center justify-center gap-2">
          <i data-lucide="arrow-left" class="w-4 h-4" aria-hidden="true"></i>
          <span>Go Back</span>
        </button>
      </div>
    </div>

    <div class="mt-7 pt-5 border-t-2 border-line-muted/80 text-center">
      <a href="../index.html?home=1"
        class="link-focus group inline-flex items-center gap-2 text-sm font-extrabold text-ink-muted hover:text-blue dark:hover:text-blue transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4 transition-transform group-hover:-translate-x-1" aria-hidden="true"></i>
        <span>Return Home</span>
      </a>
    </div>
  </main>

  <script>
    function refreshIcons() {
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    }

    function syncThemeToggleState() {
      const btn = document.getElementById('theme-toggle');
      if (btn) {
        btn.setAttribute('aria-pressed', String(document.documentElement.classList.contains('dark')));
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme_hub', JSON.stringify(isDark ? 'dark' : 'light'));
      syncThemeToggleState();
    }

    function updateNetworkStatus() {
      const dot = document.getElementById('network-dot');
      const status = document.getElementById('network-status');
      if (!dot || !status) return;
      const online = navigator.onLine !== false;
      dot.className = online
        ? 'w-2.5 h-2.5 rounded-full bg-green shrink-0'
        : 'w-2.5 h-2.5 rounded-full bg-pink shrink-0';
      status.textContent = online ? 'Online — server unavailable' : 'Offline — check internet';
    }

    let copyResetTimer = null;
    async function copyDiagnostics() {
      const btn = document.getElementById('copy-details-btn');
      const online = navigator.onLine !== false ? 'Online' : 'Offline';
      const summary = `Error 500 | Path: ${window.location.pathname} | Time: ${new Date().toISOString()} | Network: ${online}`;

      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(summary);
        } else {
          throw new Error('Clipboard API unavailable');
        }
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = summary;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }

      if (!btn) return;
      btn.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5 text-green" aria-hidden="true"></i><span>Copied</span>';
      refreshIcons();

      if (copyResetTimer) clearTimeout(copyResetTimer);
      copyResetTimer = setTimeout(() => {
        btn.innerHTML = '<i data-lucide="copy" class="w-3.5 h-3.5" aria-hidden="true"></i><span>Copy Details</span>';
        refreshIcons();
      }, 2000);
    }

    if (window.history.length > 1) {
      const backBtn = document.getElementById('go-back-btn');
      if (backBtn) {
        backBtn.classList.remove('hidden');
        backBtn.classList.add('flex');
      }
    }

    window.addEventListener('online', updateNetworkStatus);
    window.addEventListener('offline', updateNetworkStatus);

    refreshIcons();
    syncThemeToggleState();
    updateNetworkStatus();
  </script>
</body>

</html>
