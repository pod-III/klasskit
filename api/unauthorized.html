<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied | KlassKit</title>
  <link rel="icon" type="image/x-icon" href="../media/icon.ico" />
  <link rel="icon" type="image/webp" href="../media/icon.webp" />
  <link rel="apple-touch-icon" href="../media/icon-180.png" />
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#1ea7fd">

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.4"></script>
  <script defer src="../supabase.js"></script>
  <script src="https://unpkg.com/lucide@1.16.0"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="../css/tailwind.generated.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/api.css">

  <script>
    (function () {
      const rawSaved = localStorage.getItem('theme_hub');
      let saved = rawSaved;
      try { saved = rawSaved ? JSON.parse(rawSaved) : null; } catch (e) {}
      if (saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>

<body class="min-h-screen flex items-center justify-center px-4 py-8 sm:p-6 bg-[#f8fafc] dark:bg-[#020617] selection:bg-orange selection:text-white relative">

  <main class="glass-card w-full max-w-[460px] p-6 sm:p-8 rounded-[2rem] animate-pop-in relative z-10 text-center">
    <div class="flex items-center justify-between gap-3 mb-6">
      <a href="../index.html?home=1" class="link-focus inline-flex items-center gap-2.5 text-left group">
        <img src="../media/icon.webp" alt="KlassKit"
          class="w-9 h-9 rounded-xl border-2 border-dark dark:border-slate-500 object-contain bg-white dark:bg-slate-800 p-0.5 shadow-hard-sm">
        <span class="font-heading font-bold text-lg uppercase tracking-tight text-dark dark:text-white group-hover:text-blue transition-colors">
          KlassKit
        </span>
      </a>
      <button id="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle dark mode" aria-pressed="false" title="Toggle dark mode"
        class="btn-chunky w-10 h-10 rounded-xl bg-white/90 dark:bg-slate-800/90 text-dark dark:text-yellow-400 flex items-center justify-center shrink-0">
        <i data-lucide="moon" class="w-5 h-5 dark:hidden" aria-hidden="true"></i>
        <i data-lucide="sun" class="w-5 h-5 hidden dark:block" aria-hidden="true"></i>
      </button>
    </div>

    <div class="relative inline-block mb-4">
      <span class="absolute -top-1.5 -left-2 w-3.5 h-3.5 rounded-full bg-pink border-2 border-dark dark:border-slate-900" aria-hidden="true"></span>
      <span class="absolute -bottom-1 -right-2 w-3 h-3 rounded-full bg-blue border-2 border-dark dark:border-slate-900" aria-hidden="true"></span>
      <div
        class="w-20 h-20 bg-orange rounded-2xl border-[3px] border-dark dark:border-slate-500 flex items-center justify-center mx-auto rotate-3 hover:rotate-0 transition-transform shadow-hard dark:shadow-hard-dark">
        <i data-lucide="lock" class="w-10 h-10 text-white" aria-hidden="true"></i>
      </div>
    </div>

    <div class="mb-3">
      <span id="auth-status-pill" class="api-status-pill bg-orange/15 border-orange text-orange-700 dark:text-orange-300">
        403 &bull; Access Restricted
      </span>
    </div>

    <h1 class="font-heading text-3xl sm:text-4xl font-bold text-dark dark:text-white uppercase tracking-tight leading-tight">
      Access Denied
    </h1>

    <p id="auth-subtitle" class="text-slate-500 dark:text-slate-400 font-bold text-sm sm:text-base mt-2.5 leading-relaxed">
      You need permission to open this area. Sign in with an authorized account to continue.
    </p>

    <div id="account-chip"
      class="hidden mt-4 inline-flex items-center justify-center gap-2 px-3.5 py-2 rounded-2xl border-2 border-slate-200 dark:border-slate-700 bg-slate-50/90 dark:bg-slate-800/70 text-xs font-extrabold text-dark dark:text-slate-200 max-w-full">
      <i data-lucide="user-round" class="w-4 h-4 text-blue shrink-0" aria-hidden="true"></i>
      <span id="account-name" class="truncate">Teacher</span>
      <span id="account-role" class="px-2 py-0.5 rounded-full bg-orange/15 border border-orange/40 text-orange-700 dark:text-orange-300 text-[10px] font-black uppercase tracking-wider shrink-0">TEACHER</span>
    </div>

    <div class="mt-6 space-y-3">
      <a id="primary-cta" href="../login.html"
        class="btn-chunky w-full py-3.5 rounded-2xl bg-orange text-white font-heading font-bold text-lg uppercase tracking-wider flex items-center justify-center gap-2">
        <span id="primary-cta-label">Sign In to Continue</span>
        <i data-lucide="log-in" class="w-5 h-5" aria-hidden="true"></i>
      </a>

      <div class="flex gap-3">
        <a id="secondary-cta" href="../hub.html"
          class="btn-chunky flex-1 py-3 rounded-2xl bg-white dark:bg-slate-800 text-dark dark:text-white font-heading font-bold text-sm uppercase tracking-wider flex items-center justify-center gap-2">
          <i data-lucide="layout-dashboard" class="w-4 h-4 text-blue" aria-hidden="true"></i>
          <span>Open Hub</span>
        </a>
        <button id="go-back-btn" type="button" onclick="history.back()"
          class="hidden btn-chunky flex-1 py-3 rounded-2xl bg-white dark:bg-slate-800 text-dark dark:text-white font-heading font-bold text-sm uppercase tracking-wider items-center justify-center gap-2">
          <i data-lucide="arrow-left" class="w-4 h-4" aria-hidden="true"></i>
          <span>Go Back</span>
        </button>
      </div>
    </div>

    <div class="mt-7 pt-5 border-t-2 border-slate-200/80 dark:border-slate-700/80 text-center">
      <a href="../index.html?home=1"
        class="link-focus group inline-flex items-center gap-2 text-sm font-extrabold text-slate-500 dark:text-slate-400 hover:text-blue dark:hover:text-blue transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4 transition-transform group-hover:-translate-x-1" aria-hidden="true"></i>
        <span>Return Home</span>
      </a>
    </div>
  </main>

  <script>
    function refreshIcons() {
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    }

    function syncThemeToggleState() {
      const btn = document.getElementById('theme-toggle');
      if (btn) {
        btn.setAttribute('aria-pressed', String(document.documentElement.classList.contains('dark')));
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme_hub', JSON.stringify(isDark ? 'dark' : 'light'));
      syncThemeToggleState();
    }

    if (window.history.length > 1) {
      const backBtn = document.getElementById('go-back-btn');
      if (backBtn) {
        backBtn.classList.remove('hidden');
        backBtn.classList.add('flex');
      }
    }

    window.addEventListener('load', async () => {
      try {
        if (typeof getUser !== 'function') return;
        const user = await getUser();
        const subtitle = document.getElementById('auth-subtitle');
        const chip = document.getElementById('account-chip');
        const nameEl = document.getElementById('account-name');
        const roleEl = document.getElementById('account-role');
        const primaryCta = document.getElementById('primary-cta');
        const secondaryCta = document.getElementById('secondary-cta');

        if (user && user.is_sandbox) {
          if (subtitle) {
            subtitle.textContent = "You're currently in Sandbox Mode. Sign in with an authorized KlassKit account to access this feature.";
          }
          if (chip && nameEl && roleEl) {
            nameEl.textContent = 'Guest Teacher';
            roleEl.textContent = 'SANDBOX';
            chip.classList.remove('hidden');
            chip.classList.add('inline-flex');
          }
          return;
        }

        if (user) {
          const profile = typeof getUserProfile === 'function' ? await getUserProfile() : null;
          const displayLabel = profile?.display_name || user.email || 'Teacher';
          const roleLabel = (profile?.role || 'teacher').toUpperCase();

          if (chip && nameEl && roleEl) {
            nameEl.textContent = displayLabel;
            roleEl.textContent = roleLabel;
            chip.classList.remove('hidden');
            chip.classList.add('inline-flex');
          }

          if (subtitle) {
            subtitle.textContent = "You're signed in, but this area requires additional permissions (Pro or Admin).";
          }

          if (primaryCta) {
            primaryCta.href = '../hub.html';
            primaryCta.className = 'btn-chunky w-full py-3.5 rounded-2xl bg-blue text-white font-heading font-bold text-lg uppercase tracking-wider flex items-center justify-center gap-2';
            primaryCta.innerHTML = '<span>Back to Hub</span><i data-lucide="layout-dashboard" class="w-5 h-5" aria-hidden="true"></i>';
          }

          if (secondaryCta) {
            secondaryCta.href = '../login.html';
            secondaryCta.innerHTML = '<i data-lucide="user-round" class="w-4 h-4 text-orange" aria-hidden="true"></i><span>Switch Account</span>';
          }

          refreshIcons();
        }
      } catch (err) {
        console.warn('[Unauthorized] Unable to inspect session:', err);
      }
    });

    refreshIcons();
    syncThemeToggleState();
  </script>
</body>

</html>
