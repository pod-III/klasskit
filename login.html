<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — KlassKit</title>
  <link rel="icon" type="image/x-icon" href="./media/icon.ico" />
  <link rel="icon" type="image/webp" href="./media/icon.webp" />
  <link rel="apple-touch-icon" href="./media/icon-180.png" />
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1ea7fd">

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.4"></script>
  <script defer src="/supabase.js"></script>
  <script src="https://unpkg.com/lucide@1.16.0"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/tailwind.generated.css">
  <link rel="stylesheet" href="css/base.css">

  <script>
    (function () {
      const rawSaved = localStorage.getItem('theme_hub');
      let saved = rawSaved;
      try { saved = rawSaved ? JSON.parse(rawSaved) : null; } catch (e) {}
      if (saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <style>
    /* Ambient Background Orbs & Classroom Accents */
    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 9999px;
      filter: blur(80px);
      opacity: 0.22;
    }

    .dark .ambient-orb {
      opacity: 0.16;
    }

    .ambient-orb-blue {
      width: 24rem;
      height: 24rem;
      top: -6rem;
      left: -6rem;
      background: var(--color-blue, #1ea7fd);
    }

    .ambient-orb-warm {
      width: 24rem;
      height: 24rem;
      bottom: -6rem;
      right: -6rem;
      background: radial-gradient(circle, var(--color-pink, #ff4785) 0%, var(--color-orange, #ff7e33) 100%);
    }

    .floating-shape {
      position: absolute;
      opacity: 0.07;
      animation: login-float 16s ease-in-out infinite;
    }

    .dark .floating-shape {
      opacity: 0.06;
    }

    @keyframes login-float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-14px) rotate(8deg);
      }
    }

    /* Glassmorphism Soft Brutalist Card */
    :where(.glass-card) {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 3px solid #1e293b;
      box-shadow: 8px 8px 0px #1e293b, inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    :where(.dark .glass-card) {
      background: rgba(15, 23, 42, 0.85);
      border-color: #475569;
      box-shadow: 8px 8px 0px #000000, inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    @media (max-width: 474px) {
      :where(.glass-card) {
        box-shadow: 6px 6px 0px #1e293b, inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }

      :where(.dark .glass-card) {
        box-shadow: 6px 6px 0px #000000, inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
    }

    /* Chunky Buttons (background left to Tailwind utilities; element prefix beats Preflight) */
    button:where(.btn-chunky) {
      position: relative;
      border: 3px solid #1e293b;
      box-shadow: 0 4px 0 #1e293b;
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.15s ease;
      cursor: pointer;
      user-select: none;
      transform: translateY(0);
    }

    html:where(.dark) button:where(.btn-chunky) {
      border-color: #475569;
      box-shadow: 0 4px 0 #000000;
    }

    .btn-chunky:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #1e293b;
    }

    .dark .btn-chunky:hover:not(:disabled) {
      box-shadow: 0 6px 0 #000000;
    }

    .btn-chunky:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 0 0 #1e293b;
    }

    .dark .btn-chunky:active:not(:disabled) {
      box-shadow: 0 0 0 #000000;
    }

    .btn-chunky:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .btn-chunky:focus-visible {
      outline: 3px solid var(--color-blue, #1ea7fd);
      outline-offset: 2px;
    }

    /* Auth Inputs (0,0,1/0,0,2 beats Preflight while yielding to Tailwind 0,1,0 pl-12/pr-12) */
    input:where(.auth-input) {
      background: #ffffff;
      color: #1e293b;
      border: 3px solid #1e293b;
      border-radius: 9999px;
      padding: 0.9rem 1.25rem;
      font-weight: 700;
      font-size: 1rem;
      line-height: 1.5;
      width: 100%;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease, background-color 0.18s ease;
    }

    html:where(.dark) input:where(.auth-input) {
      background: rgba(2, 6, 23, 0.85);
      color: #f8fafc;
      border-color: #475569;
    }

    .auth-input::placeholder {
      color: #94a3b8;
      font-weight: 600;
    }

    .dark .auth-input::placeholder {
      color: #64748b;
    }

    /* Scoped Panel Focus Accents */
    #content-signin {
      --focus-accent: var(--color-blue, #1ea7fd);
      --focus-shadow: rgba(30, 167, 253, 0.25);
    }

    #content-signup {
      --focus-accent: var(--color-green, #00d063);
      --focus-shadow: rgba(0, 208, 99, 0.25);
    }

    #content-forgot {
      --focus-accent: var(--color-orange, #ff7e33);
      --focus-shadow: rgba(255, 126, 51, 0.25);
    }

    .auth-input:focus {
      border-color: var(--focus-accent, var(--color-blue, #1ea7fd));
      transform: translateY(-1px);
      box-shadow: 0 4px 0 var(--focus-shadow, rgba(30, 167, 253, 0.25));
    }

    .input-wrap:focus-within .input-icon {
      color: var(--focus-accent, var(--color-blue, #1ea7fd));
    }

    /* Password Match Feedback */
    .auth-input.input-match,
    .dark .auth-input.input-match {
      border-color: var(--color-green, #00d063);
      box-shadow: 0 4px 0 rgba(0, 208, 99, 0.25);
    }

    .auth-input.input-mismatch,
    .dark .auth-input.input-mismatch {
      border-color: var(--color-pink, #ff4785);
      box-shadow: 0 4px 0 rgba(255, 71, 133, 0.25);
    }

    /* Browser Autofill Styling */
    .auth-input:-webkit-autofill,
    .auth-input:-webkit-autofill:hover {
      -webkit-text-fill-color: #1e293b;
      -webkit-box-shadow: 0 0 0 1000px #ffffff inset;
      caret-color: #1e293b;
      transition: background-color 5000s ease-in-out 0s;
    }

    .auth-input:-webkit-autofill:focus {
      -webkit-text-fill-color: #1e293b;
      -webkit-box-shadow: 0 0 0 1000px #ffffff inset, 0 4px 0 var(--focus-shadow, rgba(30, 167, 253, 0.25));
      caret-color: #1e293b;
    }

    .dark .auth-input:-webkit-autofill,
    .dark .auth-input:-webkit-autofill:hover {
      -webkit-text-fill-color: #f8fafc;
      -webkit-box-shadow: 0 0 0 1000px #020617 inset;
      caret-color: #f8fafc;
    }

    .dark .auth-input:-webkit-autofill:focus {
      -webkit-text-fill-color: #f8fafc;
      -webkit-box-shadow: 0 0 0 1000px #020617 inset, 0 4px 0 var(--focus-shadow, rgba(30, 167, 253, 0.25));
      caret-color: #f8fafc;
    }

    /* Segmented Tabs (display left to Tailwind flex/hidden) */
    .auth-tabs-track {
      background: #f1f5f9;
      border: 3px solid #1e293b;
      box-shadow: inset 0 2px 4px rgba(15, 23, 42, 0.08);
    }

    .dark .auth-tabs-track {
      background: rgba(2, 6, 23, 0.8);
      border-color: #475569;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    button:where(.tab-btn) {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.65rem 0.75rem;
      border-radius: 0.75rem;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 2px solid transparent;
      background: transparent;
      color: #475569;
      cursor: pointer;
      user-select: none;
      transition: all 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    html:where(.dark) button:where(.tab-btn) {
      color: #94a3b8;
    }

    .tab-btn:hover:not(.active) {
      color: #1e293b;
      background: rgba(255, 255, 255, 0.75);
    }

    .dark .tab-btn:hover:not(.active) {
      color: #f8fafc;
      background: rgba(30, 41, 59, 0.8);
    }

    #tab-signin.active {
      background: var(--color-blue, #1ea7fd);
      color: #ffffff;
      border-color: #1e293b;
      box-shadow: 0 3px 0 #1e293b;
    }

    #tab-signup.active {
      background: var(--color-green, #00d063);
      color: #ffffff;
      border-color: #1e293b;
      box-shadow: 0 3px 0 #1e293b;
    }

    .dark #tab-signin.active,
    .dark #tab-signup.active {
      border-color: #020617;
      box-shadow: 0 3px 0 #000000;
    }

    .tab-btn:focus-visible,
    .pw-toggle:focus-visible,
    .link-focus:focus-visible {
      outline: 3px solid var(--color-blue, #1ea7fd);
      outline-offset: 2px;
    }

    .link-focus:focus-visible {
      border-radius: 0.5rem;
    }

    /* Animations */
    @keyframes pop-in {
      0% {
        opacity: 0;
        transform: scale(0.92) translateY(10px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .animate-pop-in {
      animation: pop-in 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: tab-fade-in 0.24s ease-out forwards;
    }

    @keyframes tab-fade-in {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .floating-shape {
        animation: none;
      }
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center px-4 py-8 sm:p-6 bg-[#f8fafc] dark:bg-[#020617] selection:bg-pink selection:text-white relative">

  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-orb ambient-orb-blue"></div>
    <div class="ambient-orb ambient-orb-warm"></div>
    <div class="floating-shape top-10 left-8 text-blue">
      <i data-lucide="sparkles" class="w-20 h-20 sm:w-28 sm:h-28"></i>
    </div>
    <div class="floating-shape bottom-10 right-8 text-pink" style="animation-delay: -5s;">
      <i data-lucide="graduation-cap" class="w-24 h-24 sm:w-32 sm:h-32"></i>
    </div>
    <div class="floating-shape top-1/2 left-10 hidden md:block text-green" style="animation-delay: -10s;">
      <i data-lucide="book-open" class="w-16 h-16"></i>
    </div>
  </div>

  <main class="glass-card w-full max-w-[440px] p-6 sm:p-8 rounded-[2rem] animate-pop-in relative z-10">
    <button id="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle dark mode" aria-pressed="false" title="Toggle dark mode"
      class="btn-chunky absolute top-4 right-4 w-10 h-10 rounded-xl bg-white/90 dark:bg-slate-800/90 text-dark dark:text-yellow-400 flex items-center justify-center">
      <i data-lucide="moon" class="w-5 h-5 dark:hidden" aria-hidden="true"></i>
      <i data-lucide="sun" class="w-5 h-5 hidden dark:block" aria-hidden="true"></i>
    </button>

    <div class="text-center mb-6">
      <div class="relative inline-block mb-3.5">
        <span class="absolute -top-1.5 -left-2 w-3.5 h-3.5 rounded-full bg-pink border-2 border-dark dark:border-slate-900" aria-hidden="true"></span>
        <span class="absolute -bottom-1 -right-2 w-3 h-3 rounded-full bg-orange border-2 border-dark dark:border-slate-900" aria-hidden="true"></span>
        <div
          class="w-16 h-16 sm:w-[72px] sm:h-[72px] bg-white dark:bg-slate-800 rounded-2xl border-[3px] border-dark dark:border-slate-500 flex items-center justify-center mx-auto rotate-3 hover:rotate-0 hover:scale-105 shadow-hard dark:shadow-hard-dark transition-transform duration-200">
          <img src="./media/icon.webp" alt="KlassKit Logo" class="w-11 h-11 sm:w-12 sm:h-12 object-contain">
        </div>
      </div>
      <h1 class="font-heading text-3xl sm:text-4xl font-bold text-dark dark:text-white uppercase tracking-tight leading-none">
        KlassKit
      </h1>
      <p id="auth-subtitle" class="text-slate-500 dark:text-slate-400 font-bold text-sm sm:text-base mt-2">
        Personalize your learning journey
      </p>
    </div>

    <div id="auth-tabs" role="tablist" aria-label="Authentication mode" class="auth-tabs-track flex gap-1.5 p-1.5 rounded-2xl mb-6">
      <button type="button" id="tab-signin" role="tab" aria-selected="true" aria-controls="content-signin"
        class="tab-btn active" onclick="switchTab('signin')">
        <i data-lucide="log-in" class="w-4 h-4" aria-hidden="true"></i>
        <span>Sign In</span>
      </button>
      <button type="button" id="tab-signup" role="tab" aria-selected="false" aria-controls="content-signup"
        class="tab-btn" onclick="switchTab('signup')">
        <i data-lucide="user-plus" class="w-4 h-4" aria-hidden="true"></i>
        <span>Sign Up</span>
      </button>
    </div>

    <div id="content-signin" role="tabpanel" aria-labelledby="tab-signin" class="tab-content active">
      <form class="space-y-4" novalidate onsubmit="event.preventDefault(); handleSignIn();">
        <div class="space-y-1.5">
          <label for="signin-email" class="block text-xs font-extrabold text-dark dark:text-slate-300 ml-1 uppercase tracking-wider">
            Email Address
          </label>
          <div class="relative input-wrap">
            <i data-lucide="mail" class="input-icon pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 transition-colors" aria-hidden="true"></i>
            <input type="email" id="signin-email" autocomplete="email" class="auth-input pl-12" placeholder="teacher@school.edu" required>
          </div>
        </div>

        <div class="space-y-1.5">
          <label for="signin-password" class="block text-xs font-extrabold text-dark dark:text-slate-300 ml-1 uppercase tracking-wider">
            Password
          </label>
          <div class="relative input-wrap">
            <i data-lucide="lock" class="input-icon pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 transition-colors" aria-hidden="true"></i>
            <input type="password" id="signin-password" autocomplete="current-password" class="auth-input pl-12 pr-12" placeholder="••••••••" required>
            <button type="button" onclick="togglePasswordVisibility('signin-password', this)"
              aria-label="Show password" aria-pressed="false"
              class="pw-toggle absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 flex items-center justify-center rounded-full text-slate-400 hover:text-blue dark:hover:text-blue transition-colors">
              <i data-lucide="eye-off" class="w-5 h-5" aria-hidden="true"></i>
            </button>
          </div>
          <div class="text-right px-1 pt-0.5">
            <button type="button" onclick="switchTab('forgot')"
              class="link-focus text-xs font-extrabold text-blue hover:underline uppercase tracking-wide">
              Forgot Password?
            </button>
          </div>
        </div>

        <div id="signin-message" role="alert" aria-live="polite" class="hidden"></div>

        <button type="submit" data-icon="arrow-right"
          class="btn-chunky w-full py-3.5 rounded-2xl bg-blue text-white font-heading font-bold text-lg uppercase tracking-wider flex items-center justify-center gap-2">
          <span class="btn-label">Let's Go!</span>
          <span class="btn-icon inline-flex items-center justify-center">
            <i data-lucide="arrow-right" class="w-5 h-5" aria-hidden="true"></i>
          </span>
        </button>
      </form>
    </div>

    <div id="content-signup" role="tabpanel" aria-labelledby="tab-signup" class="tab-content">
      <form class="space-y-4" novalidate onsubmit="event.preventDefault(); handleSignUp();">
        <div class="space-y-1.5">
          <label for="signup-displayname" class="block text-xs font-extrabold text-dark dark:text-slate-300 ml-1 uppercase tracking-wider">
            Display Name
          </label>
          <div class="relative input-wrap">
            <i data-lucide="user" class="input-icon pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 transition-colors" aria-hidden="true"></i>
            <input type="text" id="signup-displayname" autocomplete="name" class="auth-input pl-12" placeholder="Professor Awesome" required>
          </div>
        </div>

        <div class="space-y-1.5">
          <label for="signup-email" class="block text-xs font-extrabold text-dark dark:text-slate-300 ml-1 uppercase tracking-wider">
            Email Address
          </label>
          <div class="relative input-wrap">
            <i data-lucide="mail" class="input-icon pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 transition-colors" aria-hidden="true"></i>
            <input type="email" id="signup-email" autocomplete="email" class="auth-input pl-12" placeholder="teacher@school.edu" required>
          </div>
        </div>

        <div class="space-y-2">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-3">
            <div class="space-y-1.5">
              <label for="signup-password" class="block text-xs font-extrabold text-dark dark:text-slate-300 ml-1 uppercase tracking-wider">
                Password
              </label>
              <div class="relative input-wrap">
                <i data-lucide="lock" class="input-icon pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 transition-colors" aria-hidden="true"></i>
                <input type="password" id="signup-password" autocomplete="new-password" class="auth-input pl-12 pr-12" placeholder="••••••••" required
                  minlength="6" oninput="checkPasswordMatch()">
                <button type="button" onclick="togglePasswordVisibility('signup-password', this)"
                  aria-label="Show password" aria-pressed="false"
                  class="pw-toggle absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 flex items-center justify-center rounded-full text-slate-400 hover:text-green dark:hover:text-green transition-colors">
                  <i data-lucide="eye-off" class="w-5 h-5" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <div class="space-y-1.5">
              <label for="signup-confirm" class="block text-xs font-extrabold text-dark dark:text-slate-300 ml-1 uppercase tracking-wider">
                Confirm
              </label>
              <div class="relative input-wrap">
                <i data-lucide="shield-check" class="input-icon pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 transition-colors" aria-hidden="true"></i>
                <input type="password" id="signup-confirm" autocomplete="new-password" class="auth-input pl-12 pr-12" placeholder="••••••••" required
                  minlength="6" oninput="checkPasswordMatch()">
                <button type="button" onclick="togglePasswordVisibility('signup-confirm', this)"
                  aria-label="Show password" aria-pressed="false"
                  class="pw-toggle absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 flex items-center justify-center rounded-full text-slate-400 hover:text-green dark:hover:text-green transition-colors">
                  <i data-lucide="eye-off" class="w-5 h-5" aria-hidden="true"></i>
                </button>
              </div>
            </div>
          </div>
          <p id="password-match-msg" class="hidden items-center gap-1.5 text-xs font-extrabold ml-1"></p>
        </div>

        <div id="signup-message" role="alert" aria-live="polite" class="hidden"></div>

        <button type="submit" data-icon="user-plus"
          class="btn-chunky w-full py-3.5 rounded-2xl bg-green text-white font-heading font-bold text-lg uppercase tracking-wider flex items-center justify-center gap-2">
          <span class="btn-label">Create Account</span>
          <span class="btn-icon inline-flex items-center justify-center">
            <i data-lucide="user-plus" class="w-5 h-5" aria-hidden="true"></i>
          </span>
        </button>
      </form>
    </div>

    <div id="content-forgot" role="tabpanel" class="tab-content">
      <div class="flex items-center justify-between mb-3">
        <button type="button" onclick="switchTab('signin')"
          class="link-focus inline-flex items-center gap-1.5 text-xs font-extrabold text-slate-500 dark:text-slate-400 hover:text-dark dark:hover:text-white uppercase tracking-wide transition-colors">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5" aria-hidden="true"></i>
          <span>Back to Sign In</span>
        </button>
      </div>
      <div class="mb-4">
        <h2 class="font-heading text-xl font-bold text-dark dark:text-white uppercase tracking-tight">Reset Password</h2>
        <p class="text-xs sm:text-sm font-semibold text-slate-500 dark:text-slate-400 mt-1">
          Enter your email address and we'll send a password reset link.
        </p>
      </div>
      <form class="space-y-4" novalidate onsubmit="event.preventDefault(); handleForgotPassword();">
        <div class="space-y-1.5">
          <label for="forgot-email" class="block text-xs font-extrabold text-dark dark:text-slate-300 ml-1 uppercase tracking-wider">
            Reset Email
          </label>
          <div class="relative input-wrap">
            <i data-lucide="mail" class="input-icon pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 transition-colors" aria-hidden="true"></i>
            <input type="email" id="forgot-email" autocomplete="email" class="auth-input pl-12" placeholder="teacher@school.edu" required>
          </div>
        </div>

        <div id="forgot-message" role="alert" aria-live="polite" class="hidden"></div>

        <button type="submit" data-icon="send"
          class="btn-chunky w-full py-3.5 rounded-2xl bg-orange text-white font-heading font-bold text-lg uppercase tracking-wider flex items-center justify-center gap-2">
          <span class="btn-label">Send Reset Link</span>
          <span class="btn-icon inline-flex items-center justify-center">
            <i data-lucide="send" class="w-5 h-5" aria-hidden="true"></i>
          </span>
        </button>
      </form>
    </div>

    <div class="mt-7 pt-5 border-t-2 border-slate-200/80 dark:border-slate-700/80 text-center">
      <a href="./index.html?home=1"
        class="link-focus group inline-flex items-center gap-2 text-sm font-extrabold text-slate-500 dark:text-slate-400 hover:text-blue dark:hover:text-blue transition-colors">
        <i data-lucide="chevron-left" class="w-4 h-4 transition-transform group-hover:-translate-x-1" aria-hidden="true"></i>
        <span>Back to Home</span>
      </a>
    </div>
  </main>

  <script>
    function refreshIcons() {
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    }

    function syncThemeToggleState() {
      const btn = document.getElementById('theme-toggle');
      if (btn) {
        btn.setAttribute('aria-pressed', String(document.documentElement.classList.contains('dark')));
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme_hub', JSON.stringify(isDark ? 'dark' : 'light'));
      syncThemeToggleState();
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input || !btn) return;
      const isVisible = input.type === 'text';

      input.type = isVisible ? 'password' : 'text';
      const newIcon = isVisible ? 'eye-off' : 'eye';
      btn.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
      btn.setAttribute('aria-pressed', String(!isVisible));
      btn.innerHTML = `<i data-lucide="${newIcon}" class="w-5 h-5" aria-hidden="true"></i>`;
      refreshIcons();
    }

    function checkPasswordMatch() {
      const pass = document.getElementById('signup-password');
      const confirm = document.getElementById('signup-confirm');
      const msg = document.getElementById('password-match-msg');
      if (!pass || !confirm || !msg) return;

      if (!confirm.value) {
        confirm.classList.remove('input-match', 'input-mismatch');
        if (pass.value.length > 0 && pass.value.length < 6) {
          msg.className = 'flex items-center gap-1.5 text-xs font-extrabold ml-1 text-slate-600 dark:text-slate-300';
          if (msg.dataset.state !== 'hint') {
            msg.dataset.state = 'hint';
            msg.innerHTML = '<i data-lucide="alert-circle" class="w-3.5 h-3.5 shrink-0" aria-hidden="true"></i><span>Use at least 6 characters</span>';
            refreshIcons();
          }
        } else {
          msg.dataset.state = 'empty';
          msg.className = 'hidden items-center gap-1.5 text-xs font-extrabold ml-1';
          msg.textContent = '';
        }
        return;
      }

      if (pass.value === confirm.value) {
        confirm.classList.add('input-match');
        confirm.classList.remove('input-mismatch');
        msg.className = 'flex items-center gap-1.5 text-xs font-extrabold ml-1 text-green-700 dark:text-green-300';
        if (msg.dataset.state !== 'match') {
          msg.dataset.state = 'match';
          msg.innerHTML = '<i data-lucide="check-circle" class="w-3.5 h-3.5 shrink-0" aria-hidden="true"></i><span>Passwords match!</span>';
          refreshIcons();
        }
      } else {
        confirm.classList.add('input-mismatch');
        confirm.classList.remove('input-match');
        msg.className = 'flex items-center gap-1.5 text-xs font-extrabold ml-1 text-pink-700 dark:text-pink-300';
        if (msg.dataset.state !== 'mismatch') {
          msg.dataset.state = 'mismatch';
          msg.innerHTML = '<i data-lucide="alert-circle" class="w-3.5 h-3.5 shrink-0" aria-hidden="true"></i><span>Passwords do not match</span>';
          refreshIcons();
        }
      }
    }

    function hideMessage(elementId) {
      const el = document.getElementById(elementId);
      if (!el) return;
      el.className = 'hidden';
      el.textContent = '';
    }

    function switchTab(tab) {
      if (tab !== 'signin' && tab !== 'signup' && tab !== 'forgot') return;

      document.querySelectorAll('.tab-btn').forEach((btn) => {
        btn.classList.remove('active');
        btn.setAttribute('aria-selected', 'false');
      });
      document.querySelectorAll('.tab-content').forEach((content) => content.classList.remove('active'));

      const tabGroup = document.getElementById('auth-tabs');
      const subtitle = document.getElementById('auth-subtitle');
      const subtitles = {
        signin: 'Personalize your learning journey',
        signup: 'Create your free KlassKit account',
        forgot: 'Recover access to your classroom'
      };

      if (tab === 'forgot') {
        tabGroup.classList.add('hidden');
      } else {
        tabGroup.classList.remove('hidden');
        const activeTab = document.getElementById('tab-' + tab);
        if (activeTab) {
          activeTab.classList.add('active');
          activeTab.setAttribute('aria-selected', 'true');
        }
      }

      if (subtitle && subtitles[tab]) {
        subtitle.textContent = subtitles[tab];
      }

      hideMessage('signin-message');
      hideMessage('signup-message');
      hideMessage('forgot-message');

      const panel = document.getElementById('content-' + tab);
      if (panel) panel.classList.add('active');
    }

    function showMessage(elementId, text, isError) {
      const el = document.getElementById(elementId);
      if (!el) return;

      el.className = isError
        ? 'p-3.5 rounded-xl border-[3px] border-pink bg-pink/10 dark:bg-pink/15 text-pink-700 dark:text-pink-300 text-sm font-bold flex items-center justify-center gap-2 animate-shake'
        : 'p-3.5 rounded-xl border-[3px] border-green bg-green/10 dark:bg-green/15 text-green-700 dark:text-green-300 text-sm font-bold flex items-center justify-center gap-2 animate-pop-in';

      el.innerHTML = '';
      const icon = document.createElement('i');
      icon.setAttribute('data-lucide', isError ? 'alert-circle' : 'check-circle');
      icon.className = 'w-4 h-4 shrink-0';
      icon.setAttribute('aria-hidden', 'true');

      const msgSpan = document.createElement('span');
      msgSpan.textContent = text;

      el.appendChild(icon);
      el.appendChild(msgSpan);
      refreshIcons();
    }

    function humanizeError(err) {
      const msg = typeof err === 'string' ? err : (err?.message || 'Something went wrong. Please try again.');
      const map = {
        'Invalid login credentials':
          'Wrong email or password. Try again!',
        'Email not confirmed':
          'Check your inbox — you need to verify your email first.',
        'User already registered':
          'That email is already taken. Try signing in instead.',
        'Password should be at least 6 characters':
          'Password must be at least 6 characters.',
      };
      return map[msg] ?? msg;
    }

    function setLoading(btn, loading, originalText) {
      if (!btn) return;
      btn.disabled = loading;
      btn.setAttribute('aria-busy', String(loading));

      const label = btn.querySelector('.btn-label');
      const iconWrap = btn.querySelector('.btn-icon');

      if (label) label.textContent = loading ? 'Working...' : originalText;
      if (iconWrap) {
        const iconName = loading ? 'loader-2' : btn.dataset.icon;
        iconWrap.innerHTML = `<i data-lucide="${iconName}" class="w-5 h-5${loading ? ' animate-spin' : ''}" aria-hidden="true"></i>`;
      }
      refreshIcons();
    }

    async function handleSignIn() {
      const email = document.getElementById('signin-email').value.trim();
      const pass = document.getElementById('signin-password').value;
      const btn = document.querySelector('#content-signin .btn-chunky');

      if (!btn || btn.disabled) return;
      hideMessage('signin-message');
      if (!email || !pass) return showMessage('signin-message', 'Fill in all fields!', true);

      setLoading(btn, true, "Let's Go!");
      try {
        if (typeof signIn !== 'function') {
          throw new Error('Authentication service unavailable. Please refresh and try again.');
        }
        const { error } = await signIn(email, pass);

        if (error) {
          setLoading(btn, false, "Let's Go!");
          return showMessage('signin-message', humanizeError(error), true);
        }

        try {
          if (typeof migrateLocalToCloud === 'function') {
            await migrateLocalToCloud();
          }
        } catch (migrationError) {
          console.warn('[Auth] Cloud migration skipped:', migrationError);
        }

        const dest = localStorage.getItem('after_login') || '/hub.html';
        localStorage.removeItem('after_login');
        window.location.href = dest;
      } catch (err) {
        setLoading(btn, false, "Let's Go!");
        showMessage('signin-message', humanizeError(err), true);
      }
    }

    async function handleSignUp() {
      const email = document.getElementById('signup-email').value.trim();
      const pass = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;
      const displayName = document.getElementById('signup-displayname').value.trim();
      const btn = document.querySelector('#content-signup .btn-chunky');

      if (!btn || btn.disabled) return;
      hideMessage('signup-message');
      if (!email || !pass || !displayName) return showMessage('signup-message', 'All fields required!', true);
      if (pass !== confirm) return showMessage('signup-message', 'Passwords do not match!', true);
      if (pass.length < 6) return showMessage('signup-message', 'Password too short!', true);

      localStorage.setItem('klasskit_pending_display_name', displayName);

      setLoading(btn, true, 'Create Account');
      try {
        if (typeof signUp !== 'function') {
          throw new Error('Authentication service unavailable. Please refresh and try again.');
        }
        const { error } = await signUp(email, pass, displayName);
        setLoading(btn, false, 'Create Account');

        if (error) return showMessage('signup-message', humanizeError(error), true);

        showMessage('signup-message', 'Check your email for a link!', false);
      } catch (err) {
        setLoading(btn, false, 'Create Account');
        showMessage('signup-message', humanizeError(err), true);
      }
    }

    async function handleForgotPassword() {
      const email = document.getElementById('forgot-email').value.trim();
      const btn = document.querySelector('#content-forgot .btn-chunky');

      if (!btn || btn.disabled) return;
      hideMessage('forgot-message');
      if (!email) return showMessage('forgot-message', 'Please enter your email!', true);

      setLoading(btn, true, 'Send Reset Link');
      try {
        if (typeof sendPasswordReset !== 'function') {
          throw new Error('Authentication service unavailable. Please refresh and try again.');
        }
        const { error } = await sendPasswordReset(email);
        setLoading(btn, false, 'Send Reset Link');

        if (error) return showMessage('forgot-message', humanizeError(error), true);

        showMessage('forgot-message', 'Check your inbox for a reset link!', false);
      } catch (err) {
        setLoading(btn, false, 'Send Reset Link');
        showMessage('forgot-message', humanizeError(err), true);
      }
    }

    refreshIcons();
    syncThemeToggleState();

    const initialTab = new URLSearchParams(window.location.search).get('tab');
    if (initialTab === 'signup' || initialTab === 'forgot') {
      switchTab(initialTab);
    }

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW Registered!', reg))
          .catch(err => console.log('SW Reg error:', err));
      });
    }
  </script>
</body>

</html>
