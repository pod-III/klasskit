<!doctype html>
<html lang="en">

<head>
    <script>
        if (localStorage.getItem("theme_whiteboard") === "dark" || (!localStorage.getItem("theme_whiteboard") && window.matchMedia("(prefers-color-scheme:dark)").matches)) {
            document.documentElement.classList.add("dark")
        }
    </script>
    <!-- Supabase Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.4"></script>
    <script src="/supabase.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Whiteboard</title>
    <link rel="icon" type="image/x-icon" href="../../../media/icon.ico" />
    <link rel="icon" type="image/webp" href="../../../media/icon.webp" />

    <script src="https://unpkg.com/lucide@1.16.0"></script>
    <link rel="stylesheet" href="../../../css/tailwind.generated.css" />


    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="../../../css/base.css" />
    <link rel="stylesheet" href="../../../css/components.css" />
    <link rel="stylesheet" href="style.css" />
    
</head>

<body class="flex h-screen w-screen bg-grid" id="body-bg">
    <input type="file" id="image-upload" accept="image/*" class="hidden" onchange="handleImageUpload(this)">

    <aside class="sidebar">
        <div class="mb-3 group">
            <div
                class="w-10 h-10 bg-dark rounded-xl border-3 border-dark dark:border-slate-500 flex items-center justify-center shadow-neo-sm group-hover:shadow-neo group-hover:-translate-y-0.5 transition-all">
                <span class="font-heading font-bold text-white text-lg">KK</span>
            </div>
        </div>

        <button type="button" class="btn-tool active" onclick="setTool('pen')" id="tool-pen" data-tool="pen" title="Freehand Pen" aria-label="Freehand Pen" aria-pressed="true">
            <i data-lucide="pencil" class="w-5 h-5"></i>
        </button>

        <div class="w-9 h-[2px] bg-slate-200 dark:bg-slate-600 my-1"></div>

        <button type="button" class="btn-tool" onclick="setTool('line')" id="tool-line" data-type="shape" title="Straight Line" aria-label="Straight Line" aria-pressed="false">
            <i data-lucide="minus" class="w-5 h-5 transform -rotate-45"></i>
        </button>
        <button type="button" class="btn-tool" onclick="setTool('rect')" id="tool-rect" data-type="shape" title="Rectangle" aria-label="Rectangle" aria-pressed="false">
            <i data-lucide="square" class="w-5 h-5"></i>
        </button>
        <button type="button" class="btn-tool" onclick="setTool('circle')" id="tool-circle" data-type="shape" title="Circle" aria-label="Circle" aria-pressed="false">
            <i data-lucide="circle" class="w-5 h-5"></i>
        </button>

        <div class="w-9 h-[2px] bg-slate-200 dark:bg-slate-600 my-1"></div>

        <button type="button" class="btn-tool" onclick="setTool('text')" id="tool-text" data-tool="text" title="Type Text" aria-label="Type Text" aria-pressed="false">
            <i data-lucide="type" class="w-5 h-5"></i>
        </button>
        <button type="button" class="btn-tool" onclick="setTool('image')" id="tool-image" data-tool="image" title="Insert Image" aria-label="Insert Image" aria-pressed="false">
            <i data-lucide="image" class="w-5 h-5"></i>
        </button>
        <button type="button" class="btn-tool" onclick="setTool('eraser')" id="tool-eraser" data-tool="eraser" title="Eraser" aria-label="Eraser" aria-pressed="false">
            <i data-lucide="eraser" class="w-5 h-5"></i>
        </button>

        <div class="mt-auto flex flex-col items-center w-full gap-1.5">
            <button type="button" class="btn-tool" onclick="setTool('hand')" id="tool-hand" data-tool="hand"
                title="Pan / Move (Space)" aria-label="Pan or Move (Space)" aria-pressed="false">
                <i data-lucide="hand" class="w-5 h-5"></i>
            </button>
            <button type="button" id="btn-undo"
                class="btn-tool text-slate-500 dark:text-slate-300 border-slate-300 dark:border-slate-500 shadow-none hover:shadow-none hover:bg-slate-50 dark:hover:bg-slate-700 hover:border-slate-400"
                onclick="undo()" title="Undo (Ctrl+Z)" aria-label="Undo">
                <i data-lucide="undo-2" class="w-5 h-5"></i>
            </button>
        </div>
    </aside>

    <div class="flex flex-col flex-grow h-full relative">
        <header class="top-bar">
            <div class="flex items-center gap-5">
                <div class="flex flex-col gap-0.5">
                    <span
                        class="text-[10px] font-heading font-bold text-slate-400 dark:text-slate-400 uppercase tracking-wider">Ink
                        Color</span>
                    <div class="flex items-center gap-2.5 px-1.5 py-0.5 rounded-xl">
                        <div role="button" tabindex="0" aria-label="Default dark/light ink" aria-pressed="true" class="color-dot bg-dark dark:bg-white selected" id="dot-dark"
                            onclick="setDarkLightColor(this)"></div>
                        <div role="button" tabindex="0" aria-label="Blue ink" aria-pressed="false" class="color-dot bg-blue" data-color="#1ea7fd" onclick="setColor('#1ea7fd', this)"></div>
                        <div role="button" tabindex="0" aria-label="Green ink" aria-pressed="false" class="color-dot bg-green" data-color="#00d063" onclick="setColor('#00d063', this)"></div>
                        <div role="button" tabindex="0" aria-label="Orange ink" aria-pressed="false" class="color-dot bg-orange" data-color="#ff7e33" onclick="setColor('#ff7e33', this)"></div>
                        <div role="button" tabindex="0" aria-label="Pink ink" aria-pressed="false" class="color-dot bg-pink" data-color="#ff4785" onclick="setColor('#ff4785', this)"></div>
                    </div>
                </div>

                <div class="w-[2px] h-9 bg-slate-200 dark:bg-slate-600 rounded-full"></div>

                <div class="flex flex-col gap-0.5">
                    <label for="size-slider"
                        class="text-[10px] font-heading font-bold text-slate-400 dark:text-slate-400 uppercase tracking-wider">Stroke
                        Width</label>
                    <div class="flex items-center gap-2.5">
                        <i data-lucide="circle" class="w-2 h-2 fill-slate-300 text-slate-300 dark:fill-slate-500 dark:text-slate-500"></i>
                        <input type="range" id="size-slider" min="2" max="40" value="4"
                            oninput="updateSize(this.value)" />
                        <i data-lucide="circle" class="w-5 h-5 fill-slate-800 text-slate-800 dark:fill-slate-200 dark:text-slate-200"></i>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-2.5">
                <button type="button" onclick="toggleTheme()" id="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false"
                    class="group flex items-center justify-center w-10 h-10 rounded-xl font-heading font-bold text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 border-3 border-transparent hover:border-slate-200 dark:hover:border-slate-600 transition-all active:scale-95"
                    title="Toggle Dark Mode">
                    <i data-lucide="sun" id="theme-icon-sun" class="w-5 h-5 hidden dark:block"></i>
                    <i data-lucide="moon" id="theme-icon-moon" class="w-5 h-5 block dark:hidden"></i>
                </button>

                <div id="cloud-status"
                    class="hidden items-center gap-2 px-3 py-1 rounded-xl bg-green/10 border border-green/30 text-green text-xs font-heading font-bold">
                    <span class="w-2 h-2 bg-green rounded-full animate-pulse"></span>
                    <span id="cloud-status-text">Synced</span>
                </div>

                <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-700 border-3 border-slate-200 dark:border-slate-500 p-0.5 rounded-xl">
                    <button type="button" onclick="changeZoom(-0.1)" aria-label="Zoom out"
                        class="p-1.5 hover:bg-white dark:hover:bg-slate-600 rounded-lg transition-colors active:bg-slate-200 dark:active:bg-slate-500"
                        title="Zoom Out">
                        <i data-lucide="minus" class="w-4 h-4 text-slate-600 dark:text-slate-300"></i>
                    </button>
                    <span id="zoom-display" class="w-11 text-center font-heading font-bold text-xs text-slate-700 dark:text-slate-200">100%</span>
                    <button type="button" onclick="changeZoom(0.1)" aria-label="Zoom in"
                        class="p-1.5 hover:bg-white dark:hover:bg-slate-600 rounded-lg transition-colors active:bg-slate-200 dark:active:bg-slate-500"
                        title="Zoom In">
                        <i data-lucide="plus" class="w-4 h-4 text-slate-600 dark:text-slate-300"></i>
                    </button>
                </div>

                <button type="button" id="grid-toggle" onclick="toggleGrid()" aria-pressed="true" aria-label="Toggle background grid"
                    class="group flex items-center gap-1.5 px-3 py-1.5 h-10 rounded-xl font-heading font-bold text-sm text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 border-3 border-transparent hover:border-slate-200 dark:hover:border-slate-600 transition-all active:scale-95">
                    <i data-lucide="grid-3x3" class="w-4 h-4 group-hover:text-blue transition-colors"></i>
                    <span>Grid</span>
                </button>

                <button type="button" onclick="showClearModal()" aria-label="Clear board"
                    class="flex items-center justify-center w-10 h-10 rounded-xl border-3 border-red-200 dark:border-red-400/30 text-red-400 hover:bg-red-50 dark:hover:bg-red-500/10 hover:text-red-500 hover:border-red-300 dark:hover:border-red-400/50 transition-all active:translate-y-1"
                    title="Clear Board">
                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                </button>

                <button type="button" onclick="saveBoardCloud()" aria-label="Sync to cloud"
                    class="flex items-center gap-1.5 px-4 h-10 bg-blue text-white rounded-xl border-3 border-dark dark:border-slate-500 shadow-hard hover:shadow-hard-hover hover:-translate-y-0.5 transition-all active:translate-y-1 active:shadow-none font-heading font-bold text-sm">
                    <i data-lucide="upload-cloud" class="w-4 h-4"></i>
                    <span>Sync</span>
                </button>
                <button type="button" onclick="downloadBoard()" aria-label="Export whiteboard as PNG"
                    class="flex items-center gap-1.5 px-4 h-10 bg-green text-dark rounded-xl border-3 border-dark dark:border-slate-500 shadow-hard hover:shadow-hard-hover hover:-translate-y-0.5 transition-all active:translate-y-1 active:shadow-none font-heading font-bold text-sm">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span>Export</span>
                </button>
            </div>
        </header>

        <main id="canvas-wrapper">
            <canvas id="canvas-main" width="3000" height="3000"></canvas>
            <canvas id="canvas-temp" width="3000" height="3000"></canvas>
        </main>

    </div>

    <div id="clear-modal" onclick="if(event.target === this) closeClearModal()"
        class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 dark:bg-black/70 backdrop-blur-sm opacity-0 transition-opacity duration-200">
        <div class="bg-white dark:bg-slate-800 border-3 border-dark dark:border-slate-500 p-8 rounded-3xl shadow-neo text-center max-w-sm w-full mx-4 transform scale-90 transition-transform duration-200"
            id="modal-box">
            <div
                class="w-20 h-20 bg-red-50 dark:bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-6 border-3 border-red-200 dark:border-red-400/30">
                <i data-lucide="eraser" class="w-10 h-10 text-red-500"></i>
            </div>
            <h2 class="font-heading font-bold text-3xl mb-3">
                Wipe it clean?
            </h2>
            <p class="font-body text-lg text-slate-500 dark:text-slate-400 mb-8 leading-tight">
                You're about to delete everything. This cannot be undone!
            </p>
            <div class="flex gap-4">
                <button type="button" onclick="closeClearModal()"
                    class="flex-1 py-3 rounded-xl border-3 border-slate-300 dark:border-slate-500 font-heading font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 hover:border-slate-400 dark:hover:border-slate-400 transition-all">
                    No, Keep
                </button>
                <button type="button" onclick="confirmClear()"
                    class="flex-1 py-3 rounded-xl border-3 border-dark dark:border-slate-500 bg-pink text-white font-heading font-bold shadow-hard hover:shadow-hard-hover hover:-translate-y-0.5 active:translate-y-1 active:shadow-none transition-all">
                    Yes, Wipe
                </button>
            </div>
        </div>
    </div>

    <div id="text-modal" onclick="if(event.target === this) closeTextModal()"
        class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 dark:bg-black/70 backdrop-blur-sm opacity-0 transition-opacity duration-200">
        <div class="bg-white dark:bg-slate-800 border-3 border-dark dark:border-slate-500 p-6 rounded-3xl shadow-neo max-w-md w-full mx-4 transform scale-90 transition-transform duration-200"
            id="text-modal-box">
            <h2 class="font-heading font-bold text-2xl mb-4 text-center text-slate-800 dark:text-white">
                Add Text
            </h2>
            <textarea id="text-modal-input" rows="3"
                class="w-full p-3 bg-slate-50 dark:bg-slate-700 border-2 border-slate-200 dark:border-slate-500 rounded-xl font-heading text-lg text-slate-800 dark:text-white outline-none focus:border-blue resize-none mb-4"
                placeholder="Type your text here..."></textarea>
            <div class="flex items-center justify-between mb-4 px-1">
                <div class="flex items-center gap-2">
                    <span class="text-[10px] font-heading font-bold text-slate-400 uppercase tracking-wider">Color</span>
                    <div class="w-6 h-6 rounded-full border-2 border-slate-300 dark:border-slate-500" id="text-modal-color-preview"
                        style="background-color: #1e293b;"></div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-[10px] font-heading font-bold text-slate-400 uppercase tracking-wider">Size</span>
                    <span id="text-modal-size-display" class="font-heading font-bold text-sm text-slate-700 dark:text-slate-200">4</span>
                </div>
            </div>
            <div class="flex gap-3">
                <button type="button" onclick="closeTextModal()"
                    class="flex-1 py-3 rounded-xl border-3 border-slate-300 dark:border-slate-500 font-heading font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 hover:border-slate-400 dark:hover:border-slate-400 transition-all">
                    Cancel
                </button>
                <button type="button" onclick="commitTextFromModal()"
                    class="flex-1 py-3 rounded-xl border-3 border-dark dark:border-slate-500 bg-blue text-white font-heading font-bold shadow-hard hover:shadow-hard-hover hover:-translate-y-0.5 active:translate-y-1 active:shadow-none transition-all">
                    Place Text
                </button>
            </div>
        </div>
    </div>

    <div id="auth-overlay"
        class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-[var(--bg-primary)] transition-opacity duration-300">
        <div class="flex flex-col items-center gap-4">
            <div class="w-16 h-16 border-4 border-[var(--color-blue)] border-t-transparent rounded-full animate-spin"></div>
            <p class="font-heading font-bold text-xl text-[var(--text-primary)]">Loading Whiteboard...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
