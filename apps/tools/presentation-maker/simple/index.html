<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Supabase Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <script src="/supabase.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedy Slides — KlassKit</title>
    <link rel="icon" type="image/x-icon" href="../../../../media/icon.ico" />
    <link rel="icon" type="image/webp" href="../../../../media/icon.webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/lucide@1.16.0"></script>
    <script src="../../../../components/input-modal.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pink: '#ff4785',
                        orange: '#ff7e33',
                        green: '#00d063',
                        blue: '#1ea7fd',
                        dark: '#0f172a',
                        chalk: '#f8fafc',
                        oled: '#020617'
                    },
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        nunito: ['Nunito', 'sans-serif'],
                    },
                    boxShadow: {
                        'hard': '4px 4px 0px 0px #0f172a',
                        'hard-sm': '2px 2px 0px 0px #0f172a',
                        'hard-dark': '4px 4px 0px 0px #000000',
                        'hard-white': '4px 4px 0px 0px #000000',
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="../../../../css/base.css" />
    <link rel="stylesheet" href="../../../../css/components.css" />
</head>

<body class="bg-grid min-h-screen flex flex-col items-center justify-center text-dark dark:text-chalk p-2.5 sm:p-3 overflow-y-auto lg:overflow-hidden">

    <div class="w-full flex flex-col lg:flex-row gap-4 items-stretch app-container animate-pop-in">
        
        <!-- Left Section: Input & Strip -->
        <div class="flex-[2.4] bg-white/85 dark:bg-slate-900/85 backdrop-blur-xl border-[3px] sm:border-4 border-dark dark:border-slate-500 rounded-2xl shadow-hard dark:shadow-hard-dark overflow-hidden flex flex-col">
            
            <!-- Header Bar -->
            <div class="bg-pink border-b-[3px] sm:border-b-4 border-dark dark:border-slate-500 px-4 py-2.5 flex items-center justify-between shrink-0">
                <div class="flex items-center gap-3 text-white">
                    <div class="bg-white/25 p-1.5 rounded-xl border-2 border-dark/80 shadow-[2px_2px_0px_0px_#0f172a] -rotate-3">
                        <i data-lucide="monitor-play" class="w-5 h-5"></i>
                    </div>
                    <h1 class="text-lg sm:text-xl font-bold font-title tracking-wide uppercase drop-shadow-[1px_1px_0px_#0f172a]">Speedy Slides</h1>
                </div>
                <div class="flex items-center gap-2.5">
                    <div class="bg-white/90 dark:bg-slate-900/90 border-2 border-dark dark:border-slate-500 px-2.5 py-1 rounded-xl shadow-[2px_2px_0px_0px_#0f172a]">
                        <span id="item-count" class="font-bold font-title text-dark dark:text-chalk text-xs uppercase">0 items</span>
                    </div>
                    <button onclick="app.toggleDarkMode()"
                        class="btn-chunky p-2 bg-chalk dark:bg-slate-800 border-2 border-dark dark:border-slate-500 rounded-xl shadow-[0_3px_0_#0f172a] dark:shadow-[0_3px_0_#000] text-dark dark:text-chalk"
                        title="Toggle Theme" aria-label="Toggle dark mode">
                        <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
                        <i data-lucide="sun" class="w-4 h-4 hidden dark:block text-yellow-400"></i>
                    </button>
                </div>
            </div>

            <div class="p-3.5 sm:p-4 flex flex-col flex-1 overflow-hidden gap-3">
                <!-- Input Form -->
                <div class="flex-1 flex flex-col min-h-[160px]">
                    <label class="block font-title font-bold mb-1.5 text-xs sm:text-sm uppercase tracking-wider flex items-center gap-2 text-dark dark:text-chalk">
                        <i data-lucide="type" class="w-4 h-4 text-pink"></i>
                        Content Input (One Slide Per Line)
                    </label>
                    
                    <textarea id="word-input"
                        class="w-full flex-1 p-3.5 bg-white dark:bg-slate-800/90 border-[3px] border-dark dark:border-slate-500 rounded-2xl focus:outline-none focus:border-blue text-base font-semibold resize-none text-dark dark:text-chalk placeholder-dark/35 dark:placeholder-chalk/35 shadow-[inset_0_3px_0_rgba(15,23,42,0.06)] transition-colors"
                        placeholder="Type each slide on a new line..."></textarea>
                </div>

                <!-- Bottom Section: Images & Slide Strip -->
                <div class="shrink-0 flex flex-col gap-2.5">
                    <div id="image-upload-area" class="p-2.5 border-[3px] border-dashed border-dark/25 dark:border-slate-600 rounded-xl flex items-center justify-between bg-slate-50/90 dark:bg-slate-800/60 transition-colors gap-2">
                        <div class="flex items-center gap-2.5">
                            <div class="bg-blue/15 p-1.5 rounded-lg border-2 border-blue/40">
                                <i data-lucide="image" class="w-4 h-4 text-blue"></i>
                            </div>
                            <span id="image-count-text" class="font-bold text-dark/80 dark:text-chalk/80 font-title text-xs uppercase tracking-wide transition-colors">0 images</span>
                        </div>
                        <div class="flex gap-2">
                            <input type="file" id="image-input" class="hidden" multiple accept="image/*" onchange="app.handleImages(event)">
                            <button onclick="app.openImageManager()" class="btn-chunky bg-blue text-white font-title font-bold py-1.5 px-3 border-2 border-dark dark:border-slate-500 rounded-xl shadow-[0_3px_0_#0f172a] dark:shadow-[0_3px_0_#000] text-[11px] hidden" id="manage-images-btn">
                                Manage
                            </button>
                            <button onclick="document.getElementById('image-input').click()" class="btn-chunky bg-white dark:bg-slate-800 text-dark dark:text-chalk font-title font-bold py-1.5 px-3 border-2 border-dark dark:border-slate-500 rounded-xl shadow-[0_3px_0_#0f172a] dark:shadow-[0_3px_0_#000] text-[11px] flex items-center gap-1">
                                <i data-lucide="plus" class="w-3.5 h-3.5 text-blue"></i> Add Images
                            </button>
                        </div>
                    </div>

                    <div class="flex flex-col gap-1">
                        <div class="flex justify-between items-center px-1">
                            <label class="text-[10px] font-title font-bold uppercase tracking-widest text-dark/50 dark:text-chalk/50">Slide Strip Overview</label>
                            <span id="preview-count" class="text-[10px] font-title font-bold text-blue uppercase tracking-wider bg-blue/10 border border-blue/30 px-2 py-0.5 rounded-full">0 Slides</span>
                        </div>
                        <div id="slide-strip" class="flex gap-3 overflow-x-auto py-2 px-3 custom-scrollbar min-h-[88px] items-center bg-slate-100/80 dark:bg-slate-800/60 rounded-2xl border-2 border-dark/20 dark:border-slate-600 shadow-inner">
                            <div class="text-[11px] italic opacity-40 px-2 font-bold font-title uppercase tracking-widest">Workspace is empty</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Section: Sidebar -->
        <div class="flex-1 flex flex-col gap-4 min-w-[290px]">
            <!-- Sets Saver Card -->
            <div class="flex-1 bg-white/85 dark:bg-slate-900/85 backdrop-blur-xl border-[3px] sm:border-4 border-dark dark:border-slate-500 rounded-2xl shadow-hard dark:shadow-hard-dark flex flex-col overflow-hidden">
                <div class="bg-orange border-b-[3px] sm:border-b-4 border-dark dark:border-slate-500 px-3.5 py-2.5 shrink-0 flex items-center justify-between">
                    <h2 class="text-base font-bold font-title flex items-center gap-2 text-white uppercase tracking-wide drop-shadow-[1px_1px_0px_#0f172a]">
                        <i data-lucide="library" class="w-4 h-4"></i> Saved Slides
                    </h2>
                    <div class="flex items-center gap-1.5">
                        <label class="text-[9px] font-title font-bold text-white/90 uppercase tracking-wider">Sort:</label>
                        <select id="sets-sort" onchange="app.renderSets()" class="bg-white/90 border-2 border-dark rounded-lg text-[10px] font-title font-bold py-0.5 px-1.5 outline-none text-dark cursor-pointer">
                            <option value="recent">RECENT</option>
                            <option value="alpha">A-Z</option>
                            <option value="used">POPULAR</option>
                        </select>
                    </div>
                </div>

                <div class="p-3.5 flex-1 flex flex-col overflow-hidden">
                    <div id="active-set-indicator" class="hidden mb-2 p-2 bg-orange/15 border-2 border-orange/40 rounded-xl flex items-center justify-between">
                        <div class="flex items-center gap-2 overflow-hidden">
                            <i data-lucide="pen-tool" class="w-3.5 h-3.5 text-orange shrink-0"></i>
                            <span id="active-set-name" class="text-[11px] font-title font-bold text-orange uppercase truncate">Editing: Slide Name</span>
                        </div>
                        <span class="text-[9px] font-title font-bold text-orange bg-orange/10 px-1.5 py-0.5 rounded-md">AUTO-SAVING</span>
                    </div>

                    <div class="flex flex-col gap-2 mb-3 shrink-0">
                        <input id="set-name-input" type="text" placeholder="Slide set name..."
                            class="w-full px-3 py-2 bg-white dark:bg-slate-800 text-dark dark:text-chalk font-bold text-xs border-2 border-dark dark:border-slate-500 rounded-xl focus:border-orange outline-none transition-colors" />
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="app.newSet()"
                                class="btn-chunky bg-chalk dark:bg-slate-800 text-dark dark:text-chalk font-title font-bold py-2 px-2.5 border-2 border-dark dark:border-slate-500 rounded-xl shadow-[0_3px_0_#0f172a] dark:shadow-[0_3px_0_#000] text-[11px] flex items-center justify-center gap-1.5">
                                <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> NEW SLIDES
                            </button>
                            <button onclick="app.saveCurrentSet()"
                                class="btn-chunky bg-orange text-white font-title font-bold py-2 px-2.5 border-2 border-dark dark:border-slate-500 rounded-xl shadow-[0_3px_0_#0f172a] dark:shadow-[0_3px_0_#000] text-[11px] flex items-center justify-center gap-1.5">
                                <i data-lucide="save" class="w-3.5 h-3.5"></i> SAVE AS
                            </button>
                        </div>
                    </div>
                    
                    <div id="sets-list" class="flex-1 space-y-2 overflow-y-auto pr-1 custom-scrollbar">
                        <div class="flex flex-col items-center justify-center h-full text-dark/35 dark:text-chalk/35 gap-1.5 py-2">
                            <i data-lucide="folder-search" class="w-5 h-5 opacity-60"></i>
                            <p class="text-[11px] font-bold font-title italic">No saved sets yet.</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Actions Card -->
            <div class="bg-white/85 dark:bg-slate-900/85 backdrop-blur-xl border-[3px] sm:border-4 border-dark dark:border-slate-500 rounded-2xl shadow-hard dark:shadow-hard-dark p-3.5 space-y-2.5 shrink-0">
                <div class="grid grid-cols-2 gap-2.5">
                    <button onclick="app.startPresentation(false)"
                        class="btn-chunky bg-green text-white font-title font-bold text-base py-2.5 px-3 border-[3px] border-dark dark:border-slate-500 rounded-xl shadow-[0_4px_0_#0f172a] dark:shadow-[0_4px_0_#000] flex items-center justify-center gap-2">
                        <i data-lucide="play" class="w-5 h-5 fill-current"></i> START
                    </button>

                    <button onclick="app.startPresentation(true)"
                        class="btn-chunky bg-blue text-white font-title font-bold text-base py-2.5 px-3 border-[3px] border-dark dark:border-slate-500 rounded-xl shadow-[0_4px_0_#0f172a] dark:shadow-[0_4px_0_#000] flex items-center justify-center gap-2">
                        <i data-lucide="shuffle" class="w-5 h-5"></i> SHUFFLE
                    </button>
                </div>

                <button onclick="app.openClearModal()"
                    class="btn-chunky w-full bg-slate-100 dark:bg-slate-800 text-dark dark:text-chalk font-title font-bold text-xs py-2 px-4 border-2 border-dark dark:border-slate-500 rounded-xl shadow-[0_3px_0_#0f172a] dark:shadow-[0_3px_0_#000] flex items-center justify-center gap-2">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5 text-pink"></i> CLEAR WORKSPACE
                </button>
            </div>
        </div>
    </div>

    <!-- PRESENTATION MODE -->
    <div id="presentation-mode" tabindex="0">
        <div id="slide-content" class="text-center p-6 sm:p-10 max-w-[90vw] flex flex-col items-center justify-center">
            <h1 id="display-word" class="text-chalk font-title slide-text break-words leading-tight"
                style="font-size: 10vw;">
                Word
            </h1>
            <img id="display-image" class="max-w-full max-h-[78vh] object-contain hidden slide-text rounded-2xl shadow-[6px_6px_0px_0px_#0f172a] border-4 border-chalk transition-all duration-300" />
        </div>

        <div class="absolute bottom-5 left-0 w-full text-center pointer-events-none">
            <div class="inline-flex items-center gap-2 bg-dark/90 backdrop-blur-md text-chalk border-[3px] border-white/25 px-5 py-2.5 rounded-2xl text-sm sm:text-base font-title font-bold shadow-[4px_4px_0px_0px_#000]">
                <span>Slide <span id="slide-number" class="text-blue">1</span> / <span id="total-slides">1</span></span>
                <span class="mx-2 opacity-40">|</span>
                <span class="flex items-center gap-1.5 text-xs sm:text-sm font-nunito"><i data-lucide="arrow-left-right" class="w-4 h-4 text-orange"></i> Arrows or Click</span>
            </div>
        </div>

        <button onclick="app.stopPresentation()"
            class="btn-chunky absolute top-5 right-5 bg-pink text-white border-[3px] border-dark rounded-xl p-2.5 shadow-[0_4px_0_#0f172a] z-50 pointer-events-auto"
            title="Exit Presentation (Esc)">
            <i data-lucide="x" class="w-7 h-7"></i>
        </button>

        <button onclick="app.toggleImageFullscreen()" id="img-fullscreen-btn"
            class="btn-chunky absolute top-5 left-5 bg-chalk text-dark border-[3px] border-dark dark:border-slate-500 dark:text-chalk dark:bg-slate-800 rounded-xl p-2.5 shadow-[0_4px_0_#0f172a] z-50 pointer-events-auto hidden"
            title="Toggle Fullscreen Image">
            <i data-lucide="maximize" class="w-6 h-6" id="img-fullscreen-icon"></i>
        </button>
    </div>

    <!-- CLEAR MODAL -->
    <div id="clear-modal" class="fixed inset-0 bg-dark/80 backdrop-blur-md z-50 hidden items-center justify-center p-4">
        <div class="bg-chalk dark:bg-slate-900 border-4 border-dark dark:border-slate-500 rounded-[2rem] shadow-hard dark:shadow-hard-dark max-w-sm w-full p-6 animate-pop-in">
            <div class="flex items-center gap-3 mb-3">
                <div class="bg-pink p-2.5 rounded-xl border-2 border-dark text-white">
                    <i data-lucide="alert-triangle" class="w-5 h-5"></i>
                </div>
                <h2 class="text-2xl font-title font-bold text-dark dark:text-chalk uppercase">Clear Text?</h2>
            </div>
            <p class="mb-6 text-dark/70 dark:text-chalk/70 font-semibold text-sm">Are you sure you want to delete all entered content? This cannot be undone.</p>
            <div class="flex gap-3">
                <button onclick="app.closeClearModal()"
                    class="btn-chunky flex-1 bg-white dark:bg-slate-800 text-dark dark:text-chalk font-title font-bold py-2.5 px-4 border-[3px] border-dark dark:border-slate-500 rounded-xl shadow-[0_4px_0_#0f172a] dark:shadow-[0_4px_0_#000]">
                    Cancel
                </button>
                <button onclick="app.confirmClear()"
                    class="btn-chunky flex-1 bg-pink text-white font-title font-bold py-2.5 px-4 border-[3px] border-dark dark:border-slate-500 rounded-xl shadow-[0_4px_0_#0f172a] dark:shadow-[0_4px_0_#000]">
                    Yes, Clear
                </button>
            </div>
        </div>
    </div>

    <!-- IMAGE MANAGER MODAL -->
    <div id="image-manager-modal" class="fixed inset-0 bg-dark/80 backdrop-blur-md z-[60] hidden items-center justify-center p-4">
        <div class="bg-chalk dark:bg-slate-900 border-4 border-dark dark:border-slate-500 rounded-[2rem] shadow-hard dark:shadow-hard-dark max-w-4xl w-full p-5 sm:p-6 flex flex-col max-h-[85vh] animate-pop-in">
            <div class="flex justify-between items-center mb-4 shrink-0">
                <div class="flex items-center gap-3">
                    <div class="bg-blue/15 p-2.5 rounded-xl border-2 border-blue">
                        <i data-lucide="images" class="w-5 h-5 text-blue"></i>
                    </div>
                    <h2 class="text-xl sm:text-2xl font-title font-bold text-dark dark:text-chalk uppercase">Manage Images</h2>
                </div>
                <button onclick="app.closeImageManager()" class="btn-chunky p-2 bg-white dark:bg-slate-800 text-dark dark:text-chalk rounded-xl border-2 border-dark dark:border-slate-500 shadow-[0_3px_0_#0f172a] dark:shadow-[0_3px_0_#000]">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div id="image-manager-list" class="flex-1 overflow-y-auto custom-scrollbar grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 p-3 mb-4 bg-white dark:bg-slate-800 rounded-2xl border-[3px] border-dark dark:border-slate-600">
                <!-- Images injected here -->
            </div>
            
            <div class="pt-3 border-t-2 border-dark/10 dark:border-slate-700 shrink-0 flex justify-between items-center">
                <span class="text-sm font-bold font-title text-dark/60 dark:text-chalk/60 uppercase" id="image-manager-count">0 Images</span>
                <button onclick="app.clearImages()" class="btn-chunky bg-pink text-white font-title font-bold py-2 px-5 border-2 border-dark dark:border-slate-500 rounded-xl shadow-[0_3px_0_#0f172a] dark:shadow-[0_3px_0_#000] flex items-center gap-2 text-xs">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> CLEAR ALL
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-[100] flex flex-col gap-2.5 pointer-events-none"></div>

    <script src="script.js"></script>
</body>

</html>
