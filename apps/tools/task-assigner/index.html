<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        if (localStorage.getItem('theme_task-assigner') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <!-- Supabase Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.4"></script>
    <script src="/supabase.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Assigner</title>
    <link rel="icon" type="image/x-icon" href="../../../media/icon.ico" />
    <link rel="icon" type="image/webp" href="../../../media/icon.webp" />
    
    <script src="https://unpkg.com/lucide@1.16.0"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="../../../components/input-modal.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pink: '#ff4785',
                        orange: '#ff7e33',
                        green: '#00d063',
                        blue: '#1ea7fd',
                        purple: '#A855F7',
                        dark: '#1e293b',
                        chalk: '#f8fafc',
                        surface: 'rgba(255, 255, 255, 0.85)',
                        border: '#1e293b',
                    },
                    fontFamily: {
                        heading: ['Fredoka', 'sans-serif'],
                        body: ['Nunito', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    boxShadow: {
                        'neo': '4px 4px 0px 0px #1e293b',
                        'neo-sm': '2px 2px 0px 0px #1e293b',
                        'neo-lg': '8px 8px 0px 0px #1e293b',
                    },
                    animation: {
                        'pop': 'pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                        'shake': 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both',
                        'float-1': 'float-icon-1 20s infinite linear',
                        'float-2': 'float-icon-2 25s infinite linear reverse',
                        'float-3': 'float-icon-3 15s infinite linear',
                    },
                    keyframes: {
                        pop: {
                            '0%': { transform: 'scale(0.8)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        },
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        },
                        'float-icon-1': {
                            '0%': { transform: 'translate(0, 0) rotate(0deg)' },
                            '33%': { transform: 'translate(30px, -50px) rotate(120deg)' },
                            '66%': { transform: 'translate(-20px, 20px) rotate(240deg)' },
                            '100%': { transform: 'translate(0, 0) rotate(360deg)' },
                        },
                        'float-icon-2': {
                            '0%': { transform: 'translate(0, 0) rotate(0deg)' },
                            '50%': { transform: 'translate(-40px, -30px) rotate(-180deg)' },
                            '100%': { transform: 'translate(0, 0) rotate(-360deg)' },
                        },
                        'float-icon-3': {
                            '0%': { transform: 'translate(0, 0) scale(1)' },
                            '50%': { transform: 'translate(20px, 40px) scale(1.2)' },
                            '100%': { transform: 'translate(0, 0) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../css/base.css" />
    <link rel="stylesheet" href="../../../css/components.css" />

    <style>
        :focus-visible {
            outline: 3px solid #1ea7fd;
            outline-offset: 2px;
        }

        .bg-float-icon {
            color: rgba(203, 213, 225, 0.45);
            opacity: 0.35;
            position: fixed;
            z-index: 0;
            pointer-events: none;
        }
        html.dark .bg-float-icon {
            opacity: 0.12;
            color: white;
        }

        body {
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
            background-color: #f8fafc;
            background-image:
                linear-gradient(#e2e8f0 1.5px, transparent 1.5px),
                linear-gradient(90deg, #e2e8f0 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            color: #1e293b;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s, color 0.3s;
        }

        html.dark body {
            background-color: #020617;
            background-image:
                linear-gradient(#0f172a 1.5px, transparent 1.5px),
                linear-gradient(90deg, #0f172a 1.5px, transparent 1.5px);
            color: #e2e8f0;
        }

        html.dark .shadow-neo { box-shadow: 4px 4px 0px 0px #000000; }
        html.dark .shadow-neo-sm { box-shadow: 2px 2px 0px 0px #000000; }
        html.dark .shadow-neo-lg { box-shadow: 8px 8px 0px 0px #000000; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        html.dark .glass-panel {
            background: rgba(15, 23, 42, 0.82);
            border-color: rgba(100, 116, 139, 0.5);
        }

        .console-frame {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 3px solid #1e293b;
            border-radius: 1.5rem;
            box-shadow: 8px 8px 0px #1e293b;
            display: flex;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        html.dark .console-frame {
            background: rgba(15, 23, 42, 0.85);
            border-color: #64748b;
            box-shadow: 8px 8px 0px #000000;
        }

        .btn-chunky {
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateY(0);
            position: relative;
            border: 2px solid #1e293b;
            box-shadow: 0 4px 0 #1e293b;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        html.dark .btn-chunky {
            border-color: #64748b;
            box-shadow: 0 4px 0 #000000;
            background-color: rgba(30, 41, 59, 0.9);
            color: #e2e8f0;
        }

        .btn-chunky:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #1e293b;
            filter: brightness(103%);
        }

        html.dark .btn-chunky:hover:not(:disabled) {
            box-shadow: 0 6px 0 #000000;
        }

        .btn-chunky:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 0 0 #1e293b !important;
        }

        html.dark .btn-chunky:active:not(:disabled) {
            box-shadow: 0 0 0 #000000 !important;
        }

        .btn-chunky.active {
            background-color: #1ea7fd !important;
            color: #ffffff !important;
            border-color: #1e293b !important;
        }

        html.dark .btn-chunky.active {
            border-color: #93c5fd !important;
        }

        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.5);
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: content-box;
        }
        html.dark .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); }

        textarea.input-styled {
            background-image: radial-gradient(rgba(148, 163, 184, 0.35) 1px, transparent 1px);
            background-size: 10px 10px;
            border: 2px solid #334155;
            transition: all 0.2s;
        }
        html.dark textarea.input-styled {
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            border-color: #475569;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(203, 213, 225, 0.8);
            border: 2px solid #334155;
            transition: .3s;
            border-radius: 34px;
        }
        html.dark .slider {
            background-color: rgba(30, 41, 59, 0.9);
            border-color: #64748b;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            box-shadow: 1px 1px 0px #1e293b;
            transition: .3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 50%;
        }
        input:checked + .slider { background-color: rgba(0, 208, 99, 0.3); border-color: #00d063; }
        input:checked + .slider:before { transform: translateX(24px); background-color: #00d063; }

        .assign-card {
            min-height: 14rem;
        }
        .assign-card-col {
            width: 50%;
            min-width: 0;
        }
        .assign-fit-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-width: 0;
            min-height: 0;
            flex: 1 1 0%;
            overflow: hidden;
        }
        .fit-text {
            width: 100%;
            max-width: 100%;
            text-align: center;
            overflow-wrap: normal;
            word-break: normal;
        }

        @media (min-width: 768px) {
            .hidden-panel-desktop { margin-left: -24rem; }
        }
        @media (max-width: 767px) {
            .hidden-panel-mobile { display: none; }
        }
    </style>
  
</head>

<body class="h-screen w-screen flex flex-col items-center justify-center p-2 md:p-4 overflow-hidden transition-colors duration-300">

    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none"></div>

    <!-- FLOATING BACKGROUND ICONS -->
    <i data-lucide="message-circle" class="bg-float-icon w-32 h-32 top-10 left-10"></i>
    <i data-lucide="users" class="bg-float-icon w-40 h-40 bottom-20 right-20"></i>
    <i data-lucide="rocket" class="bg-float-icon w-24 h-24 top-1/2 left-1/2 -ml-12 -mt-12"></i>

    <div class="console-frame w-full h-full relative flex-col md:flex-row z-10">
        
        <!-- SIDEBAR -->
        <aside id="controls" class="w-full md:w-96 glass-panel border-b-2 md:border-b-0 md:border-r-2 border-dark dark:border-slate-500 flex flex-col z-50 transition-all duration-300 shadow-xl md:shadow-none h-[45%] md:h-full relative shrink-0">
            
            <div class="px-5 py-3.5 border-b-2 border-dark dark:border-slate-500 bg-slate-50/70 dark:bg-slate-800/70 flex justify-between items-center shrink-0">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-heading font-bold text-dark dark:text-slate-100 tracking-wide leading-none">
                        TASK<span class="text-blue">ASSIGNER</span>
                    </h1>
                    <div class="flex items-center gap-2 mt-1.5">
                        <button onclick="toggleTheme()" id="theme-toggle" type="button" aria-label="Toggle Dark Mode" aria-pressed="false" class="px-2 py-1 bg-white dark:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-400 dark:border-slate-500 text-[10px] font-bold rounded-md flex items-center gap-1 hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors">
                            <i data-lucide="moon" class="w-3 h-3 hidden dark:block"></i>
                            <i data-lucide="sun" class="w-3 h-3 block dark:hidden"></i>
                            <span class="hidden dark:inline">DARK</span>
                            <span class="inline dark:hidden">LIGHT</span>
                        </button>
                        <span class="text-[10px] text-slate-400 dark:text-slate-400 font-bold uppercase tracking-widest">Auto-Save</span>
                    </div>
                </div>
                <button onclick="toggleControlPanel()" type="button" aria-label="Close Sidebar" class="p-2 bg-pink/10 text-pink border-2 border-pink/40 dark:border-pink/50 rounded-lg shadow-neo-sm hover:bg-pink/20 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="flex-1 p-4 overflow-y-auto custom-scrollbar space-y-4 bg-transparent relative">
                
                <!-- PRESET MANAGEMENT -->
                <div class="space-y-2 pb-4 border-b-2 border-slate-200 dark:border-slate-700 border-dashed">
                    <label for="preset-select" class="text-xs font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="folder-open" class="w-4 h-4 text-blue"></i> Presets
                    </label>
                    <select id="preset-select" onchange="onPresetSelect()" class="w-full p-2.5 bg-white/80 dark:bg-slate-900/70 text-dark dark:text-slate-200 text-sm font-bold border-2 border-slate-400 dark:border-slate-600 rounded-xl outline-none focus:border-blue transition-colors">
                        <option value="">-- Select a Preset --</option>
                    </select>
                    <input type="text" id="preset-name" placeholder="Preset name..." aria-label="Preset Name" class="w-full p-2.5 bg-white/80 dark:bg-slate-900/70 text-dark dark:text-slate-200 font-mono text-sm border-2 border-slate-400 dark:border-slate-600 rounded-xl outline-none focus:border-blue transition-colors">
                    <div class="flex gap-2">
                        <button onclick="saveCurrentPreset()" type="button" class="flex-1 btn-chunky bg-green text-dark py-2 rounded-xl text-xs font-bold tracking-wider flex items-center justify-center gap-1">
                            <i data-lucide="save" class="w-3.5 h-3.5"></i> SAVE
                        </button>
                        <button onclick="createNewPreset()" type="button" class="flex-1 btn-chunky bg-white dark:bg-slate-700 !text-blue py-2 rounded-xl text-xs font-bold tracking-wider flex items-center justify-center gap-1">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i> NEW
                        </button>
                        <button onclick="deleteCurrentPreset()" type="button" class="flex-1 btn-chunky bg-white dark:bg-slate-700 !text-pink py-2 rounded-xl text-xs font-bold tracking-wider flex items-center justify-center gap-1">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> DEL
                        </button>
                    </div>
                </div>

                <!-- SETUP INPUTS -->
                <div class="space-y-3">
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="peopleInput" class="text-xs font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest flex items-center gap-2">
                                <i data-lucide="users" class="w-4 h-4 text-pink"></i> Students
                            </label>
                            <div class="flex items-center gap-2">
                                <button onclick="dedupePeople()" type="button" title="Remove duplicate names" class="text-[10px] font-black uppercase tracking-wider px-1.5 py-0.5 rounded bg-slate-200/80 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-pink/20 hover:text-pink transition-colors">Dedupe</button>
                                <span id="peopleCount" class="text-pink font-black text-xs">0</span>
                            </div>
                        </div>
                        <textarea id="peopleInput" rows="3" spellcheck="false" class="input-styled w-full p-2.5 bg-white/80 dark:bg-slate-900/70 text-dark dark:text-slate-200 font-mono text-sm rounded-xl outline-none resize-none transition-colors" placeholder="Enter names (comma or line separated)..."></textarea>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="taskInput" class="text-xs font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest flex items-center gap-2">
                                <i data-lucide="target" class="w-4 h-4 text-orange"></i> Missions
                            </label>
                            <span id="taskCount" class="text-orange font-black text-xs">0</span>
                        </div>
                        <textarea id="taskInput" rows="3" spellcheck="false" class="input-styled w-full p-2.5 bg-white/80 dark:bg-slate-900/70 text-dark dark:text-slate-200 font-mono text-sm rounded-xl outline-none resize-none transition-colors" placeholder="Enter missions/tasks..."></textarea>
                    </div>

                    <!-- Group Size -->
                    <div class="p-3 bg-slate-50/70 dark:bg-slate-800/60 border-2 border-slate-300 dark:border-slate-600 rounded-xl space-y-2">
                        <span class="text-xs font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest block text-center">Group Size</span>
                        <div class="grid grid-cols-4 gap-2">
                            <button onclick="setGroupSize(1)" id="btnSize1" type="button" class="btn-chunky bg-white dark:bg-slate-700 py-1.5 rounded-xl text-sm font-bold">1</button>
                            <button onclick="setGroupSize(2)" id="btnSize2" type="button" class="btn-chunky bg-white dark:bg-slate-700 py-1.5 rounded-xl text-sm font-bold">2</button>
                            <button onclick="setGroupSize(3)" id="btnSize3" type="button" class="btn-chunky bg-white dark:bg-slate-700 py-1.5 rounded-xl text-sm font-bold">3</button>
                            <button onclick="setGroupSize(4)" id="btnSize4" type="button" class="btn-chunky bg-white dark:bg-slate-700 py-1.5 rounded-xl text-sm font-bold">4</button>
                        </div>
                    </div>

                    <!-- Sorting Mode -->
                    <div class="p-3 bg-slate-50/70 dark:bg-slate-800/60 border-2 border-slate-300 dark:border-slate-600 rounded-xl flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <i data-lucide="shuffle" id="sort-icon-ui" class="w-4 h-4 text-blue"></i>
                            <label for="sort-mode-toggle" class="text-xs font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest cursor-pointer">Sorting</label>
                        </div>
                        <div class="flex items-center gap-2 text-right">
                            <span class="text-[10px] font-bold text-slate-500 dark:text-slate-400">A-Z</span>
                            <label class="switch">
                                <input type="checkbox" id="sort-mode-toggle" onchange="updateSortIcon()" aria-label="Toggle Random Sorting">
                                <span class="slider"></span>
                            </label>
                            <span class="text-[10px] font-bold text-slate-500 dark:text-slate-400">RANDOM</span>
                        </div>
                    </div>

                    <!-- Image Upload -->
                    <div class="p-3 bg-slate-50/70 dark:bg-slate-800/60 border-2 border-slate-300 dark:border-slate-600 rounded-xl space-y-2">
                        <span class="text-xs font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest flex items-center gap-2">
                            <i data-lucide="image" class="w-4 h-4 text-purple"></i> Mission Images
                        </span>
                        <label class="w-full cursor-pointer flex items-center justify-center gap-2 p-2 border-2 border-dashed border-slate-300 dark:border-slate-500 rounded-xl hover:border-purple transition-colors text-xs font-bold text-slate-600 dark:text-slate-300">
                            <i data-lucide="upload" class="w-4 h-4"></i>
                            <span id="image-upload-label">Upload Images</span>
                            <input type="file" id="card-image-input" class="hidden" accept="image/*" multiple onchange="handleImageUpload(this)">
                        </label>
                        <div id="image-preview-list" class="flex gap-2 flex-wrap"></div>
                        <div class="flex bg-slate-200 dark:bg-slate-700 rounded-lg p-1 gap-1 mt-1">
                            <button id="text-mission-btn" type="button" onclick="setMissionMode('text')" class="flex-1 py-1.5 px-2 rounded-md text-[10px] font-bold uppercase transition-all bg-white dark:bg-slate-600 text-dark dark:text-white shadow-neo-sm">Text Mission</button>
                            <button id="image-mission-btn" type="button" onclick="setMissionMode('image')" class="flex-1 py-1.5 px-2 rounded-md text-[10px] font-bold uppercase transition-all text-slate-500 dark:text-slate-400 hover:bg-white/50 dark:hover:bg-slate-600/50">Image Mission</button>
                        </div>
                        <input type="checkbox" id="image-mission-toggle" class="hidden" onchange="onImageMissionToggle()">
                    </div>
                </div>

                <div class="pt-2 flex gap-2.5">
                     <button onclick="clearAll()" type="button" class="btn-chunky bg-white dark:bg-slate-700 !text-slate-500 dark:!text-slate-300 w-12 h-12 rounded-xl flex items-center justify-center shrink-0" title="Clear All" aria-label="Clear All Inputs">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                    </button>
                    <button onclick="assignTasks()" type="button" class="flex-grow btn-chunky bg-green text-dark py-3 rounded-xl text-base font-bold tracking-wide flex items-center justify-center gap-2" title="Assign Tasks (Ctrl+Enter)">
                        <i data-lucide="wand-2" class="w-5 h-5"></i> ASSIGN
                    </button>
                </div>
            </div>

            <div class="px-4 py-2.5 border-t-2 border-dark dark:border-slate-500 bg-slate-50/70 dark:bg-slate-800/70 flex justify-between items-center shrink-0">
                <button id="sound-toggle" type="button" aria-label="Toggle Sound" aria-pressed="true" class="p-2 glass-panel border-2 border-slate-400 dark:border-slate-500 rounded-xl text-slate-500 dark:text-slate-300 hover:text-dark dark:hover:text-white transition-colors">
                    <i data-lucide="volume-2" class="w-5 h-5"></i>
                </button>
                <div class="font-heading font-black text-slate-400 dark:text-slate-400 text-xs uppercase tracking-wider">READY</div>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 relative min-h-0 md:h-full bg-slate-50/40 dark:bg-slate-900/40 flex flex-col overflow-hidden transition-colors duration-300">
            <div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(currentColor 2px, transparent 2px); background-size: 24px 24px;"></div>
            
            <!-- Main display header with Sidebar toggle and action buttons -->
            <div class="absolute top-3 left-3 right-3 z-20 flex flex-wrap gap-2">
                <button onclick="toggleControlPanel()" type="button" class="btn-chunky bg-white dark:bg-slate-800 p-2 rounded-xl text-slate-600 dark:text-slate-200 flex items-center justify-center" title="Toggle Sidebar" aria-label="Toggle Sidebar">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </button>
                <button onclick="assignTasks()" type="button" class="btn-chunky bg-green text-dark px-4 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5">
                    <i data-lucide="wand-2" class="w-4 h-4"></i> ASSIGN
                </button>
                <button onclick="autoFitCards()" type="button" class="btn-chunky bg-white dark:bg-slate-700 text-blue px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1" title="Autofit card layout">
                    <i data-lucide="layout-template" class="w-4 h-4"></i> Fit Cards <span id="fit-cards-indicator" class="ml-1 bg-blue/10 dark:bg-blue/20 text-blue px-1 py-0.5 rounded text-[10px]">Default</span>
                </button>
                <button onclick="autoFitTextAll()" type="button" class="btn-chunky bg-white dark:bg-slate-700 text-orange px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1" title="Autofit text in cards">
                    <i data-lucide="type" class="w-4 h-4"></i> Fit Text
                </button>
            </div>

            <div id="resultsArea" class="flex-grow w-full h-full relative p-5 overflow-y-auto custom-scrollbar hidden">
                <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-5 pt-14">
                    <!-- Cards will be injected here -->
                </div>
            </div>

            <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center z-10 text-center p-8 animate-pop">
                <div class="w-28 h-28 glass-panel border-4 border-dark dark:border-slate-500 rounded-full flex items-center justify-center mb-5 shadow-neo-lg rotate-3">
                    <i data-lucide="rocket" class="w-14 h-14 text-blue"></i>
                </div>
                <h3 class="text-4xl font-heading text-dark dark:text-slate-100 mb-2">Ready?</h3>
                <p class="text-lg text-slate-500 dark:text-slate-400 font-bold max-w-md">Enter your class list and missions, then hit Assign.</p>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="errorModal" class="fixed inset-0 bg-dark/50 hidden z-[100] items-center justify-center backdrop-blur-sm" onclick="if(event.target === this) hideModal()">
        <div class="glass-panel border-4 border-dark dark:border-slate-500 p-7 rounded-3xl shadow-neo-lg max-w-sm w-full animate-pop flex flex-col items-center text-center gap-5 m-4 bg-white dark:bg-slate-800">
            <div class="bg-pink/10 p-4 rounded-2xl border-2 border-pink/40 shadow-neo-sm">
                <i data-lucide="alert-triangle" class="w-12 h-12 text-pink"></i>
            </div>
            <div>
                <h2 class="font-heading text-3xl mb-2 text-dark dark:text-white">Hold up!</h2>
                <p class="text-base font-bold text-slate-600 dark:text-slate-300">Please enter both students and missions before assigning.</p>
            </div>
            <button onclick="hideModal()" type="button" class="btn-chunky bg-dark text-white dark:bg-white dark:text-dark px-8 py-3 rounded-2xl w-full text-xl">GOT IT</button>
        </div>
    </div>

    <script>
        // --- CONSTANTS & CONFIG ---
        const DB_NAME = 'TaskAssignerDB';
        const DB_VERSION = 2;
        const STORE_PRESETS = 'presets';
        const STORE_SETTINGS = 'settings';
        const STORE_IMAGES = 'images';
        const LS_KEY_THEME = 'theme_task-assigner';
        const LS_KEY_SOUND = 'sound_task-assigner';
        const LS_KEY_DRAFT = 'taskAssigner_draft_v1';

        let idb = null;
        let currentPresetId = null;
        let currentGroupSize = 1;
        let audioEnabled = localStorage.getItem(LS_KEY_SOUND) !== 'off';
        let uploadedImages = []; // { id, url, name }

        function escapeHTML(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // --- THEME & UI ---
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            localStorage.setItem(LS_KEY_THEME, isDark ? 'dark' : 'light');
            const btn = document.getElementById('theme-toggle');
            if (btn) btn.setAttribute('aria-pressed', String(isDark));
            lucide.createIcons();
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem(LS_KEY_THEME) || 'light';
            const isDark = savedTheme === 'dark';
            document.documentElement.classList.toggle('dark', isDark);
            const btn = document.getElementById('theme-toggle');
            if (btn) btn.setAttribute('aria-pressed', String(isDark));
        }

        function toggleControlPanel() {
            const controls = document.getElementById('controls');
            const isHidden = controls.classList.contains('hidden-panel-desktop') || controls.classList.contains('hidden-panel-mobile');
            
            if (isHidden) {
                controls.classList.remove('hidden-panel-desktop', 'hidden-panel-mobile');
            } else {
                controls.classList.add('hidden-panel-mobile', 'hidden-panel-desktop');
            }
            // Trigger a resize event to refresh layout if needed
            setTimeout(() => window.dispatchEvent(new Event('resize')), 350);
        }

        // --- TOAST NOTIFICATIONS ---
        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                success: 'bg-green text-dark border-dark dark:border-slate-500',
                error: 'bg-pink text-white border-dark dark:border-slate-500',
                info: 'bg-blue text-white border-dark dark:border-slate-500',
                warning: 'bg-orange text-dark border-dark dark:border-slate-500'
            };
            const icons = {
                success: 'check-circle',
                error: 'x-circle',
                info: 'info',
                warning: 'alert-triangle'
            };
            toast.className = `${colors[type]} px-4 py-2.5 rounded-xl shadow-neo border-2 font-bold text-sm flex items-center gap-2 pointer-events-auto transform transition-all duration-300 translate-y-[-20px] opacity-0`;
            toast.innerHTML = `<i data-lucide="${icons[type]}" class="w-4 h-4"></i> <span>${escapeHTML(message)}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            requestAnimationFrame(() => toast.classList.remove('translate-y-[-20px]', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('translate-y-[-20px]', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // --- AUDIO ---
        const AudioEngine = {
            synths: {},
            init: async () => { try { await Tone.start(); } catch (e) {} },
            _getSynth: (type) => {
                if (typeof Tone === 'undefined') return null;
                if (!AudioEngine.synths[type]) {
                    if (type === 'click') AudioEngine.synths.click = new Tone.MembraneSynth().toDestination();
                    else if (type === 'success') AudioEngine.synths.success = new Tone.PolySynth().toDestination();
                    else if (type === 'error') AudioEngine.synths.error = new Tone.PluckSynth().toDestination();
                }
                return AudioEngine.synths[type];
            },
            playClick: () => {
                if (!audioEnabled) return;
                const s = AudioEngine._getSynth('click');
                if (s) s.triggerAttackRelease("C2", "32n");
            },
            playSuccess: () => {
                if (!audioEnabled) return;
                const s = AudioEngine._getSynth('success');
                if (s) s.triggerAttackRelease(["C4", "E4", "A4"], "16n");
            },
            playError: () => {
                if (!audioEnabled) return;
                const s = AudioEngine._getSynth('error');
                if (s) s.triggerAttackRelease("E2", "16n");
            }
        };

        // --- FUNCTIONS ---
        function initIcons() { lucide.createIcons(); }

        // ========== INDEXEDDB ==========
        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains(STORE_PRESETS)) {
                        const presetsStore = database.createObjectStore(STORE_PRESETS, { keyPath: 'id', autoIncrement: true });
                        presetsStore.createIndex('name', 'name', { unique: false });
                        presetsStore.createIndex('updatedAt', 'updatedAt', { unique: false });
                    }
                    if (!database.objectStoreNames.contains(STORE_SETTINGS)) {
                        database.createObjectStore(STORE_SETTINGS, { keyPath: 'key' });
                    }
                    if (!database.objectStoreNames.contains(STORE_IMAGES)) {
                        database.createObjectStore(STORE_IMAGES, { keyPath: 'id' });
                    }
                };
            });
        }

        // --- IMAGE HANDLERS ---
        async function saveImageToDB(id, blob, name) {
            if (!idb) return;
            return new Promise((resolve, reject) => {
                const tx = idb.transaction(STORE_IMAGES, 'readwrite');
                const store = tx.objectStore(STORE_IMAGES);
                const req = store.put({ id, blob, name, updatedAt: Date.now() });
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        async function getImageFromDB(id) {
            if (!idb) return null;
            return new Promise((resolve, reject) => {
                const tx = idb.transaction(STORE_IMAGES, 'readonly');
                const store = tx.objectStore(STORE_IMAGES);
                const req = store.get(id);
                req.onsuccess = () => {
                    const result = req.result;
                    if (result && result.blob) {
                        resolve(URL.createObjectURL(result.blob));
                    } else {
                        resolve(null);
                    }
                };
                req.onerror = () => reject(req.error);
            });
        }

        async function getAllImagesFromDB() {
            if (!idb) return [];
            return new Promise((resolve, reject) => {
                const tx = idb.transaction(STORE_IMAGES, 'readonly');
                const store = tx.objectStore(STORE_IMAGES);
                const req = store.getAll();
                req.onsuccess = () => {
                    const results = req.result || [];
                    resolve(results.map(r => ({ id: r.id, name: r.name, url: URL.createObjectURL(r.blob) })));
                };
                req.onerror = () => reject(req.error);
            });
        }

        async function deleteImageFromDB(id) {
            if (!idb) return;
            return new Promise((resolve, reject) => {
                const tx = idb.transaction(STORE_IMAGES, 'readwrite');
                const store = tx.objectStore(STORE_IMAGES);
                const req = store.delete(id);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        async function handleImageUpload(input) {
            const files = Array.from(input.files || []).filter(f => f.type.startsWith('image/'));
            input.value = '';
            if (!files.length) return;
            for (const file of files) {
                const id = crypto.randomUUID();
                await saveImageToDB(id, file, file.name);
            }
            await refreshImagePreviews();
            showToast(`${files.length} image(s) uploaded`, 'success');
        }

        async function refreshImagePreviews() {
            uploadedImages.forEach(img => {
                if (img && img.url) {
                    try { URL.revokeObjectURL(img.url); } catch (_) {}
                }
            });
            uploadedImages = await getAllImagesFromDB();
            const container = document.getElementById('image-preview-list');
            if (!container) return;
            if (uploadedImages.length === 0) {
                container.innerHTML = '';
                document.getElementById('image-upload-label').textContent = 'Upload Images';
                return;
            }
            document.getElementById('image-upload-label').textContent = `${uploadedImages.length} image(s)`;
            container.innerHTML = uploadedImages.map(img => `
                <button type="button" title="Remove ${escapeHTML(img.name)}" aria-label="Remove ${escapeHTML(img.name)}" class="relative group w-10 h-10 rounded-lg border-2 border-slate-400 dark:border-slate-500 overflow-hidden cursor-pointer" onclick="removeImage('${escapeHTML(img.id)}')">
                    <img src="${escapeHTML(img.url)}" alt="${escapeHTML(img.name)}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
                        <i data-lucide="x" class="w-4 h-4 text-white"></i>
                    </div>
                </button>
            `).join('');
            lucide.createIcons();
        }

        async function removeImage(id) {
            await deleteImageFromDB(id);
            await refreshImagePreviews();
            // Re-render cards if visible to remove deleted image
            const cardsGrid = document.getElementById('cardsGrid');
            if (cardsGrid && cardsGrid.children.length > 0) {
                // Cards will re-render on next assign; for now just refresh previews
            }
            showToast('Image removed', 'info');
        }

        async function initDB() {
            try {
                idb = await openDB();
                await migrateFromLocalStorage();
                await loadFromCloud();
            } catch (e) {
                console.error('Failed to initialize IndexedDB:', e);
            }
        }

        // --- CLOUD SYNC ---
        async function saveToCloud() {
            try {
                const presets = await getAllPresets();
                await saveProgress('task_assigner_presets', { presets });
            } catch (e) {
                console.error("Cloud save failed", e);
            }
        }

        async function loadFromCloud() {
            try {
                const data = await loadProgress('task_assigner_presets');
                if (data && Array.isArray(data.presets)) {
                    for (const p of data.presets) {
                        if (!p || !p.id) continue;
                        const local = await getPreset(p.id);
                        if (!local || (p.updatedAt || 0) > (local.updatedAt || 0)) {
                            await savePreset(p.name, p.content, p.id, p.updatedAt);
                        }
                    }
                    await renderPresetSelector();
                }
            } catch (e) {
                console.error("Cloud load failed", e);
            }
        }

        // --- AUTOFIT FUNCTIONS ---
        let currentGridCols = 3; // 1, 2, 3, or 0 for auto
        const gridLayouts = ['grid-cols-1', 'grid-cols-2', 'grid-cols-3', 'grid-cols-4'];

        function autoFitCards() {
            const cardsGrid = document.getElementById('cardsGrid');
            if (!cardsGrid || cardsGrid.children.length === 0) {
                showToast('Generate cards first', 'warning');
                return;
            }
            const cardCount = cardsGrid.children.length;
            const vpWidth = document.getElementById('resultsArea').clientWidth;

            // Cycle layouts: auto → 1col → 2col → 3col → 4col → auto
            currentGridCols = (currentGridCols + 1) % 5;

            // Remove all grid col classes
            gridLayouts.forEach(cls => cardsGrid.classList.remove(cls));
            cardsGrid.classList.remove('md:grid-cols-2', 'lg:grid-cols-2', 'xl:grid-cols-3');

            const indicator = document.getElementById('fit-cards-indicator');
            if (currentGridCols === 0) {
                // Auto-fit: pick best column count based on card count and viewport
                let bestCols = 1;
                if (cardCount >= 2 && vpWidth >= 600) bestCols = 2;
                if (cardCount >= 3 && vpWidth >= 900) bestCols = 3;
                if (cardCount >= 4 && vpWidth >= 1200) bestCols = 4;
                cardsGrid.classList.add(`grid-cols-${bestCols}`);
                if (indicator) indicator.textContent = 'Auto';
                showToast(`Auto layout: ${bestCols} column(s)`, 'info');
            } else {
                cardsGrid.classList.add(`grid-cols-${currentGridCols}`);
                if (indicator) indicator.textContent = `${currentGridCols} Col`;
                showToast(`Layout: ${currentGridCols} column(s)`, 'info');
            }

            // Also adjust card min-heights to fill viewport
            const vpHeight = document.getElementById('resultsArea').clientHeight - 80;
            const rows = Math.ceil(cardCount / (currentGridCols === 0 ? 3 : currentGridCols));
            const idealHeight = Math.max(180, Math.floor(vpHeight / Math.max(1, rows)) - 24);
            Array.from(cardsGrid.children).forEach(card => {
                card.style.minHeight = `${idealHeight}px`;
            });

            AudioEngine.playClick();
            // Re-fit text after layout change
            setTimeout(() => fitAllCardTexts(true), 150);
        }

        let renderGenerationId = 0;

        function fitAllCardTexts(silent = false) {
            const cardsGrid = document.getElementById('cardsGrid');
            if (!cardsGrid || cardsGrid.children.length === 0) return false;

            const cardElements = Array.from(cardsGrid.children);
            const containersAndTexts = [];

            // Collapse all .fit-text nodes first so no card panel bloats the un-fitted box height
            cardElements.forEach(card => {
                const els = Array.from(card.querySelectorAll('.fit-text'));
                els.forEach(el => {
                    el.style.display = 'none';
                });
                els.forEach(el => {
                    const container = el.parentElement;
                    if (!container) return;
                    containersAndTexts.push({
                        el,
                        container,
                        w: container.clientWidth,
                        h: container.clientHeight
                    });
                });
            });

            containersAndTexts.forEach(({ el, container, w, h }) => {
                fitText(el, w, h);
            });

            // Safety restore in case any element had no container
            cardElements.forEach(card => {
                card.querySelectorAll('.fit-text').forEach(el => {
                    if (el.style.display === 'none') el.style.display = '';
                });
            });

            if (!silent) {
                showToast('Text fitted', 'success');
                AudioEngine.playClick();
            }
            return true;
        }

        function autoFitTextAll() {
            const cardsGrid = document.getElementById('cardsGrid');
            if (!cardsGrid || cardsGrid.children.length === 0) {
                showToast('Generate cards first', 'warning');
                return;
            }
            fitAllCardTexts(false);
        }

        function fitText(el, measuredW, measuredH) {
            const container = el.parentElement;
            if (!container) return;

            let containerW = measuredW;
            let containerH = measuredH;

            if (containerW == null || containerH == null) {
                const card = el.closest ? el.closest('.assign-card') : null;
                const siblingTexts = card ? Array.from(card.querySelectorAll('.fit-text')) : [el];
                const prevDisplays = siblingTexts.map(s => s.style.display);
                siblingTexts.forEach(s => { s.style.display = 'none'; });
                containerW = container.clientWidth;
                containerH = container.clientHeight;
                siblingTexts.forEach((s, idx) => { s.style.display = prevDisplays[idx]; });
            }

            if (containerW <= 0 || containerH <= 0) {
                el.style.display = '';
                return;
            }

            const maxW = Math.max(24, containerW - 6);
            const maxH = Math.max(24, containerH - 6);
            const isSingleWord = el.dataset && el.dataset.fitMode === 'single';
            const minFontSize = 8;
            const maxFontSize = 72;

            // Measure out-of-flow inside the real container so font/styles match without stretching the card
            el.style.display = isSingleWord ? 'inline-block' : 'block';
            el.style.position = 'absolute';
            el.style.left = '0';
            el.style.top = '0';
            el.style.visibility = 'hidden';
            el.style.pointerEvents = 'none';
            el.style.width = isSingleWord ? 'auto' : maxW + 'px';
            el.style.whiteSpace = isSingleWord ? 'nowrap' : 'normal';
            el.style.overflowWrap = 'normal';
            el.style.wordBreak = 'normal';

            function isOverflowing(size) {
                el.style.fontSize = size + 'px';
                return el.scrollWidth > maxW || el.scrollHeight > maxH;
            }

            // Binary search for optimal font size
            let low = minFontSize, high = maxFontSize, best = minFontSize;
            while (low <= high) {
                const mid = Math.floor((low + high) / 2);
                if (isOverflowing(mid)) {
                    high = mid - 1;
                } else {
                    best = mid;
                    low = mid + 1;
                }
            }

            el.style.fontSize = best + 'px';

            // Only break mid-word if an unbroken mega-word exceeds width even at minFontSize
            if (el.scrollWidth > maxW) {
                el.style.whiteSpace = 'normal';
                el.style.width = maxW + 'px';
                el.style.overflowWrap = 'anywhere';
                el.style.wordBreak = 'break-word';
                let bLow = minFontSize, bHigh = maxFontSize, bBest = minFontSize;
                while (bLow <= bHigh) {
                    const mid = Math.floor((bLow + bHigh) / 2);
                    el.style.fontSize = mid + 'px';
                    if (el.scrollWidth > maxW || el.scrollHeight > maxH) {
                        bHigh = mid - 1;
                    } else {
                        bBest = mid;
                        bLow = mid + 1;
                    }
                }
                el.style.fontSize = bBest + 'px';
            } else {
                el.style.whiteSpace = isSingleWord ? 'nowrap' : 'normal';
            }

            // Restore in-flow centered presentation
            el.style.position = '';
            el.style.left = '';
            el.style.top = '';
            el.style.visibility = '';
            el.style.pointerEvents = '';
            el.style.display = '';
            el.style.width = '100%';
            el.style.textAlign = 'center';
        }

        async function migrateFromLocalStorage() {
            const savedPeople = localStorage.getItem('taskAssignerPeople_v2');
            const savedTasks = localStorage.getItem('taskAssignerTasks_v2');
            if (savedPeople || savedTasks) {
                const content = JSON.stringify({ people: savedPeople || '', tasks: savedTasks || '' });
                await savePreset('My Class Setup', content);
                localStorage.removeItem('taskAssignerPeople_v2');
                localStorage.removeItem('taskAssignerTasks_v2');
            }
        }

        async function savePreset(name, content, id = null, customUpdatedAt = null) {
            if (!idb) return;
            return new Promise((resolve, reject) => {
                const tx = idb.transaction(STORE_PRESETS, 'readwrite');
                const store = tx.objectStore(STORE_PRESETS);
                const data = { name, content, updatedAt: customUpdatedAt || Date.now() };
                if (id) data.id = id;
                const request = id ? store.put(data) : store.add(data);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function getAllPresets() {
            if (!idb) return [];
            return new Promise((resolve, reject) => {
                const tx = idb.transaction(STORE_PRESETS, 'readonly');
                const store = tx.objectStore(STORE_PRESETS);
                const index = store.index('updatedAt');
                const request = index.getAll();
                request.onsuccess = () => resolve(request.result.reverse());
                request.onerror = () => reject(request.error);
            });
        }

        async function getPreset(id) {
            if (!idb) return null;
            return new Promise((resolve, reject) => {
                const tx = idb.transaction(STORE_PRESETS, 'readonly');
                const store = tx.objectStore(STORE_PRESETS);
                const request = store.get(id);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function deletePreset(id) {
            if (!idb) return;
            return new Promise((resolve, reject) => {
                const tx = idb.transaction(STORE_PRESETS, 'readwrite');
                const store = tx.objectStore(STORE_PRESETS);
                const request = store.delete(id);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        async function saveCurrentPresetId(id) {
            if (!idb) return;
            return new Promise((resolve, reject) => {
                const tx = idb.transaction(STORE_SETTINGS, 'readwrite');
                const store = tx.objectStore(STORE_SETTINGS);
                const request = store.put({ key: 'currentPresetId', value: id });
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        async function getCurrentPresetId() {
            if (!idb) return null;
            return new Promise((resolve, reject) => {
                const tx = idb.transaction(STORE_SETTINGS, 'readonly');
                const store = tx.objectStore(STORE_SETTINGS);
                const request = store.get('currentPresetId');
                request.onsuccess = () => resolve(request.result?.value || null);
                request.onerror = () => reject(request.error);
            });
        }

        async function renderPresetSelector() {
            const presets = await getAllPresets();
            const select = document.getElementById('preset-select');
            select.innerHTML = '<option value="">-- Select a Preset --</option>';
            presets.forEach(p => {
                const option = document.createElement('option');
                option.value = p.id;
                option.textContent = p.name;
                if (p.id === currentPresetId) option.selected = true;
                select.appendChild(option);
            });
        }

        function saveDraft() {
            try {
                const draft = {
                    people: document.getElementById('peopleInput').value,
                    tasks: document.getElementById('taskInput').value,
                    groupSize: currentGroupSize,
                    isRandom: document.getElementById('sort-mode-toggle').checked,
                    useImageMission: document.getElementById('image-mission-toggle').checked
                };
                localStorage.setItem(LS_KEY_DRAFT, JSON.stringify(draft));
            } catch (_) {}
        }

        function loadDraft() {
            try {
                const raw = localStorage.getItem(LS_KEY_DRAFT);
                if (!raw) return null;
                return JSON.parse(raw);
            } catch (_) {
                return null;
            }
        }

        async function onPresetSelect() {
            const select = document.getElementById('preset-select');
            const id = parseInt(select.value);
            if (!id) return;
            const preset = await getPreset(id);
            if (preset) {
                let data = {};
                try {
                    data = JSON.parse(preset.content || '{}') || {};
                } catch (err) {
                    console.warn('Invalid preset JSON', err);
                    showToast('Preset data corrupted', 'error');
                    return;
                }
                currentPresetId = id;
                document.getElementById('peopleInput').value = data.people || '';
                document.getElementById('taskInput').value = data.tasks || '';
                document.getElementById('preset-name').value = preset.name;
                if (data.isRandom !== undefined) {
                    document.getElementById('sort-mode-toggle').checked = data.isRandom;
                    updateSortIcon();
                }
                if (data.useImageMission !== undefined) {
                    document.getElementById('image-mission-toggle').checked = data.useImageMission;
                }
                if ([1, 2, 3, 4].includes(Number(data.groupSize))) {
                    setGroupSize(Number(data.groupSize), true);
                }
                syncMissionModeButtons();
                await saveCurrentPresetId(id);
                await renderPresetSelector();
                updateCounts();
                saveDraft();
            }
        }

        async function saveCurrentPreset() {
            const name = document.getElementById('preset-name').value.trim() || 'Untitled';
            const content = JSON.stringify({
                people: document.getElementById('peopleInput').value,
                tasks: document.getElementById('taskInput').value,
                groupSize: currentGroupSize,
                isRandom: document.getElementById('sort-mode-toggle').checked,
                useImageMission: document.getElementById('image-mission-toggle').checked
            });
            const id = await savePreset(name, content, currentPresetId);
            if (id !== undefined && id !== null) {
                currentPresetId = id;
                await saveCurrentPresetId(id);
            }
            saveDraft();
            await saveToCloud();
            await renderPresetSelector();
            showToast('Preset saved!', 'success');
        }

        async function createNewPreset() {
            document.getElementById('preset-name').value = 'New Preset';
            document.getElementById('peopleInput').value = '';
            document.getElementById('taskInput').value = '';
            currentPresetId = null;
            await saveCurrentPresetId(null);
            await renderPresetSelector();
            document.getElementById('preset-select').value = '';
            updateCounts();
            saveDraft();
        }

        async function deleteCurrentPreset() {
            if (!currentPresetId) {
                showToast('No preset selected', 'error');
                return;
            }
            const confirmed = await showConfirmModal('Delete this preset?', {
                title: 'Delete Preset',
                confirmText: 'Delete',
                cancelText: 'Cancel',
                icon: 'trash-2',
                iconColor: 'pink'
            });
            if (!confirmed) return;
            await deletePreset(currentPresetId);
            currentPresetId = null;
            document.getElementById('preset-name').value = '';
            document.getElementById('peopleInput').value = '';
            document.getElementById('taskInput').value = '';
            await saveCurrentPresetId(null);
            saveDraft();
            await saveToCloud();
            await renderPresetSelector();
            updateCounts();
            showToast('Preset deleted', 'success');
        }

        // --- DATA LOGIC ---
        function updateCounts() {
            const p = document.getElementById('peopleInput').value.split(/[\n,;]/).map(s => s.trim()).filter(s => s.length > 0).length;
            const t = document.getElementById('taskInput').value.split(/[\n,;]/).map(s => s.trim()).filter(s => s.length > 0).length;
            document.getElementById('peopleCount').textContent = p;
            document.getElementById('taskCount').textContent = t;
        }

        function dedupePeople() {
            const input = document.getElementById('peopleInput');
            const items = input.value.split(/[\n,;]/).map(s => s.trim()).filter(Boolean);
            const seen = new Set();
            const unique = [];
            for (const name of items) {
                const key = name.toLowerCase();
                if (!seen.has(key)) {
                    seen.add(key);
                    unique.push(name);
                }
            }
            const removed = items.length - unique.length;
            if (removed > 0) {
                input.value = unique.join('\n');
                updateCounts();
                saveDraft();
                showToast(`Removed ${removed} duplicate${removed > 1 ? 's' : ''}`, 'success');
                AudioEngine.playClick();
            } else {
                showToast('No duplicates found', 'info');
            }
        }

        function setGroupSize(size, silent = false) {
            currentGroupSize = size;
            [1, 2, 3, 4].forEach(id => {
                const btn = document.getElementById(`btnSize${id}`);
                if (btn) {
                    const isActive = id === size;
                    btn.classList.toggle('active', isActive);
                    btn.setAttribute('aria-pressed', String(isActive));
                }
            });
            saveDraft();
            if (!silent) AudioEngine.playClick();
        }

        function shuffle(array) {
            const arrayCopy = [...array];
            for (let i = arrayCopy.length - 1; i > 0; i--) {
                const randomValue = new Uint32Array(1);
                window.crypto.getRandomValues(randomValue);
                const j = randomValue[0] % (i + 1);
                [arrayCopy[i], arrayCopy[j]] = [arrayCopy[j], arrayCopy[i]];
            }
            return arrayCopy;
        }

        function showModal() {
            document.getElementById('errorModal').classList.remove('hidden');
            document.getElementById('errorModal').style.display = 'flex';
            AudioEngine.playError();
        }

        function hideModal() {
            document.getElementById('errorModal').classList.add('hidden');
            document.getElementById('errorModal').style.display = 'none';
            AudioEngine.playClick();
        }

        function assignTasks() {
            AudioEngine.init();
            
            let peopleInput = document.getElementById('peopleInput');
            let taskInput = document.getElementById('taskInput');
            let people = peopleInput.value.split(/[\n,;]/).map(s => s.trim()).filter(s => s.length > 0);
            let tasks = taskInput.value.split(/[\n,;]/).map(s => s.trim()).filter(s => s.length > 0);
            const useImageMission = document.getElementById('image-mission-toggle')?.checked || false;
            const hasImageMissions = useImageMission && uploadedImages.length > 0;

            if (people.length === 0 || (tasks.length === 0 && !hasImageMissions)) {
                showModal();
                return;
            }

            // Handle Sorting Mode
            const isRandom = document.getElementById('sort-mode-toggle').checked;
            if (isRandom) {
                people = shuffle(people);
            } else {
                people.sort((a, b) => a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'}));
            }

            // tasks = shuffle(tasks); // Now handled by refilling bucket in renderGrid

            let groups = [];
            if (currentGroupSize === 1) {
                groups = people.map(p => [p]);
            } else {
                for (let i = 0; i < people.length; i += currentGroupSize) {
                    groups.push(people.slice(i, i + currentGroupSize));
                }
            }

            renderGrid(groups, tasks);
            AudioEngine.playSuccess();
            
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#FF6B95', '#FF8C42', '#00E676', '#2979FF']
                });
            }
        }

        function renderGrid(groups, tasks) {
            const cardsGrid = document.getElementById('cardsGrid');
            const resultsArea = document.getElementById('resultsArea');
            const emptyState = document.getElementById('emptyState');
            const useImageMission = document.getElementById('image-mission-toggle')?.checked || false;

            cardsGrid.innerHTML = '';
            emptyState.classList.add('hidden');
            resultsArea.classList.remove('hidden');

            const cardColors = [
                { accent: 'bg-pink', text: 'text-dark' },
                { accent: 'bg-orange', text: 'text-dark' },
                { accent: 'bg-green', text: 'text-dark' },
                { accent: 'bg-blue', text: 'text-dark' },
            ];

            let currentTaskBucket = [];
            groups.forEach((groupArray, index) => {
                let task = 'Image Mission';
                if (tasks.length > 0) {
                    if (currentTaskBucket.length === 0) {
                        currentTaskBucket = shuffle(tasks);
                    }
                    task = currentTaskBucket.pop();
                }
                const colorTheme = cardColors[index % cardColors.length];
                const isGroup = groupArray.length > 1;
                const label = isGroup ? 'TEAM' : 'STUDENT';

                // --- Text Fitting Logic ---
                const taskWords = task.split(/\s+/).filter(w => w.length > 0);
                const isMultiWordTask = taskWords.length >= 2;

                // --- Image Logic ---
                const img = uploadedImages.length > 0 ? uploadedImages[index % uploadedImages.length] : null;
                const safeImgUrl = img ? escapeHTML(img.url) : '';
                const imgHtml = img ? (useImageMission
                    ? `<div class="w-full h-full max-h-[280px] rounded-xl overflow-hidden border-2 border-dark/20 dark:border-slate-500 shadow-neo-sm flex items-center justify-center bg-white/40 dark:bg-slate-900/40"><img src="${safeImgUrl}" alt="Mission preview" class="w-full h-full object-contain"></div>`
                    : `<div class="w-full h-24 mb-2 rounded-xl overflow-hidden border-2 border-dark/20 dark:border-slate-500 shadow-neo-sm shrink-0"><img src="${safeImgUrl}" alt="Mission preview" class="w-full h-full object-cover"></div>`
                ) : '';

                const safeLabel = escapeHTML(label);
                const safeTask = escapeHTML(task);

                let namesHtml = '';
                if (isGroup) {
                    namesHtml = `<div class="flex flex-wrap gap-2 mt-2 justify-center">${groupArray.map(n => `<span class="bg-white/75 dark:bg-slate-800/85 border-2 border-dark/25 dark:border-slate-500 px-3 py-1 rounded-xl text-lg font-black text-dark dark:text-white shadow-neo-sm">${escapeHTML(n)}</span>`).join('')}</div>`;
                } else {
                    const studentName = groupArray[0];
                    const nameWords = studentName.split(/\s+/).filter(w => w.length > 0);
                    const isMultiWordName = nameWords.length >= 2;
                    namesHtml = `<div class="fit-text font-black text-dark dark:text-white leading-[1.12] ${isMultiWordName ? '' : 'whitespace-nowrap'}" data-fit-mode="${isMultiWordName ? 'multi' : 'single'}" style="font-size: 24px;">${escapeHTML(studentName)}</div>`;
                }

                const card = document.createElement('div');
                card.className = `assign-card w-full min-h-[14rem] glass-panel border-2 border-dark dark:border-slate-500 rounded-2xl flex shadow-neo animate-pop overflow-hidden`;
                card.style.animationDelay = `${index * 0.1}s`;

                card.innerHTML = `
                    <div class="assign-card-col w-1/2 p-4 flex flex-col justify-center border-r-2 border-dark/20 dark:border-slate-500 border-dashed relative z-10 overflow-hidden">
                        <div class="flex items-center gap-2 mb-2 shrink-0">
                            <div class="w-10 h-10 ${colorTheme.accent} rounded-xl border-2 border-dark/30 dark:border-slate-500 flex items-center justify-center text-dark shadow-neo-sm">
                                <i data-lucide="${isGroup ? 'users' : 'user'}" class="w-5 h-5"></i>
                            </div>
                            <span class="text-xs font-extrabold text-slate-500 dark:text-slate-300 tracking-widest uppercase">${safeLabel}</span>
                        </div>
                        <div class="${isGroup ? 'flex-grow flex items-center justify-center overflow-hidden' : 'assign-fit-container'}">
                            ${namesHtml}
                        </div>
                    </div>

                    <div class="assign-card-col w-1/2 p-4 ${colorTheme.accent} flex flex-col ${useImageMission && imgHtml ? 'justify-start pt-4' : 'justify-center'} items-center text-center relative overflow-hidden">
                        <div class="bg-white/65 dark:bg-slate-900/60 border-2 border-dark/25 dark:border-slate-500 px-3 py-1 rounded-lg text-[10px] font-black text-dark dark:text-white mb-3 tracking-widest uppercase shadow-neo-sm shrink-0">MISSION</div>
                        <div class="${useImageMission && imgHtml ? 'flex-grow flex items-start justify-start pt-1 w-full overflow-hidden' : 'assign-fit-container'}">
                            ${useImageMission && imgHtml ? imgHtml : `<div class="fit-text font-heading font-black leading-[1.12] ${colorTheme.text} z-10 ${isMultiWordTask ? '' : 'whitespace-nowrap'}" data-fit-mode="${isMultiWordTask ? 'multi' : 'single'}" style="font-size: 24px;">${safeTask}</div>`}
                        </div>
                        <i data-lucide="target" class="absolute -bottom-6 -right-6 w-32 h-32 text-dark/10 z-0"></i>
                    </div>
                `;

                cardsGrid.appendChild(card);
            });

            // Fit immediately and re-fit after Tailwind CDN styles & webfonts settle
            const genId = ++renderGenerationId;
            fitAllCardTexts(true);
            requestAnimationFrame(() => {
                if (genId === renderGenerationId) fitAllCardTexts(true);
            });
            setTimeout(() => {
                if (genId === renderGenerationId) fitAllCardTexts(true);
            }, 60);
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(() => {
                    if (genId === renderGenerationId) fitAllCardTexts(true);
                });
            }
            lucide.createIcons();
        }

        async function clearAll() {
            const confirmed = await showConfirmModal('Clear all names, missions, and generated results?', {
                title: 'Clear Everything?',
                confirmText: 'Clear All'
            });
            if (!confirmed) return;

            document.getElementById('peopleInput').value = '';
            document.getElementById('taskInput').value = '';
            updateCounts();
            saveDraft();
            document.getElementById('cardsGrid').innerHTML = '';
            document.getElementById('resultsArea').classList.add('hidden');
            document.getElementById('emptyState').classList.remove('hidden');
            AudioEngine.playClick();
            showToast('Cleared!', 'info');
        }

        function updateSortIcon() {
            const isRandom = document.getElementById('sort-mode-toggle').checked;
            const iconEl = document.getElementById('sort-icon-ui');
            if (isRandom) {
                iconEl.setAttribute('data-lucide', 'shuffle');
            } else {
                iconEl.setAttribute('data-lucide', 'arrow-down-az');
            }
            lucide.createIcons();
        }

        function syncMissionModeButtons() {
            const enabled = document.getElementById('image-mission-toggle').checked;
            const textBtn = document.getElementById('text-mission-btn');
            const imgBtn = document.getElementById('image-mission-btn');
            if (!textBtn || !imgBtn) return;
            const activeClass = 'flex-1 py-1.5 px-2 rounded-md text-[10px] font-bold uppercase transition-all bg-white dark:bg-slate-600 text-dark dark:text-white shadow-neo-sm';
            const inactiveClass = 'flex-1 py-1.5 px-2 rounded-md text-[10px] font-bold uppercase transition-all text-slate-500 dark:text-slate-400 hover:bg-white/50 dark:hover:bg-slate-600/50';
            textBtn.setAttribute('aria-pressed', String(!enabled));
            imgBtn.setAttribute('aria-pressed', String(enabled));
            if (enabled) {
                textBtn.className = inactiveClass;
                imgBtn.className = activeClass;
            } else {
                textBtn.className = activeClass;
                imgBtn.className = inactiveClass;
            }
        }

        function setMissionMode(mode) {
            const checkbox = document.getElementById('image-mission-toggle');
            checkbox.checked = mode === 'image';
            onImageMissionToggle();
        }

        function onImageMissionToggle() {
            const enabled = document.getElementById('image-mission-toggle').checked;
            if (enabled && uploadedImages.length === 0) {
                showToast('Upload images first', 'warning');
                document.getElementById('image-mission-toggle').checked = false;
                syncMissionModeButtons();
                saveDraft();
                return;
            }
            syncMissionModeButtons();
            saveDraft();
            // If cards are already rendered, refresh them
            const cardsGrid = document.getElementById('cardsGrid');
            if (cardsGrid && cardsGrid.children.length > 0) {
                assignTasks();
            }
        }

        function updateSoundButtonUI() {
            const button = document.getElementById('sound-toggle');
            if (!button) return;
            const icon = audioEnabled ? 'volume-2' : 'volume-x';
            button.setAttribute('aria-pressed', String(audioEnabled));
            button.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5"></i>`;
        }

        // --- INIT ---
        async function initializeApp() {
            loadTheme();
            await initDB();
            currentPresetId = await getCurrentPresetId();
            let loadedPreset = false;
            if (currentPresetId) {
                const preset = await getPreset(currentPresetId);
                if (preset) {
                    try {
                        const data = JSON.parse(preset.content || '{}') || {};
                        loadedPreset = true;
                        document.getElementById('peopleInput').value = data.people || '';
                        document.getElementById('taskInput').value = data.tasks || '';
                        if (data.isRandom !== undefined) document.getElementById('sort-mode-toggle').checked = data.isRandom;
                        if (data.useImageMission !== undefined) document.getElementById('image-mission-toggle').checked = data.useImageMission;
                        if ([1, 2, 3, 4].includes(Number(data.groupSize))) currentGroupSize = Number(data.groupSize);
                        document.getElementById('preset-name').value = preset.name;
                    } catch (err) {
                        console.warn('Corrupt preset ignored', err);
                    }
                }
            }
            if (!loadedPreset) {
                const draft = loadDraft();
                if (draft) {
                    if (typeof draft.people === 'string') document.getElementById('peopleInput').value = draft.people;
                    if (typeof draft.tasks === 'string') document.getElementById('taskInput').value = draft.tasks;
                    if (draft.isRandom !== undefined) document.getElementById('sort-mode-toggle').checked = !!draft.isRandom;
                    if (draft.useImageMission !== undefined) document.getElementById('image-mission-toggle').checked = !!draft.useImageMission;
                    if ([1, 2, 3, 4].includes(Number(draft.groupSize))) currentGroupSize = Number(draft.groupSize);
                }
            }
            syncMissionModeButtons();
            updateSortIcon();
            setGroupSize(currentGroupSize, true);
            updateSoundButtonUI();
            await renderPresetSelector();
            await refreshImagePreviews();
            updateCounts();
            lucide.createIcons();

            // Listeners
            document.getElementById('peopleInput').addEventListener('input', () => {
                updateCounts();
                saveDraft();
            });
            document.getElementById('taskInput').addEventListener('input', () => {
                updateCounts();
                saveDraft();
            });
            document.getElementById('sort-mode-toggle').addEventListener('change', () => {
                saveDraft();
            });

            document.getElementById('sound-toggle').addEventListener('click', () => {
                audioEnabled = !audioEnabled;
                localStorage.setItem(LS_KEY_SOUND, audioEnabled ? 'on' : 'off');
                updateSoundButtonUI();
                lucide.createIcons();
                if (audioEnabled) AudioEngine.playClick();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    const errModal = document.getElementById('errorModal');
                    if (errModal && !errModal.classList.contains('hidden')) {
                        hideModal();
                    }
                } else if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    const errModal = document.getElementById('errorModal');
                    if (errModal && !errModal.classList.contains('hidden')) return;
                    e.preventDefault();
                    assignTasks();
                }
            });

            let resizeFitTimer = null;
            window.addEventListener('resize', () => {
                clearTimeout(resizeFitTimer);
                resizeFitTimer = setTimeout(() => fitAllCardTexts(true), 120);
            });
        }

        window.onload = async () => {
            await requireAuth();
            await initializeApp();
        };
    </script>
</body>
</html>
