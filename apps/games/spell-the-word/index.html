<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spell It | KlassKit</title>
    <link rel="icon" type="image/x-icon" href="../../../media/icon.ico" />
    <link rel="icon" type="image/webp" href="../../../media/icon.webp" />

    <!-- Early Synchronous Dark Mode & Hub Color-Theme Sync -->
    <script>
        (function () {
            function readStored(key) {
                try {
                    var raw = localStorage.getItem(key);
                    if (raw == null) return null;
                    try { return JSON.parse(raw); } catch (e) { return raw; }
                } catch (e) { return null; }
            }
            function syncTheme(changedKey) {
                var isDark;
                if (changedKey === 'theme_hub') {
                    var hubVal = readStored('theme_hub');
                    isDark = hubVal ? hubVal === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
                } else {
                    var toolTheme = readStored('theme_spell-the-word') || readStored('theme') || readStored('klasskit-theme');
                    var hubTheme = readStored('theme_hub');
                    isDark = toolTheme
                        ? toolTheme === 'dark'
                        : hubTheme
                            ? hubTheme === 'dark'
                            : window.matchMedia('(prefers-color-scheme: dark)').matches;
                }
                document.documentElement.classList.toggle('dark', isDark);

                var colorTheme = readStored('klasskit_colorTheme');
                if (colorTheme && colorTheme !== 'classic') {
                    document.documentElement.setAttribute('data-theme', colorTheme);
                } else {
                    document.documentElement.removeAttribute('data-theme');
                }
            }
            syncTheme();
            window.addEventListener('storage', function (e) {
                if (
                    e.key === 'theme_hub' ||
                    e.key === 'theme_spell-the-word' ||
                    e.key === 'theme' ||
                    e.key === 'klasskit-theme' ||
                    e.key === 'klasskit_colorTheme'
                ) {
                    syncTheme(e.key);
                }
            });
        })();
    </script>

    <!-- Core Typography: Fredoka (Headings) + Nunito (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <!-- Stylesheets (?v=2) -->
    <link rel="stylesheet" href="../../../css/tailwind.generated.css?v=2" />
    <link rel="stylesheet" href="../../../css/base.css?v=2" />
    <link rel="stylesheet" href="../../../css/components.css?v=2" />
    <link rel="stylesheet" href="./style.css?v=2" />

    <!-- Deferred Runtime Scripts -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.4"></script>
    <script defer src="/supabase.js"></script>
    <script defer src="https://unpkg.com/lucide@1.16.0"></script>
    <script defer src="./script.js?v=2"></script>
    <script defer src="/js/analytics.js"></script>
</head>

<body class="h-screen w-screen overflow-hidden font-body text-dark dark:text-slate-100 flex flex-col">

    <!-- TOP GLASSMORPHIC NAVIGATION BAR -->
    <header id="topBar" class="glass-topbar sticky top-0 z-40 px-3 sm:px-5 py-2.5 flex-none">
        <div class="max-w-6xl mx-auto w-full flex flex-wrap items-center justify-between gap-2.5">
            <!-- Brand + Status Pills -->
            <div class="flex items-center gap-2.5 min-w-0">
                <div class="w-10 h-10 rounded-xl bg-green text-white border-2 border-dark dark:border-slate-500 shadow-hard-sm flex items-center justify-center flex-shrink-0">
                    <i data-lucide="spell-check" class="w-5 h-5"></i>
                </div>
                <div class="min-w-0">
                    <h1 class="font-heading text-lg sm:text-xl font-bold uppercase tracking-tight leading-none text-dark dark:text-white truncate">
                        Spell It
                    </h1>
                    <p class="text-[11px] font-extrabold uppercase tracking-widest text-slate-500 dark:text-slate-400 truncate mt-0.5">
                        Phonics Spelling Arena
                    </p>
                </div>

                <span id="progressBadge" class="hidden sm:inline-flex sticker -rotate-2 bg-pink text-white px-3 py-1 rounded-xl text-xs uppercase ml-2">
                    Word 1 of 3
                </span>

                <span id="streakBadge" class="hidden md:inline-flex items-center gap-1 px-2.5 py-1 rounded-xl bg-white dark:bg-slate-800 border-2 border-dark dark:border-slate-500 shadow-hard-xs font-heading font-bold text-xs uppercase text-orange">
                    <i data-lucide="flame" class="w-3.5 h-3.5"></i>
                    <span id="streakCount">0</span>
                </span>
            </div>

            <!-- Action Controls -->
            <div class="flex items-center gap-2">
                <button type="button" id="btnOpenPlayer" onclick="App.openStudentView()" title="Open Student View"
                    class="btn-chunky bg-green text-white rounded-xl px-3 py-1.5 text-xs flex items-center gap-1.5">
                    <i data-lucide="monitor" class="w-4 h-4"></i>
                    <span class="hidden md:inline">Student View</span>
                </button>

                <button type="button" id="reachModeBtn" onclick="App.toggleReachMode()" aria-label="Toggle Reach Mode" title="Reach Mode (bottom alignment)"
                    class="btn-chunky bg-pink text-white rounded-xl w-9 h-9 p-0 flex-shrink-0">
                    <span id="reachIconSlot" class="inline-flex items-center justify-center"><i data-lucide="arrow-down" class="w-4 h-4"></i></span>
                </button>

                <button type="button" id="sfxToggleBtn" onclick="App.toggleSfx()" aria-label="Toggle sound effects"
                    class="btn-chunky bg-white dark:bg-slate-800 text-dark dark:text-white rounded-xl w-9 h-9 p-0 flex-shrink-0">
                    <span id="sfxIconSlot" class="inline-flex items-center justify-center"><i data-lucide="volume-2" class="w-4 h-4 text-green"></i></span>
                </button>

                <button type="button" id="settingsBtn" onclick="App.openSettings()" aria-label="Word sets manager"
                    class="btn-chunky bg-blue text-white rounded-xl px-3 py-1.5 text-xs flex items-center gap-1.5">
                    <i data-lucide="layers" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Sets</span>
                </button>

                <button type="button" id="themeToggleBtn" onclick="App.toggleDarkMode()" aria-label="Toggle dark mode"
                    class="btn-chunky bg-white dark:bg-slate-800 text-dark dark:text-white rounded-xl w-9 h-9 p-0 flex-shrink-0">
                    <span id="themeToggleIconSlot" class="inline-flex items-center justify-center"><i data-lucide="moon" class="w-4 h-4"></i></span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN SPELLING ARENA -->
    <main id="mainWrapper" class="main-wrapper flex-1 min-h-0 overflow-y-auto p-3 sm:p-6">
        <div id="gameBoard" class="glass-surface w-full max-w-5xl p-5 sm:p-8 flex flex-col items-center gap-5 sm:gap-6">

            <!-- Word Prompt & Navigation Header -->
            <div class="w-full flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-2 sm:hidden">
                    <span id="mobileProgressBadge" class="sticker bg-pink text-white px-2.5 py-1 rounded-xl text-xs uppercase">1 / 3</span>
                </div>

                <div class="flex items-center gap-2.5 mx-auto">
                    <button type="button" id="prevWordBtn" onclick="App.prevWord()" aria-label="Previous word"
                        class="btn-chunky bg-white dark:bg-slate-800 text-dark dark:text-white rounded-xl w-10 h-10 p-0">
                        <i data-lucide="chevron-left" class="w-5 h-5"></i>
                    </button>

                    <button type="button" id="listenBtn" onclick="App.playTargetWordAudio()"
                        class="btn-chunky bg-blue text-white rounded-2xl px-5 py-2.5 text-base sm:text-lg flex items-center gap-2">
                        <i data-lucide="volume-2" class="w-5 h-5"></i>
                        <span>Hear Word</span>
                    </button>

                    <button type="button" id="nextWordBtn" onclick="App.nextWord()" aria-label="Next word"
                        class="btn-chunky bg-white dark:bg-slate-800 text-dark dark:text-white rounded-xl w-10 h-10 p-0">
                        <i data-lucide="chevron-right" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Answer Slots Tray -->
            <div class="w-full bg-slate-50/90 dark:bg-slate-900/75 rounded-2xl p-5 sm:p-7 border-3 border-dark dark:border-slate-500 shadow-inner-hard flex items-center justify-center min-h-[120px]">
                <div id="slotsContainer" class="flex flex-wrap gap-2.5 sm:gap-4 justify-center"></div>
            </div>

            <!-- Letter Pool Tray -->
            <div class="w-full bg-slate-100/90 dark:bg-slate-800/80 rounded-2xl p-4 sm:p-6 border-2 border-dark dark:border-slate-500 flex flex-col items-center gap-4">
                <div class="w-full flex flex-wrap items-center justify-between gap-2">
                    <span class="font-heading font-bold text-xs uppercase tracking-widest text-slate-500 dark:text-slate-300">
                        Letter Pool
                    </span>

                    <div id="poolControls" class="flex items-center gap-1.5">
                        <button type="button" id="hintBtn" onclick="App.useHint()"
                            class="btn-chunky bg-orange text-white rounded-xl px-3 py-1 text-xs flex items-center gap-1">
                            <i data-lucide="lightbulb" class="w-3.5 h-3.5"></i>
                            <span>Hint</span>
                        </button>
                        <button type="button" id="shuffleBtn" onclick="App.shufflePool()"
                            class="btn-chunky bg-white dark:bg-slate-900 text-dark dark:text-white rounded-xl px-3 py-1 text-xs flex items-center gap-1">
                            <i data-lucide="shuffle" class="w-3.5 h-3.5 text-blue"></i>
                            <span class="hidden sm:inline">Shuffle</span>
                        </button>
                        <button type="button" id="clearSlotsBtn" onclick="App.clearSlots()"
                            class="btn-chunky bg-white dark:bg-slate-900 text-dark dark:text-white rounded-xl px-3 py-1 text-xs flex items-center gap-1">
                            <i data-lucide="eraser" class="w-3.5 h-3.5 text-pink"></i>
                            <span class="hidden sm:inline">Clear</span>
                        </button>
                    </div>
                </div>

                <div id="lettersContainer" class="flex flex-wrap gap-2.5 sm:gap-4 justify-center min-h-[82px]"></div>
            </div>

            <p id="keyboardHintLine" class="text-[11px] font-bold text-slate-500 dark:text-slate-400 text-center">
                Tap tiles or type <kbd class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-700 border border-dark dark:border-slate-500 font-heading text-[10px]">A–Z</kbd> &amp; <kbd class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-700 border border-dark dark:border-slate-500 font-heading text-[10px]">Backspace</kbd> on your keyboard.
            </p>
        </div>
    </main>

    <!-- STUDENT VIEW FLOATING TOOLBAR (?player=1) -->
    <div id="playerToolbar" class="is-hidden fixed bottom-4 left-1/2 -translate-x-1/2 z-50 glass-surface px-5 py-2.5 flex items-center gap-3">
        <span class="sticker bg-green text-white px-2.5 py-0.5 rounded-lg text-[10px] uppercase">Student View</span>
        <span id="playerConnStatus" class="text-xs font-extrabold uppercase text-slate-500 dark:text-slate-300 flex items-center gap-1.5">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5 animate-spin text-blue"></i>
            <span>Syncing...</span>
        </span>
        <span id="studentWordDisplay" class="font-heading text-sm font-bold text-dark dark:text-white">0 / 0</span>
    </div>

    <!-- WORD SETS MANAGER MODAL -->
    <div id="settingsModal" class="modal-overlay" onclick="if (event.target === this) App.closeSettings()">
        <div class="modal-card glass-surface w-full max-w-2xl max-h-[88vh] flex flex-col overflow-hidden">
            <div class="p-4 sm:p-5 border-b-3 border-dark dark:border-slate-500 bg-white/70 dark:bg-slate-900/70 flex items-center justify-between gap-3 flex-none">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="w-10 h-10 rounded-xl bg-blue text-white border-2 border-dark dark:border-slate-500 flex items-center justify-center flex-shrink-0">
                        <i data-lucide="layers" class="w-5 h-5"></i>
                    </div>
                    <div class="min-w-0">
                        <h2 class="font-heading text-xl sm:text-2xl font-bold uppercase text-dark dark:text-white">Word Sets</h2>
                        <p id="smActiveLabel" class="text-[11px] font-extrabold text-slate-500 dark:text-slate-400 uppercase tracking-wider truncate">No saved set loaded</p>
                    </div>
                </div>
                <button type="button" onclick="App.closeSettings()" aria-label="Close word sets modal"
                    class="btn-chunky bg-white dark:bg-slate-800 text-dark dark:text-white rounded-xl w-9 h-9 p-0 flex-shrink-0">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <div class="p-4 sm:p-5 border-b-3 border-dark dark:border-slate-500 space-y-3 flex-none">
                <div class="flex flex-wrap gap-2">
                    <input id="smSetName" type="text" placeholder="Set name (e.g. Grade 3 Animals)"
                        class="flex-1 min-w-[160px] bg-white dark:bg-slate-900 border-2 border-dark dark:border-slate-500 rounded-xl px-3.5 py-2 font-body text-sm font-bold text-dark dark:text-white" />
                    <button type="button" onclick="App.smSaveAsNew()"
                        class="btn-chunky bg-green text-white rounded-xl px-3.5 py-2 text-xs flex items-center gap-1">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span>Save New</span>
                    </button>
                    <button type="button" onclick="App.smSaveCurrent()"
                        class="btn-chunky bg-blue text-white rounded-xl px-3.5 py-2 text-xs flex items-center gap-1">
                        <i data-lucide="save" class="w-4 h-4"></i>
                        <span>Update</span>
                    </button>
                </div>

                <textarea id="wordsInput" rows="3" placeholder="e.g. ENGLISH, KLASSKIT, CODING (comma or new line separated)"
                    class="w-full bg-white dark:bg-slate-900 border-2 border-dark dark:border-slate-500 rounded-2xl p-3 font-heading text-base uppercase font-bold text-dark dark:text-white resize-y"></textarea>

                <button type="button" onclick="App.smPlayCurrent()"
                    class="btn-chunky bg-pink text-white rounded-xl py-2.5 px-5 text-sm w-full flex items-center justify-center gap-2">
                    <i data-lucide="play" class="w-4 h-4"></i>
                    <span>Play This List Now</span>
                </button>
            </div>

            <div class="flex-1 min-h-0 overflow-y-auto p-4 sm:p-5 space-y-3">
                <div class="flex items-center justify-between gap-2">
                    <span class="font-heading font-bold text-xs uppercase tracking-widest text-slate-500 dark:text-slate-400">Saved Sets</span>
                    <select id="smSort" onchange="App.smRenderLibrary()" aria-label="Sort saved sets"
                        class="text-xs font-bold bg-white dark:bg-slate-800 text-dark dark:text-white border-2 border-dark dark:border-slate-500 rounded-xl px-2.5 py-1">
                        <option value="recent">Recent</option>
                        <option value="alpha">A–Z</option>
                        <option value="popular">Popular</option>
                    </select>
                </div>
                <div id="smLibrary" class="flex flex-col gap-2"></div>
            </div>
        </div>
    </div>

    <!-- FEEDBACK MODAL (WORD SOLVED / TRY AGAIN) -->
    <div id="feedbackModal" class="modal-overlay" onclick="if (event.target === this) App.handleFeedbackAction()">
        <div class="modal-card glass-surface max-w-md w-full p-6 text-center">
            <div id="feedbackIconSlot" class="w-16 h-16 rounded-2xl bg-green text-white border-3 border-dark dark:border-slate-500 shadow-hard-md mx-auto flex items-center justify-center mb-3">
                <i data-lucide="circle-check" class="w-8 h-8"></i>
            </div>
            <span id="feedbackBadge" class="sticker -rotate-2 bg-orange text-white px-3 py-1 rounded-full text-xs uppercase mb-2">Well Done</span>
            <h2 id="feedbackTitle" class="font-heading text-3xl font-bold uppercase text-dark dark:text-white mt-1 mb-2">Awesome!</h2>
            <p id="feedbackMessage" class="text-sm font-bold text-slate-600 dark:text-slate-300 mb-6">You spelled it right.</p>
            <button type="button" id="feedbackActionBtn" onclick="App.handleFeedbackAction()"
                class="btn-chunky bg-green text-white rounded-xl px-6 py-3 text-base w-full">
                Next Word
            </button>
        </div>
    </div>

    <!-- REUSABLE CONFIRMATION MODAL -->
    <div id="confirmModal" class="modal-overlay" onclick="if (event.target === this) App.cancelConfirm()">
        <div class="modal-card glass-surface max-w-md w-full p-6 text-center">
            <div class="w-14 h-14 rounded-2xl bg-pink text-white border-3 border-dark dark:border-slate-500 shadow-hard-sm mx-auto flex items-center justify-center mb-3">
                <i data-lucide="triangle-alert" class="w-7 h-7"></i>
            </div>
            <h2 id="confirmTitle" class="font-heading text-2xl font-bold uppercase text-dark dark:text-white mb-2">Delete Set?</h2>
            <p id="confirmMessage" class="text-sm font-bold text-slate-600 dark:text-slate-300 mb-6">Are you sure?</p>
            <div class="grid grid-cols-2 gap-3">
                <button type="button" onclick="App.cancelConfirm()"
                    class="btn-chunky bg-white dark:bg-slate-800 text-dark dark:text-white rounded-xl px-4 py-2.5 text-sm">
                    Cancel
                </button>
                <button type="button" onclick="App.executeConfirm()"
                    class="btn-chunky bg-pink text-white rounded-xl px-4 py-2.5 text-sm">
                    Delete
                </button>
            </div>
        </div>
    </div>

    <!-- FLOATING TOAST -->
    <div id="toastBanner" role="status" aria-live="polite"
        class="glass-surface bg-dark text-white px-4 py-2.5 rounded-xl flex items-center gap-2 text-xs sm:text-sm font-heading font-bold uppercase tracking-wide shadow-hard-md">
        <span id="toastIconSlot" class="inline-flex items-center justify-center flex-shrink-0"><i data-lucide="info" class="w-4 h-4 text-blue"></i></span>
        <span id="toastText">Notification</span>
    </div>

</body>

</html>
