<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Supabase Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.4"></script>
    <script src="/supabase.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card</title>
    <link rel="icon" type="image/x-icon" href="../../../media/icon.ico" />
    <link rel="icon" type="image/webp" href="../../../media/icon.webp" />

    <!-- Early Theme Init -->
    <script>
        (function () {
            const saved = localStorage.getItem('theme_card-memory');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@1.16.0"></script>
    <script src="../../../components/input-modal.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            pink: '#ff4785',
                            orange: '#ff7e33',
                            green: '#00d063',
                            blue: '#1ea7fd',
                            dark: '#1e293b',
                            chalk: '#f8fafc',
                        }
                    },
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        heading: ['Fredoka', 'sans-serif'],
                    },
                    boxShadow: {
                        'neo': '4px 4px 0px 0px #1e293b',
                        'neo-sm': '2px 2px 0px 0px #1e293b',
                        'neo-lg': '8px 8px 0px 0px #1e293b',
                        'neo-pressed': '0px 0px 0px 0px #1e293b',
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="../../../css/base.css" />
    <link rel="stylesheet" href="../../../css/components.css" />

    <style>
        :focus-visible {
            outline: 3px solid #1ea7fd;
            outline-offset: 2px;
        }

        .dark .shadow-neo {
            box-shadow: 4px 4px 0px 0px #000000;
        }

        .dark .shadow-neo-sm {
            box-shadow: 2px 2px 0px 0px #000000;
        }

        .dark .shadow-neo-lg {
            box-shadow: 8px 8px 0px 0px #000000;
        }

        /* 3D Mechanics */
        .perspective-1000 {
            perspective: 1000px;
        }

        .transform-style-3d {
            transform-style: preserve-3d;
        }

        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        /* Button Interaction */
        .btn-neo {
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.15s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.15s ease;
        }

        .btn-neo:hover:not(:disabled) {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px 0px #1e293b;
        }

        .dark .btn-neo:hover:not(:disabled) {
            box-shadow: 6px 6px 0px 0px #000000;
        }

        .btn-neo:active:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px 0px #1e293b;
        }

        .dark .btn-neo:active:not(:disabled) {
            box-shadow: 0px 0px 0px 0px #000000;
        }

        /* Image Handling */
        .card-img {
            object-fit: contain;
            width: 85%;
            height: 85%;
            pointer-events: none;
            filter: drop-shadow(0 4px 3px rgb(0 0 0 / 0.07));
        }

        /* Drop Zone */
        .drop-zone {
            transition: all 0.2s;
        }

        .drop-zone.drag-over {
            background-color: rgba(30, 167, 253, 0.12);
            border-color: #1ea7fd;
            transform: scale(1.01);
        }
    </style>

</head>

    <script>
        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function shuffleArray(arr) {
            const copy = arr.slice();
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        const AudioFX = {
            ctx: null,
            muted: localStorage.getItem('sound_card-memory') === 'muted',
            init() {
                if (!this.ctx) {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    if (Ctx) this.ctx = new Ctx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume().catch(() => { });
                }
            },
            playTone(freq, type, duration, vol = 0.08) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            },
            playFlip() { this.playTone(440, 'sine', 0.08, 0.05); },
            playHide() {
                this.playTone(520, 'triangle', 0.12, 0.08);
                setTimeout(() => this.playTone(390, 'triangle', 0.18, 0.08), 90);
            },
            playReveal() {
                this.playTone(523.25, 'triangle', 0.12, 0.08);
                setTimeout(() => this.playTone(659.25, 'triangle', 0.18, 0.08), 90);
            }
        };

        /**
         * Game Module
         * Handles hybrid input (text + images), drag-and-drop, and game states.
         */
        const Game = (function () {
            // --- State ---
            let state = {
                items: [],         // Final mixed list for game
                pendingImages: [], // Base64 strings from upload
                duration: 30,
                theme: 'random',
                timerInterval: null,
                flipTimeouts: [],
                isRevealing: false
            };

            // --- Presets Data ---
            const presets = {
                animals: "Lion, Tiger, Elephant, Monkey, Zebra, Giraffe, Bear",
                fruits: "Apple, Banana, Orange, Grape, Melon, Kiwi, Lemon",
                classroom: "Pencil, Ruler, Book, Desk, Chair, Eraser, Bag",
                actions: "Run, Jump, Sleep, Eat, Drink, Read, Write"
            };

            const colors = {
                pink: 'bg-brand-pink text-white',
                white: 'bg-white dark:bg-slate-800 text-brand-dark dark:text-white',
                random: ['bg-brand-pink text-white', 'bg-brand-orange text-white', 'bg-brand-green text-brand-dark', 'bg-brand-blue text-white']
            };

            // --- DOM Elements ---
            const els = {
                grid: document.getElementById('game-grid'),
                modal: document.getElementById('setup-modal'),
                timerBar: document.getElementById('timer-container'),
                timerFill: document.getElementById('timer-fill'),
                timerNum: document.getElementById('timer-number'),
                preview: document.getElementById('image-preview'),
                dropZone: document.getElementById('drop-area'),
                itemCount: document.getElementById('setup-item-count'),
                soundBtn: document.getElementById('sound-btn'),
                inputs: {
                    words: document.getElementById('input-words'),
                    time: document.getElementById('input-time'),
                    theme: document.getElementById('input-color')
                },
                btns: {
                    start: document.getElementById('btn-start'),
                    hide: document.getElementById('btn-hide'),
                    revealGroup: document.getElementById('controls-reveal')
                },
                status: document.getElementById('status-text')
            };

            // --- Init ---
            async function init() {
                await requireAuth();
                updateSoundUI();
                lucide.createIcons();
                setupDragDrop();
                setupKeyboardAndInputs();
                updateSetupCount();

                // Load Cloud Progress
                try {
                    const data = await loadProgress('card-memory');
                    if (data) {
                        state.items = data.items || [];
                        state.duration = clampDuration(data.duration);
                        state.theme = data.theme || 'random';

                        if (state.items.length > 0) {
                            els.inputs.words.value = state.items
                                .filter(i => i.type === 'text')
                                .map(i => i.value).join(', ');
                            els.inputs.time.value = state.duration;
                            els.inputs.theme.value = state.theme;

                            state.pendingImages = state.items
                                .filter(i => i.type === 'image')
                                .map(i => i.value);
                            updatePreview();
                            updateSetupCount();

                            renderGrid();
                            resetUI();
                            els.status.textContent = `${state.items.length} items restored. Press Start!`;
                        }
                    }
                } catch (e) {
                    console.error("Cloud load failed", e);
                }
            }

            function clampDuration(val) {
                const n = parseInt(val, 10);
                if (isNaN(n)) return 30;
                return Math.min(300, Math.max(3, n));
            }

            function clearFlipTimeouts() {
                state.flipTimeouts.forEach(id => clearTimeout(id));
                state.flipTimeouts = [];
            }

            function setupKeyboardAndInputs() {
                els.inputs.words.addEventListener('input', updateSetupCount);
                els.modal.addEventListener('click', (e) => {
                    if (e.target === els.modal) closeSetup();
                });

                document.addEventListener('keydown', (e) => {
                    const isSetupOpen = !els.modal.classList.contains('hidden');
                    const inputModal = document.getElementById('universalInputModal');
                    const isAlertOpen = inputModal && !inputModal.classList.contains('hidden');

                    if (e.key === 'Escape' && isSetupOpen && !isAlertOpen) {
                        closeSetup();
                        return;
                    }

                    const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
                    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable)) {
                        return;
                    }
                    if (isSetupOpen || isAlertOpen) return;

                    if (e.key === ' ' && !e.ctrlKey && !e.metaKey && !e.altKey) {
                        if (!els.btns.start.classList.contains('hidden')) {
                            e.preventDefault();
                            startMemorization();
                        } else if (!els.btns.hide.classList.contains('hidden')) {
                            e.preventDefault();
                            hideCards();
                        }
                    } else if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey && !e.metaKey && !e.altKey) {
                        if (!els.btns.revealGroup.classList.contains('hidden')) {
                            e.preventDefault();
                            revealAll();
                        }
                    }
                });
            }

            function updateSetupCount() {
                if (!els.itemCount) return;
                const textWords = els.inputs.words.value
                    .split(/[\n,]+/)
                    .map(w => w.trim())
                    .filter(Boolean).length;
                const total = textWords + state.pendingImages.length;
                els.itemCount.textContent = `${total} item${total === 1 ? '' : 's'}`;
            }

            function setupDragDrop() {
                const zone = els.dropZone;

                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                    zone.addEventListener(eventName, preventDefaults, false);
                });

                function preventDefaults(e) {
                    e.preventDefault();
                    e.stopPropagation();
                }

                ['dragenter', 'dragover'].forEach(eventName => {
                    zone.addEventListener(eventName, () => zone.classList.add('drag-over'), false);
                });

                ['dragleave', 'drop'].forEach(eventName => {
                    zone.addEventListener(eventName, () => zone.classList.remove('drag-over'), false);
                });

                zone.addEventListener('drop', (e) => {
                    const dt = e.dataTransfer;
                    const files = dt.files;
                    handleFiles(files);
                });
            }

            // --- Setup Logic ---

            function openSetup() {
                updateSetupCount();
                els.modal.classList.remove('hidden');
            }

            function closeSetup() {
                els.modal.classList.add('hidden');
            }

            function usePreset(key) {
                const current = els.inputs.words.value.trim();
                const newVal = presets[key];

                if (current.length > 0) {
                    els.inputs.words.value = current + ", " + newVal;
                } else {
                    els.inputs.words.value = newVal;
                }
                updateSetupCount();
            }

            function dedupeWords() {
                const raw = els.inputs.words.value;
                const words = raw.split(/[\n,]+/).map(w => w.trim()).filter(Boolean);
                const seen = new Set();
                const unique = [];
                for (const w of words) {
                    const k = w.toLowerCase();
                    if (!seen.has(k)) {
                        seen.add(k);
                        unique.push(w);
                    }
                }
                els.inputs.words.value = unique.join(', ');
                updateSetupCount();
            }

            function handleFiles(files) {
                if (files && files.length > 0) {
                    Array.from(files).forEach(file => {
                        if (!file.type.startsWith('image/')) return;

                        const reader = new FileReader();
                        reader.onload = function (e) {
                            state.pendingImages.push(e.target.result);
                            updatePreview();
                            updateSetupCount();
                        };
                        reader.readAsDataURL(file);
                    });
                }
            }

            function updatePreview() {
                els.preview.innerHTML = '';
                if (state.pendingImages.length === 0) return;

                state.pendingImages.forEach((src, idx) => {
                    const thumb = document.createElement('div');
                    thumb.className = "w-14 h-14 border-2 border-brand-dark dark:border-slate-500 rounded-lg relative shadow-sm hover:scale-105 transition-transform bg-white overflow-visible";

                    const img = document.createElement('img');
                    img.src = src;
                    img.alt = `Uploaded image ${idx + 1}`;
                    img.className = "w-full h-full object-cover rounded-md";

                    const delBtn = document.createElement('button');
                    delBtn.type = "button";
                    delBtn.setAttribute('aria-label', `Remove image ${idx + 1}`);
                    delBtn.className = "absolute -top-2 -right-2 bg-brand-pink text-white rounded-full w-5 h-5 flex items-center justify-center text-xs border-2 border-brand-dark hover:bg-red-600 shadow-sm font-bold";
                    delBtn.textContent = "×";
                    delBtn.onclick = () => removeImage(idx);

                    thumb.appendChild(img);
                    thumb.appendChild(delBtn);
                    els.preview.appendChild(thumb);
                });
            }

            function removeImage(idx) {
                state.pendingImages.splice(idx, 1);
                updatePreview();
                updateSetupCount();
            }

            function clearAll() {
                state.pendingImages = [];
                els.inputs.words.value = '';
                updatePreview();
                updateSetupCount();
            }

            async function saveSetup() {
                state.items = [];

                const textRaw = els.inputs.words.value;
                if (textRaw.trim()) {
                    const words = textRaw.split(/[\n,]+/).map(w => w.trim()).filter(w => w.length > 0);
                    words.forEach(w => state.items.push({ type: 'text', value: w }));
                }

                state.pendingImages.forEach(src => {
                    state.items.push({ type: 'image', value: src });
                });

                state.duration = clampDuration(els.inputs.time.value);
                els.inputs.time.value = state.duration;
                state.theme = els.inputs.theme.value;

                if (state.items.length === 0) {
                    await showAlertModal("Please add some words or images first!", { title: "No Items", icon: "alert-circle", iconColor: "orange" });
                    return;
                }

                clearInterval(state.timerInterval);
                clearFlipTimeouts();
                state.isRevealing = false;

                shuffleItems();
                renderGrid();
                resetUI();
                closeSetup();
                els.status.textContent = `${state.items.length} items loaded. Press Start!`;
                els.status.className = "font-sans text-xs sm:text-sm font-extrabold text-brand-orange dark:text-brand-green uppercase tracking-wider truncate mt-0.5";

                saveProgress('card-memory', {
                    items: state.items,
                    duration: state.duration,
                    theme: state.theme
                });
            }

            function shuffleItems() {
                state.items = shuffleArray(state.items);
            }

            // --- Game Logic ---

            function resetUI() {
                els.btns.start.classList.remove('hidden');
                els.btns.hide.classList.add('hidden');
                els.btns.revealGroup.classList.add('hidden');
                els.timerBar.classList.add('hidden');
            }

            function renderGrid() {
                els.grid.innerHTML = '';
                const count = state.items.length;

                let gridClass = "grid gap-3 sm:gap-4 w-full ";
                let cardHeightClass = "h-32 sm:h-36 md:h-40";
                if (count <= 4) {
                    gridClass += "grid-cols-2 md:grid-cols-2 max-w-3xl";
                    cardHeightClass = "h-36 sm:h-44 md:h-48";
                } else if (count <= 8) {
                    gridClass += "grid-cols-3 md:grid-cols-4 max-w-5xl";
                } else if (count <= 10) {
                    gridClass += "grid-cols-3 md:grid-cols-5 max-w-6xl";
                } else {
                    gridClass += "grid-cols-3 md:grid-cols-5 max-w-6xl";
                    cardHeightClass = "h-28 sm:h-32";
                }

                els.grid.className = gridClass;

                state.items.forEach((item, index) => {
                    let bgClass = '';
                    if (state.theme === 'random') {
                        bgClass = colors.random[index % colors.random.length];
                    } else {
                        bgClass = colors[state.theme] || colors.random[0];
                    }

                    const card = document.createElement('div');
                    card.className = `group ${cardHeightClass} perspective-1000 cursor-pointer select-none`;
                    card.setAttribute('role', 'button');
                    card.setAttribute('tabindex', '0');
                    card.setAttribute('aria-label', `Card ${index + 1}`);

                    let content = '';
                    if (item.type === 'text') {
                        const safeVal = escapeHTML(item.value);
                        const len = String(item.value).length;
                        const txtSize = len > 18 ? 'text-lg md:text-xl' : len > 10 ? 'text-xl md:text-2xl' : 'text-2xl md:text-3xl';
                        content = `<span class="font-heading ${txtSize} font-black break-words px-3 leading-tight drop-shadow-sm">${safeVal}</span>`;
                    } else {
                        const safeSrc = escapeHTML(item.value);
                        content = `<img src="${safeSrc}" alt="Memory card" class="card-img bg-white rounded-lg border-2 border-brand-dark/10">`;
                    }

                    card.innerHTML = `
                        <div class="card-inner relative w-full h-full text-center transition-all duration-700 transform-style-3d shadow-neo rounded-2xl border-[3px] border-brand-dark dark:border-slate-500" id="card-${index}">
                            <div class="absolute inset-0 w-full h-full ${bgClass} rounded-xl backface-hidden flex items-center justify-center z-20 overflow-hidden">
                                ${content}
                            </div>
                            <div class="absolute inset-0 w-full h-full bg-brand-dark dark:bg-slate-900 rounded-xl rotate-y-180 backface-hidden flex items-center justify-center z-10 border-[3px] border-white/10">
                                <span class="font-heading text-5xl text-brand-chalk opacity-25 font-black">?</span>
                            </div>
                        </div>
                    `;

                    card.onclick = () => toggleCard(index);
                    card.onkeydown = (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            toggleCard(index);
                        }
                    };
                    els.grid.appendChild(card);
                });
            }

            function toggleCard(index) {
                if (!state.isRevealing) return;
                const card = document.getElementById(`card-${index}`);
                if (card) {
                    card.classList.toggle('rotate-y-180');
                    AudioFX.playFlip();
                }
            }

            function startMemorization() {
                clearFlipTimeouts();
                clearInterval(state.timerInterval);
                state.isRevealing = false;

                document.querySelectorAll('.card-inner').forEach(c => c.classList.remove('rotate-y-180'));

                els.btns.start.classList.add('hidden');
                els.btns.revealGroup.classList.add('hidden');
                els.btns.hide.classList.remove('hidden');

                AudioFX.init();
                startTimer();
                els.status.textContent = "Memorize the items!";
                els.status.className = "font-sans text-xs sm:text-sm font-extrabold text-brand-blue uppercase tracking-wider animate-pulse truncate mt-0.5";
            }

            function shuffleAndRestart() {
                clearFlipTimeouts();
                clearInterval(state.timerInterval);
                document.querySelectorAll('.card-inner').forEach(c => c.classList.remove('rotate-y-180'));

                const tid = setTimeout(() => {
                    shuffleItems();
                    renderGrid();
                    startMemorization();
                }, 300);
                state.flipTimeouts.push(tid);
            }

            function startTimer() {
                els.timerBar.classList.remove('hidden');
                let timeLeft = state.duration;

                els.timerFill.classList.remove('bg-brand-pink');
                els.timerFill.classList.add('bg-brand-green');

                els.timerNum.textContent = timeLeft + "s";
                els.timerFill.style.transition = 'none';
                els.timerFill.style.width = '100%';
                void els.timerFill.offsetWidth;

                els.timerFill.style.transition = `width ${state.duration}s linear`;
                els.timerFill.style.width = '0%';

                clearInterval(state.timerInterval);
                state.timerInterval = setInterval(() => {
                    timeLeft--;
                    els.timerNum.textContent = Math.max(0, timeLeft) + "s";

                    if (timeLeft <= 5) {
                        els.timerFill.classList.remove('bg-brand-green');
                        els.timerFill.classList.add('bg-brand-pink');
                    } else {
                        els.timerFill.classList.remove('bg-brand-pink');
                        els.timerFill.classList.add('bg-brand-green');
                    }

                    if (timeLeft <= 0) hideCards();
                }, 1000);
            }

            function hideCards() {
                clearInterval(state.timerInterval);
                clearFlipTimeouts();
                state.isRevealing = true;
                AudioFX.playHide();

                document.querySelectorAll('.card-inner').forEach((c, i) => {
                    const tid = setTimeout(() => c.classList.add('rotate-y-180'), i * 30);
                    state.flipTimeouts.push(tid);
                });

                els.timerBar.classList.add('hidden');
                els.btns.hide.classList.add('hidden');
                els.btns.revealGroup.classList.remove('hidden');
                els.status.textContent = "TIME'S UP! Write it down!";
                els.status.className = "font-sans text-xs sm:text-sm font-extrabold text-brand-pink uppercase tracking-wider truncate mt-0.5";
            }

            function revealAll() {
                clearFlipTimeouts();
                AudioFX.playReveal();
                document.querySelectorAll('.card-inner').forEach((c, i) => {
                    const tid = setTimeout(() => c.classList.remove('rotate-y-180'), i * 30);
                    state.flipTimeouts.push(tid);
                });
                els.status.textContent = "Checking answers...";
                els.status.className = "font-sans text-xs sm:text-sm font-extrabold text-brand-green uppercase tracking-wider truncate mt-0.5";
            }

            function toggleTheme() {
                const isDark = document.documentElement.classList.toggle('dark');
                localStorage.setItem('theme_card-memory', isDark ? 'dark' : 'light');
                lucide.createIcons();
            }

            function toggleSound() {
                AudioFX.muted = !AudioFX.muted;
                localStorage.setItem('sound_card-memory', AudioFX.muted ? 'muted' : 'unmuted');
                updateSoundUI();
                if (!AudioFX.muted) AudioFX.playFlip();
            }

            function updateSoundUI() {
                if (!els.soundBtn) return;
                els.soundBtn.setAttribute('aria-pressed', String(!AudioFX.muted));
                els.soundBtn.title = AudioFX.muted ? 'Unmute Sound' : 'Mute Sound';
                els.soundBtn.innerHTML = `<i data-lucide="${AudioFX.muted ? 'volume-x' : 'volume-2'}" class="w-5 h-5 ${AudioFX.muted ? 'text-slate-400' : ''}"></i>`;
                lucide.createIcons();
            }

            // Public API
            return {
                init, openSetup, closeSetup, usePreset, dedupeWords,
                handleFiles, removeImage, clearAll, saveSetup,
                startMemorization, hideCards, revealAll, toggleCard,
                shuffleAndRestart, toggleTheme, toggleSound
            };
        })();

        Game.init();
    </script>
</body>
