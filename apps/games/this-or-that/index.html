<!doctype html>
<html lang="en">

<head>
    <!-- Supabase Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <script src="/supabase.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>This or That</title>
    <link rel="icon" type="image/x-icon" href="../../../media/icon.ico" />
    <link rel="icon" type="image/webp" href="../../../media/icon.webp" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet" />
    <script src="https://unpkg.com/lucide@1.16.0"></script>
    <script src="../../../components/input-modal.js"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        display: ["Fredoka", "sans-serif"],
                        body: ["Nunito", "sans-serif"],
                    },
                    colors: {
                        kkpink: "#FF6B95",
                        kkorange: "#FF8C42",
                        kkgreen: "#00E676",
                        kkblue: "#2979FF",
                        kkyellow: "#FFD600",
                        kkdark: "#1e293b",
                        kkchalk: "#f8fafc",
                    },
                    boxShadow: {
                        hard: "4px 4px 0px 0px rgba(30, 41, 59, 1)",
                        "hard-sm": "2px 2px 0px 0px rgba(30, 41, 59, 1)",
                        "hard-md": "6px 6px 0px 0px rgba(30, 41, 59, 1)",
                        "hard-lg": "8px 8px 0px 0px rgba(30, 41, 59, 1)",
                        "hard-xl": "12px 12px 0px 0px rgba(30, 41, 59, 1)",
                    },
                    borderWidth: {
                        '3': '3px',
                        '5': '5px',
                        '6': '6px',
                    },
                    animation: {
                        "float-slow": "float 6s ease-in-out infinite",
                        "float-medium": "float 4s ease-in-out infinite",
                        "float-fast": "float 3s ease-in-out infinite",
                        "pop-in": "popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards",
                        "slide-up": "slideUp 0.5s cubic-bezier(0.2, 1, 0.3, 1) forwards",
                        "slide-down": "slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards",
                    },
                },
            },
        };
    </script>

    <style>
        :focus-visible {
            outline: 3px solid #1ea7fd;
            outline-offset: 2px;
        }

        body {
            font-family: "Nunito", sans-serif;
            background-color: #f8fafc;
            background-image:
                linear-gradient(rgba(30, 41, 59, 0.1) 1px, transparent 1px),
                linear-gradient(90deg,
                    rgba(30, 41, 59, 0.1) 1px,
                    transparent 1px);
            background-size: 40px 40px;
            overflow: hidden;
        }

        .dark body {
            background-color: #020617;
            background-image:
                linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
                linear-gradient(90deg,
                    rgba(148, 163, 184, 0.08) 1px,
                    transparent 1px);
            background-size: 40px 40px;
        }

        .dark .shadow-hard {
            box-shadow: 4px 4px 0px 0px #000000;
        }
        .dark .shadow-hard-sm {
            box-shadow: 2px 2px 0px 0px #000000;
        }
        .dark .shadow-hard-md {
            box-shadow: 6px 6px 0px 0px #000000;
        }
        .dark .shadow-hard-lg {
            box-shadow: 8px 8px 0px 0px #000000;
        }
        .dark .shadow-hard-xl {
            box-shadow: 12px 12px 0px 0px #000000;
        }
        .dark .btn-chunky:hover:not(:disabled) {
            box-shadow: 6px 6px 0px 0px #000000;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            70% {
                transform: scale(1.05);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-10px) rotate(5deg);
            }

            100% {
                transform: translateY(0px) rotate(0deg);
            }
        }

        .animate-pop {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .animate-slide-up {
            animation: slideUp 0.5s cubic-bezier(0.2, 1, 0.3, 1) forwards;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 12px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-left: 2px solid #e2e8f0;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border: 3px solid #f1f5f9;
            border-radius: 99px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .dark .custom-scrollbar::-webkit-scrollbar-track {
            background: #0f172a;
            border-left: 2px solid #334155;
        }

        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border: 3px solid #0f172a;
        }

        .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* Selected option highlight in Game Screen */
        .option-panel.is-selected {
            box-shadow: inset 0 0 0 8px rgba(255, 255, 255, 0.92);
            filter: brightness(1.06);
        }

        .option-panel.is-dimmed {
            opacity: 0.72;
            filter: saturate(0.85);
        }

        .option-panel {
            transition: opacity 0.25s ease, filter 0.25s ease, box-shadow 0.2s ease;
        }

        /* Image dropzone highlight */
        .img-drop-active {
            border-color: #2979FF !important;
            background-color: rgba(41, 121, 255, 0.12) !important;
            transform: scale(1.06);
        }

        .btn-chunky {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .btn-chunky:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 6px 6px 0px 0px rgba(30, 41, 59, 1);
        }

        .btn-chunky:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0px 0px 0px 0px rgba(30, 41, 59, 1) !important;
        }

        .btn-chunky:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Panel Hover Effect for Image Card */
        .option-panel:hover .option-card-img {
            transform: scale(1.04);
        }

        .option-panel:hover .panel-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .text-stroke-3 {
            -webkit-text-stroke: 3px #1e293b;
            paint-order: stroke fill;
        }

        .text-stroke-2 {
            -webkit-text-stroke: 2px #1e293b;
            paint-order: stroke fill;
        }

        .bg-dots {
            background-image: radial-gradient(rgba(30, 41, 59, 0.1) 2px, transparent 1px);
            background-size: 24px 24px;
        }

        .glass-dark {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-light {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .editor-input {
            transition: all 0.2s ease;
        }

        .editor-input:focus {
            transform: translateY(-1px);
            box-shadow: 4px 4px 0px 0px rgba(30, 41, 59, 1);
        }
    </style>
    <link rel="stylesheet" href="../../../css/base.css" />
    <link rel="stylesheet" href="../../../css/components.css" />
    <script>
        (function () {
            const saved = localStorage.getItem('theme_this_or_that');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</head>

<body class="h-screen w-screen flex flex-col text-kkdark dark:text-white select-none">
    <header class="bg-white dark:bg-slate-800 border-b-4 border-kkdark dark:border-slate-500 px-4 py-2.5 flex justify-between items-center z-50 shadow-md">
        <div class="flex items-center gap-3">
            <div
                class="w-10 h-10 md:w-11 md:h-11 bg-kkpink rounded-xl border-4 border-kkdark dark:border-slate-500 flex items-center justify-center shadow-hard-sm">
                <i data-lucide="layers" class="text-white w-6 h-6"></i>
            </div>
            <div>
                <h1 class="font-display font-bold text-xl md:text-2xl tracking-wide leading-none text-kkdark dark:text-white uppercase">
                    This or That
                </h1>
            </div>
        </div>
        <div class="flex gap-2 md:gap-3">
            <button onclick="toggleFullscreen()" id="fullscreenBtn" title="Toggle Fullscreen (F)" aria-label="Toggle Fullscreen"
                class="btn-chunky bg-white dark:bg-slate-700 text-kkdark dark:text-white w-10 h-10 md:w-11 md:h-11 rounded-xl border-4 border-kkdark dark:border-slate-500 shadow-hard-sm flex items-center justify-center">
                <i data-lucide="maximize-2" class="w-5 h-5"></i>
            </button>
            <button onclick="toggleTheme()" id="themeBtn" title="Toggle Dark Mode" aria-label="Toggle Dark Mode"
                class="btn-chunky bg-white dark:bg-slate-700 text-kkdark dark:text-white w-10 h-10 md:w-11 md:h-11 rounded-xl border-4 border-kkdark dark:border-slate-500 shadow-hard-sm flex items-center justify-center">
                <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
                <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
            </button>
            <button onclick="toggleSound()" id="soundBtn" title="Toggle Sound" aria-label="Toggle Sound"
                class="btn-chunky bg-white dark:bg-slate-700 text-kkdark dark:text-white w-10 h-10 md:w-11 md:h-11 rounded-xl border-4 border-kkdark dark:border-slate-500 shadow-hard-sm flex items-center justify-center">
                <i data-lucide="volume-2" class="w-5 h-5"></i>
            </button>
            <button onclick="exitGame()" id="exitBtn"
                class="btn-chunky bg-kkorange text-white px-4 md:px-5 py-1 md:py-1.5 rounded-xl border-4 border-kkdark dark:border-slate-500 shadow-hard-sm font-display font-bold text-sm md:text-base uppercase">
                Exit
            </button>
        </div>
    </header>

    <main class="flex-grow relative flex flex-col overflow-hidden w-full bg-transparent">
        <div id="startScreen" class="absolute inset-0 flex flex-col items-center justify-center z-20 overflow-hidden p-4">
            <div class="absolute inset-0 pointer-events-none opacity-20">
                <i data-lucide="help-circle" class="w-32 h-32 text-kkblue absolute top-10 left-10"></i>
                <i data-lucide="gamepad-2" class="w-32 h-32 text-kkpink absolute bottom-20 right-10"></i>
                <i data-lucide="zap" class="w-24 h-24 text-kkyellow absolute top-20 right-1/4"></i>
                <i data-lucide="star" class="w-20 h-20 text-kkgreen absolute bottom-10 left-1/4"></i>
            </div>

            <div class="relative z-10 w-full max-w-md px-4">
                <div class="mb-5 text-center animate-pop relative">
                    <div
                        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-52 h-52 bg-white dark:bg-slate-800 rounded-full border-4 border-kkdark dark:border-slate-500 shadow-hard-lg -z-10">
                    </div>
                    <h1
                        class="font-display font-bold text-7xl md:text-8xl leading-none text-white text-stroke-3 drop-shadow-[6px_6px_0_rgba(30,41,59,1)] transform -rotate-3">
                        This</h1>
                    <h1
                        class="font-display font-bold text-7xl md:text-8xl leading-none text-kkyellow text-stroke-3 drop-shadow-[6px_6px_0_rgba(30,41,59,1)] transform rotate-2 -mt-3">
                        That</h1>
                </div>

                <div class="bg-white dark:bg-slate-800 rounded-3xl border-[6px] border-kkdark dark:border-slate-500 shadow-hard-xl overflow-hidden animate-slide-up"
                    style="animation-delay: 0.2s">
                    <div class="p-5 md:p-6 flex flex-col gap-3.5">
                        <div id="startDeckStatus" class="flex items-center justify-center gap-2 py-1.5 px-3 rounded-xl bg-slate-100 dark:bg-slate-700/80 border-2 border-kkdark/20 dark:border-slate-600 text-xs font-extrabold uppercase tracking-wider text-slate-600 dark:text-slate-300">
                            <i data-lucide="layers" class="w-3.5 h-3.5 text-kkpink"></i>
                            <span id="startDeckStatusText">Loading deck...</span>
                        </div>

                        <button onclick="startGame()"
                            class="btn-chunky w-full bg-kkblue text-white text-2xl py-4 rounded-2xl border-4 border-kkdark dark:border-slate-500 shadow-hard font-display font-bold flex items-center justify-center gap-4 group">
                            <span
                                class="bg-white text-kkblue w-9 h-9 rounded-full flex items-center justify-center border-2 border-kkdark group-hover:scale-110 transition-transform">
                                <i data-lucide="play" class="w-5 h-5 ml-0.5"></i>
                            </span>
                            PLAY NOW
                        </button>

                        <button onclick="openSetupModal()"
                            class="btn-chunky w-full bg-white dark:bg-slate-700 text-kkdark dark:text-white text-xl py-3.5 rounded-2xl border-4 border-kkdark dark:border-slate-500 shadow-hard font-bold flex items-center justify-center gap-3">
                            <i data-lucide="settings-2" class="w-6 h-6 text-kkorange"></i>
                            CUSTOMIZE
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="gameScreen" class="hidden absolute inset-0 flex flex-col">
            <div class="absolute top-0 left-0 w-full h-1.5 bg-kkdark/20 z-50 pointer-events-none">
                <div id="slideProgressBar" class="h-full bg-kkyellow transition-all duration-300 ease-out" style="width: 0%"></div>
            </div>

            <div
                class="absolute top-4 left-1/2 transform -translate-x-1/2 z-40 w-full max-w-3xl px-4 text-center pointer-events-none">
                <div class="inline-block animate-pop max-w-full">
                    <div
                        class="bg-white dark:bg-slate-800 px-6 md:px-10 py-2.5 md:py-3 rounded-2xl border-4 border-kkdark dark:border-slate-500 shadow-hard transform -rotate-1">
                        <h3 id="questionText"
                            class="font-display font-bold text-xl md:text-3xl text-kkdark dark:text-white uppercase tracking-wide leading-tight break-words">
                            Ready?</h3>
                    </div>
                </div>
            </div>

            <div id="optionsContainer" class="w-full h-full flex flex-col md:flex-row bg-kkdark"></div>

            <div class="absolute bottom-4 left-0 w-full flex justify-center items-center z-50 pointer-events-none">
                <div
                    class="pointer-events-auto flex gap-3 items-center bg-white dark:bg-slate-800 p-2 md:p-2.5 rounded-2xl border-4 border-kkdark dark:border-slate-500 shadow-hard transform scale-90 md:scale-100">
                    <button onclick="prevSlide()" id="prevSlideBtn" title="Previous Slide (Left Arrow)" aria-label="Previous Slide"
                        class="btn-chunky bg-gray-100 dark:bg-slate-700 w-11 h-11 rounded-xl border-4 border-gray-200 dark:border-slate-500 text-gray-500 dark:text-slate-200 hover:text-kkdark hover:border-kkdark flex items-center justify-center">
                        <i data-lucide="chevron-left" class="w-7 h-7"></i>
                    </button>
                    <div class="font-display font-bold text-xl min-w-[60px] text-center text-kkdark dark:text-white">
                        <span id="slideCounter">1/1</span>
                    </div>
                    <button onclick="nextSlide()" id="nextSlideBtn" title="Next Slide (Right Arrow / Space)" aria-label="Next Slide"
                        class="btn-chunky bg-kkblue w-12 h-11 rounded-xl border-4 border-kkdark dark:border-slate-500 text-white shadow-sm flex items-center justify-center">
                        <i data-lucide="chevron-right" class="w-7 h-7"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="endScreen"
            class="hidden absolute inset-0 z-30 bg-kkchalk dark:bg-slate-900 flex flex-col items-center justify-center p-6">
            <div class="animate-pop text-center">
                <i data-lucide="trophy"
                    class="w-28 h-28 text-kkyellow drop-shadow-[4px_4px_0_#1e293b] mx-auto mb-5 transform -rotate-6"></i>
                <h2
                    class="font-display font-bold text-6xl md:text-8xl mb-2 text-kkpink drop-shadow-[4px_4px_0_#1e293b] stroke-black text-stroke-2">
                    FINISH</h2>
                <div class="bg-white dark:bg-slate-800 px-8 py-4 rounded-2xl border-4 border-kkdark dark:border-slate-500 shadow-hard mb-8 inline-block">
                    <p class="text-2xl font-bold text-gray-700 dark:text-slate-200">Class dismissed!</p>
                    <p id="endSummaryText" class="text-sm font-extrabold uppercase tracking-wider text-kkblue mt-1"></p>
                </div>
            </div>
            <div class="flex flex-col md:flex-row gap-3.5 w-full max-w-xl animate-slide-up" style="animation-delay: 0.2s">
                <button onclick="resetGame()"
                    class="btn-chunky flex-1 bg-kkblue text-white text-xl py-4 rounded-xl border-4 border-kkdark dark:border-slate-500 shadow-hard font-display font-bold flex items-center justify-center gap-2">
                    <i data-lucide="rotate-ccw" class="w-5 h-5"></i> REPLAY
                </button>
                <button onclick="shuffleAndReplay()"
                    class="btn-chunky flex-1 bg-kkgreen text-kkdark text-xl py-4 rounded-xl border-4 border-kkdark dark:border-slate-500 shadow-hard font-display font-bold flex items-center justify-center gap-2">
                    <i data-lucide="shuffle" class="w-5 h-5"></i> SHUFFLE
                </button>
                <button onclick="openSetupModal()"
                    class="btn-chunky flex-1 bg-kkorange text-white text-xl py-4 rounded-xl border-4 border-kkdark dark:border-slate-500 shadow-hard font-display font-bold flex items-center justify-center gap-2">
                    <i data-lucide="settings-2" class="w-5 h-5"></i> SETUP
                </button>
            </div>
        </div>

    </main>

    <div id="setupModal" onclick="if(event.target === this) closeSetupModal()"
        class="fixed inset-0 bg-slate-900/90 z-[100] hidden flex items-center justify-center backdrop-blur-sm p-2 md:p-4">
        <div
            class="bg-white dark:bg-slate-800 w-full max-w-[95vw] h-[93vh] rounded-3xl border-[6px] border-kkdark dark:border-slate-500 shadow-hard-lg flex flex-col overflow-hidden animate-pop">
            <div class="bg-kkchalk dark:bg-slate-900 border-b-4 border-kkdark dark:border-slate-500 p-3 md:p-4 flex justify-between items-center shrink-0">
                <div class="flex items-center gap-3">
                    <div class="bg-kkorange text-white p-2 rounded-xl border-4 border-kkdark dark:border-slate-500 shadow-sm">

                    </div>
                    <div>

                </div>
                <button onclick="closeSetupModal()" title="Close (Esc)" aria-label="Close Game Builder"

                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="flex flex-col md:flex-row h-full overflow-hidden">
                <div
                    class="w-full md:w-72 bg-gray-50 dark:bg-slate-900/70 border-b-4 md:border-b-0 md:border-r-4 border-kkdark dark:border-slate-500 p-4 overflow-y-auto custom-scrollbar flex-shrink-0">
                    <h3 class="font-black text-gray-400 dark:text-slate-400 text-xs uppercase tracking-widest mb-4">Quick Presets</h3>
                    <div class="flex flex-col gap-3">
                        <button onclick="loadBlank()"
                            class="btn-chunky text-left p-3 rounded-xl border-4 border-kkdark dark:border-slate-500 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 font-bold text-sm text-gray-700 dark:text-slate-200 shadow-hard-sm flex items-center gap-3 mb-2">
                            <span

                                    data-lucide="file-plus" class="w-4 h-4"></i></span> Start from Scratch
                        </button>
                        <button onclick="loadPreset('standard2')"
                            class="btn-chunky text-left p-3 rounded-xl border-4 border-kkdark dark:border-slate-500 bg-white dark:bg-slate-800 hover:bg-pink-50 dark:hover:bg-slate-700 font-bold text-sm text-gray-700 dark:text-slate-200 shadow-hard-sm flex items-center gap-3">
                            <span
                                class="bg-kkpink text-white w-6 h-6 rounded-lg border-2 border-kkdark dark:border-slate-500 flex items-center justify-center text-xs font-display">2</span>
                            Standard (2)
                        </button>
                        <button onclick="loadPreset('classroom2')"
                            class="btn-chunky text-left p-3 rounded-xl border-4 border-kkdark dark:border-slate-500 bg-white dark:bg-slate-800 hover:bg-yellow-50 dark:hover:bg-slate-700 font-bold text-sm text-gray-700 dark:text-slate-200 shadow-hard-sm flex items-center gap-3">
                            <span
                                class="bg-kkyellow text-kkdark w-6 h-6 rounded-lg border-2 border-kkdark dark:border-slate-500 flex items-center justify-center text-xs font-display">2</span>
                            Classroom (2)
                        </button>
                        <button onclick="loadPreset('classroom3')"
                            class="btn-chunky text-left p-3 rounded-xl border-4 border-kkdark dark:border-slate-500 bg-white dark:bg-slate-800 hover:bg-blue-50 dark:hover:bg-slate-700 font-bold text-sm text-gray-700 dark:text-slate-200 shadow-hard-sm flex items-center gap-3">
                            <span
                                class="bg-kkblue text-white w-6 h-6 rounded-lg border-2 border-kkdark dark:border-slate-500 flex items-center justify-center text-xs font-display">3</span>
                            Classroom (3)
                        </button>
                        <button onclick="loadPreset('classroom4')"

        // --- IndexedDB Wrapper ---
        const DB_NAME = "KKThisOrThatDB";
        const DB_VERSION = 3; // Bumped for image_cache store
        const STORE_NAME = "gameData";
        const STORE_PRESETS = "userPresets";
        const STORE_IMAGES = "imageHashes"; // For deduplication
        const STORE_CACHE = "image_cache"; // For cloud caching

        let currentPresetId = "states";

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: "id" });
                    }
                    if (!db.objectStoreNames.contains(STORE_PRESETS)) {
                        const presetStore = db.createObjectStore(STORE_PRESETS, { keyPath: "id", autoIncrement: true });
                        presetStore.createIndex("name", "name", { unique: false });
                        presetStore.createIndex("updatedAt", "updatedAt", { unique: false });
                    }
                    if (!db.objectStoreNames.contains(STORE_IMAGES)) {
                        db.createObjectStore(STORE_IMAGES, { keyPath: "hash" });
                    }
                    if (!db.objectStoreNames.contains(STORE_CACHE)) {
                        db.createObjectStore(STORE_CACHE);
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function getCacheImg(url) {
            try {
                const db = await openDB();
                return new Promise((res) => {
                    const r = db.transaction(STORE_CACHE, "readonly").objectStore(STORE_CACHE).get(url);
                    r.onsuccess = () => res(r.result);
                    r.onerror = () => res(null);
                });
            } catch(e) { return null; }
        }

        async function putCacheImg(url, blob) {
            try {
                const db = await openDB();
                db.transaction(STORE_CACHE, "readwrite").objectStore(STORE_CACHE).put(blob, url);
            } catch(e) { }
        }

        const blobCache = new Map();

        async function resolveAndCache(url) {
            if (!url || !url.includes('klasskit-media')) return url;
            if (blobCache.has(url)) return blobCache.get(url);

            const cachedBlob = await getCacheImg(url);
            if (cachedBlob) {
                const bUrl = URL.createObjectURL(cachedBlob);
                blobCache.set(url, bUrl);
                return bUrl;
            }

            try {
                const signedUrl = await resolveMediaUrl(url);
                const resp = await fetch(signedUrl);
                const blob = await resp.blob();
                
                await putCacheImg(url, blob);
                const bUrl = URL.createObjectURL(blob);
                blobCache.set(url, bUrl);
                return bUrl;
            } catch (e) {
                console.warn("Cloud cache failed", e);
                return url;
            }
        }

        // --- PRESET MANAGEMENT ---
        async function getAllPresets() {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_PRESETS, "readonly");
                const store = tx.objectStore(STORE_PRESETS);
                const index = store.index("updatedAt");
                const request = index.getAll();
                request.onsuccess = () => resolve(request.result.reverse());
                request.onerror = () => reject(request.error);
            });
        }

        async function saveUserPreset(name, data, id = null) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_PRESETS, "readwrite");
                const store = tx.objectStore(STORE_PRESETS);
                const preset = { name, data, updatedAt: Date.now() };
                if (id) preset.id = id;
                const request = id ? store.put(preset) : store.add(preset);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function deleteUserPreset(id) {
            // Cloud Cleanup
            const { data: { user } } = await db.auth.getUser();
            if (!isSandbox() && user) {
                deleteFolder(`${user.id}/this_or_that/${id}`).catch(e => console.warn("Cloud folder delete failed", e));
            }

            const localDb = await openDB();
            return new Promise((resolve, reject) => {
                const tx = localDb.transaction(STORE_PRESETS, "readwrite");
                const store = tx.objectStore(STORE_PRESETS);
                const request = store.delete(id);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        async function saveCurrentPresetId(id) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, "readwrite");
                const store = tx.objectStore(STORE_NAME);
                const request = store.put({ id: "currentPresetId", value: id });
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        async function getCurrentPresetId() {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, "readonly");
                const store = tx.objectStore(STORE_NAME);
                const request = store.get("currentPresetId");
                request.onsuccess = () => resolve(request.result?.value || null);
                request.onerror = () => reject(request.error);
            });
        }

        async function renderPresetSelector() {
            const presets = await getAllPresets();
            const select = document.getElementById("userPresetSelect");
            if (!select) return;
            select.innerHTML = '<option value="">-- Select a Custom Preset --</option>';
            presets.forEach(p => {
                const option = document.createElement("option");
                option.value = p.id;
                option.textContent = p.name;
                if (p.id === currentPresetId) option.selected = true;
                select.appendChild(option);
            });
            syncToCloud();
        }

        async function syncToCloud() {
            if (syncTimeout) clearTimeout(syncTimeout);
            syncTimeout = setTimeout(async () => {
                const presets = await getAllPresets();
                // Strip local DataURLs from cloud sync, but keep Supabase URLs
                const cleanPresets = presets.map(p => ({
                    ...p,
                    data: p.data.map(slide => ({
                        ...slide,
                        images: (slide.images || []).map(img => (img && img.startsWith('http')) ? img : "")
                    }))
                }));
                const cleanQuestions = questions.map(s => ({
                    ...s,
                    images: (s.images || []).map(img => (img && img.startsWith('http')) ? img : "")
                }));

                await saveProgress('this_or_that', {
                    questions: cleanQuestions,
                    presets: cleanPresets,
                    currentPresetId
                });
            }, 2000);
        }

        async function loadFromCloud() {
            const cloudData = await loadProgress('this_or_that');
            if (cloudData) {
                // Merge presets (cloud prioritized)
                const db = await openDB();
                if (cloudData.presets) {
                    for (const p of cloudData.presets) {
                        const tx = db.transaction(STORE_PRESETS, "readwrite");
                        const store = tx.objectStore(STORE_PRESETS);
                        // We use name as a weak unique identifier for cloud merge
                        const existing = await new Promise(r => {
                            const req = store.index("name").get(p.name);
                            req.onsuccess = () => r(req.result);
                        });
                        if (!existing) {
                            delete p.id; // Let local DB assign new ID
                            store.add(p);
                        }
                    }
                }
                if (cloudData.questions && questions.length === 0) {
                    questions = cloudData.questions;
                    await saveGameData(questions);
                }
                currentPresetId = cloudData.currentPresetId ?? currentPresetId;
                await renderPresetSelector();
            }
        }

        let syncTimeout = null;

        async function onUserPresetSelect() {
            const select = document.getElementById("userPresetSelect");
            const id = parseInt(select.value);
            if (!id) return;
            const presets = await getAllPresets();
            const preset = presets.find(p => p.id === id);
            if (preset) {
                currentPresetId = id;
                editorData = JSON.parse(JSON.stringify(preset.data));
                document.getElementById("userPresetNameInput").value = preset.name;
                await saveCurrentPresetId(id);
                renderBuilder();
                renderPresetSelector();
            }
        }

        async function saveCurrentUserPreset() {
            const name = document.getElementById("userPresetNameInput").value.trim() || "Untitled";
            const oldId = currentPresetId;
            const id = await saveUserPreset(name, editorData, (typeof oldId === 'number') ? oldId : null);
            
            // Migration Logic: If we saved from "states" or "custom" to a real ID
            if (oldId === "states" || oldId === "custom") {
                const { data: { user } } = await db.auth.getUser();
                if (!isSandbox() && user) {
                    console.log("Finalizing cloud folder...");
                    
                    const oldDir = `${user.id}/this_or_that/${oldId}`;
                    const newDir = `${user.id}/this_or_that/${id}`;

                    // 1. List files in old dir
                    const { data: files } = await db.storage.from(STORAGE_CONFIG.bucket).list(oldDir);
                    if (files && files.length > 0) {
                        for (const file of files) {
                            if (file.name === '.emptyFolderPlaceholder') continue;
                            const oldPath = `${oldDir}/${file.name}`;
                            const newPath = `${newDir}/${file.name}`;
                            await copyMedia(oldPath, newPath).catch(e => console.warn("Copy failed", e));
                        }
                        
                        // 2. Update editorData URLs to point to new ID
                        const oldDirUrl = `/this_or_that/${oldId}/`;
                        const newDirUrl = `/this_or_that/${id}/`;
                        editorData.forEach(slide => {
                            if (slide.images) {
                                slide.images = slide.images.map(img => (img && img.includes(oldDirUrl)) ? img.replace(oldDirUrl, newDirUrl) : img);
                            }
                        });
                        
                        // 3. Save again with updated URLs
                        await saveUserPreset(name, editorData, id);
                        
                        // 4. Delete old folder
                        await deleteFolder(oldDir).catch(e => console.warn(e));
                    }
                }
            }

            currentPresetId = id;
            await saveCurrentPresetId(id);
            await renderPresetSelector();
            renderBuilder(true);
            showToast(`Preset "${name}" saved!`);
        }

        async function createNewUserPreset() {
            document.getElementById("userPresetNameInput").value = "New Preset";

            currentPresetId = null;
            await saveCurrentPresetId(null);
            await renderPresetSelector();
            document.getElementById("userPresetSelect").value = "";

        }

        async function deleteCurrentUserPreset() {
            if (typeof currentPresetId !== "number") {

                await deleteUserPreset(currentPresetId);

                await renderPresetSelector();
                document.getElementById("userPresetSelect").value = "";
                showToast("Preset deleted");
            });
        }

        // --- IMAGE DEDUPLICATION ---
        async function hashImage(dataUrl) {
            // Simple hash based on first 100 chars + length
            return dataUrl.slice(0, 100) + "_" + dataUrl.length;
        }

        async function storeImageHash(hash, dataUrl) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_IMAGES, "readwrite");
                const store = tx.objectStore(STORE_IMAGES);
                const request = store.put({ hash, dataUrl });
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        async function getImageByHash(hash) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_IMAGES, "readonly");
                const store = tx.objectStore(STORE_IMAGES);
                const request = store.get(hash);
                request.onsuccess = () => resolve(request.result?.dataUrl || null);
                request.onerror = () => reject(request.error);
            });
        }

        async function deduplicateImagesInEditorData() {
            for (const slide of editorData) {
                if (slide.images) {
                    for (let i = 0; i < slide.images.length; i++) {
                        const img = slide.images[i];
                        if (img) {
                            const hash = await hashImage(img);
                            const existing = await getImageByHash(hash);
                            if (existing) {
                                // Use existing image
                                slide.images[i] = existing;
                            } else {
                                // Store new image
                                await storeImageHash(hash, img);
                            }
                        }
                    }
                }
            }
        }
        // --- END IMAGE DEDUPLICATION ---

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (isMuted) return;
            if (audioCtx.state === "suspended") audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const t = audioCtx.currentTime;

            if (type === "click") {
                osc.type = "sine";
                osc.frequency.setValueAtTime(400, t);
                osc.frequency.exponentialRampToValueAtTime(100, t + 0.1);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.1);
                osc.start(t); osc.stop(t + 0.1);
            } else if (type === "pop") {
                osc.type = "triangle";
                osc.frequency.setValueAtTime(200, t);
                osc.frequency.linearRampToValueAtTime(400, t + 0.1);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.15);
                osc.start(t); osc.stop(t + 0.15);
            }
        }

        function toggleSound() {

                btn.classList.remove("bg-gray-100", "dark:bg-slate-600");
            }
            lucide.createIcons();
        }

        function showToast(message, options = {}) {
            const container = document.getElementById("toastContainer");
            if (!container) return;

            const toast = document.createElement("div");
            toast.className = "pointer-events-auto flex items-center justify-between gap-3 px-4 py-3 rounded-2xl border-4 border-kkdark dark:border-slate-500 bg-white dark:bg-slate-800 text-kkdark dark:text-white shadow-hard animate-pop font-bold text-sm";

            const msgSpan = document.createElement("span");
            msgSpan.textContent = message;
            toast.appendChild(msgSpan);

            if (options.actionLabel && typeof options.onAction === "function") {
                const actionBtn = document.createElement("button");
                actionBtn.className = "btn-chunky px-3 py-1 rounded-lg bg-kkyellow text-kkdark border-2 border-kkdark text-xs font-display font-bold uppercase shrink-0";
                actionBtn.textContent = options.actionLabel;
                actionBtn.onclick = () => {
                    options.onAction();
                    toast.remove();
                };
                toast.appendChild(actionBtn);
            }

            container.appendChild(toast);
            const duration = options.duration || (options.actionLabel ? 5000 : 3000);
            setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transform = "translateY(8px)";
                toast.style.transition = "all 0.2s ease";
                setTimeout(() => toast.remove(), 220);
            }, duration);
        }

        function updateStartDeckStatus() {
            const el = document.getElementById("startDeckStatusText");
            if (!el) return;
            if (questions.length > 0) {
                el.textContent = `${questions.length} Slide${questions.length === 1 ? "" : "s"} Ready`;
            } else {
                el.textContent = "No Slides Yet — Click Customize";
            }
        }

        function toggleFullscreen() {
            playSound("click");
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        document.addEventListener("fullscreenchange", () => {
            const btn = document.getElementById("fullscreenBtn");
            if (!btn) return;
            const icon = document.fullscreenElement ? "minimize-2" : "maximize-2";
            btn.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5"></i>`;
            lucide.createIcons();
        });

        function exitGame() {
            playSound("click");
            const gameScreen = document.getElementById("gameScreen");
            const endScreen = document.getElementById("endScreen");
            const startScreen = document.getElementById("startScreen");
            const isOnStart = !startScreen.classList.contains("hidden");

            if (isOnStart) {
                location.reload();
                return;
            }
            gameScreen.classList.add("hidden");
            endScreen.classList.add("hidden");
            startScreen.classList.remove("hidden");
            updateStartDeckStatus();
        }

        async function customAlert(msg) {
            playSound("click");
            await showAlertModal(msg, { title: "Notice", icon: "info", iconColor: "blue" });
        }

        async function customConfirm(msg, callback) {
            playSound("click");
            const confirmed = await showConfirmModal(msg, {
                title: "Confirm",
                confirmText: "Yes",
                cancelText: "No",
                icon: "help-circle",
                iconColor: "orange"
            });
            if (confirmed && callback) callback();
        }

        async function init() {
            await requireAuth();
            updateSoundIcon();
            lucide.createIcons();

            try {
                const savedData = await loadGameData();
                const savedPresetId = await getCurrentPresetId();
                if (savedPresetId) {
                    currentPresetId = savedPresetId;
                } else {
                    currentPresetId = "states";
                }
                if (savedData) {
                    questions = savedData;
                } else {
                    questions = [];
                }
                await loadFromCloud();
            } catch (error) {
                console.error("Failed to load from IndexedDB:", error);
                questions = [];
            }
            updateStartDeckStatus();
        }

        function getIcon(text) {
            const lower = text.toLowerCase();
            for (const key in ICON_MAP) {
                if (lower.includes(key)) return ICON_MAP[key];
            }
            return "circle";
        }

        function openSetupModal() {
            playSound("click");
            if (questions.length === 0) {
                editorData = [{ question: "", options: ["", ""], images: [] }];
            } else {
                editorData = JSON.parse(JSON.stringify(questions));
                editorData.forEach(slide => {
                    if (!slide.images) slide.images = [];
                });
            }
            renderBuilder();
            renderPresetSelector();
            document.getElementById("setupModal").classList.remove("hidden");
        }

        function closeSetupModal() {
            playSound("click");
            document.getElementById("setupModal").classList.add("hidden");
            const tc = document.getElementById("toastContainer");
            if (tc) tc.innerHTML = "";
        }

        function loadPreset(key) {
            playSound("click");
            const prevData = JSON.parse(JSON.stringify(editorData));
            const prevPresetId = currentPresetId;
            currentPresetId = key;
            editorData = JSON.parse(JSON.stringify(PRESETS[key]));
            renderBuilder();
            showToast(`Loaded "${key}" preset (${editorData.length} slides)`, {
                actionLabel: "Undo",
                onAction: () => {
                    editorData = prevData;
                    currentPresetId = prevPresetId;
                    renderBuilder();
                }
            });
        }

        function loadBlank() {
            playSound("click");
            const prevData = JSON.parse(JSON.stringify(editorData));
            const prevPresetId = currentPresetId;
            currentPresetId = "states";
            editorData = [{ question: "", options: ["", ""], images: [] }];
            renderBuilder();
            showToast("Started from scratch", {
                actionLabel: "Undo",
                onAction: () => {
                    editorData = prevData;
                    currentPresetId = prevPresetId;
                    renderBuilder();
                }
            });
        }

        // --- EXPORT / IMPORT FUNCTIONS ---
        function exportGameData() {
            playSound("click");
            if (editorData.length === 0) {
                customAlert("There is no data to export!");
                return;
            }

            const dataStr = JSON.stringify(editorData, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);

            const rawName = (document.getElementById("userPresetNameInput")?.value || "").trim();
            const safeName = rawName.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
            const filename = safeName ? `${safeName}-this-or-that.json` : "this-or-that-klasskit.json";

            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();

            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(`Exported ${editorData.length} slides!`);
        }

        function handleImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const importedData = JSON.parse(e.target.result);

                    if (Array.isArray(importedData) && importedData.length > 0 && importedData[0] && typeof importedData[0] === "object" && Array.isArray(importedData[0].options)) {
                        editorData = importedData;

                        editorData.forEach(slide => {
                            if (!slide.images) slide.images = [];
                        });

                        renderBuilder();
                        showToast(`Imported ${editorData.length} slides!`);
                    } else {
                        customAlert("Invalid game file. Please select a correct This or That .json file.");
                    }
                } catch (err) {
                    customAlert("Error reading the file. Make sure it is a valid JSON game file.");
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }
        // --- END EXPORT / IMPORT ---

        async function processImageFile(file, sIdx, oIdx) {
            if (!file || !file.type.startsWith("image/")) {
                customAlert("Please select a valid image file.");
                return;
            }
            const slot = document.getElementById(`img-slot-${sIdx}-${oIdx}`);
            if (slot) {
                slot.innerHTML = `<div class="w-10 h-10 rounded-lg border-2 border-kkdark dark:border-slate-500 bg-slate-100 dark:bg-slate-700 flex items-center justify-center"><i data-lucide="loader-2" class="w-5 h-5 text-kkblue animate-spin"></i></div>`;
                lucide.createIcons();
            }

            try {
                const { data: { user } } = await db.auth.getUser();
                let imgSource;
                if (!isSandbox() && user) {
                    imgSource = await uploadMedia(file, 'this_or_that', currentPresetId);
                } else {
                    imgSource = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.onerror = reject;
                        reader.readAsDataURL(file);
                    });
                }

                if (!editorData[sIdx].images) editorData[sIdx].images = [];
                editorData[sIdx].images[oIdx] = imgSource;
                renderBuilder(true);
            } catch (err) {
                console.error("Image upload failed", err);
                customAlert("Failed to process image.");
                renderBuilder(true);
            }
        }

        async function handleImageUpload(event, sIdx, oIdx) {
            const file = event.target.files[0];
            if (!file) return;
            await processImageFile(file, sIdx, oIdx);
        }

        async function handleImageDrop(event, sIdx, oIdx) {
            event.preventDefault();
            event.currentTarget.classList.remove("img-drop-active");
            const file = event.dataTransfer?.files?.[0];
            if (file) {
                await processImageFile(file, sIdx, oIdx);
            }
        }

        function escapeHTML(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme_this_or_that', isDark ? 'dark' : 'light');
        }

        function shuffleSlides() {
            if (editorData.length < 2) return;
            playSound("click");
            for (let i = editorData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [editorData[i], editorData[j]] = [editorData[j], editorData[i]];
            }
            renderBuilder();
            showToast("Slides shuffled!");
        }

        function updateBuilderStats() {
            const statsEl = document.getElementById("builderStats");
            if (!statsEl) return;
            const total = editorData.length;
            const ready = editorData.filter(s => s.question.trim() !== "" && s.options.every(o => o.trim() !== "")).length;
            statsEl.textContent = `${total} Slide${total === 1 ? "" : "s"} · ${ready} Ready`;
        }

        function renderBuilder(skipAnimation = false) {
            const container = document.getElementById("builderContainer");
            container.innerHTML = "";
            updateBuilderStats();

            editorData.forEach((slide, sIdx) => {
                if (!slide.images) slide.images = [];
                const card = document.createElement("div");
                card.className = `bg-white dark:bg-slate-800 p-4 md:p-5 rounded-2xl border-4 border-kkdark dark:border-slate-500 shadow-hard ${skipAnimation ? "" : "animate-pop-in"} relative group overflow-hidden`;
                if (!skipAnimation) {
                    card.style.animationDelay = `${Math.min(sIdx, 8) * 0.04}s`;
                }

                let html = `
                    <div class="absolute top-0 left-0 w-2 h-full ${COLORS[sIdx % COLORS.length]}"></div>
                    <div class="flex justify-between items-center mb-4 pl-3">
                        <div class="flex items-center gap-3 w-full">
                            <div class="bg-kkdark dark:bg-slate-600 text-white font-display text-xs w-6 h-6 rounded flex items-center justify-center shrink-0 shadow-hard-sm">
                                ${sIdx + 1}
                            </div>
                            <div class="relative w-full">
                                <input type="text" value="${escapeHTML(slide.question)}" oninput="updateQuestion(${sIdx}, this.value)" 
                                    placeholder="Question or Category..." 
                                    class="editor-input font-display text-lg w-full bg-slate-50 dark:bg-slate-700 border-2 border-kkdark dark:border-slate-500 rounded-lg px-3 py-1 text-kkdark dark:text-white focus:bg-white dark:focus:bg-slate-600 outline-none">
                            </div>
                        </div>
                        <div class="flex gap-1.5 shrink-0 ml-3">
                            <button onclick="moveSlide(${sIdx}, -1)" title="Move Up" ${sIdx === 0 ? "disabled" : ""}
                                class="btn-chunky w-8 h-8 rounded-lg bg-slate-50 dark:bg-slate-700 text-kkdark dark:text-slate-200 border-2 border-kkdark dark:border-slate-500 flex items-center justify-center">
                                <i data-lucide="chevron-up" class="w-4 h-4"></i>
                            </button>
                            <button onclick="moveSlide(${sIdx}, 1)" title="Move Down" ${sIdx === editorData.length - 1 ? "disabled" : ""}
                                class="btn-chunky w-8 h-8 rounded-lg bg-slate-50 dark:bg-slate-700 text-kkdark dark:text-slate-200 border-2 border-kkdark dark:border-slate-500 flex items-center justify-center">
                                <i data-lucide="chevron-down" class="w-4 h-4"></i>
                            </button>
                            <button onclick="duplicateSlide(${sIdx})" title="Duplicate" 
                                class="btn-chunky w-8 h-8 rounded-lg bg-blue-50 dark:bg-blue-900/40 text-kkblue border-2 border-kkdark dark:border-slate-500 flex items-center justify-center">
                                <i data-lucide="copy" class="w-4 h-4"></i>
                            </button>
                            <button onclick="deleteSlide(${sIdx})" title="Delete" 
                                class="btn-chunky w-8 h-8 rounded-lg bg-red-50 dark:bg-red-900/40 text-red-500 border-2 border-kkdark dark:border-slate-500 flex items-center justify-center">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pl-3">
                    `;

                slide.options.forEach((opt, oIdx) => {
                    const hasImg = slide.images[oIdx];
                    const accentColor = COLORS[oIdx % COLORS.length];

                    html += `
                        <div class="flex flex-col gap-1.5 p-3 rounded-xl border-2 border-kkdark dark:border-slate-600 bg-slate-50/50 dark:bg-slate-900/50 relative">
                            <div class="flex items-center gap-2">
                                <div class="w-3 h-3 rounded-full ${accentColor} border-2 border-kkdark dark:border-slate-400 shadow-hard-sm"></div>
                                <span class="text-[10px] font-black text-gray-400 dark:text-slate-400 uppercase tracking-widest">Option ${oIdx + 1}</span>
                            </div>
                            
                            <div class="relative flex items-center gap-2">
                                <input type="text" value="${escapeHTML(opt)}" oninput="updateOption(${sIdx}, ${oIdx}, this.value)" 
                                    placeholder="Answer..." 
                                    class="editor-input w-full bg-white dark:bg-slate-700 border-2 border-kkdark dark:border-slate-500 rounded-lg px-3 py-2 font-bold text-sm focus:border-kkblue outline-none text-kkdark dark:text-white">
                                
                                <div class="flex items-center gap-1.5">
                                    <div id="img-slot-${sIdx}-${oIdx}" class="relative w-10 h-10 flex-shrink-0">
                                        ${hasImg ? `
                                            <img data-src="${escapeHTML(hasImg)}" class="w-10 h-10 rounded-lg border-2 border-kkdark dark:border-slate-500 object-cover shadow-hard-sm">
                                            <button onclick="removeImage(${sIdx}, ${oIdx})" title="Remove Image" class="absolute -top-1.5 -right-1.5 bg-red-500 text-white w-5 h-5 rounded-full border-2 border-kkdark flex items-center justify-center shadow-hard-sm hover:scale-110 transition-transform">
                                                <i data-lucide="x" class="w-2.5 h-2.5"></i>
                                            </button>
                                        ` : `
                                            <label title="Upload or Drop Image"
                                                ondragover="event.preventDefault(); this.classList.add('img-drop-active');"
                                                ondragleave="this.classList.remove('img-drop-active');"
                                                ondrop="handleImageDrop(event, ${sIdx}, ${oIdx})"
                                                class="btn-chunky w-10 h-10 bg-white dark:bg-slate-700 rounded-lg border-2 border-kkdark dark:border-slate-500 flex items-center justify-center cursor-pointer text-gray-400 dark:text-slate-300 hover:text-kkblue shadow-hard-sm transition-all">
                                                <i data-lucide="image" class="w-5 h-5"></i>
                                                <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event, ${sIdx}, ${oIdx})">
                                            </label>
                                        `}
                                    </div>
                                    ${slide.options.length > 2 ? `
                                        <button onclick="deleteOption(${sIdx}, ${oIdx})" title="Remove Option" class="btn-chunky w-8 h-8 bg-white dark:bg-slate-700 border-2 border-kkdark dark:border-slate-500 rounded-lg text-gray-400 dark:text-slate-300 hover:text-red-500 flex items-center justify-center shadow-hard-sm">
                                            <i data-lucide="minus-circle" class="w-4 h-4"></i>
                                        </button>
                                    ` : ""}
                                </div>
                            </div>
                        </div>
                    `;
                });

                if (slide.options.length < 5) {
                    html += `
                        <button onclick="addOption(${sIdx})" 
                            class="btn-chunky flex flex-col items-center justify-center gap-1 border-2 border-dashed border-gray-300 dark:border-slate-600 rounded-xl py-2 text-gray-400 dark:text-slate-400 font-bold text-xs hover:border-kkblue hover:text-kkblue bg-white dark:bg-slate-800 hover:bg-blue-50 dark:hover:bg-slate-700 transition-all shadow-hard-sm">
                            <i data-lucide="plus" class="w-5 h-5"></i>
                            <span>ADD</span>
                        </button>
                    `;
                }

                html += `</div>`;
                card.innerHTML = html;
                container.appendChild(card);
            });

            if (editorData.length === 0) {
                container.innerHTML = `
                    <div class="lg:col-span-2 text-center py-20 bg-white dark:bg-slate-800 rounded-3xl border-4 border-dashed border-gray-200 dark:border-slate-600 animate-pulse">
                        <i data-lucide="layout" class="w-16 h-16 mx-auto mb-4 text-gray-200 dark:text-slate-600"></i>
                        <p class="text-gray-400 dark:text-slate-400 font-display text-xl">Create your first slide to start!</p>
                    </div>`;
            }
            lucide.createIcons();

            // Resolve cloud images in builder
            const imgs = container.querySelectorAll('img[data-src]');
            for (const img of imgs) {
                const src = img.getAttribute('data-src');
                if (src && src.includes('klasskit-media')) {
                    resolveAndCache(src).then(url => { img.src = url; });
                } else {
                    img.src = src;
                }
            }
        }

        function updateQuestion(sIdx, val) {
            editorData[sIdx].question = val;
            updateBuilderStats();
        }
        function updateOption(sIdx, oIdx, val) {
            editorData[sIdx].options[oIdx] = val;
            updateBuilderStats();
        }

        function moveSlide(sIdx, dir) {
            const target = sIdx + dir;
            if (target < 0 || target >= editorData.length) return;
            playSound("click");
            [editorData[sIdx], editorData[target]] = [editorData[target], editorData[sIdx]];
            renderBuilder(true);
        }

        function removeImage(sIdx, oIdx) {
            playSound("click");
            if (editorData[sIdx].images) {
                const url = editorData[sIdx].images[oIdx];
                if (url && url.includes('klasskit-media')) {
                    deleteMediaFromUrl(url).catch(e => console.error("Cloud delete failed", e));
                }
                editorData[sIdx].images[oIdx] = null;
                renderBuilder(true);
            }
        }

        function addOption(sIdx) {
            if (editorData[sIdx].options.length < 5) {
                editorData[sIdx].options.push("");
                renderBuilder(true);
            }
        }

        function addNewSlide() {
            editorData.push({ question: "", options: ["", ""], images: [] });
            renderBuilder(true);
            const scrollContainer = document.getElementById("builderScrollArea");
            setTimeout(() => { scrollContainer.scrollTo({ top: scrollContainer.scrollHeight, behavior: "smooth" }); }, 50);
        }

        function deleteOption(sIdx, oIdx) {
            if (editorData[sIdx].options.length > 2) {
                editorData[sIdx].options.splice(oIdx, 1);
                editorData[sIdx].images.splice(oIdx, 1);
                renderBuilder(true);
            }
        }

        function duplicateSlide(sIdx) {
            playSound("click");
            const slideToDuplicate = JSON.parse(JSON.stringify(editorData[sIdx]));
            editorData.splice(sIdx + 1, 0, slideToDuplicate);
            renderBuilder(true);
        }

        function deleteSlide(sIdx) {
            playSound("click");
            const removed = editorData.splice(sIdx, 1)[0];
            renderBuilder(true);
            showToast(`Slide ${sIdx + 1} deleted`, {
                actionLabel: "Undo",
                onAction: () => {
                    editorData.splice(sIdx, 0, removed);
                    renderBuilder(true);
                }
            });
        }

        async function saveAndStart() {
            const validData = editorData.filter(
                (s) => s.question.trim() !== "" && s.options.every((o) => o.trim() !== "")
            );
            if (validData.length === 0) {
                customAlert("Please add at least one valid slide with a question and completed options before saving.");
                return;
            }
            questions = validData;
            updateStartDeckStatus();

            try {
                await saveGameData(questions);
            } catch (error) {
                console.warn("Failed to save to local database (might be out of storage or in private mode):", error);
            }
            
            syncToCloud();
            closeSetupModal();
            startGame();
        }

        let selectedOptionIndex = null;

        function selectOption(idx) {
            playSound("pop");
            const panels = document.querySelectorAll("#optionsContainer .option-panel");
            if (!panels.length) return;

            if (selectedOptionIndex === idx) {
                selectedOptionIndex = null;
                panels.forEach((p) => {
                    p.classList.remove("is-selected", "is-dimmed");
                    p.setAttribute("aria-pressed", "false");
                    const badge = p.querySelector(".picked-badge");
                    if (badge) badge.classList.add("hidden");
                });
                return;
            }

            selectedOptionIndex = idx;
            panels.forEach((p, i) => {
                const badge = p.querySelector(".picked-badge");
                if (i === idx) {
                    p.classList.add("is-selected");
                    p.classList.remove("is-dimmed");
                    p.setAttribute("aria-pressed", "true");
                    if (badge) badge.classList.remove("hidden");
                } else {
                    p.classList.remove("is-selected");
                    p.classList.add("is-dimmed");
                    p.setAttribute("aria-pressed", "false");
                    if (badge) badge.classList.add("hidden");
                }
            });
        }

        function startGame() {
            if (questions.length === 0) {
                customAlert("Your game is empty! Let's build one first.");
                openSetupModal();
                return;
            }
            currentIndex = 0;
            document.getElementById("startScreen").classList.add("hidden");
            document.getElementById("endScreen").classList.add("hidden");
            document.getElementById("gameScreen").classList.remove("hidden");
            renderSlide();
        }

        function renderSlide() {
            const container = document.getElementById("optionsContainer");
            container.innerHTML = "";
            selectedOptionIndex = null;
            const data = questions[currentIndex];
            if (!data) { endGame(); return; }

            document.getElementById("questionText").innerText = data.question;
            document.getElementById("slideCounter").innerText = `${currentIndex + 1}/${questions.length}`;

            const progressBar = document.getElementById("slideProgressBar");
            if (progressBar) {
                progressBar.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
            }

            const prevBtn = document.getElementById("prevSlideBtn");
            if (prevBtn) {
                prevBtn.disabled = currentIndex === 0;
            }

            const nextBtn = document.getElementById("nextSlideBtn");
            if (nextBtn) {
                const isLast = currentIndex === questions.length - 1;
                nextBtn.title = isLast ? "Finish Game (Right Arrow / Space)" : "Next Slide (Right Arrow / Space)";
                nextBtn.innerHTML = isLast
                    ? '<i data-lucide="flag" class="w-6 h-6"></i>'
                    : '<i data-lucide="chevron-right" class="w-7 h-7"></i>';
            }

            data.options.forEach((optText, idx) => {
                const colorClass = COLORS[idx % COLORS.length];
                const imgSrc = data.images && data.images[idx];

                const panel = document.createElement("div");
                let borderClass = "border-b-4 md:border-b-0 md:border-r-4 border-kkdark";
                if (idx === data.options.length - 1) borderClass = "";

                panel.className = `${colorClass} ${borderClass} option-panel flex-1 relative flex flex-col items-center ${imgSrc ? 'justify-start p-0' : 'justify-center p-2 md:p-6'} overflow-hidden cursor-pointer`;
                panel.setAttribute("role", "button");
                panel.setAttribute("aria-pressed", "false");
                panel.setAttribute("aria-label", `Option ${idx + 1}: ${optText}`);
                panel.style.animation = `slideUp 0.6s cubic-bezier(0.2, 1, 0.3, 1) forwards`;
                panel.style.animationDelay = `${idx * 0.1}s`;
                panel.style.opacity = "0";
                panel.addEventListener("animationend", () => {
                    panel.style.animation = "";
                    panel.style.opacity = "";
                }, { once: true });

                const pickedBadge = `
                    <div class="picked-badge hidden absolute bottom-2 right-2 md:bottom-24 md:right-auto md:left-1/2 md:-translate-x-1/2 z-20 bg-white text-kkdark px-3.5 py-1 md:px-4 md:py-1.5 rounded-full border-4 border-kkdark shadow-hard font-display font-bold text-xs md:text-sm uppercase tracking-wider flex items-center gap-1.5 animate-pop pointer-events-none">
                        <i data-lucide="check-circle-2" class="w-4 h-4 text-kkgreen"></i> PICKED
                    </div>
                `;

                const textOnlyMarkup = `
                    <div class="relative z-10 flex items-center justify-center panel-icon transition-transform duration-300 pt-14 pb-16 px-6 max-w-[90%]">
                        <h2 class="font-display font-bold text-3xl md:text-6xl text-white drop-shadow-[4px_4px_0_rgba(0,0,0,0.3)] uppercase tracking-wide text-center leading-tight break-words">
                            ${escapeHTML(optText)}
                        </h2>
                    </div>
                `;

                let backgroundLayer = '';
                let contentLayer = '';

                if (imgSrc) {
                    // IMAGE MODE: Full-Bleed Full-Color Image + Floating Rounded Colored Title Label at Top
                    const isCompact = data.options.length > 2;
                    const mobileTopPad = idx === 0 ? 'pt-20' : 'pt-4';
                    backgroundLayer = `
                            <div class="absolute inset-0 z-0 overflow-hidden bg-slate-900/10">
                                <img src="${escapeHTML(imgSrc)}" alt="${escapeHTML(optText)}" class="option-card-img w-full h-full object-cover transition-transform duration-500 ease-out">
                            </div>
                        `;
                    contentLayer = `
                            <div class="relative z-10 w-full flex justify-center px-4 ${mobileTopPad} md:pt-24 pointer-events-none">
                                <div class="${colorClass} px-6 py-2 md:px-8 md:py-3 rounded-2xl border-4 border-kkdark dark:border-slate-500 shadow-hard max-w-[90%]">
                                    <h2 class="font-display font-bold ${isCompact ? 'text-xl md:text-2xl' : 'text-2xl md:text-4xl'} text-white drop-shadow-[2px_2px_0_rgba(30,41,59,1)] uppercase tracking-wide text-center leading-tight">
                                        ${escapeHTML(optText)}
                                    </h2>
                                </div>
                            </div>
                        `;
                } else {
                    // TEXT-ONLY MODE: Clean centered typography without an image placeholder
                    backgroundLayer = `<div class="absolute inset-0 bg-dots opacity-20 pointer-events-none"></div>`;
                    contentLayer = textOnlyMarkup;
                }

                panel.innerHTML = backgroundLayer + contentLayer + pickedBadge;

                // Resolve cloud images & add graceful error fallback to text-only mode
                const cardImg = panel.querySelector('.option-card-img');
                if (cardImg) {
                    cardImg.onerror = () => {
                        panel.classList.remove('justify-start', 'p-0');
                        panel.classList.add('justify-center', 'p-2', 'md:p-6');
                        panel.innerHTML = `<div class="absolute inset-0 bg-dots opacity-20 pointer-events-none"></div>` + textOnlyMarkup + pickedBadge;
                        lucide.createIcons();
                    };
                    if (imgSrc && imgSrc.includes('klasskit-media')) {
                        resolveAndCache(imgSrc).then(url => { if (cardImg) cardImg.src = url; });
                    }
                }

                panel.onclick = () => selectOption(idx);
                container.appendChild(panel);
            });

            if (typeof hydrateImages === 'function') hydrateImages();
            lucide.createIcons();
            playSound("pop");
        }

        function nextSlide() {
            if (currentIndex < questions.length - 1) { currentIndex++; renderSlide(); }
            else { endGame(); }
        }

        function prevSlide() {
            if (currentIndex > 0) { currentIndex--; renderSlide(); }
            else { playSound("click"); }
        }

        function endGame() {
            playSound("pop");
            const summaryEl = document.getElementById("endSummaryText");
            if (summaryEl) {
                summaryEl.textContent = `${questions.length} Slide${questions.length === 1 ? "" : "s"} Completed`;
            }
            document.getElementById("gameScreen").classList.add("hidden");
            document.getElementById("endScreen").classList.remove("hidden");
        }

        function resetGame() {
            playSound("click");
            document.getElementById("endScreen").classList.add("hidden");
            startGame();
        }

        function shuffleAndReplay() {
            playSound("click");
            for (let i = questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questions[i], questions[j]] = [questions[j], questions[i]];
            }
            document.getElementById("endScreen").classList.add("hidden");
            startGame();
        }

        // Touch swipe navigation on Game Screen
        let touchStartX = 0;
        let touchStartY = 0;
        const gameScreenEl = document.getElementById("gameScreen");
        if (gameScreenEl) {
            gameScreenEl.addEventListener("touchstart", (e) => {
                touchStartX = e.changedTouches[0].clientX;
                touchStartY = e.changedTouches[0].clientY;
            }, { passive: true });
            gameScreenEl.addEventListener("touchend", (e) => {
                const dx = e.changedTouches[0].clientX - touchStartX;
                const dy = e.changedTouches[0].clientY - touchStartY;
                if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
                    if (dx < 0) nextSlide();
                    else prevSlide();
                }
            }, { passive: true });
        }

        document.addEventListener("keydown", (e) => {
            const setupModal = document.getElementById("setupModal");
            const isSetupOpen = setupModal && !setupModal.classList.contains("hidden");

            if (e.key === "Escape" && isSetupOpen) {
                closeSetupModal();
                return;
            }

            const tag = (document.activeElement && document.activeElement.tagName || "").toLowerCase();
            if (tag === "input" || tag === "textarea" || tag === "select") return;

            if ((e.key === "f" || e.key === "F") && !e.ctrlKey && !e.metaKey && !e.altKey) {
                toggleFullscreen();
                return;
            }

            if (isSetupOpen) return;
            if (document.getElementById("gameScreen").classList.contains("hidden")) return;

            if (e.key === "ArrowRight" || e.code === "Space" || e.key === "Enter") {
                if (e.code === "Space") e.preventDefault();
                nextSlide();
            } else if (e.key === "ArrowLeft") {
                prevSlide();
            } else if (["1", "2", "3", "4", "5"].includes(e.key)) {
                const optIdx = parseInt(e.key, 10) - 1;
                const slide = questions[currentIndex];
                if (slide && optIdx < slide.options.length) {
                    selectOption(optIdx);
                }
            }
        });

        init();
    </script>
</body>

</html>
