<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Domino Card Maker — KlassKit</title>
<link rel="icon" type="image/x-icon" href="../../../media/icon.ico" />
<link rel="icon" type="image/webp" href="../../../media/icon.webp" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="../../../components/app-bootstrap.js"></script>
<script src="../../../components/bulk-import-modal.js"></script>
<script src="https://unpkg.com/lucide@1.16.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.4"></script>
<script src="/supabase.js"></script>

<link rel="stylesheet" href="../../../css/tailwind.generated.css" />
<link rel="stylesheet" href="../../../css/base.css" />
<link rel="stylesheet" href="../../../css/components.css" />

<script>
  KlassKitBootstrap.syncTheme('theme_domino-maker');
</script>

<style>
  :root {
    --color-pink: #ff4785;
    --color-orange: #ff7e33;
    --color-green: #00d063;
    --color-blue: #1ea7fd;
    --color-dark: #1e293b;
    --color-chalk: #f8fafc;
    --border-primary: var(--color-dark);
    --shadow-hard-sm: 2px 2px 0px 0px var(--border-primary);
    --shadow-hard-md: 4px 4px 0px 0px var(--border-primary);
    --shadow-hard-lg: 8px 8px 0px 0px var(--border-primary);
  }

  .dark {
    --border-primary: #64748b;
    --shadow-hard-sm: 2px 2px 0px 0px #000000;
    --shadow-hard-md: 4px 4px 0px 0px #000000;
    --shadow-hard-lg: 8px 8px 0px 0px #000000;
  }

  body {
    font-family: "Nunito", sans-serif;
    background-color: var(--color-chalk);
    color: var(--color-dark);
  }

  .dark body {
    background-color: #020617;
    color: white;
  }

  @media screen {
    .hidden { display: none !important; }
  }

  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible,
  select:focus-visible {
    outline: 3px solid #1ea7fd;
    outline-offset: 2px;
  }

  /* Custom Scrollbar (matches Card Maker) */
  .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.05); border-radius: 4px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  /* Card Maker Sidebar & Preview Area */
  .sidebar {
    width: 100%;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 4px solid var(--border-primary);
    z-index: 50;
  }

  @media (min-width: 768px) {
    .sidebar {
      width: 340px;
      border-bottom: none;
      border-right: 4px solid var(--border-primary);
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
    }
  }

  @media (min-width: 1440px) {
    .sidebar { width: 380px; }
  }

  .dark .sidebar {
    background: rgba(30, 41, 59, 0.85);
  }

  .preview-area {
    background-color: #f8fafc;
    background-image:
      linear-gradient(rgba(30, 41, 59, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30, 41, 59, 0.05) 1px, transparent 1px);
    background-size: 20px 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 28px 80px;
    overflow-y: auto;
    gap: 44px;
    min-width: 0;
  }

  .dark .preview-area {
    background-color: #020617;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
  }

  /* Card Maker Chunky Controls */
  .section-label {
    font-size: 11px;
    font-weight: 700;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.5rem;
    display: block;
    font-family: "Fredoka", sans-serif;
  }

  .btn-chunky {
    border: 3px solid var(--border-primary);
    font-family: "Fredoka", sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    box-shadow: var(--shadow-hard-md);
    transition: all 0.1s ease;
  }

  .btn-chunky:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 6px 6px 0px 0px var(--border-primary);
  }

  .dark .btn-chunky:hover:not(:disabled) {
    box-shadow: 6px 6px 0px 0px #000000;
  }

  .btn-chunky:active:not(:disabled) {
    transform: translate(4px, 4px);
    box-shadow: none !important;
  }

  .btn-chunky:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .input-chunky {
    width: 100%;
    border: 3px solid var(--border-primary);
    border-radius: 0.75rem;
    padding: 0.65rem 0.9rem;
    font-weight: 700;
    background: white;
    color: #1e293b;
    outline: none;
    box-shadow: var(--shadow-hard-sm);
    transition: box-shadow 0.15s ease;
  }

  .dark .input-chunky {
    background: #1e293b;
    color: white;
  }

  .input-chunky:focus {
    box-shadow: 0 0 0 4px rgba(30, 167, 253, 0.3);
  }

  /* Toggle Switch (matches Card Maker) */
  .toggle-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f8fafc;
    padding: 0.75rem 1rem;
    border: 2px solid #1e293b;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .dark .toggle-container {
    background: #0f172a;
    border-color: #64748b;
  }

  .toggle-container:hover { background: #f1f5f9; }
  .dark .toggle-container:hover { background: #1e293b; }

  .toggle-switch {
    width: 44px;
    height: 24px;
    background: #cbd5e1;
    border-radius: 12px;
    position: relative;
    transition: background 0.2s;
    border: 2px solid #1e293b;
    flex-shrink: 0;
  }

  .toggle-switch::after {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    background: white;
    border-radius: 50%;
    top: 2px;
    left: 2px;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    border: 2px solid #1e293b;
  }

  input:checked + .toggle-switch { background: #00e676; }
  input:checked + .toggle-switch::after { transform: translateX(20px); }

  /* A4 Page Simulation (matches Card Maker) */
  .page-wrapper {
    position: relative;
    transition: transform 0.2s ease;
  }

  .a4-page,
  .page {
    width: 210mm;
    height: 297mm;
    background: #ffffff;
    box-sizing: border-box;
    padding: 0;
    display: grid;
    margin: 0 auto;
    grid-template-columns: repeat(2, 1fr);
    gap: 0;
    position: relative;
    overflow: hidden;
    border: 4px solid #1e293b;
    box-shadow: 12px 12px 0px rgba(30, 41, 59, 0.15);
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  .domino-tile {
    display: flex;
    align-items: stretch;
    width: 100%;
    height: 100%;
    background: #f5f0e6;
    color: #1e293b;
    border: 1.5px solid #1e293b;
    border-radius: 1.5mm;
    box-sizing: border-box;
    overflow: hidden;
    min-width: 0;
    min-height: 0;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    position: relative;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.06), 0 1px 1px rgba(0,0,0,0.04);
  }
  .domino-half {
    flex: 1 1 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 2.5mm;
    min-width: 0;
    overflow: hidden;
  }
  .domino-divider {
    align-self: stretch;
    width: 0;
    flex-shrink: 0;
    position: relative;
    border-left: 1.5px solid #1e293b;
  }
  .domino-divider::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 2.2mm;
    height: 2.2mm;
    background: radial-gradient(circle at 35% 35%, #475569 0%, #1e293b 70%);
    border-radius: 50%;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    box-shadow: inset 0 0.5px 1px rgba(0,0,0,0.3);
  }
  .domino-half span { display: block; word-break: break-word; line-height: 1.1; }
  .domino-half img { max-height: 90%; max-width: 85%; object-fit: contain; }
  .domino-half img.error { display: none; }
  .domino-half .img-fallback { display: none; font-size: 0.7rem; color: #64748b; text-align: center; }
  .domino-half img.error + .img-fallback { display: block; }

  /* Library items */
  .dm-library-item {
    border: 2px solid #cbd5e1;
    border-radius: 0.75rem;
    padding: 0.6rem 0.75rem;
    transition: all 0.15s ease;
    cursor: pointer;
    background: white;
  }
  .dark .dm-library-item { border-color: #475569; background: #1e293b; }
  .dm-library-item:hover { border-color: var(--color-blue); transform: translateX(2px); }
  .dm-library-item.active { border-color: var(--color-blue); background: rgba(30, 167, 253, 0.08); }
  .dm-library-item .delete-btn { opacity: 0; transition: opacity 0.15s ease; }
  .dm-library-item:hover .delete-btn { opacity: 1; }
  @media (max-width: 1024px) { .dm-library-item .delete-btn { opacity: 1; } }

  /* Print Overrides (matches Card Maker) */
  @media print {
    @page { size: A4 portrait; margin: 0; }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      background: #fff !important;
      background-image: none !important;
      color: #1e293b !important;
      height: auto !important;
      overflow: visible !important;
      display: block !important;
    }
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .no-print { display: none !important; }
    .preview-area {
      padding: 0 !important;
      display: block !important;
      background: none !important;
      gap: 0 !important;
      overflow: visible !important;
    }
    #output {
      margin: 0 !important;
      padding: 0 !important;
      display: block !important;
      overflow: visible !important;
    }
    .page-wrapper {
      break-after: page;
      page-break-after: always;
      margin: 0 !important;
      transform: none !important;
      zoom: 1 !important;
    }
    .page-wrapper:last-child {
      break-after: auto;
      page-break-after: auto;
    }
    .page {
      width: 210mm !important;
      height: 297mm !important;
      padding: 0 !important;
      margin: 0 !important;
      box-shadow: none !important;
      border: none !important;
    }
  }
</style>
  <script defer src="/js/analytics.js"></script>
</head>

<body class="flex flex-col md:flex-row min-h-screen text-brand-dark dark:text-white transition-colors duration-300">

  <!-- SIDEBAR CONTROLS (matches Card Maker) -->
  <aside class="sidebar glass-panel no-print flex flex-col p-4 sm:p-5">
    <!-- Header -->
    <div class="mb-4 border-b-2 border-slate-100 dark:border-slate-700 pb-4 flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-heading text-brand-dark dark:text-white tracking-tight leading-none">
          DOMINO<span class="text-brand-blue">MAKER</span>
        </h1>
        <div class="flex items-center gap-2 mt-2">
          <span class="px-2 py-0.5 rounded bg-brand-dark text-white text-[10px] font-bold uppercase tracking-widest">KlassKit</span>
          <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Edition</span>
        </div>
      </div>

      <button onclick="toggleTheme()"
        class="bg-white dark:bg-slate-800 text-brand-dark dark:text-white p-2 rounded-full border-2 border-brand-dark dark:border-slate-500 shadow-neo-sm hover:-translate-y-1 transition-all group focus:outline-none"
        aria-label="Toggle dark mode">
        <i data-lucide="moon" class="w-4 h-4 dark:hidden group-hover:rotate-12 transition-transform"></i>
        <i data-lucide="sun" class="w-4 h-4 hidden dark:block group-hover:rotate-90 transition-transform"></i>
      </button>
    </div>

    <!-- Active Set Indicator -->
    <div id="activeSetIndicator" class="hidden mb-6 animate-pop-in">
      <div class="bg-brand-blue/10 border-2 border-brand-blue/30 rounded-xl p-3 flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-brand-blue flex items-center justify-center text-white shrink-0 shadow-neo-sm">
          <i data-lucide="layers" class="w-4 h-4"></i>
        </div>
        <div class="min-w-0">
          <p class="text-[10px] font-bold text-brand-blue uppercase tracking-wider leading-none mb-1">Active Set</p>
          <p id="activeSetName" class="text-sm font-bold truncate dark:text-white">Untitled</p>
        </div>
        <button onclick="closeActiveSet()" class="ml-auto text-slate-400 hover:text-brand-pink transition-colors" title="Close active set">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Scrollable Controls -->
    <div class="space-y-6 flex-1 overflow-y-auto pr-2 custom-scrollbar">

      <!-- Quick Workspace Actions -->
      <section>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="newWorkspace()"
            class="btn-chunky bg-white dark:bg-slate-700 py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 dark:text-white">
            <i data-lucide="sparkles" class="w-4 h-4"></i> New
          </button>
          <button onclick="openSaveAsModal()"
            class="btn-chunky bg-brand-blue text-white py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5">
            <i data-lucide="save" class="w-4 h-4"></i> Save As
          </button>
        </div>
      </section>

      <!-- Word List -->
      <section class="border-t-2 border-slate-100 dark:border-slate-700 pt-4">
        <div class="flex items-center justify-between gap-2 mb-2">
          <label class="section-label mb-0">Word List</label>
          <button id="openBulkImportBtn" type="button"
            class="btn-chunky bg-white dark:bg-slate-700 px-2.5 py-1 rounded-lg text-[10px] flex items-center gap-1 dark:text-white">
            <i data-lucide="file-up" class="w-3 h-3"></i> Bulk Import
          </button>
        </div>
        <textarea id="wordList" rows="7"
          placeholder="One word per line, or separate with commas.&#10;I'll automatically link them into a matching chain.&#10;Image URLs (.jpg/.png/.svg) work too."
          class="input-chunky w-full p-3 text-sm resize-none custom-scrollbar"></textarea>
        <div id="dupWarning" class="hidden mt-2 text-xs font-bold text-brand-orange"></div>
        <div class="flex items-center justify-between mt-2">
          <span id="itemCount" class="text-[11px] font-bold text-slate-400">0 words entered</span>
          <div class="flex gap-3">
            <button id="loadExample" type="button" class="text-[11px] font-bold text-brand-blue hover:underline">Example</button>
            <button id="clearList" type="button" class="text-[11px] font-bold text-brand-pink hover:underline">Clear</button>
          </div>
        </div>
        <div id="cefrPresetsSlot" class="mt-3"></div>
      </section>

      <!-- Set Layout -->
      <section class="border-t-2 border-slate-100 dark:border-slate-700 pt-4 space-y-4">
        <label class="section-label">Set Layout</label>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <span class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">Set Size (Tiles)</span>
            <input id="setSize" type="number" min="4" max="120" value="36"
              class="input-chunky py-2 px-3 text-sm" />
          </div>
          <div>
            <span class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">Tiles / Page</span>
            <input id="tilesPerPage" type="number" min="2" max="40" value="18"
              class="input-chunky py-2 px-3 text-sm" />
          </div>
        </div>

        <div>
          <span class="text-xs font-bold text-brand-dark dark:text-white block mb-2">Text Size</span>
          <select id="fontSize" class="input-chunky py-2 text-xs">
            <option value="text-sm">Small</option>
            <option value="text-base" selected>Medium</option>
            <option value="text-lg">Large</option>
          </select>
        </div>

        <label class="toggle-container">
          <span class="text-xs font-bold text-brand-dark dark:text-white">UPPERCASE Text</span>
          <input id="uppercase" type="checkbox" checked class="sr-only" />
          <div class="toggle-switch"></div>
        </label>

        <button id="shuffleBtn" type="button"
          class="btn-chunky w-full bg-brand-orange text-brand-dark rounded-xl py-2.5 text-xs flex items-center justify-center gap-2">
          <i data-lucide="shuffle" class="w-4 h-4"></i> Reshuffle Layout
        </button>
      </section>

      <!-- Library -->
      <section class="border-t-2 border-slate-100 dark:border-slate-700 pt-4">
        <div class="flex items-center justify-between mb-2">
          <label class="section-label mb-0">Library</label>
          <select id="librarySort" onchange="renderLibrary()"
            class="bg-transparent text-[10px] font-bold text-slate-400 outline-none cursor-pointer hover:text-brand-blue transition-colors uppercase tracking-widest">
            <option value="recent">Recent</option>
            <option value="alpha">Alpha</option>
            <option value="popular">Popular</option>
          </select>
        </div>
        <div id="libraryList" class="space-y-1.5 max-h-48 overflow-y-auto custom-scrollbar">
          <p class="text-slate-400 text-[10px] italic">No saved sets yet.</p>
        </div>
      </section>
    </div>

    <!-- Sticky Footer Actions -->
    <div class="mt-4 space-y-2 pt-4 border-t-2 border-brand-dark dark:border-slate-700">
      <div class="grid grid-cols-2 gap-2">
        <button id="generateBtn" type="button"
          class="btn-chunky bg-brand-blue text-white py-3 rounded-xl text-sm flex items-center justify-center gap-1.5">
          <i data-lucide="sparkles" class="w-4 h-4"></i> GENERATE
        </button>
        <button id="printBtn" type="button"
          class="btn-chunky bg-brand-green py-3 rounded-xl text-sm flex items-center justify-center gap-1.5 text-brand-dark">
          <i data-lucide="printer" class="w-4 h-4"></i> PRINT
        </button>
      </div>
    </div>
  </aside>

  <!-- FLOATING ZOOM BAR (matches Card Maker) -->
  <div id="zoom-bar" class="no-print fixed bottom-4 right-4 z-[60] flex items-center gap-1 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-[3px] border-brand-dark dark:border-slate-500 rounded-2xl p-1 shadow-neo dark:shadow-[4px_4px_0px_0px_#000000]">
    <button onclick="setPreviewZoom(0.5)" id="zoom-0.5" class="px-2.5 py-1 rounded-xl text-[11px] font-heading font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">50%</button>
    <button onclick="setPreviewZoom(0.75)" id="zoom-0.75" class="px-2.5 py-1 rounded-xl text-[11px] font-heading font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">75%</button>
    <button onclick="setPreviewZoom(1)" id="zoom-1" class="px-2.5 py-1 rounded-xl text-[11px] font-heading font-bold bg-brand-blue text-white transition-colors">100%</button>
    <button onclick="setPreviewZoom('fit')" id="zoom-fit" class="px-2.5 py-1 rounded-xl text-[11px] font-heading font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="Fit page to screen">FIT</button>
  </div>

  <!-- MAIN WORKSPACE (matches Card Maker .preview-area) -->
  <main id="previewArea" class="preview-area transition-all duration-500 flex-1">
    <div id="statsLine" class="no-print hidden px-4 py-2 rounded-2xl bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-[3px] border-brand-dark dark:border-slate-500 shadow-neo-sm text-xs font-bold text-slate-600 dark:text-slate-300 flex items-center gap-2"></div>
    <div id="output" class="w-full flex flex-col items-center gap-12">
      <div id="emptyState" class="bg-white dark:bg-slate-800 border-4 border-brand-dark dark:border-slate-500 rounded-[2rem] shadow-neo p-12 text-center text-slate-400 dark:text-slate-400 max-w-md w-full mt-8">
        <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-brand-green/15 border-[3px] border-brand-dark flex items-center justify-center">
          <i data-lucide="layout-grid" class="w-8 h-8 text-brand-green"></i>
        </div>
        <p class="font-heading font-bold text-xl text-brand-dark dark:text-white uppercase">Your domino set will appear here</p>
        <p class="text-sm mt-2">Paste a word list and hit <span class="font-bold text-brand-blue">GENERATE</span> to create printable A4 tiles.</p>
      </div>
    </div>
  </main>

  <!-- Save As Modal -->
  <div id="saveAsModal" class="no-print fixed inset-0 z-[200] hidden items-center justify-center bg-brand-dark/60 backdrop-blur-md p-4">
    <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-[2rem] border-4 border-brand-dark dark:border-slate-500 shadow-neo p-6 animate-pop-in">
      <h3 class="font-heading font-bold text-xl mb-1 text-brand-dark dark:text-white uppercase">Save Set</h3>
      <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">Store your current workspace to the library.</p>
      <label class="section-label">Set Name</label>
      <input id="saveAsName" type="text" placeholder="My Domino Set"
        class="input-chunky w-full px-3 py-2.5 text-sm mb-5" />
      <div class="flex gap-3">
        <button onclick="closeSaveAsModal()"
          class="btn-chunky flex-1 bg-white dark:bg-slate-700 text-brand-dark dark:text-white rounded-2xl py-2.5 text-sm">Cancel</button>
        <button onclick="confirmSaveAs()"
          class="btn-chunky flex-1 bg-brand-green text-brand-dark rounded-2xl py-2.5 text-sm">Save</button>
      </div>
    </div>
  </div>

<script>
  lucide.createIcons();

  const wordListEl = document.getElementById('wordList');
  const setSizeEl = document.getElementById('setSize');
  const tilesPerPageEl = document.getElementById('tilesPerPage');
  const fontSizeEl = document.getElementById('fontSize');
  const uppercaseEl = document.getElementById('uppercase');
  const outputEl = document.getElementById('output');
  const emptyStateEl = document.getElementById('emptyState');
  const itemCountEl = document.getElementById('itemCount');
  const statsLineEl = document.getElementById('statsLine');
  const dupWarningEl = document.getElementById('dupWarning');
  const shuffleBtn = document.getElementById('shuffleBtn');

  const COLS = 2;

  const EXAMPLE = `FORGET
SPILL
TEAR
TRIP
DROP
CRASH
SMASH
SCRATCH
KNOCK OVER
BREAK
FALL`;

  const STORAGE_KEY = 'klasskit-domino-maker-v2';
  let currentTiles = [];
  let autoSaveTimer = null;

  // ===== IndexedDB Sets Management =====
  const DB_NAME = 'klasskit-domino-maker';
  const DB_VERSION = 1;
  const STORE_NAME = 'sets';
  let activeSetId = null;
  let dataBase = null;

  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onerror = () => reject(request.error);
      request.onsuccess = () => { dataBase = request.result; resolve(dataBase); };
      request.onupgradeneeded = (e) => {
        const dataBase = e.target.result;
        if (!dataBase.objectStoreNames.contains(STORE_NAME)) {
          const store = dataBase.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
          store.createIndex('name', 'name', { unique: false });
          store.createIndex('lastUsed', 'lastUsed', { unique: false });
          store.createIndex('usageCount', 'usageCount', { unique: false });
        }
      };
    });
  }

  async function ensureDB() {
    if (!dataBase) dataBase = await openDB();
    return dataBase;
  }

  async function saveSetToDB(record) {
    const database = await ensureDB();
    return new Promise((resolve, reject) => {
      const tx = database.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const req = store.put(record);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function getSetById(id) {
    const database = await ensureDB();
    return new Promise((resolve, reject) => {
      const tx = database.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function deleteSetById(id) {
    const database = await ensureDB();
    return new Promise((resolve, reject) => {
      const tx = database.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const req = store.delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  async function getAllSets() {
    const database = await ensureDB();
    return new Promise((resolve, reject) => {
      const tx = database.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.getAll();
      req.onsuccess = () => {
        const sets = req.result || [];
        // backward compatibility
        sets.forEach(s => {
          if (!s.lastUsed) s.lastUsed = s.createdAt || Date.now();
          if (typeof s.usageCount !== 'number') s.usageCount = 0;
        });
        resolve(sets);
      };
      req.onerror = () => reject(req.error);
    });
  }

  function getWorkspaceData() {
    return {
      list: wordListEl.value,
      setSize: setSizeEl.value,
      tilesPerPage: tilesPerPageEl.value,
      fontSize: fontSizeEl.value,
      uppercase: uppercaseEl.checked,
    };
  }

  function applyWorkspaceData(data) {
    wordListEl.value = data.list || '';
    setSizeEl.value = data.setSize || 36;
    tilesPerPageEl.value = data.tilesPerPage || 18;
    fontSizeEl.value = data.fontSize || 'text-base';
    uppercaseEl.checked = typeof data.uppercase === 'boolean' ? data.uppercase : true;
  }

  function updateActiveIndicator(name) {
    const el = document.getElementById('activeSetIndicator');
    const nameEl = document.getElementById('activeSetName');
    if (activeSetId !== null && name) {
      el.classList.remove('hidden');
      nameEl.textContent = name;
    } else {
      el.classList.add('hidden');
    }
    lucide.createIcons();
  }

  async function autoSaveIfActive() {
    if (activeSetId === null) return;
    const set = await getSetById(activeSetId);
    if (!set) return;
    const data = getWorkspaceData();
    Object.assign(set, data, { lastUsed: Date.now() });
    await saveSetToDB(set);
    // Debounce cloud sync to avoid API spam on every keystroke
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(() => {
      syncLibraryToCloud().catch(() => {});
    }, 800);
  }

  async function newWorkspace() {
    activeSetId = null;
    applyWorkspaceData({ list: '', setSize: 36, tilesPerPage: 18, fontSize: 'text-base', uppercase: true });
    currentTiles = [];
    outputEl.innerHTML = '';
    outputEl.appendChild(emptyStateEl);
    statsLineEl.classList.add('hidden');
    shuffleBtn.disabled = true;
    updateActiveIndicator('');
    updateCount();
    lucide.createIcons();
  }

  function openSaveAsModal() {
    const modal = document.getElementById('saveAsModal');
    const input = document.getElementById('saveAsName');
    input.value = '';
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    setTimeout(() => input.focus(), 50);
  }

  function closeSaveAsModal() {
    const modal = document.getElementById('saveAsModal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }

  async function confirmSaveAs() {
    const name = document.getElementById('saveAsName').value.trim();
    if (!name) return;
    const data = getWorkspaceData();
    const now = Date.now();
    const record = {
      name,
      ...data,
      createdAt: now,
      lastUsed: now,
      usageCount: 0,
    };
    activeSetId = await saveSetToDB(record);
    updateActiveIndicator(name);
    closeSaveAsModal();
    renderLibrary();
    await syncLibraryToCloud().catch(() => {});
  }

  async function loadSet(id) {
    const set = await getSetById(id);
    if (!set) return;
    activeSetId = id;
    set.usageCount = (set.usageCount || 0) + 1;
    set.lastUsed = Date.now();
    await saveSetToDB(set);
    applyWorkspaceData(set);
    updateCount();
    generate();
    updateActiveIndicator(set.name);
    renderLibrary();
    await syncLibraryToCloud().catch(() => {});
  }

  async function deleteSet(id) {
    if (!confirm('Delete this saved set?')) return;
    await deleteSetById(id);
    if (activeSetId === id) {
      activeSetId = null;
      updateActiveIndicator('');
    }
    renderLibrary();
    await syncLibraryToCloud().catch(() => {});
  }

  function closeActiveSet() {
    activeSetId = null;
    updateActiveIndicator('');
    renderLibrary();
  }

  function escapeHtmlAttr(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function renderLibrary() {
    const listEl = document.getElementById('libraryList');
    const sortMode = document.getElementById('librarySort').value;
    let sets = await getAllSets();

    if (sortMode === 'recent') {
      sets.sort((a, b) => (b.lastUsed || 0) - (a.lastUsed || 0));
    } else if (sortMode === 'alpha') {
      sets.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    } else if (sortMode === 'popular') {
      sets.sort((a, b) => (b.usageCount || 0) - (a.usageCount || 0));
    }

    if (sets.length === 0) {
      listEl.innerHTML = `
        <div class="text-center py-6">
          <i data-lucide="package-open" class="w-8 h-8 mx-auto mb-2 text-slate-300 dark:text-slate-600"></i>
          <p class="text-xs text-slate-400">No saved sets yet.</p>
        </div>`;
      return;
    }

    listEl.innerHTML = sets.map(s => {
      const isActive = s.id === activeSetId;
      const activeBadge = isActive ? '<span class="dm-badge bg-brand-blue text-white ml-2">Active</span>' : '';
      return `
        <div class="dm-library-item ${isActive ? 'active' : ''} flex items-center gap-2 group">
          <button onclick="loadSet(${s.id})" class="flex-1 text-left min-w-0">
            <p class="text-sm font-bold truncate dark:text-white flex items-center">${escapeHtmlAttr(s.name)}${activeBadge}</p>
            <p class="text-[10px] text-slate-400 font-medium">${new Date(s.lastUsed).toLocaleDateString()} · Used ${s.usageCount || 0}×</p>
          </button>
          <button onclick="deleteSet(${s.id})" class="delete-btn p-1.5 rounded-lg text-slate-400 hover:text-brand-pink hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors shrink-0" title="Delete">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>
      `;
    }).join('');
    lucide.createIcons();
  }

  // ===== Existing Functions =====

  function toggleTheme() {
    const isDark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme_domino-maker', isDark ? 'dark' : 'light');
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function parseList(raw) {
    return raw.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
  }

  function isImageURL(s) {
    return /^(https?:\/\/|data:image\/)/i.test(s) && (/\.(png|jpe?g|gif|webp|svg)(\?.*)?$/i.test(s) || s.startsWith('data:image'));
  }

  function updateCount() {
    const items = parseList(wordListEl.value);
    itemCountEl.textContent = `${items.length} word${items.length === 1 ? '' : 's'} entered`;

    // Duplicate detection
    const seen = new Set();
    const dups = [];
    for (const item of items) {
      const key = item.toLowerCase();
      if (seen.has(key)) dups.push(item);
      seen.add(key);
    }
    if (dups.length > 0) {
      dupWarningEl.textContent = `⚠ Duplicate words detected: ${[...new Set(dups)].join(', ')} — the chain may not work as a game.`;
      dupWarningEl.classList.remove('hidden');
    } else {
      dupWarningEl.classList.add('hidden');
    }
  }

  function buildChain(items, n) {
    if (!items.length || n <= 0) return [];
    const seq = [];
    for (let i = 0; i < n; i++) seq.push(items[i % items.length]);
    const tiles = [];
    for (let i = 0; i < n; i++) tiles.push([seq[i], seq[(i + 1) % n]]);
    return tiles;
  }

  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function renderHalf(val, opts) {
    if (!val) return '<div class="domino-half"></div>';
    if (isImageURL(val)) {
      return `<div class="domino-half">
        <img src="${escapeHtml(val)}" alt="" onerror="this.classList.add('error')" />
        <span class="img-fallback font-heading font-bold text-xs">Image failed to load</span>
      </div>`;
    }
    const upClass = opts.uppercase ? 'uppercase' : '';
    return `<div class="domino-half"><span class="font-heading font-bold ${opts.fontSize} ${upClass}">${escapeHtml(val)}</span></div>`;
  }

  function renderTile(pair, opts) {
    const [left, right] = pair;
    return `
      <div class="domino-tile">
        ${renderHalf(left, opts)}
        <div class="domino-divider"></div>
        ${renderHalf(right, opts)}
      </div>`;
  }

  function renderPage(pageTiles, opts, pageIndex) {
    const pageRows = Math.ceil(pageTiles.length / COLS);
    let cellsHTML = '';
    for (let i = 0; i < pageTiles.length; i++) {
      cellsHTML += renderTile(pageTiles[i], opts);
    }
    return `
      <div class="page-wrapper">
        <div class="absolute -top-9 left-0 w-full flex justify-between items-end no-print pb-2">
          <div class="font-heading font-bold text-slate-400 text-sm uppercase tracking-widest">Page ${pageIndex + 1}</div>
          <div class="flex gap-2">
            <button type="button" onclick="reshuffle()"
              class="bg-brand-orange text-brand-dark border-2 border-brand-dark dark:border-slate-500 px-3 py-1 rounded-lg font-heading font-bold text-[11px] shadow-neo-sm hover:scale-105 active:translate-y-0.5 transition-all flex items-center gap-1">
              <i data-lucide="shuffle" class="w-3.5 h-3.5"></i> SHUFFLE
            </button>
          </div>
        </div>
        <div class="page a4-page" style="grid-template-rows:repeat(${pageRows},1fr);">
          ${cellsHTML}
        </div>
      </div>`;
  }

  // ===== Cloud Sync =====
  const CLOUD_TOOL_KEY = 'domino-maker';

  async function saveWorkspaceToCloud() {
    const data = getWorkspaceData();
    await saveProgress(CLOUD_TOOL_KEY + '-workspace', data);
  }

  async function loadWorkspaceFromCloud() {
    const data = await loadProgress(CLOUD_TOOL_KEY + '-workspace');
    if (data) {
      applyWorkspaceData(data);
      return true;
    }
    // Fallback to old localStorage key (one-time migration)
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const oldData = JSON.parse(raw);
        applyWorkspaceData(oldData);
        await saveProgress(CLOUD_TOOL_KEY + '-workspace', oldData);
        localStorage.removeItem(STORAGE_KEY);
        return true;
      }
    } catch (e) {}
    return false;
  }

  async function syncLibraryToCloud() {
    const sets = await getAllSets();
    await saveProgress(CLOUD_TOOL_KEY, { sets, activeId: activeSetId });
  }

  async function syncLibraryFromCloud() {
    const payload = await loadProgress(CLOUD_TOOL_KEY);
    if (!payload || !Array.isArray(payload.sets) || !payload.sets.length) return false;
    // Validate payload before wiping local data
    if (!payload.sets.every(s => s && typeof s.name === 'string')) return false;

    const dataBase = await ensureDB();
    const tx = dataBase.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);

    await new Promise((resolve, reject) => {
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));

      const clearReq = store.clear();
      clearReq.onerror = () => reject(clearReq.error);
      clearReq.onsuccess = () => {
        for (const set of payload.sets) {
          const { id, ...data } = set;
          // Preserve original IDs so activeSetId stays valid
          store.put({ ...data, id: set.id });
        }
      };
    });

    if (typeof payload.activeId === 'number') activeSetId = payload.activeId;
    return true;
  }

  // ===== Legacy wrappers (replaced by cloud sync) =====
  function saveSettings() {
    saveWorkspaceToCloud().catch(() => {});
  }

  function loadSettings() {
    loadWorkspaceFromCloud().catch(() => {});
  }

  function renderTiles() {
    const tilesPerPage = Math.max(2, Math.min(40, parseInt(tilesPerPageEl.value) || 18));
    const rows = Math.ceil(tilesPerPage / COLS);
    const pages = [];
    for (let i = 0; i < currentTiles.length; i += tilesPerPage) {
      pages.push(currentTiles.slice(i, i + tilesPerPage));
    }
    const opts = { fontSize: fontSizeEl.value, uppercase: uppercaseEl.checked };
    outputEl.innerHTML = pages.map((p, i) => renderPage(p, opts, i)).join('');

    const items = parseList(wordListEl.value);
    let note = '';
    if (items.length > 0 && items.length < currentTiles.length) {
      note = ` · words repeated to fill the set`;
    } else if (items.length > currentTiles.length) {
      note = ` · using first ${currentTiles.length} words`;
    }
    statsLineEl.innerHTML = `<i data-lucide="info" class="w-3.5 h-3.5 text-brand-blue"></i> ${currentTiles.length} tiles · ${pages.length} page${pages.length === 1 ? '' : 's'} · ${tilesPerPage} per page (${COLS}×${rows} grid)${note}`;
    statsLineEl.classList.remove('hidden');
    applyPreviewZoom();
    lucide.createIcons();
  }

  let currentZoomMode = localStorage.getItem('dominomaker_zoom') || '1';

  function setPreviewZoom(mode) {
    currentZoomMode = String(mode);
    localStorage.setItem('dominomaker_zoom', currentZoomMode);
    applyPreviewZoom();
  }

  function applyPreviewZoom() {
    const container = document.getElementById('previewArea');
    if (!container) return;
    let zoomVal = 1;
    if (currentZoomMode === 'fit') {
      const availW = Math.max(320, container.clientWidth - 72);
      zoomVal = Math.min(1, Math.max(0.35, +(availW / 794).toFixed(2)));
    } else {
      zoomVal = parseFloat(currentZoomMode) || 1;
    }
    document.querySelectorAll('.page-wrapper').forEach((w) => {
      w.style.zoom = String(zoomVal);
    });
    ['0.5', '0.75', '1', 'fit'].forEach((k) => {
      const btn = document.getElementById(`zoom-${k}`);
      if (!btn) return;
      const active = currentZoomMode === k;
      btn.classList.toggle('bg-brand-blue', active);
      btn.classList.toggle('text-white', active);
      btn.classList.toggle('text-slate-600', !active);
      btn.classList.toggle('dark:text-slate-300', !active);
    });
  }

  window.addEventListener('resize', () => {
    if (currentZoomMode === 'fit') applyPreviewZoom();
  });

  function generate() {
    const items = parseList(wordListEl.value);
    updateCount();
    saveSettings();

    if (items.length === 0) {
      currentTiles = [];
      outputEl.innerHTML = '';
      outputEl.appendChild(emptyStateEl);
      statsLineEl.classList.add('hidden');
      shuffleBtn.disabled = true;
      lucide.createIcons();
      return;
    }

    const setSize = Math.max(4, Math.min(120, parseInt(setSizeEl.value) || 36));
    currentTiles = shuffleArray(buildChain(items, setSize));
    shuffleBtn.disabled = false;
    renderTiles();
  }

  function reshuffle() {
    if (currentTiles.length === 0) return;
    currentTiles = shuffleArray(currentTiles.slice());
    renderTiles();
  }

  document.getElementById('generateBtn').addEventListener('click', generate);
  document.getElementById('shuffleBtn').addEventListener('click', reshuffle);
  document.getElementById('printBtn').addEventListener('click', () => {
    if (!currentTiles.length && wordListEl.value.trim()) generate();
    window.print();
  });
  window.addEventListener('beforeprint', () => {
    if (!currentTiles.length && wordListEl.value.trim()) generate();
  });
  document.getElementById('loadExample').addEventListener('click', () => {
    wordListEl.value = EXAMPLE;
    updateCount();
    generate();
  });
  document.getElementById('clearList').addEventListener('click', () => {
    wordListEl.value = '';
    updateCount();
    generate();
  });
  wordListEl.addEventListener('input', updateCount);

  // Auto-save triggers
  [wordListEl, setSizeEl, tilesPerPageEl].forEach(el => {
    el.addEventListener('input', () => autoSaveIfActive());
    el.addEventListener('change', () => autoSaveIfActive());
  });
  [fontSizeEl, uppercaseEl].forEach(el => {
    el.addEventListener('change', () => autoSaveIfActive());
  });

  // Save As modal keyboard
  document.getElementById('saveAsName').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); confirmSaveAs(); }
    if (e.key === 'Escape') { closeSaveAsModal(); }
  });
  document.getElementById('saveAsModal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('saveAsModal')) closeSaveAsModal();
  });

  // Cloud-first startup
  (async function init() {
    if (typeof requireAuth === 'function') await requireAuth();
    await loadWorkspaceFromCloud().catch(() => {});
    await syncLibraryFromCloud().catch(() => {});
    updateCount();
    shuffleBtn.disabled = currentTiles.length === 0;
    if (parseList(wordListEl.value).length > 0) generate();
    renderLibrary();
    applyPreviewZoom();

    if (window.KlassKitBulkImport) {
      const dominoBulkModal = window.KlassKitBulkImport.create({
        id: 'dm-bulk-import-overlay',
        title: 'Domino Word Import',
        subtitle: 'Paste terms to auto-link into a domino chain',
        accentColor: 'blue',
        unitLabel: 'item',
        unitLabelPlural: 'items',
        confirmText: 'Import & Generate',
        guideItems: [
          { label: 'One Per Line / CSV', syntax: 'APPLE\nBANANA, CHERRY', color: 'green', desc: 'Supports commas, newlines, numbered lists, or image URLs.' },
          { label: 'Comments', syntax: '# Unit 3 Kitchen', color: 'orange', desc: 'Lines starting with # are skipped.' }
        ],
        placeholder: '# Domino Vocabulary\nKITCHEN\nBEDROOM, SOFA\n1. TABLE\n2. CHAIR',
        template: '# Domino Word List\nKITCHEN\nBEDROOM\nSOFA\nTABLE\nCHAIR\nLAMP\nWINDOW\nDOOR',
        sample: 'KITCHEN\nBEDROOM\nSOFA\nTABLE\nCHAIR\nLAMP\nMIRROR\nWINDOW\nDOOR\nFRIDGE\nSTOVE\nCLOCK',
        options: [
          { id: 'append', label: 'Append to existing list', defaultChecked: false },
          { id: 'dedupe', label: 'Remove duplicate terms (recommended for chains)', defaultChecked: true }
        ],
        parse(rawText, optionValues) {
          const lines = String(rawText || '').replace(/\r\n/g, '\n').split('\n');
          const items = [];
          const seen = new Set();
          const dedupe = optionValues ? optionValues.dedupe !== false : true;
          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed || trimmed.startsWith('#')) continue;
            const parts = trimmed.split(',');
            for (let part of parts) {
              part = part.trim()
                .replace(/^[-*•]\s+/, '')
                .replace(/^\d+[\).\]]\s+/, '');
              if (!part) continue;
              const key = part.toLowerCase();
              if (dedupe && seen.has(key)) continue;
              seen.add(key);
              items.push(part);
            }
          }
          const warnings = items.length > 0 && items.length < 4
            ? ['At least 4 unique items work best for classroom domino chains.']
            : [];
          return {
            items,
            warnings,
            badges: items.map(w => ({ label: w, tone: 'blue' }))
          };
        },
        onImport(result, optionValues) {
          const imported = result.items || [];
          if (!imported.length) return false;
          let finalList = imported;
          if (optionValues && optionValues.append && wordListEl.value.trim()) {
            const existing = parseList(wordListEl.value);
            finalList = [...existing, ...imported];
            if (optionValues.dedupe !== false) {
              const seen = new Set();
              finalList = finalList.filter(item => {
                const k = item.toLowerCase();
                if (seen.has(k)) return false;
                seen.add(k);
                return true;
              });
            }
          }
          wordListEl.value = finalList.join('\n');
          updateCount();
          generate();
          autoSaveIfActive();
          return true;
        }
      });

      document.getElementById('openBulkImportBtn')?.addEventListener('click', () => dominoBulkModal.open());

      window.KlassKitBulkImport.mountPresets({
        container: '#cefrPresetsSlot',
        url: 'presets.json',
        title: 'CEFR Domino Packs',
        collapsible: true,
        getMeta: (p) => ({ icon: 'puzzle', label: `${(p.words || []).length} terms` }),
        onSelect: (preset) => {
          wordListEl.value = (preset.words || []).join('\n');
          updateCount();
          generate();
          autoSaveIfActive();
        }
      });
    }
  })();
</script>
</body>
</html>
