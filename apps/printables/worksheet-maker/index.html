                <input type="text" data-action="update-sort-field" data-field="title" data-qid="${q.id}" data-catid="${cat.id}" value="${esc(cat.title)}" placeholder="Category ${idx + 1}" class="sm:w-44 bg-white dark:bg-slate-900 border-2 border-dark/25 dark:border-slate-600 rounded-lg px-2.5 py-1.5 text-xs font-black text-dark dark:text-white outline-none focus:border-blue" />
                <input type="text" data-action="update-sort-field" data-field="items" data-qid="${q.id}" data-catid="${cat.id}" value="${esc(cat.items)}" placeholder="comma, separated, answers" class="flex-1 min-w-0 bg-white dark:bg-slate-900 border-2 border-dark/25 dark:border-slate-600 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-dark dark:text-white outline-none focus:border-blue" />
                <button type="button" data-action="delete-sort-cat" data-qid="${q.id}" data-catid="${cat.id}" class="text-slate-400 hover:text-red-500 p-1 self-end sm:self-center shrink-0"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
              </div>
            `).join('')}
            <button type="button" data-action="add-sort-cat" data-qid="${q.id}" class="text-xs text-blue hover:text-blue/80 font-heading font-black uppercase tracking-wider flex items-center gap-1.5 mt-1">
              <i data-lucide="plus" class="w-4 h-4"></i> Add Category Column
            </button>
          </div>
        </div>
      `;
    }

    function getDrawingEditor(q) {
      return `
        <div class="space-y-4">
          ${getEditorTextarea('Prompt / Drawing Task', q.text, 'Draw and label your diagram in the box below:', 'update-q-text', `data-qid="${q.id}"`, 2)}
          ${getQuestionImageEditorHTML(q)}
          <div class="flex flex-wrap items-center gap-2">
            ${getModuleOptionSelectHTML('Box Height', q.id, 'boxHeight', q.boxHeight || 'md', [['sm', 'Compact'], ['md', 'Medium'], ['lg', 'Large']])}
            ${getModuleOptionSelectHTML('Canvas Surface', q.id, 'boxStyle', q.boxStyle || 'blank', [['blank', 'Blank Canvas'], ['dots', 'Dot Grid'], ['grid', 'Square Graph Grid'], ['split', 'Split (Left / Right)']])}
            ${getModuleOptionSelectHTML('Caption Lines', q.id, 'captionLines', q.captionLines ?? 2, [[0, 'None'], [1, '1 line'], [2, '2 lines'], [3, '3 lines'], [4, '4 lines']])}
          </div>
          ${getEditorTextarea('Expected Labels / Teacher Note (For Key)', q.answer || '', 'What should students draw or label?', 'update-q-ans', `data-qid="${q.id}"`, 2)}
        </div>
      `;
    }

    function getChecklistEditor(q) {
      return `
        <div class="space-y-4">
          ${getEditorTextarea('Checklist Prompt / Title', q.text, 'Self-Check before handing in your paper:', 'update-q-text', `data-qid="${q.id}"`, 2)}
          <div class="flex flex-wrap items-center gap-2">
            ${getModuleOptionSelectHTML('Marker Style', q.id, 'checkStyle', q.checkStyle || 'box', [['box', 'Checkboxes [  ]'], ['yn', 'Yes / No'], ['stars', '3-Star Rating'], ['faces', 'Smiley Self-Check']])}
          </div>
          <div class="space-y-2">
            <label class="text-xs font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest font-heading">Checklist Criteria</label>
            ${(q.items || []).map((it, idx) => `
              <div class="flex items-center gap-2">
                <span class="text-xs font-black text-slate-400 w-5 text-center">${idx + 1}.</span>
                <input type="text" data-action="update-checklist-item" data-qid="${q.id}" data-itemid="${it.id}" value="${esc(it.text)}" placeholder="Criterion ${idx + 1}" class="flex-1 min-w-0 bg-slate-50 dark:bg-slate-900 border-2 border-dark dark:border-slate-600 rounded-xl px-3 py-2 text-sm font-semibold text-dark dark:text-white outline-none focus:border-blue" />
                <button type="button" data-action="delete-checklist-item" data-qid="${q.id}" data-itemid="${it.id}" class="text-slate-400 hover:text-red-500 p-1.5 shrink-0"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
              </div>
            `).join('')}
            <button type="button" data-action="add-checklist-item" data-qid="${q.id}" class="text-xs text-blue hover:text-blue/80 font-heading font-black uppercase tracking-wider flex items-center gap-1.5 mt-1">
              <i data-lucide="plus" class="w-4 h-4"></i> Add Criterion
            </button>
          </div>
        </div>
      `;
    }

    // --- HTML Generators (Preview) ---
    function getPreviewScaleMeta() {
      const settings = getWorksheetSettings();
      const map = {
        sm: { text: 'text-sm', blockGap: 'mb-4', wrapperText: 'text-sm' },
        md: { text: 'text-base', blockGap: 'mb-7', wrapperText: 'text-base' },
        lg: { text: 'text-lg', blockGap: 'mb-9', wrapperText: 'text-lg' }
      };
      return map[settings.fontSize] || map.md;
    }

    function getWorksheetLookStyles() {
      const settings = getWorksheetSettings();
      const scale = getPreviewScaleMeta();
      const accent = WS_ACCENTS[settings.accentColor] || WS_ACCENTS.blue;
      const fontMap = {
        sans: "'Nunito', system-ui, -apple-system, sans-serif",
        serif: "'Merriweather', Georgia, Cambria, serif",
        rounded: "'Fredoka', 'Nunito', sans-serif",
        mono: "ui-monospace, 'SFMono-Regular', Menlo, monospace"
      };
      return {
        settings,
        scale,
        accent,
        theme: settings.theme || 'classic',
        isTwoCol: Number(settings.questionColumns) === 2,
        fontCss: fontMap[settings.fontFamily] || fontMap.sans
      };
    }

    function getPreviewNumBadgeHTML(index, look) {
      const t = look.theme;
      if (t === 'neo') {
        return `<span class="inline-flex items-center justify-center min-w-[1.65rem] h-6 px-1.5 rounded-md font-extrabold text-xs text-white shrink-0 border border-slate-900" style="background:${look.accent.hex}">${index}</span>`;
      }
      if (t === 'modern') {
        return `<span class="inline-flex items-center justify-center min-w-[1.65rem] h-6 px-1.5 rounded-md font-bold text-xs shrink-0" style="background:${look.accent.soft}; color:${look.accent.dark}; border:1px solid ${look.accent.hex}55">${index}</span>`;
      }
      if (t === 'kids') {
        return `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full font-extrabold text-xs text-white shrink-0" style="background:${look.accent.hex}">${index}</span>`;
      }
      if (t === 'notebook') {
        return `<span class="font-extrabold underline decoration-2 shrink-0" style="text-decoration-color:${look.accent.hex}; color:${look.accent.dark}">#${index}</span>`;
      }
      if (t === 'exam') {
        return `<span class="font-bold text-slate-900 shrink-0 tabular-nums">Q${index}.</span>`;
      }
      return `<span class="font-bold text-slate-900 shrink-0">${index}.</span>`;
    }

    function getPreviewCardStyle(look) {
      const t = look.theme;
      if (t === 'neo') {
        return 'border: 2px solid #0f172a; border-radius: 12px; padding: 13px 15px; background: #ffffff; box-shadow: 0 3px 0 #0f172a;';
      }
      if (t === 'modern') {
        return `border: 1px solid #cbd5e1; border-left: 4px solid ${look.accent.hex}; border-radius: 10px; padding: 12px 14px; background: #ffffff;`;
      }
      if (t === 'kids') {
        return `border: 2px dashed ${look.accent.hex}88; border-radius: 16px; padding: 13px 15px; background: ${look.accent.soft}55;`;
      }
      if (t === 'notebook') {
        return `border-left: 3px double ${look.accent.hex}; padding: 6px 10px 10px 13px; border-bottom: 1px dashed #cbd5e1;`;
      }
      if (t === 'exam') {
        return 'border-bottom: 1px solid #cbd5e1; padding-bottom: 12px;';
      }
      return '';
    }

    function wrapPreviewQuestionBlock(index, q, promptHtml, bodyHtml) {
      const look = getWorksheetLookStyles();
      const gapCls = look.isTwoCol ? '' : look.scale.blockGap;
      const cardStyle = getPreviewCardStyle(look);
      const scoreHtml = fmtPreviewScore(q.points);
      return `
        <div class="print-block ${gapCls}" style="${cardStyle}">
          <div class="flex items-start gap-2.5">
            ${getPreviewNumBadgeHTML(index, look)}
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-baseline gap-3">
                <div class="flex-1 min-w-0">${promptHtml}</div>
                ${scoreHtml ? `<span class="text-xs font-semibold text-slate-500 shrink-0 print:text-black">${scoreHtml}</span>` : ''}
              </div>
              ${getQuestionImagePreviewHTML(q)}
              ${bodyHtml}
            </div>
          </div>
        </div>
      `;
    }

    function getQuestionText(text) {
      const scale = getPreviewScaleMeta();
      return `<div class="${scale.text} font-medium mb-2.5 whitespace-pre-wrap leading-snug">${esc(text)}</div>`;
    }

    function getQuestionImagePreviewHTML(q) {
      const src = getWsImageSrc(q && q.imageId);
      if (!src) return '';
      const clsMap = { sm: 'max-h-28', md: 'max-h-44', lg: 'max-h-64' };
      const sizeCls = clsMap[q.imageSize] || clsMap.md;
      return `<div class="my-2.5"><img src="${esc(src)}" alt="" class="${sizeCls} max-w-full object-contain rounded-lg border border-slate-200 bg-white p-1" /></div>`;
    }

    function fmtPreviewScore(pts) {
      const settings = getWorksheetSettings();
      if (!settings.showPoints) return '';
      const n = Number(pts) || 0;
      if (n <= 0) return '';
      if (settings.theme === 'exam') return `[${n} pt${n !== 1 ? 's' : ''}]`;
      return `(${n} pt${n !== 1 ? 's' : ''})`;
    }

    function getPreviewWordBankHTML() {
      const look = getWorksheetLookStyles();
      if (!look.settings.showWordBank) return '';
      const rawAnswers = [];
      const seen = new Set();
      (state.worksheet.questions || []).forEach((q) => {
        if (q.type !== 'fib' || !q.answer) return;
        const word = String(q.answer).trim();
        if (!word) return;
        const key = word.toLowerCase();
        if (!seen.has(key)) {
          seen.add(key);
          rawAnswers.push(word);
        }
      });
      if (rawAnswers.length === 0) return '';
      rawAnswers.sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
      return `
        <div class="mb-6 p-3.5 rounded-xl border-2 border-dashed" style="border-color:${look.accent.hex}; background:${look.accent.soft}">
          <div class="text-xs font-extrabold uppercase tracking-wider mb-2" style="color:${look.accent.dark}">Word Bank</div>
          <div class="flex flex-wrap gap-2">
            ${rawAnswers.map(w => `<span class="px-2.5 py-0.5 border border-slate-400 rounded-lg bg-white text-sm font-semibold text-slate-900">${esc(w)}</span>`).join('')}
          </div>
        </div>
      `;
    }

    function getMCQPreview(q, index) {
      const hasOptImg = Array.isArray(q.options) && q.options.some(o => Boolean(getWsImageSrc(o.imageId)));
      const optColMode = String(q.optColumns || 'auto');
      let layoutCls = 'flex flex-col gap-2 pl-1 mt-1.5';
      if (optColMode === '1') {
        layoutCls = 'grid grid-cols-1 gap-2 pl-1 mt-1.5';
      } else if (optColMode === '2') {
        layoutCls = 'grid grid-cols-2 gap-2.5 pl-1 mt-1.5';
      } else if (optColMode === '4') {
        layoutCls = 'grid grid-cols-2 sm:grid-cols-4 gap-2 pl-1 mt-1.5';
      } else if (hasOptImg) {
        layoutCls = 'grid grid-cols-1 sm:grid-cols-2 gap-3 pl-1 mt-1.5';
      }

      const optsHtml = `
        <div class="${layoutCls}">
          ${(q.options || []).map((opt, idx) => {
            const letter = String.fromCharCode(65 + idx);
            const isCorrect = state.showAnswers && opt.isCorrect;
            const circleCls = isCorrect ? 'border-blue-600 text-blue-700 bg-blue-50 font-bold' : 'border-slate-500 text-slate-700';
            const textCls = isCorrect ? 'text-blue-800 font-bold' : 'text-slate-800';
            const optImg = getWsImageSrc(opt.imageId);
            return `
              <div class="flex items-start gap-2.5 min-w-0">
                <span class="flex-shrink-0 w-6 h-6 rounded-full border flex items-center justify-center text-xs font-semibold ${circleCls}">${letter}</span>
                <div class="flex flex-col gap-1 pt-0.5 min-w-0">
                  ${optImg ? `<img src="${esc(optImg)}" alt="" class="max-h-24 max-w-[160px] object-contain rounded border border-slate-200 bg-white p-0.5" />` : ''}
                  ${(opt.text || !optImg) ? `<span class="${textCls} break-words">${esc(opt.text) || '...'}</span>` : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
      return wrapPreviewQuestionBlock(index, q, getQuestionText(q.text), optsHtml);
    }

    function getFIBPreview(q, index) {
      const scale = getPreviewScaleMeta();
      const rawText = String(q.text || '');
      const hasBlank = /_{3,}|\[blank\]/i.test(rawText);
      let displayHtml = esc(rawText);
      if (state.showAnswers && hasBlank) {
        displayHtml = displayHtml.replace(/_{3,}|\[blank\]/gi, `<strong class="text-blue-700 font-bold border-b-2 border-blue-600 px-1.5">${esc(q.answer) || 'Answer'}</strong>`);
      } else if (hasBlank) {
        displayHtml = displayHtml.replace(/_{3,}|\[blank\]/gi, `<span class="inline-block border-b-2 border-slate-800 min-w-[7rem] mx-1">&nbsp;</span>`);
      }

      const promptHtml = `<div class="${scale.text} font-medium leading-relaxed whitespace-pre-wrap mb-1">${displayHtml}</div>`;
      const extraLine = !hasBlank ? `
        <div class="mt-3 border-b-2 border-slate-800 w-64 h-6">
          ${state.showAnswers ? `<span class="text-blue-700 font-bold">${esc(q.answer)}</span>` : ''}
        </div>
      ` : '';

      return wrapPreviewQuestionBlock(index, q, promptHtml, extraLine);
    }

    function getSAPreview(q, index) {
      const lineCount = Math.max(1, Math.min(10, parseInt(q.lines, 10) || 2));
      const answerArea = state.showAnswers
        ? `<div class="mt-2 text-blue-700 font-semibold italic">Answer: ${esc(q.answer) || 'No answer key provided.'}</div>`
        : `<div class="mt-3 flex flex-col gap-5">${`<div class="w-full border-b border-slate-500 h-2"></div>`.repeat(lineCount)}</div>`;

      return wrapPreviewQuestionBlock(index, q, getQuestionText(q.text), answerArea);
    }

    function getTFPreview(q, index) {
      const labelsMap = {
        tf: ['True', 'False'],
        yn: ['Yes', 'No'],
        ci: ['Correct', 'Incorrect']
      };
      const [posLbl, negLbl] = labelsMap[q.tfStyle] || labelsMap.tf;
      const trueCls = (state.showAnswers && q.isTrue) ? 'border-blue-600 text-blue-700 bg-blue-50 font-bold' : 'border-slate-300 text-slate-700';
      const falseCls = (state.showAnswers && !q.isTrue) ? 'border-blue-600 text-blue-700 bg-blue-50 font-bold' : 'border-slate-300 text-slate-700';

      const bodyHtml = `
        <div class="flex flex-wrap gap-3 mt-2 text-sm font-semibold">
          <span class="px-3.5 py-0.5 rounded-full border-2 ${trueCls}">${posLbl}</span>
          <span class="px-3.5 py-0.5 rounded-full border-2 ${falseCls}">${negLbl}</span>
        </div>
        ${q.requireCorrection ? `
          <div class="mt-2.5 flex items-end gap-2 text-xs text-slate-600 font-medium">
            <span class="shrink-0">If ${negLbl}, correction:</span>
            <div class="flex-1 border-b border-slate-500 h-4"></div>
          </div>
        ` : ''}
      `;
      return wrapPreviewQuestionBlock(index, q, getQuestionText(q.text), bodyHtml);
    }

    function getMatchingPreview(q, index) {
      const look = getWorksheetLookStyles();
      const pairs = Array.isArray(q.pairs) ? q.pairs : [];
      const rightItems = [...pairs].sort((a, b) => String(a && a.id || '').localeCompare(String(b && b.id || '')));
      const labels = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
      const rightItemsWithLabels = rightItems.map((item, i) => ({ ...item, label: labels[i % labels.length] }));
      const isLineMatch = q.matchStyle === 'lines';

      const rowCardCls = look.theme === 'minimal'
        ? 'border-b border-slate-200 py-1.5 px-1'
        : look.theme === 'neo'
          ? 'border-2 border-slate-900 rounded-lg bg-white py-2 px-2.5'
          : 'border border-slate-300 rounded-lg bg-slate-50/70 py-1.5 px-2.5';

      const gridGapCls = isLineMatch
        ? (look.isTwoCol ? 'gap-x-5 gap-y-2.5' : 'gap-x-10 sm:gap-x-14 gap-y-2.5')
        : (look.isTwoCol ? 'gap-x-3 gap-y-2' : 'gap-x-5 gap-y-2');

      const imgSizeCls = look.isTwoCol
        ? 'max-h-12 max-w-[78px]'
        : 'max-h-14 max-w-[110px]';

      const rowsHtml = pairs.map((pair, idx) => {
        const rightItem = rightItemsWithLabels[idx];
        const correctRight = rightItemsWithLabels.find(r => r.id === pair.id);
        const leftImg = getWsImageSrc(pair.leftImageId);
        const rightImg = rightItem ? getWsImageSrc(rightItem.rightImageId) : '';

        const leftCell = `
          <div class="flex items-center justify-between gap-2.5 min-w-0 ${rowCardCls}">
            <div class="flex items-center gap-2 min-w-0 flex-1">
              ${!isLineMatch ? `
                <span class="inline-flex items-center justify-center w-7 h-7 rounded-md border-2 border-slate-700 bg-white text-center font-extrabold text-sm shrink-0">
                  ${state.showAnswers ? `<span class="text-blue-700 leading-none">${correctRight?.label || ''}</span>` : ''}
                </span>
              ` : ''}
              <span class="inline-flex items-center justify-center w-5 h-5 rounded-full text-[11px] font-extrabold shrink-0" style="background:${look.accent.soft}; color:#0f172a; border:1.5px solid ${look.accent.hex};">${idx + 1}</span>
              ${leftImg ? `<img src="${esc(leftImg)}" alt="" class="${imgSizeCls} object-contain rounded border border-slate-200 bg-white p-0.5 shrink-0" />` : ''}
              ${pair.left ? `<span class="font-medium leading-snug break-words min-w-0">${esc(pair.left)}</span>` : ''}
            </div>
            ${isLineMatch ? `
              <div class="flex items-center gap-1.5 shrink-0">
                ${state.showAnswers ? `<span class="text-[11px] text-blue-700 font-extrabold px-1.5 py-0.5 rounded bg-blue-50 border border-blue-200">→ ${correctRight?.label || ''}</span>` : ''}
                <span class="w-3 h-3 rounded-full border-2 border-slate-800 inline-block bg-white shrink-0"></span>
              </div>
            ` : ''}
          </div>
        `;

        const rightCell = rightItem ? `
          <div class="flex items-center gap-2.5 min-w-0 ${rowCardCls}">
            ${isLineMatch ? `<span class="w-3 h-3 rounded-full border-2 border-slate-800 inline-block bg-white shrink-0"></span>` : ''}
            <span class="inline-flex items-center justify-center w-5 h-5 rounded-md text-[11px] font-extrabold shrink-0 bg-slate-100 text-slate-800 border border-slate-400">${rightItem.label}</span>
            ${rightImg ? `<img src="${esc(rightImg)}" alt="" class="${imgSizeCls} object-contain rounded border border-slate-200 bg-white p-0.5 shrink-0" />` : ''}
            ${rightItem.right ? `<span class="font-medium leading-snug break-words min-w-0">${esc(rightItem.right)}</span>` : ''}
          </div>
        ` : '<div></div>';

        return `
          <div class="grid grid-cols-2 ${gridGapCls} items-stretch print-block">
            ${leftCell}
            ${rightCell}
          </div>
        `;
      }).join('');

      const bodyHtml = `<div class="flex flex-col gap-2 w-full mt-3">${rowsHtml}</div>`;
      return wrapPreviewQuestionBlock(index, q, getQuestionText(q.text || 'Match the following items:'), bodyHtml);
    }

    function getEssayPreview(q, index) {
      const count = Math.max(1, parseInt(q.lines, 10) || 5);
      const style = q.lineStyle || 'ruled';
      let surfaceHtml = '';

      if (state.showAnswers) {
        surfaceHtml = `
          <div class="mt-3 border border-blue-200 bg-blue-50 text-blue-800 p-3.5 rounded-lg text-sm whitespace-pre-wrap">
            <strong class="block mb-1 text-blue-900 uppercase text-xs tracking-wider">Teacher Rubric / Expected Elements:</strong>
            ${esc(q.answer) || 'No rubric provided.'}
          </div>
        `;
      } else if (style === 'primary') {
        const band = `
          <div class="w-full relative" style="height:30px; border-top:1px solid #94a3b8; border-bottom:1.5px solid #475569;">
            <div style="position:absolute; left:0; right:0; top:50%; border-top:1px dashed #cbd5e1;"></div>
          </div>
        `;
        surfaceHtml = `<div class="mt-3 flex flex-col gap-2.5 w-full">${band.repeat(count)}</div>`;
      } else if (style === 'box') {
        const h = Math.max(76, count * 26);
        surfaceHtml = `<div class="mt-3 w-full rounded-lg border-2 border-slate-500 bg-white" style="height:${h}px"></div>`;
      } else if (style === 'grid') {
        const h = Math.max(96, count * 26);
        surfaceHtml = `<div class="mt-3 w-full rounded-lg border-2 border-slate-500" style="height:${h}px; background-color:#ffffff; background-image:linear-gradient(to right,#cbd5e1 1px,transparent 1px),linear-gradient(to bottom,#cbd5e1 1px,transparent 1px); background-size:20px 20px;"></div>`;
      } else {
        const lineHtml = `<div class="w-full border-b border-slate-400 h-2"></div>`.repeat(count);
        surfaceHtml = `<div class="mt-4 flex flex-col gap-5 w-full">${lineHtml}</div>`;
      }

      return wrapPreviewQuestionBlock(index, q, getQuestionText(q.text), surfaceHtml);
    }

    function getSectionPreview(q) {
      const look = getWorksheetLookStyles();
      const spanCls = look.isTwoCol ? 'col-span-full' : '';
      let frameStyle = `border-bottom: 2.5px solid ${look.accent.hex}; padding: 8px 4px;`;
      if (look.theme === 'neo') {
        frameStyle = `border: 2px solid #0f172a; background: ${look.accent.soft}; border-radius: 10px; padding: 10px 14px; box-shadow: 0 3px 0 #0f172a;`;
      } else if (look.theme === 'modern') {
        frameStyle = `border-left: 5px solid ${look.accent.hex}; background: ${look.accent.soft}; border-radius: 0 8px 8px 0; padding: 10px 14px;`;
      } else if (look.theme === 'kids') {
        frameStyle = `border: 2px dashed ${look.accent.hex}; background: ${look.accent.soft}; border-radius: 14px; padding: 10px 16px;`;
      } else if (look.theme === 'exam') {
        frameStyle = 'border-top: 2px solid #0f172a; border-bottom: 1.5px solid #0f172a; background: #f1f5f9; padding: 8px 12px;';
      }
      return `
        <div class="print-block ${spanCls} mt-2 mb-3" style="${frameStyle}">
          <div class="font-extrabold text-lg tracking-wide uppercase" style="color:${look.accent.dark}">${esc(q.text || 'SECTION')}</div>
          ${q.subtitle ? `<div class="text-sm text-slate-600 mt-0.5 font-medium">${esc(q.subtitle)}</div>` : ''}
          ${getQuestionImagePreviewHTML(q)}
        </div>
      `;
    }

    function getPassagePreview(q) {
      const look = getWorksheetLookStyles();
      const spanCls = look.isTwoCol ? 'col-span-full' : '';
      const style = q.boxStyle || 'card';
      const lines = String(q.text || '').split(/\r?\n/);

      const bodyLines = q.showLineNumbers
        ? lines.map((ln, idx) => `<div class="flex gap-3"><span class="text-xs text-slate-400 font-mono w-5 text-right shrink-0 select-none pt-0.5">${idx + 1}</span><span class="flex-1 whitespace-pre-wrap">${esc(ln) || '&nbsp;'}</span></div>`).join('')
        : `<div class="whitespace-pre-wrap leading-relaxed">${esc(q.text)}</div>`;

      let boxStyleCss = 'border: 1.5px solid #94a3b8; border-radius: 12px; background: #f8fafc; padding: 14px 16px;';
      if (style === 'grammar') {
        boxStyleCss = `border: 2px solid ${look.accent.hex}; border-radius: 12px; background: ${look.accent.soft}; padding: 14px 16px;`;
      } else if (style === 'dialogue') {
        boxStyleCss = `border-left: 4px solid ${look.accent.hex}; background: #f8fafc; border-radius: 0 10px 10px 0; padding: 12px 16px;`;
      } else if (style === 'plain') {
        boxStyleCss = 'border-top: 1.5px solid #94a3b8; border-bottom: 1.5px solid #94a3b8; padding: 12px 6px;';
      }

      return `
        <div class="print-block ${spanCls} ${look.scale.blockGap}" style="${boxStyleCss}">
          ${q.title ? `<div class="text-xs font-extrabold uppercase tracking-wider mb-2 pb-1.5 border-b border-slate-300/80" style="color:${look.accent.dark}">${esc(q.title)}</div>` : ''}
          <div class="${look.scale.text} text-slate-800">${bodyLines}</div>
          ${getQuestionImagePreviewHTML(q)}
        </div>
      `;
    }

    function getUnscramblePreview(q, index) {
      const look = getWorksheetLookStyles();
      const rowsHtml = (q.items || []).map((it, idx) => {
        const subLbl = String.fromCharCode(97 + (idx % 26));
        return `
          <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3 py-1.5">
            <div class="flex items-center flex-wrap gap-2 min-w-0">
              <span class="font-bold text-slate-700 text-sm">${subLbl}.</span>
              <span class="font-mono font-bold text-sm px-2.5 py-0.5 rounded-lg border border-slate-300 bg-slate-50 text-slate-900">${esc(it.scrambled || '...')}</span>
              ${it.hint ? `<span class="text-xs italic text-slate-500">(${esc(it.hint)})</span>` : ''}
            </div>
            <div class="flex-1 min-w-[140px] border-b-2 border-slate-700 h-6 flex items-end pb-0.5">
              ${state.showAnswers ? `<span class="text-sm font-bold" style="color:${look.accent.dark}">${esc(it.answer)}</span>` : ''}
            </div>
          </div>
        `;
      }).join('');
      return wrapPreviewQuestionBlock(index, q, getQuestionText(q.text || 'Unscramble the words:'), `<div class="space-y-1 mt-1">${rowsHtml}</div>`);
    }

    function getSortPreview(q, index) {
      const look = getWorksheetLookStyles();
      const cats = Array.isArray(q.categories) ? q.categories : [];
      const colCount = Math.min(4, Math.max(2, cats.length));
      const pool = [];
      cats.forEach(cat => {
        String(cat.items || '').split(',').map(s => s.trim()).filter(Boolean).forEach(item => pool.push(item));
      });
      pool.sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));

      const poolHtml = pool.length > 0 ? `
        <div class="mb-3 p-2.5 rounded-lg border border-dashed flex flex-wrap gap-1.5 items-center" style="border-color:${look.accent.hex}; background:${look.accent.soft}">
          <span class="text-[11px] font-extrabold uppercase tracking-wider mr-1" style="color:${look.accent.dark}">Pool:</span>
          ${pool.map(w => `<span class="px-2 py-0.5 bg-white border border-slate-400 rounded text-xs font-semibold text-slate-900">${esc(w)}</span>`).join('')}
        </div>
      ` : '';

      const gridHtml = `
        ${poolHtml}
        <div class="grid gap-0 border-2 border-slate-800 rounded-lg overflow-hidden mt-2" style="grid-template-columns: repeat(${colCount}, minmax(0, 1fr));">
          ${cats.map((cat, idx) => {
            const catItems = String(cat.items || '').split(',').map(s => s.trim()).filter(Boolean);
            const rowCount = Math.max(3, catItems.length);
            return `
              <div class="${idx < cats.length - 1 ? 'border-r border-slate-800' : ''} flex flex-col">
                <div class="px-2.5 py-2 text-center font-extrabold text-sm border-b-2 border-slate-800" style="background:${look.accent.soft}; color:${look.accent.dark}">${esc(cat.title || `Category ${idx + 1}`)}</div>
                <div class="p-2.5 flex-1 flex flex-col justify-between gap-4 bg-white min-h-[110px]">
                  ${state.showAnswers
                    ? `<div class="text-sm font-semibold text-blue-700 space-y-1">${catItems.map(w => `<div>• ${esc(w)}</div>`).join('') || '<span class="italic text-slate-400">—</span>'}</div>`
                    : `<div class="w-full border-b border-slate-300 h-4"></div>`.repeat(rowCount)}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
      return wrapPreviewQuestionBlock(index, q, getQuestionText(q.text || 'Sort the items into the categories:'), gridHtml);
    }

    function getDrawingPreview(q, index) {
      const hMap = { sm: 110, md: 185, lg: 265 };
      const h = hMap[q.boxHeight] || 185;
      const style = q.boxStyle || 'blank';
      let canvasBg = 'background:#ffffff;';
      if (style === 'dots') {
        canvasBg = 'background-color:#ffffff; background-image:radial-gradient(#94a3b8 1.25px, transparent 1.25px); background-size:16px 16px;';
      } else if (style === 'grid') {
        canvasBg = 'background-color:#ffffff; background-image:linear-gradient(to right,#e2e8f0 1px,transparent 1px),linear-gradient(to bottom,#e2e8f0 1px,transparent 1px); background-size:18px 18px;';
      }
      const splitInner = style === 'split'
        ? `<div class="w-full h-full grid grid-cols-2"><div class="border-r-2 border-dashed border-slate-400 h-full"></div><div class="h-full"></div></div>`
        : '';
      const capCount = Math.max(0, Math.min(6, parseInt(q.captionLines, 10) || 0));
      const captionHtml = capCount > 0
        ? `<div class="mt-3 flex flex-col gap-5">${`<div class="w-full border-b border-slate-500 h-2"></div>`.repeat(capCount)}</div>`
        : '';
      const keyNote = (state.showAnswers && q.answer)
        ? `<div class="mt-2 text-xs font-semibold text-blue-700 bg-blue-50 border border-blue-200 rounded px-2.5 py-1.5">Key / Labels: ${esc(q.answer)}</div>`
        : '';

      const bodyHtml = `
        <div class="mt-2 w-full rounded-xl border-2 border-slate-700 overflow-hidden" style="height:${h}px; ${canvasBg}">${splitInner}</div>
        ${keyNote}
        ${captionHtml}
      `;
      return wrapPreviewQuestionBlock(index, q, getQuestionText(q.text || 'Draw and label below:'), bodyHtml);
    }

    function getChecklistPreview(q, index) {
      const style = q.checkStyle || 'box';
      const renderMarker = () => {
        if (style === 'yn') {
          return `<span class="text-xs font-semibold text-slate-600 whitespace-nowrap border border-slate-400 rounded px-2 py-0.5">Yes / No</span>`;
        }
        if (style === 'stars') {
          return `<span class="text-sm tracking-widest text-slate-600 whitespace-nowrap">☆ ☆ ☆</span>`;
        }
        if (style === 'faces') {
          return `
            <span class="inline-flex items-center gap-1.5 text-slate-600 shrink-0" aria-hidden="true">
              <span class="w-4 h-4 rounded-full border border-slate-600 inline-flex items-center justify-center text-[9px] font-bold">☺</span>
              <span class="w-4 h-4 rounded-full border border-slate-600 inline-flex items-center justify-center text-[9px] font-bold">·</span>
              <span class="w-4 h-4 rounded-full border border-slate-600 inline-flex items-center justify-center text-[9px] font-bold">☹</span>
            </span>
          `;
        }
        return `<span class="w-4 h-4 rounded border-2 border-slate-700 inline-block shrink-0 bg-white"></span>`;
      };

      const rowsHtml = `
        <div class="mt-2 divide-y divide-slate-200 border border-slate-300 rounded-lg bg-white overflow-hidden">
          ${(q.items || []).map(it => `
            <div class="flex items-center justify-between gap-3 px-3 py-2 text-sm text-slate-800">
              <span class="flex-1">${esc(it.text)}</span>
              ${renderMarker()}
            </div>
          `).join('')}
        </div>
      `;
      return wrapPreviewQuestionBlock(index, q, getQuestionText(q.text || 'Checklist:'), rowsHtml);
    }

    // --- Zoom & Sidebar UI State ---
    let currentZoomMode = localStorage.getItem('worksheet_zoom') || '1';
    let sidebarCollapsed = false;
    let rightSidebarCollapsed = false;

    function setPreviewZoom(mode) {
      currentZoomMode = String(mode);
      try { localStorage.setItem('worksheet_zoom', currentZoomMode); } catch (e) {}
      applyPreviewZoom();
    }

    function applyPreviewZoom() {
      const wrapper = document.getElementById('a4-zoom-wrapper');
      const sheetPane = document.getElementById('print-sheet-container');
      const area = document.getElementById('previewArea');
      if (wrapper) {
        let zoomVal = 1;
        if (currentZoomMode === 'fit') {
          const host = (sheetPane && sheetPane.clientWidth > 0) ? sheetPane : area;
          const availW = host ? Math.max(240, host.clientWidth - 40) : 794;
          zoomVal = Math.min(1, Math.max(0.35, +(availW / 810).toFixed(2)));
        } else if (state.viewMode === 'split') {
          // If Split View is active and 100% would overflow horizontally, still honor explicit zoom
          zoomVal = parseFloat(currentZoomMode) || 1;
        } else {
          zoomVal = parseFloat(currentZoomMode) || 1;
        }
        wrapper.style.zoom = String(zoomVal);
      }
      ['0.5', '0.75', '1', 'fit'].forEach((k) => {
        const btn = document.getElementById(`zoom-${k}`);
        if (!btn) return;
        const active = currentZoomMode === k;
        btn.classList.toggle('bg-brand-blue', active);
        btn.classList.toggle('text-white', active);
        btn.classList.toggle('text-slate-600', !active);
        btn.classList.toggle('dark:text-slate-300', !active);
      });
    }

    function toggleSidebar() {
      sidebarCollapsed = !sidebarCollapsed;
      const aside = document.getElementById('ws-sidebar');
      if (aside) {
        if (window.innerWidth < 768) {
          aside.classList.toggle('hidden', sidebarCollapsed);
        } else {
          aside.classList.toggle('hidden-panel-desktop', sidebarCollapsed);
        }
        setTimeout(() => applyPreviewZoom(), 260);
      }
    }

    function toggleRightSidebar() {
      rightSidebarCollapsed = !rightSidebarCollapsed;
      const aside = document.getElementById('ws-right-sidebar');
      if (aside) {
        if (window.innerWidth < 768) {
          aside.classList.toggle('hidden', rightSidebarCollapsed);
        } else {
          aside.classList.toggle('hidden-panel-desktop', rightSidebarCollapsed);
        }
        setTimeout(() => applyPreviewZoom(), 260);
      }
    }

    // --- Main Rendering (Card Maker Architecture) ---
    function getQuestionCardTone(type) {
      const map = {
        mcq: 'text-pink bg-pink/10 border-pink/30',
        fib: 'text-orange bg-orange/10 border-orange/30',
        sa: 'text-blue bg-blue/10 border-blue/30',
        tf: 'text-green bg-green/10 border-green/30',
        matching: 'text-indigo-500 bg-indigo-500/10 border-indigo-500/30',
        essay: 'text-purple-500 bg-purple-500/10 border-purple-500/30',
        unscramble: 'text-amber-600 bg-amber-500/10 border-amber-500/30',
        sort: 'text-teal-600 bg-teal-500/10 border-teal-500/30',
        drawing: 'text-rose-500 bg-rose-500/10 border-rose-500/30',
        checklist: 'text-emerald-600 bg-emerald-500/10 border-emerald-500/30',
        passage: 'text-sky-600 bg-sky-500/10 border-sky-500/30',
        section: 'text-slate-700 bg-slate-500/15 border-slate-500/30 dark:text-slate-200'
      };
      return map[type] || map.sa;
    }

    function getModuleButtonsByGroup(groups, layout = 'sidebar') {
      const items = Object.values(QUESTION_TYPES).filter(t => groups.includes(t.group));
      if (layout === 'tray') {
        return items.map(t => `
          <button type="button" data-action="add-question" data-type="${t.id}" class="btn-chunky bg-white dark:bg-slate-700 hover:bg-slate-50 dark:hover:bg-slate-600 text-dark dark:text-white px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5">
            <i data-lucide="${t.icon}" class="w-3.5 h-3.5 text-blue"></i>
            <span>${t.label}</span>
          </button>
        `).join('');
      }
      return items.map(t => `
        <button type="button" data-action="add-question" data-type="${t.id}" class="btn-chunky bg-white dark:bg-slate-700 hover:bg-slate-50 dark:hover:bg-slate-600 text-dark dark:text-white py-2 px-2 rounded-xl text-[10px] flex items-center justify-start gap-1.5 text-left">
          <i data-lucide="${t.icon}" class="w-3.5 h-3.5 text-blue shrink-0"></i>

      `).join('');
    }

    function getPageFrameStyle(look) {
      const borderMode = look.settings.pageBorder || 'none';
      const fontRule = `font-family:${look.fontCss}; min-height:256mm; display:flex; flex-direction:column;`;
      if (borderMode === 'simple') return `${fontRule} border:2px solid ${look.accent.hex}; border-radius:10px; padding:14px 16px;`;
      if (borderMode === 'double') return `${fontRule} border:5px double ${look.accent.hex}; border-radius:8px; padding:14px 16px;`;
      if (borderMode === 'dashed') return `${fontRule} border:2.5px dashed ${look.accent.hex}; border-radius:16px; padding:14px 16px;`;
      if (borderMode === 'neo') return `${fontRule} border:3px solid #0f172a; border-radius:14px; padding:16px 18px; box-shadow:5px 5px 0 ${look.accent.hex};`;
      return fontRule;
    }

      const scoreBadge = s.showTotalScore
        ? `<span class="text-xs font-extrabold border px-2.5 py-0.5 rounded shrink-0" style="border-color:${look.accent.hex}; background:${look.accent.soft}; color:${look.accent.dark};">Total: ${totalPts} pts</span>`

        return `

              ${s.showTotalScore ? `<span class="text-xs font-extrabold px-2.5 py-1 rounded-lg border border-white/60 bg-black/15 text-white shrink-0">Total: ${totalPts} pts</span>` : ''}

            ${s.showHeaderFields ? `
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm font-medium pb-2 border-b border-slate-300">
                <div class="flex gap-1.5 sm:col-span-2"><span>Name:</span><div class="flex-1 border-b border-slate-700"></div></div>

                <div class="flex gap-1.5 items-end"><span>Score:</span><div class="flex-1 border-b border-slate-700 text-right text-xs text-slate-600 print:text-black">${s.showTotalScore ? `/ ${totalPts}` : ''}</div></div>

            ` : ''}
          </div>

      if (hStyle === 'boxed') {
        return `
          <div class="mb-5 p-4 rounded-xl bg-white" style="border:2px solid ${look.theme === 'neo' ? '#0f172a' : look.accent.hex};">
            <div class="flex items-baseline justify-between gap-4 ${s.showHeaderFields ? 'mb-3.5 pb-2.5 border-b border-slate-200' : ''}">

              ${!s.showHeaderFields ? scoreBadge : ''}
            </div>
            ${s.showHeaderFields ? `
              <div class="grid grid-cols-2 gap-x-6 gap-y-3 text-sm font-medium">
                <div class="flex gap-2"><span>Name:</span><div class="flex-1 border-b border-slate-700"></div></div>
                <div class="flex gap-2"><span>Date:</span><div class="flex-1 border-b border-slate-700"></div></div>
                <div class="flex gap-2"><span>Section:</span><div class="flex-1 border-b border-slate-700"></div></div>
                <div class="flex gap-2 items-end"><span>Score:</span><div class="flex-1 border-b border-slate-700 text-right text-xs text-slate-600 print:text-black">${s.showTotalScore ? `/ ${totalPts}` : ''}</div></div>

          <div class="pb-3 mb-5" style="border-bottom:2px solid ${look.accent.hex};">
            <div class="flex items-baseline justify-between gap-4 ${s.showHeaderFields ? 'mb-2.5' : ''}">
              <h1 class="text-2xl font-extrabold flex-1">${title}</h1>
              ${!s.showHeaderFields ? scoreBadge : ''}
            </div>
            ${s.showHeaderFields ? `
              <div class="grid grid-cols-4 gap-3 text-xs sm:text-sm font-medium">
                <div class="col-span-2 flex gap-1.5"><span>Name:</span><div class="flex-1 border-b border-slate-700"></div></div>
                <div class="flex gap-1.5"><span>Date:</span><div class="flex-1 border-b border-slate-700"></div></div>
                <div class="flex gap-1.5 items-end"><span>Score:</span><div class="flex-1 border-b border-slate-700 text-right text-xs text-slate-600 print:text-black">${s.showTotalScore ? `/ ${totalPts}` : ''}</div></div>

    function getA4SheetInnerHTML() {
      const look = getWorksheetLookStyles();
      const settings = look.settings;
      const scale = look.scale;
      const totalPts = getTotalPoints();

      const previewBuilders = {
        mcq: getMCQPreview,
        fib: getFIBPreview,
        sa: getSAPreview,
        tf: getTFPreview,
        matching: getMatchingPreview,
        essay: getEssayPreview,
        unscramble: getUnscramblePreview,
        sort: getSortPreview,
        drawing: getDrawingPreview,
        checklist: getChecklistPreview,
        passage: (q) => getPassagePreview(q),
        section: (q) => getSectionPreview(q)
      };

      let qNum = 0;
      const qHtml = state.worksheet.questions.map((q) => {
        const typeMeta = Object.values(QUESTION_TYPES).find(t => t.id === q.type);
        if (!(typeMeta && typeMeta.nonNumbered)) qNum += 1;
        const fn = previewBuilders[q.type];
        return fn ? fn(q, qNum) : '';
      }).join('');

      const listLayoutCls = look.isTwoCol
        ? 'grid grid-cols-1 sm:grid-cols-2 gap-4 items-start'
        : '';

      return `
        <div id="ws-page-frame" style="${getPageFrameStyle(look)}">
          ${getWorksheetHeaderHTML(look, totalPts)}

          ${state.worksheet.instructions ? `
            <div class="mb-6 p-3.5 italic text-slate-800 rounded-lg text-sm" style="background:${look.accent.soft}; border-left:4px solid ${look.accent.hex};">
              <strong>Instructions:</strong> ${esc(state.worksheet.instructions)}
            </div>
          ` : ''}

          ${getPreviewWordBankHTML()}

          ${state.showAnswers ? `
            <div class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 opacity-5 pointer-events-none z-0 no-print">
              <h1 class="text-[120px] font-black text-blue/30 -rotate-45 whitespace-nowrap">ANSWER KEY</h1>
            </div>
          ` : ''}

          <div class="relative z-10 ${scale.wrapperText} ${listLayoutCls}">
            ${qHtml}
          </div>

          ${state.worksheet.questions.length === 0 ? '<div class="text-center py-20 text-gray-400 italic">No modules added yet. Add a question or layout block from the sidebar or Builder view.</div>' : ''}

          <div class="kk-print-brand-footer mt-auto pt-3">
            <span class="kk-print-footer-note">${(settings.showFooter && settings.footerText) ? esc(settings.footerText) : (state.showAnswers ? 'Teacher Answer Key' : 'Printable Worksheet')}</span>
            <span class="kk-print-brand-mark">
              <span class="kk-brand-dots" aria-hidden="true">
                <span class="kk-brand-dot" style="background:#ff4785"></span>
                <span class="kk-brand-dot" style="background:#ff7e33"></span>
                <span class="kk-brand-dot" style="background:#00d063"></span>
                <span class="kk-brand-dot" style="background:#1ea7fd"></span>
              </span>
              <span>Made with <strong>KlassKit</strong></span>
            </span>
          </div>
        </div>
      `;
    }

    function refreshLivePreview() {
      const sheetInner = document.getElementById('live-a4-preview-inner');
      if (sheetInner) {
        sheetInner.innerHTML = getA4SheetInnerHTML();
      }
      const totalPts = getTotalPoints();
      const summary = `${state.worksheet.questions.length} Qs · ${totalPts} Pts`;
      const p1 = document.getElementById('ws-summary-pill');
      const p2 = document.getElementById('ws-top-summary-pill');
      if (p1) p1.textContent = summary;
      if (p2) p2.textContent = summary;
    }

        mcq: getMCQEditor,

        sa: getSAEditor,
        tf: getTFEditor,
        matching: getMatchingEditor,
        essay: getEssayEditor,
        unscramble: getUnscrambleEditor,
        sort: getSortEditor,
        drawing: getDrawingEditor,

        return `

                  ${Object.values(QUESTION_TYPES).map(t => `<option value="${t.id}" ${t.id === q.type ? 'selected' : ''}>${t.label}</option>`).join('')}

              <div class="flex items-center gap-1">
                ${isLayoutBlock ? '' : `
                  <div class="flex items-center mr-2 border-2 border-brand-dark dark:border-slate-500 rounded-lg overflow-hidden bg-white dark:bg-slate-800">
                    <span class="px-2 text-[11px] text-slate-500 dark:text-slate-400 border-r-2 border-brand-dark dark:border-slate-500 bg-slate-50 dark:bg-slate-900 font-black">Pts</span>
                    <input type="number" min="0" data-action="update-q-pts" data-qid="${q.id}" value="${q.points}" class="w-12 px-2 py-1 text-xs font-bold outline-none bg-transparent text-dark dark:text-white" />

                `}

    async function applyStarterPreset(presetId) {

            iconColor: 'blue'

      }

      activeSetId = null;
      activeSetName = null;
      loadedPresetId = preset.id;

      state.worksheet = {
        title: preset.titleText || preset.title || 'Starter Worksheet',

    function parseWorksheetImport(rawText) {
      const norm = String(rawText || '').replace(/\r\n/g, '\n');
      const rawLines = norm.split('\n');
      let parsedTitle = '';
      let parsedInstructions = '';

      // Extract leading ## Title and ? Instructions before splitting blocks
      let bodyStartIdx = 0;
      for (let i = 0; i < rawLines.length; i++) {
        const trimmed = rawLines[i].trim();
        if (!trimmed) {
          bodyStartIdx = i + 1;
          continue;
        }
        const titleM = trimmed.match(/^##+\s*(.+)$/);
        if (titleM) {
          parsedTitle = titleM[1].trim();
          bodyStartIdx = i + 1;
          continue;
        }
        const instM = trimmed.match(/^\?\s*(.+)$/);
        if (instM) {
          parsedInstructions = instM[1].trim();
          bodyStartIdx = i + 1;
          continue;
        }
        break;
      }

      const bodyText = rawLines.slice(bodyStartIdx).join('\n');
      const blocks = String(bodyText || '')
        .split(/\n(?:\s*---+\s*\n|\s*\n+)/)
        .map(b => b.replace(/^---+\s*|\s*---+$/g, '').trim())
        .filter(Boolean);
      const questions = [];
      const warnings = [];
      const badges = [];

      const typeAliases = {
        mcq: 'mcq',
        fib: 'fib',
        fill: 'fib',
        sa: 'sa',
        short: 'sa',
        tf: 'tf',
        truefalse: 'tf',
        'true/false': 'tf',
        matching: 'matching',
        match: 'matching',
        essay: 'essay'
      };

      const badgeMeta = {
        mcq: { tag: 'MCQ', tone: 'pink' },
        fib: { tag: 'FIB', tone: 'orange' },
        sa: { tag: 'SA', tone: 'slate' },
        tf: { tag: 'T/F', tone: 'green' },
        matching: { tag: 'MATCH', tone: 'blue' },
        essay: { tag: 'ESSAY', tone: 'orange' }
      };

      const isDirectiveLine = (l) => (
        /^(?:\*-|-\s+|\*\s+|=|a(?:nswer)?\s*:|~\d+(?:\s*lines?)?$|[A-Da-d][.)]\s+)/i.test(l)
        || /^.+?\s*(?:\||=>|->)\s*.+$/.test(l)
        || /^\*?\s*(?:true|false)\s*$/i.test(l)
      );

      blocks.forEach((blockText) => {
        const bLines = String(blockText || '').split('\n').map(l => l.trim()).filter(Boolean);
        if (!bLines.length) return;
        if (bLines.length === 1 && /^##+\s*(.+)$/.test(bLines[0])) {
          if (!parsedTitle) parsedTitle = bLines[0].replace(/^##+\s*/, '').trim();
          return;
        }
        if (bLines.length === 1 && /^\?\s*(.+)$/.test(bLines[0])) {
          if (!parsedInstructions) parsedInstructions = bLines[0].replace(/^\?\s*/, '').trim();
          return;
        }

        let explicitType = null;
        let points = 1;
        let essayLines = 5;
        let essayLinesExplicit = false;

        const stripHeaderTags = (str) => {
          let s = str;
          // [mcq], [fib], [fill], [tf], [sa], [matching], [essay]
          s = s.replace(/\[(mcq|fib|fill|sa|short|tf|truefalse|true\/false|matching|match|essay)\]/ig, (_, t) => {
            explicitType = typeAliases[t.toLowerCase()] || explicitType;
            return ' ';
          });
          // @2pt, @3pts, @5 or [2pt]
          s = s.replace(/(?:^|\s)@(\d+)(?:pts?)?(?=$|\s)/ig, (_, n) => {
            points = Math.max(0, parseInt(n, 10));
            return ' ';
          });
          s = s.replace(/\[(\d+)\s*pts?\]/ig, (_, n) => {
            points = Math.max(0, parseInt(n, 10));
            return ' ';
          });
          // ~4 or ~6 lines
          s = s.replace(/(?:^|\s)~(\d+)(?:\s*lines?)?(?=$|\s)/ig, (_, n) => {
            essayLines = Math.max(1, parseInt(n, 10));
            essayLinesExplicit = true;
            return ' ';
          });
          return s.replace(/\s{2,}/g, ' ').trim();
        };

        // Split prompt lines from answer/option/pair lines
        const promptParts = [];
        let splitIdx = bLines.length;
        const looksLikePair = (l) => /^.+?\s*(?:\||=>|->)\s*.+$/.test(l);
        for (let i = 0; i < bLines.length; i++) {
          if (i > 0 && isDirectiveLine(bLines[i])) {
            splitIdx = i;
            break;
          }
          const strippedProbe = stripHeaderTags(bLines[i]);
          if (i === 0 && strippedProbe && looksLikePair(strippedProbe) && (explicitType === 'matching' || bLines.slice(1).some(looksLikePair))) {
            splitIdx = 0;
            break;
          }
          // Strip optional Q numbering (1. / Q1:) on the very first line only
          let candidate = strippedProbe;
          if (i === 0) {
            candidate = candidate.replace(/^(?:Q?\d+[.)]\s+|Question\s*\d*\s*:\s*)/i, '').trim();
          }
          if (candidate) promptParts.push(candidate);
        }

        const promptText = promptParts.join('\n').trim();
        const bodyLines = bLines.slice(splitIdx);

        if (!promptText && bodyLines.length === 0) return;

        const options = [];
        const pairs = [];
        const answerParts = [];
        let tfVal = null;

        bodyLines.forEach((line) => {
          const cleanTagLine = stripHeaderTags(line);
          if (!cleanTagLine) return;

          // ~4 lines on a standalone line
          if (/^~(\d+)(?:\s*lines?)?$/i.test(cleanTagLine)) {
            const m = cleanTagLine.match(/^~(\d+)/);
            if (m) {
              essayLines = Math.max(1, parseInt(m[1], 10));
              essayLinesExplicit = true;
            }
            return;
          }

          // T/F explicit line (*true, *false, true, false, = true, = false)
          const tfM = cleanTagLine.match(/^(?:=\s*|a(?:nswer)?\s*:\s*|\*\s*)?(true|false)\s*$/i);
          if (tfM && (explicitType === 'tf' || (!cleanTagLine.startsWith('-') && options.length === 0 && pairs.length === 0))) {
            tfVal = tfM[1].toLowerCase() === 'true';
            return;
          }

          // Answer / rubric line (= Answer or A: Answer)
          const ansM = cleanTagLine.match(/^(?:=\s*|a(?:nswer)?\s*:\s*)(.*)$/i);
          if (ansM) {
            if (ansM[1].trim()) answerParts.push(ansM[1].trim());
            return;
          }

          // Matching pair line (- Left | Right, Left | Right, Left => Right, Left -> Right)
          const pairCandidate = cleanTagLine.replace(/^(?:-\s*|\*\s*|\d+[.)]\s+)/, '');
          const pairM = pairCandidate.match(/^(.+?)\s*(?:\||=>|->)\s*(.+)$/);
          if (pairM && (explicitType === 'matching' || explicitType === null)) {
            pairs.push({ id: generateId(), left: pairM[1].trim(), right: pairM[2].trim() });
            return;
          }

          // MCQ option (*- opt, - *opt, * opt, - opt, A) opt)
          const corrOptM = cleanTagLine.match(/^(?:\*-\s*|-\s*\*\s*|\*\s+)(.+)$/);
          if (corrOptM) {
            options.push({ id: generateId(), text: corrOptM[1].trim(), isCorrect: true });
            return;
          }
          const regOptM = cleanTagLine.match(/^(?:-\s+|[A-Da-d][.)]\s+)(.+)$/);
          if (regOptM) {
            let optText = regOptM[1].trim();
            let isCorr = false;
            if (/\((?:correct|✓)\)|\[(?:correct|✓)\]$/i.test(optText)) {
              isCorr = true;
              optText = optText.replace(/\s*(?:\((?:correct|✓)\)|\[(?:correct|✓)\])$/i, '').trim();
            }
            options.push({ id: generateId(), text: optText, isCorrect: isCorr });
            return;
          }

          // Continuation answer text if answer already started
          if (answerParts.length > 0) {
            answerParts.push(cleanTagLine);
          }
        });

        // Resolve final type
        let qType = explicitType;
        if (!qType) {
          if (pairs.length >= 2 || (pairs.length >= 1 && options.length === 0)) qType = 'matching';
          else if (tfVal !== null && options.length === 0) qType = 'tf';
          else if (options.length > 0) qType = 'mcq';
          else if (essayLinesExplicit) qType = 'essay';
          else if (promptText.includes('___')) qType = 'fib';
          else qType = 'sa';
        }

        const qNum = questions.length + 1;
        const ansText = answerParts.join('\n').trim();
        const qObj = {
          id: generateId(),
          type: qType,
          text: promptText || (qType === 'matching' ? 'Match the items on the left with the right.' : 'Question text'),
          points
        };

        let metaNote = '';
        if (qType === 'mcq') {
          if (options.length < 2) {
            warnings.push(`Q${qNum} (MCQ): Only ${options.length} option(s) found — add at least 2 "- Option" lines.`);
            while (options.length < 2) {
              options.push({ id: generateId(), text: `Option ${options.length + 1}`, isCorrect: false });
            }
          }
          if (!options.some(o => o.isCorrect)) {
            options[0].isCorrect = true;
            warnings.push(`Q${qNum} (MCQ): No option marked with "*" — defaulted Option A as correct.`);
          }
          qObj.options = options;
          metaNote = `${points}pt · ${options.length} opts`;
        } else if (qType === 'fib') {
          if (!qObj.text.includes('___')) {
            warnings.push(`Q${qNum} (FIB): Tip — add "___" in the prompt where the blank should appear.`);
          }
          if (!ansText) {
            warnings.push(`Q${qNum} (FIB): Missing "= Answer" key.`);
          }
          qObj.answer = ansText;
          metaNote = `${points}pt${ansText ? ` · A: ${ansText.slice(0, 20)}` : ''}`;
        } else if (qType === 'sa') {
          if (!ansText) {
            warnings.push(`Q${qNum} (Short Answer): No "= Answer" provided (students still see answer lines).`);
          }
          qObj.answer = ansText;
          metaNote = `${points}pt${ansText ? ' · key' : ''}`;
        } else if (qType === 'tf') {
          if (tfVal === null && options.length > 0) {
            const corrOpt = options.find(o => o.isCorrect);
            if (corrOpt && /^(?:true|false)$/i.test(corrOpt.text.trim())) {
              tfVal = corrOpt.text.trim().toLowerCase() === 'true';
            }
          }
          if (tfVal === null) {
            tfVal = true;
            warnings.push(`Q${qNum} (T/F): Missing "*true" or "*false" — defaulted to True.`);
          }
          qObj.isTrue = tfVal;
          metaNote = `${points}pt · ${tfVal ? 'True' : 'False'}`;
        } else if (qType === 'matching') {
          if (pairs.length < 2) {
            warnings.push(`Q${qNum} (Matching): Found ${pairs.length} pair(s) — use "Left | Right" lines.`);
            while (pairs.length < 2) pairs.push({ id: generateId(), left: '', right: '' });
          }
          qObj.pairs = pairs;
          metaNote = `${points}pt · ${pairs.length} pairs`;
        } else if (qType === 'essay') {
          qObj.lines = essayLines;
          qObj.answer = ansText;
          metaNote = `${points}pt · ${essayLines} lines`;
        }

        questions.push(qObj);
        const bm = badgeMeta[qType] || { tag: qType.toUpperCase(), tone: 'slate' };
        badges.push({
          tag: bm.tag,
          label: qObj.text.split('\n')[0],
          meta: metaNote,
          tone: bm.tone,
          title: qObj.text
        });
      });

      return {
        items: questions,
        warnings,
        badges,
        title: parsedTitle,
        instructions: parsedInstructions
      };
    }

            { id: 'appendMode', label: 'Append to current questions (instead of replacing worksheet)', defaultChecked: false },
            { id: 'saveToLibrary', label: 'Also save worksheet to Saved Worksheets library', defaultChecked: false }
          ],
          confirmText: 'Import Questions',
          parse: parseWorksheetImport,
          onImport: async (result, opts) => {
            if (!result || !Array.isArray(result.items) || result.items.length === 0) return false;
            const importedQs = result.items;

            if (opts.appendMode) {
              if (result.title && (!state.worksheet.title || state.worksheet.title === 'Untitled Worksheet' || state.worksheet.title === 'Weekly Quiz: Science & Humanities')) {
                state.worksheet.title = result.title;
              }
              if (result.instructions && !state.worksheet.instructions) {
                state.worksheet.instructions = result.instructions;
              }
              state.worksheet.questions = [...state.worksheet.questions, ...importedQs];
            } else {
              activeSetId = null;
              activeSetName = null;
              loadedPresetId = null;
              state.worksheet = {
                title: result.title || 'Imported Worksheet',
                instructions: result.instructions || 'Please read each question carefully and provide the best possible answer.',
                questions: normalizeWorksheetState({ questions: importedQs }, { forceNewIds: true }).worksheet.questions,
                settings: getWorksheetSettings()
              };
            }

            state.viewMode = 'edit';
            state.showAnswers = false;

            if (opts.saveToLibrary) {
              const saveName = (state.worksheet.title || 'Imported Worksheet').slice(0, 100);
              const stateData = {
                activeSetId: opts.appendMode ? activeSetId : null,
                viewMode: state.viewMode,
                showAnswers: state.showAnswers,
                worksheet: state.worksheet
              };
              const newId = await saveWorksheetSetToDB(saveName, stateData, opts.appendMode ? activeSetId : null);
              if (newId) {
                activeSetId = newId;
                activeSetName = saveName;
                allSets = await getAllWorksheetSets();
              }
            }

            saveState();
            render();
            return true;
          }
        });
      }
      worksheetBulkModal.open();
    }

    function render(scrollToBottom = false) {
      const prevSidebarScroll = document.getElementById('sidebar-scroll-body')?.scrollTop || 0;
      const prevRightSidebarScroll = document.getElementById('right-sidebar-scroll-body')?.scrollTop || 0;
      const prevAreaScroll = document.getElementById('previewArea')?.scrollTop || 0;
      const prevSetsScroll = document.getElementById('sets-list')?.scrollTop || 0;

      document.getElementById('app').innerHTML = `${getSidebarHTML()}${getWorkspaceHTML()}${getRightSidebarHTML()}`;
      lucide.createIcons();

      renderLibrary();
      updateActiveIndicator();
      applyPreviewZoom();

      const sidebarScrollEl = document.getElementById('sidebar-scroll-body');
      const rightSidebarScrollEl = document.getElementById('right-sidebar-scroll-body');
      const areaEl = document.getElementById('previewArea');
      const setsEl = document.getElementById('sets-list');
      if (sidebarScrollEl) sidebarScrollEl.scrollTop = prevSidebarScroll;
      if (rightSidebarScrollEl) rightSidebarScrollEl.scrollTop = prevRightSidebarScroll;
      if (setsEl) setsEl.scrollTop = prevSetsScroll;

      if (scrollToBottom && areaEl) {
        setTimeout(() => {
          areaEl.scrollTo({ top: areaEl.scrollHeight, behavior: 'smooth' });
        }, 40);
      } else if (areaEl) {
        areaEl.scrollTop = prevAreaScroll;
      }
    }

    // --- Global Event Delegation (Non-rendering updates) ---
    // Handle typing events without re-rendering to prevent losing focus
    document.addEventListener('input', (e) => {
      const el = e.target;
      const action = el.dataset.action;
      if (!action) return;

      if (action === 'update-ws-title') {
        state.worksheet.title = el.value;
        document.querySelectorAll('[data-action="update-ws-title"]').forEach(other => {
          if (other !== el) other.value = el.value;
        });
      }
      if (action === 'update-ws-inst') {
        state.worksheet.instructions = el.value;
        document.querySelectorAll('[data-action="update-ws-inst"]').forEach(other => {
          if (other !== el) other.value = el.value;
        });
      }
      if (action === 'update-ws-setting' && el.dataset.setting === 'footerText') {
        getWorksheetSettings().footerText = el.value;
      }

      const qid = el.dataset.qid;
      if (qid) {
        const q = state.worksheet.questions.find(q => q.id === qid);
        if (q) {
          if (action === 'update-q-text') q.text = el.value;
          if (action === 'update-q-pts') q.points = Math.max(0, parseInt(el.value, 10) || 0);
          if (action === 'update-q-ans') q.answer = el.value;
          if (action === 'update-q-lines') q.lines = Math.max(1, parseInt(el.value, 10) || 1);

          if (action === 'update-q-field') {
            const field = el.dataset.field;
            if (field === 'subtitle' || field === 'title') q[field] = el.value;
          }

          if (action === 'update-mcq-text' && Array.isArray(q.options)) {
            const opt = q.options.find(o => o.id === el.dataset.optid);
            if (opt) opt.text = el.value;
          }
          if (action === 'update-match-left' && Array.isArray(q.pairs)) {
            const pair = q.pairs.find(p => p.id === el.dataset.pairid);
            if (pair) pair.left = el.value;
          }
          if (action === 'update-match-right' && Array.isArray(q.pairs)) {
            const pair = q.pairs.find(p => p.id === el.dataset.pairid);
            if (pair) pair.right = el.value;
          }
          if (action === 'update-unscramble-field' && Array.isArray(q.items)) {
            const field = el.dataset.field;
            const item = q.items.find(it => it.id === el.dataset.itemid);
            if (item && ['scrambled', 'answer', 'hint'].includes(field)) item[field] = el.value;
          }
          if (action === 'update-sort-field' && Array.isArray(q.categories)) {
            const field = el.dataset.field;
            const cat = q.categories.find(c => c.id === el.dataset.catid);
            if (cat && (field === 'title' || field === 'items')) cat[field] = el.value;
          }
          if (action === 'update-checklist-item' && Array.isArray(q.items)) {
            const item = q.items.find(it => it.id === el.dataset.itemid);
            if (item) item.text = el.value;
          }
        }
      }
      refreshLivePreview();
      saveState();
    });

    // Handle structural UI updates (checkboxes, radios, selects)
    document.addEventListener('change', (e) => {
      const el = e.target;
      const action = el.dataset.action;
      if (!action) return;

      const qid = el.dataset.qid;
      const q = qid ? state.worksheet.questions.find(q => q.id === qid) : null;

      if (action === 'change-q-type' && qid) {
        changeQuestionType(qid, el.value);
        return;
      }
      if (action === 'update-ws-setting') {
        const key = el.dataset.setting;
        const settings = getWorksheetSettings();
        if (key === 'fontSize' && ['sm', 'md', 'lg'].includes(el.value)) {
          settings.fontSize = el.value;
        } else if (key === 'fontFamily' && ['sans', 'serif', 'rounded', 'mono'].includes(el.value)) {
          settings.fontFamily = el.value;
        } else if (key === 'headerStyle' && ['standard', 'boxed', 'compact', 'banner'].includes(el.value)) {
          settings.headerStyle = el.value;
        } else if (key === 'pageBorder' && ['none', 'simple', 'double', 'dashed', 'neo'].includes(el.value)) {
          settings.pageBorder = el.value;
        } else if (['showHeaderFields', 'showTotalScore', 'showPoints', 'showWordBank'].includes(key)) {
          settings[key] = Boolean(el.checked);
        } else if (key === 'showFooter') {
          settings.showFooter = Boolean(el.checked);
          saveState();
          render();
          return;
        }
        refreshLivePreview();
        saveState();
        return;
      }
      if (action === 'update-q-field' && q) {
        const field = el.dataset.field;
        if (field === 'optColumns' && ['auto', '1', '2', '4'].includes(el.value)) {
          q.optColumns = el.value;
        } else if (field === 'lines') {
          q.lines = Math.max(1, Math.min(20, parseInt(el.value, 10) || 2));
        } else if (field === 'tfStyle' && ['tf', 'yn', 'ci'].includes(el.value)) {
          q.tfStyle = el.value;
          saveState();
          render();
          return;
        } else if (field === 'requireCorrection') {
          q.requireCorrection = Boolean(el.checked);
        } else if (field === 'matchStyle' && ['letters', 'lines'].includes(el.value)) {
          q.matchStyle = el.value;
        } else if (field === 'lineStyle' && ['ruled', 'primary', 'box', 'grid'].includes(el.value)) {
          q.lineStyle = el.value;
        } else if (field === 'boxStyle') {
          if (q.type === 'passage' && ['card', 'plain', 'grammar', 'dialogue'].includes(el.value)) q.boxStyle = el.value;
          if (q.type === 'drawing' && ['blank', 'dots', 'grid', 'split'].includes(el.value)) q.boxStyle = el.value;
        } else if (field === 'showLineNumbers') {
          q.showLineNumbers = Boolean(el.checked);
        } else if (field === 'boxHeight' && ['sm', 'md', 'lg'].includes(el.value)) {
          q.boxHeight = el.value;
        } else if (field === 'captionLines') {
          q.captionLines = Math.max(0, Math.min(6, parseInt(el.value, 10) || 0));
        } else if (field === 'checkStyle' && ['box', 'yn', 'stars', 'faces'].includes(el.value)) {
          q.checkStyle = el.value;
        }
        refreshLivePreview();
        saveState();
        return;
      }
      if (action === 'set-mcq-correct' && q) {
        q.options.forEach(o => o.isCorrect = (o.id === el.dataset.optid));
        refreshLivePreview();
      }
      if (action === 'set-tf' && q) {
        q.isTrue = el.dataset.val === 'true';
        refreshLivePreview();
      }
      if (action === 'toggle-answers') {
        state.showAnswers = el.checked;
        render();
      }
      saveState();
    });

    document.getElementById('ws-hidden-json-input')?.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (file) await handleImportJsonFile(file);
    });

    // Handle clicks that cause structural DOM changes
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      
      const action = btn.dataset.action;
      const qid = btn.dataset.qid;
      
      switch (action) {
        case 'set-ws-look': {
          const key = btn.dataset.setting;
          const val = btn.dataset.val;
          const settings = getWorksheetSettings();
          if (key === 'theme' && WS_LOOK_THEMES[val]) {
            settings.theme = val;
          } else if (key === 'accentColor' && WS_ACCENTS[val]) {
            settings.accentColor = val;
          } else if (key === 'questionColumns') {
            settings.questionColumns = (val === '2') ? 2 : 1;
          }
          saveState();
          render();
          break;
        }
        case 'auto-scramble-items':
          autoScrambleQuestion(qid);
          break;
        case 'add-unscramble-item': {
          const qUns = state.worksheet.questions.find(q => q.id === qid);
          if (qUns) {
            if (!Array.isArray(qUns.items)) qUns.items = [];
            qUns.items.push({ id: generateId(), scrambled: '', answer: '', hint: '' });
            saveState();
            render();
          }
          break;
        }
        case 'delete-unscramble-item': {
          const qUns = state.worksheet.questions.find(q => q.id === qid);
          if (qUns && Array.isArray(qUns.items)) {
            qUns.items = qUns.items.filter(it => it.id !== btn.dataset.itemid);
            saveState();
            render();
          }
          break;
        }
        case 'add-sort-cat': {
          const qSort = state.worksheet.questions.find(q => q.id === qid);
          if (qSort) {
            if (!Array.isArray(qSort.categories)) qSort.categories = [];
            qSort.categories.push({ id: generateId(), title: `Category ${qSort.categories.length + 1}`, items: '' });
            saveState();
            render();
          }
          break;
        }
        case 'delete-sort-cat': {
          const qSort = state.worksheet.questions.find(q => q.id === qid);
          if (qSort && Array.isArray(qSort.categories)) {
            qSort.categories = qSort.categories.filter(c => c.id !== btn.dataset.catid);
            saveState();
            render();
          }
          break;
        }
        case 'add-checklist-item': {
          const qChk = state.worksheet.questions.find(q => q.id === qid);
          if (qChk) {
            if (!Array.isArray(qChk.items)) qChk.items = [];
            qChk.items.push({ id: generateId(), text: '' });
            saveState();
            render();
          }
          break;
        }
        case 'delete-checklist-item': {
          const qChk = state.worksheet.questions.find(q => q.id === qid);
          if (qChk && Array.isArray(qChk.items)) {
            qChk.items = qChk.items.filter(it => it.id !== btn.dataset.itemid);
            saveState();
            render();
          }
          break;
        }
        case 'add-question':
          addQuestion(btn.dataset.type);
          break;
        case 'duplicate-question':
          duplicateQuestion(qid);
          break;
        case 'delete-question':
          (async () => {
            const confirmed = await showConfirmModal("Delete this question?", {
              title: "Delete Question?",
              confirmText: "Delete",
              cancelText: "Keep",
              icon: "trash-2",
              iconColor: "red"
            });
            if (confirmed) {
              state.worksheet.questions = state.worksheet.questions.filter(q => q.id !== qid);
              saveState();
              render();
            }
          })();
          break;
        case 'move-up':
          moveQuestion(qid, 'up');
          break;
        case 'move-down':
          moveQuestion(qid, 'down');
          break;
        case 'export-json':
          exportWorksheetJSON();

        case 'add-mcq-opt': {

          if (qMcq) {

            render();

            render();

        }
        case 'add-match-pair': {
          const qMatch = state.worksheet.questions.find(q => q.id === qid);
          if (qMatch) {
            qMatch.pairs.push({ id: generateId(), left: '', right: '', leftImageId: '', rightImageId: '' });
            saveState();
            render();

              saveState();

        case 'set-q-img-size': {
          const qTarget = state.worksheet.questions.find(q => q.id === qid);
          if (qTarget && ['sm', 'md', 'lg'].includes(btn.dataset.size)) {
            qTarget.imageSize = btn.dataset.size;
            saveState();
            render();
          }
          break;
        }
        case 'upload-opt-image': {
          const qMcq = state.worksheet.questions.find(q => q.id === qid);
          const opt = qMcq && qMcq.options.find(o => o.id === btn.dataset.optid);
          if (opt) {
            pickWorksheetImage((imgId) => {
              opt.imageId = imgId;
              saveState();
              render();
            });
          }
          break;
        }
        case 'remove-opt-image': {
          const qMcq = state.worksheet.questions.find(q => q.id === qid);
          const opt = qMcq && qMcq.options.find(o => o.id === btn.dataset.optid);
          if (opt) {
            opt.imageId = '';
            saveState();
            render();
          }
          break;
        }
        case 'upload-match-image': {
          const qMatch = state.worksheet.questions.find(q => q.id === qid);
          const pair = qMatch && qMatch.pairs.find(p => p.id === btn.dataset.pairid);
          const side = btn.dataset.side === 'right' ? 'rightImageId' : 'leftImageId';
          if (pair) {
            pickWorksheetImage((imgId) => {
              pair[side] = imgId;
              saveState();
              render();
            });
          }
          break;
        }
        case 'remove-match-image': {
          const qMatch = state.worksheet.questions.find(q => q.id === qid);
          const pair = qMatch && qMatch.pairs.find(p => p.id === btn.dataset.pairid);
          const side = btn.dataset.side === 'right' ? 'rightImageId' : 'leftImageId';
          if (pair) {
            pair[side] = '';
            saveState();
            render();
          }
          break;
        }
        case 'set-view-mode':
          if (['edit', 'split', 'preview'].includes(btn.dataset.mode)) {
            state.viewMode = btn.dataset.mode;
            saveState();
            render();
            const area = document.getElementById('previewArea');
            if (area) area.scrollTop = 0;
          }
          break;
        case 'set-answer-mode':
          state.showAnswers = btn.dataset.ans === 'true';
          saveState();
          render();
          break;
        case 'toggle-sidebar':
          toggleSidebar();
          break;
        case 'toggle-right-sidebar':
          toggleRightSidebar();
          break;
        case 'set-view-preview':
          state.showAnswers = false;
          state.viewMode = 'preview';
          saveState();
          render();
          break;
        case 'set-view-edit':
          state.viewMode = 'edit';
          saveState();
          render();
          break;
        case 'toggle-theme': {
          const isDark = document.documentElement.classList.toggle('dark');
          localStorage.setItem('theme_worksheet-maker', isDark ? 'dark' : 'light');
          render();
          break;
        }
        case 'open-bulk-import':
          openWorksheetBulkImport();
          break;
        case 'toggle-presets-drawer':
          starterPresetsOpen = !starterPresetsOpen;
          render();
          break;
        case 'filter-presets':
          starterPresetFilter = btn.dataset.level || 'ALL';
          render();
          break;
        case 'load-starter-preset':
          applyStarterPreset(btn.dataset.presetId);
          break;
        case 'print':
          window.print();
          break;
      }
    });

    window.addEventListener('resize', () => {
      if (state.viewMode !== 'edit') applyPreviewZoom();
    });

    // --- Init ---
    (async () => {
      if (typeof requireAuth === 'function') {
        await requireAuth();
      }
      await Promise.all([loadState(), fetchStarterPresets()]);
      await hydrateWorksheetImages();
      if (!state.worksheet || !Array.isArray(state.worksheet.questions)) {
        state.worksheet = {
          title: (state.worksheet && state.worksheet.title) || 'Untitled Worksheet',
          instructions: (state.worksheet && state.worksheet.instructions) || 'Please read each question carefully and provide the best possible answer.',
          questions: [],
          settings: { ...DEFAULT_WS_SETTINGS }
        };
      } else {
        state.worksheet.settings = normalizeWorksheetSettings(state.worksheet.settings);
      }
      render();
    })();
  </script>
</body>
</html>
