<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worksheet Maker - Universal Worksheet Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Merriweather:wght@400;700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../../../components/input-modal.js"></script>
  <script src="../../../components/bulk-import-modal.js"></script>
  <link rel="stylesheet" href="../../../css/tailwind.generated.css">
  <link rel="stylesheet" href="../../../css/base.css">
  <link rel="stylesheet" href="../../../css/components.css">
  <link rel="stylesheet" href="../../../css/klasskit-print.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.4"></script>
  <script src="/supabase.js"></script>
  <script>
    // Theme sync with system/localStorage
    function syncTheme() {
      const toolTheme = localStorage.getItem('theme_worksheet-maker');
      const hubTheme = localStorage.getItem('theme_hub');
      if (toolTheme === 'dark' || (!toolTheme && hubTheme === 'dark') || (!toolTheme && !hubTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }
    syncTheme();
    window.addEventListener('storage', (e) => {
      if (e.key === 'theme_hub' || e.key === 'theme_worksheet-maker') {
        syncTheme();
      }
    });
  </script>
  <link rel="stylesheet" href="./style.css?v=2">
  <script defer src="/js/analytics.js"></script>
</head>
<body class="flex flex-col md:flex-row min-h-screen md:h-screen md:overflow-hidden text-brand-dark dark:text-white transition-colors duration-300">

  <div id="app" class="w-full flex-1 flex flex-col md:flex-row min-w-0 min-h-0"></div>
  <input type="file" id="ws-hidden-image-input" accept="image/*" class="hidden">
  <input type="file" id="ws-hidden-json-input" accept=".json,application/json" class="hidden">

  <script src="./js/state.js?v=2"></script>
  <script src="./js/editors.js?v=2"></script>
  <script src="./js/preview.js?v=2"></script>
  <script src="./js/render.js?v=2"></script>
  <script src="./js/presets.js?v=2"></script>
  <script src="./script.js?v=2"></script>
</body>
</html>
