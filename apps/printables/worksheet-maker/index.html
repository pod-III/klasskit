<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worksheet Maker - Universal Worksheet Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../../../components/input-modal.js"></script>
  <script src="../../../components/bulk-import-modal.js"></script>
  <link rel="stylesheet" href="../../../css/tailwind.generated.css">
  <link rel="stylesheet" href="../../../css/base.css">
  <link rel="stylesheet" href="../../../css/components.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.4"></script>
  <script src="/supabase.js"></script>
  <script>
    // Theme sync with system/localStorage
    function syncTheme() {
      const toolTheme = localStorage.getItem('theme_worksheet-maker');
      const hubTheme = localStorage.getItem('theme_hub');
      if (toolTheme === 'dark' || (!toolTheme && hubTheme === 'dark') || (!toolTheme && !hubTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }
    syncTheme();
    window.addEventListener('storage', (e) => {
      if (e.key === 'theme_hub' || e.key === 'theme_worksheet-maker') {
        syncTheme();
      }
    });
  </script>
  <style>
    @media print {
      body { background: white !important; margin: 0; padding: 0; }
      .no-print { display: none !important; }
      .print-container { 
        width: 100% !important; 
        max-width: 100% !important;
        margin: 0 !important; 
        padding: 0 !important; 
        box-shadow: none !important; 
        background: transparent !important;
      }
      .print-block {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      @page { size: auto; margin: 15mm; }
    }
    
    /* Smooth fade in */
    .fade-in {
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="text-slate-900 dark:text-white font-body min-h-screen transition-colors">

  <div id="app"></div>
  <input type="file" id="ws-hidden-image-input" accept="image/*" class="hidden">

  <script>
    // --- State & Config ---
    const generateId = () => Math.random().toString(36).substr(2, 9);
    
    // Simple HTML escaper to prevent breakage in strings
    const esc = str => (str || '').toString().replace(/[&<>'"]/g, 
      tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag)
    );

    const QUESTION_TYPES = {
      MCQ: { id: 'mcq', label: 'Multiple Choice', icon: 'check-square' },
      FIB: { id: 'fib', label: 'Fill in the Blank', icon: 'type' },
      SA: { id: 'sa', label: 'Short Answer', icon: 'align-left' },
      TF: { id: 'tf', label: 'True / False', icon: 'check-circle' },
      MATCHING: { id: 'matching', label: 'Matching', icon: 'split-square-horizontal' },
      ESSAY: { id: 'essay', label: 'Essay / Long Answer', icon: 'file-edit' },
    };

    let state = {
      viewMode: 'edit', // 'edit' | 'preview'
      showAnswers: false,
      worksheet: {
        title: 'Untitled Worksheet',
        instructions: 'Please read each question carefully and provide the best possible answer.',
        questions: []
      }
    };

    // ── IndexedDB for Worksheet Sets & Images ──────────────────────────────────
    const DB_NAME = 'klasskit_worksheet_db';
    const DB_VERSION = 2;
    const STORE_SETS = 'worksheet_sets';
    const STORE_IMAGES = 'worksheet_images';
    const wsImageCache = new Map();
    let dbInstance = null;

    function initDB() {
      return new Promise((resolve, reject) => {
        if (dbInstance) return resolve(dbInstance);
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_SETS)) {
            db.createObjectStore(STORE_SETS, { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains(STORE_IMAGES)) {
            db.createObjectStore(STORE_IMAGES);
          }
        };
        request.onsuccess = (e) => {
          dbInstance = e.target.result;
          resolve(dbInstance);
        };
        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function saveWsImageToDB(id, dataUrl) {
      if (!id || !dataUrl) return;
      wsImageCache.set(id, dataUrl);
      try {
        const localDb = await initDB();
        await new Promise((resolve, reject) => {
          const tx = localDb.transaction(STORE_IMAGES, 'readwrite');
          const req = tx.objectStore(STORE_IMAGES).put(dataUrl, id);
          req.onsuccess = () => resolve();
          req.onerror = (e) => reject(e.target.error);
        });
      } catch (err) {
        console.warn('[WorksheetImageDB] save failed:', err);
      }
    }

    async function loadWsImageFromDB(id) {
      if (!id) return null;
      if (wsImageCache.has(id)) return wsImageCache.get(id);
      try {
        const localDb = await initDB();
        const val = await new Promise((resolve, reject) => {
          const tx = localDb.transaction(STORE_IMAGES, 'readonly');
          const req = tx.objectStore(STORE_IMAGES).get(id);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = (e) => reject(e.target.error);
        });
        if (val) wsImageCache.set(id, val);
        return val;
      } catch (err) {
        console.warn('[WorksheetImageDB] load failed:', err);
        return null;
      }
    }

    async function deleteWsImageFromDB(id) {
      if (!id) return;
      wsImageCache.delete(id);
      try {
        const localDb = await initDB();
        await new Promise((resolve) => {
          const tx = localDb.transaction(STORE_IMAGES, 'readwrite');
          tx.objectStore(STORE_IMAGES).delete(id);
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        });
      } catch (err) {}
    }

    function getWsImageSrc(imageId) {
      if (!imageId) return '';
      if (wsImageCache.has(imageId)) return wsImageCache.get(imageId);
      if (/^(https?:|data:)/i.test(imageId)) return imageId;
      return '';
    }

    function compressWsImageFile(file, maxDim = 900) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith('image/')) {
          reject(new Error('Invalid image file'));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Failed to read image'));
        reader.onload = (ev) => {
          const img = new Image();
          img.onerror = () => reject(new Error('Failed to decode image'));
          img.onload = () => {
            let w = img.naturalWidth || img.width || maxDim;
            let h = img.naturalHeight || img.height || maxDim;
            if (w > maxDim || h > maxDim) {
              const ratio = Math.min(maxDim / w, maxDim / h);
              w = Math.max(1, Math.round(w * ratio));
              h = Math.max(1, Math.round(h * ratio));
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            let out = '';
            try {
              out = canvas.toDataURL('image/webp', 0.88);
              if (!out.startsWith('data:image/webp')) out = canvas.toDataURL('image/png');
            } catch (e) {
              out = canvas.toDataURL('image/png');
            }
            resolve(out);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function hydrateWorksheetImages() {
      const ids = new Set();
      const qs = (state.worksheet && state.worksheet.questions) || [];
      qs.forEach((q) => {
        if (q && q.imageId && !/^(https?:|data:)/i.test(q.imageId) && !wsImageCache.has(q.imageId)) {
          ids.add(q.imageId);
        }
        if (Array.isArray(q && q.options)) {
          q.options.forEach((o) => {
            if (o && o.imageId && !/^(https?:|data:)/i.test(o.imageId) && !wsImageCache.has(o.imageId)) {
              ids.add(o.imageId);
            }
          });
        }
        if (Array.isArray(q && q.pairs)) {
          q.pairs.forEach((p) => {
            if (p && p.leftImageId && !/^(https?:|data:)/i.test(p.leftImageId) && !wsImageCache.has(p.leftImageId)) {
              ids.add(p.leftImageId);
            }
            if (p && p.rightImageId && !/^(https?:|data:)/i.test(p.rightImageId) && !wsImageCache.has(p.rightImageId)) {
              ids.add(p.rightImageId);
            }
          });
        }
      });
      if (ids.size === 0) return false;
      await Promise.all(Array.from(ids).map((id) => loadWsImageFromDB(id)));
      return true;
    }

    let pendingWsImageHandler = null;
    function pickWorksheetImage(onImageSaved) {
      pendingWsImageHandler = onImageSaved;
      const inp = document.getElementById('ws-hidden-image-input');
      if (inp) inp.click();
    }

    document.getElementById('ws-hidden-image-input')?.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      const handler = pendingWsImageHandler;
      pendingWsImageHandler = null;
      if (!file || !handler) return;
      try {
        const dataUrl = await compressWsImageFile(file, 900);
        const imgId = 'wsimg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
        await saveWsImageToDB(imgId, dataUrl);
        handler(imgId);
      } catch (err) {
        console.warn('[WorksheetImage] Upload failed:', err);
        alert('Could not process that image file.');
      }
    });

    // ── Cloud Set Management (Following card-maker/puzzle-maker patterns) ──────
    let activeSetId = null;
    let activeSetName = null;
    let allSets = [];
    let sortMode = 'recent';

    async function saveWorksheetSetToDB(name, stateData, existingId = null) {
      if (!isSandbox()) {
        const { data: { user } } = await db.auth.getUser();
        if (!user) return null;

        const set = {
          user_id: user.id,
          name,
          state_data: typeof sanitizeCloudPayload === 'function' ? sanitizeCloudPayload(stateData) : stateData,
          last_used: new Date().toISOString()
        };

        if (existingId) {
          const { data, error } = await db.from('tools_worksheetmaker')
            .update({ name, state_data: set.state_data, last_used: set.last_used })
            .eq('id', existingId)
            .select('id').single();
          if (error) { console.error('[WorksheetSet] Update failed:', error); return null; }
          return data.id;
        } else {
          const { data, error } = await db.from('tools_worksheetmaker')
            .insert([set])
            .select('id').single();
          if (error) { console.error('[WorksheetSet] Insert failed:', error); return null; }
          return data.id;
        }
      }

      // Local IndexedDB fallback
      const localDb = await initDB();
      const tx = localDb.transaction(STORE_SETS, 'readwrite');
      const store = tx.objectStore(STORE_SETS);

      const set = {
        name,
        stateData,
        createdAt: Date.now(),
        lastUsed: Date.now(),
        usageCount: 1
      };

      if (existingId) {
        return new Promise((resolve) => {
          const req = store.get(existingId);
          req.onsuccess = () => {
            const old = req.result;
            if (old) {
              set.id = existingId;
              set.createdAt = old.createdAt || Date.now();
              set.usageCount = (old.usageCount || 0) + 1;
            }
            store.put(set);
            tx.oncomplete = () => resolve(set.id);
          };
        });
      }

      const generatedId = 'ws_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      set.id = generatedId;
      const req = store.add(set);
      return new Promise(r => {
        req.onsuccess = () => r(set.id);
      });
    }

    async function updateWorksheetSetMetadata(id, data) {
      if (!isSandbox()) {
        const updateData = {};
        if (data.lastUsed) updateData.last_used = new Date().toISOString();
        if (data.stateData) updateData.state_data = typeof sanitizeCloudPayload === 'function' ? sanitizeCloudPayload(data.stateData) : data.stateData;
        if (data.name) updateData.name = data.name;
        if (data.usageCount !== undefined) {
          updateData.usage_count = data.usageCount;
          updateData.last_used = new Date().toISOString();
        }

        const { error } = await db.from('tools_worksheetmaker').update(updateData).eq('id', id);
        if (error) console.error('[WorksheetSet] Update metadata failed:', error);
        return;
      }

      const localDb = await initDB();
      const tx = localDb.transaction(STORE_SETS, 'readwrite');
      const store = tx.objectStore(STORE_SETS);

      return new Promise((resolve) => {
        const req = store.get(id);
        req.onsuccess = () => {
          const item = req.result;
          if (item) {
            const updated = { ...item, ...data, lastUsed: Date.now() };
            if (data.usageCount !== undefined) updated.usageCount = data.usageCount;
            store.put(updated);
          }
          resolve();
        };
      });
    }

    async function getAllWorksheetSets() {
      if (!isSandbox()) {
        const { data, error } = await db.from('tools_worksheetmaker')
          .select('*')
          .order('last_used', { ascending: false });
        if (error) { console.error(error); return []; }
        return data.map(d => ({
          id: d.id,
          name: d.name,
          stateData: d.state_data,
          usageCount: d.usage_count || 0,
          lastUsed: new Date(d.last_used).getTime(),
          createdAt: new Date(d.created_at).getTime()
        }));
      }

      try {
        const localDb = await initDB();
        return new Promise((res) => {
          const r = localDb.transaction(STORE_SETS, 'readonly').objectStore(STORE_SETS).getAll();
          r.onsuccess = () => {
            let sets = r.result || [];
            sets.forEach(set => {
              if (!set.lastUsed) set.lastUsed = set.createdAt || Date.now();
              if (!set.usageCount) set.usageCount = 0;
            });
            res(sets);
          };
          r.onerror = () => res([]);
        });
      } catch (e) { return []; }
    }

    async function deleteWorksheetSet(id) {
      if (!isSandbox()) {
        const { data: { user } } = await db.auth.getUser();
        if (user) {
          await db.from('tools_worksheetmaker').delete().eq('id', id);
        }
        return;
      }

      const localDb = await initDB();
      const tx = localDb.transaction(STORE_SETS, 'readwrite');
      tx.objectStore(STORE_SETS).delete(id);
      return new Promise(r => { tx.oncomplete = r; });
    }

    let saveTimeout = null;
    async function saveState() {
      const stateToSave = {
        activeSetId,
        viewMode: state.viewMode,
        showAnswers: state.showAnswers,
        worksheet: state.worksheet
      };

      localStorage.setItem('prog_worksheet-maker', JSON.stringify(stateToSave));

      // Auto-save to library if active set
      if (activeSetId) {
        try {
          await updateWorksheetSetMetadata(activeSetId, { stateData: stateToSave });
        } catch (err) {
          console.error('[SaveState] Failed to update library metadata:', err);
        }
      }

      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        if (typeof saveProgress === 'function') {
          saveProgress('worksheet-maker', stateToSave).catch(err => {
            console.error('[Cloud Save] Error:', err);
          });
        }
      }, 1000);
    }

    async function loadState() {
      // Load library list first
      allSets = await getAllWorksheetSets();

      let saved = null;
      if (typeof loadProgress === 'function') {
        try {
          saved = await loadProgress('worksheet-maker');
        } catch (e) {}
      }
      if (!saved) {
        const local = localStorage.getItem('prog_worksheet-maker') || localStorage.getItem('worksheet-maker_state');
        if (local) {
          try {
            saved = JSON.parse(local);
          } catch (e) {}
        }
      }
      if (saved) {
        activeSetId = saved.activeSetId || null;
        state.viewMode = saved.viewMode || 'edit';
        state.showAnswers = saved.showAnswers || false;
        if (saved.worksheet) {
          state.worksheet = saved.worksheet;
        }
      }

      // Restore active set name
      if (activeSetId) {
        const activeSet = allSets.find(s => s.id === activeSetId);
        if (activeSet) {
          activeSetName = activeSet.name;
          updateActiveIndicator();
        } else {
          activeSetId = null; // Clean up stale ID
        }
      }

      await hydrateWorksheetImages();
      renderLibrary();
    }

    // ── Library Workflows (Following sets_management_pattern.md) ──────────────

    async function createNewSet() {
      state.worksheet = {
        title: 'Untitled Worksheet',
        instructions: 'Please read each question carefully and provide the best possible answer.',
        questions: []
      };
      state.viewMode = 'edit';
      state.showAnswers = false;
      activeSetId = null;
      activeSetName = null;

      const nameInput = document.getElementById('set-name-input');
      if (nameInput) nameInput.value = '';

      updateActiveIndicator();
      render();
      saveState();
    }

    async function saveCurrentSet() {
      const nameInput = document.getElementById('set-name-input');
      const name = nameInput ? nameInput.value.trim() : '';
      if (!name || name.length > 100) {
        alert('Please enter a valid worksheet set name (1-100 characters)');
        return;
      }

      const stateData = {
        activeSetId,
        viewMode: state.viewMode,
        showAnswers: state.showAnswers,
        worksheet: state.worksheet
      };

      const newId = await saveWorksheetSetToDB(name, stateData, activeSetId);
      if (newId) {
        activeSetId = newId;
        activeSetName = name;
        if (nameInput) nameInput.value = '';
        updateActiveIndicator();
        allSets = await getAllWorksheetSets();
        renderLibrary();
        alert(`Worksheet set "${name}" saved!`);
      }
    }

    async function loadSetFromList(id) {
      let stateData = null;
      let freshSet = null;

      if (!isSandbox() && typeof db !== 'undefined') {
        try {
          const { data: { user } } = await db.auth.getUser();
          if (user) {
            const { data, error } = await db.from('tools_worksheetmaker')
              .select('*')
              .eq('id', id)
              .single();
            if (data) {
              stateData = data.state_data;
              freshSet = { name: data.name, usageCount: data.usage_count || 0 };
            }
          }
        } catch (e) {}
      }

      if (!stateData) {
        const localSet = await loadSetFromLibrary(id);
        if (localSet) {
          stateData = localSet.stateData;
          freshSet = { name: localSet.name, usageCount: localSet.usageCount || 0 };
        }
      }

      if (freshSet) {
        await updateWorksheetSetMetadata(id, { usageCount: freshSet.usageCount + 1 });
      }

      if (stateData && freshSet) {
        loadWorksheetSet(stateData, id, freshSet.name);
      }
    }

    async function loadSetFromLibrary(id) {
      const localDb = await initDB();
      return new Promise((res) => {
        const tx = localDb.transaction(STORE_SETS, 'readonly');
        const store = tx.objectStore(STORE_SETS);
        const req = store.get(id);
        req.onsuccess = () => res(req.result);
        req.onerror = () => res(null);
      });
    }

    function loadWorksheetSet(stateData, id = null, name = '') {
      activeSetId = id;
      activeSetName = name;
      state.viewMode = stateData.viewMode || 'edit';
      state.showAnswers = stateData.showAnswers || false;
      if (stateData.worksheet) {
        state.worksheet = stateData.worksheet;
      }

      const nameInput = document.getElementById('set-name-input');
      if (nameInput) nameInput.value = '';

      updateActiveIndicator();
      render();
      saveState();
      hydrateWorksheetImages().then((loadedAny) => {
        if (loadedAny) render();
      });
    }

    function updateActiveIndicator() {
      const indicator = document.getElementById('active-set-indicator');
      const nameEl = document.getElementById('active-set-name');
      const saveBtn = document.getElementById('save-btn');

      if (indicator && nameEl) {
        if (activeSetId && activeSetName) {
          indicator.classList.remove('hidden');
          nameEl.textContent = activeSetName;
          if (saveBtn) saveBtn.innerHTML = '<i data-lucide="copy" class="w-3.5 h-3.5"></i> Save As';
        } else {
          indicator.classList.add('hidden');
          if (saveBtn) saveBtn.innerHTML = '<i data-lucide="save" class="w-3.5 h-3.5"></i> Save';
        }
        lucide.createIcons();
      }
    }

    function closeActiveSet() {
      activeSetId = null;
      activeSetName = null;
      updateActiveIndicator();
      renderLibrary();
    }

    function changeSetsSort() {
      const sortSelect = document.getElementById('sets-sort');
      if (sortSelect) {
        sortMode = sortSelect.value;
        renderLibrary();
      }
    }

    function renderLibrary() {
      const list = document.getElementById('sets-list');
      if (!list) return;

      let sorted = [...allSets];
      if (sortMode === 'recent') sorted.sort((a, b) => b.lastUsed - a.lastUsed);
      else if (sortMode === 'alpha') sorted.sort((a, b) => a.name.localeCompare(b.name));
      else if (sortMode === 'popular') sorted.sort((a, b) => b.usageCount - a.usageCount);

      if (sorted.length === 0) {
        list.innerHTML = '<p class="text-slate-400 dark:text-slate-500 text-[10px] italic p-2">No saved worksheets yet.</p>';
        return;
      }

      list.innerHTML = sorted.map(set => {
        const isActive = activeSetId === set.id;
        const qCount = set.stateData?.worksheet?.questions?.length || 0;
        const date = new Date(set.lastUsed).toLocaleDateString();
        return `
          <div class="flex items-center justify-between gap-2 p-2 border-2 ${isActive ? 'bg-blue/10 border-blue text-blue dark:bg-blue/20' : 'bg-slate-50 dark:bg-slate-900 border-dark/10 dark:border-slate-700 hover:border-dark/30 dark:hover:border-slate-500'} rounded-xl transition-all duration-150">
            <div class="flex items-center gap-2 cursor-pointer flex-1 min-w-0" onclick="loadSetFromList('${set.id}')">
              <div class="w-8 h-8 rounded-lg bg-blue/20 flex items-center justify-center text-blue font-bold text-xs shrink-0">
                ${qCount}
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-1.5">
                  <p class="text-xs font-bold truncate ${isActive ? 'text-blue' : 'text-slate-700 dark:text-slate-300'}">${esc(set.name)}</p>
                  ${isActive ? '<span class="px-1 py-0.5 bg-blue text-white text-[7px] font-heading font-black rounded uppercase tracking-wider">Active</span>' : ''}
                </div>
                <p class="text-[9px] text-slate-400 dark:text-slate-500">${date} • ${set.usageCount || 0} uses</p>
              </div>
            </div>
            <button onclick="event.stopPropagation(); deleteWorksheetSetPrompt('${set.id}')" class="p-1.5 text-slate-400 hover:text-red-500 dark:hover:text-red-400 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-lg transition-colors shrink-0">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    async function deleteWorksheetSetPrompt(id) {
      if (confirm('Delete this worksheet set? This cannot be undone.')) {
        await deleteWorksheetSet(id);
        if (activeSetId === id) closeActiveSet();
        allSets = await getAllWorksheetSets();
        renderLibrary();
      }
    }

    const createDefaultQuestion = (type) => {
      const base = { id: generateId(), type, text: '', points: 1, imageId: '', imageSize: 'md' };
      switch (type) {
        case 'mcq': return { ...base, options: [{ id: generateId(), text: '', isCorrect: true, imageId: '' }, { id: generateId(), text: '', isCorrect: false, imageId: '' }] };
        case 'fib': return { ...base, text: 'The capital of Japan is ___ .', answer: 'Tokyo' };
        case 'sa': return { ...base, answer: '' };
        case 'tf': return { ...base, isTrue: true };
        case 'matching': return { ...base, pairs: [{ id: generateId(), left: '', right: '', leftImageId: '', rightImageId: '' }, { id: generateId(), left: '', right: '', leftImageId: '', rightImageId: '' }] };
        case 'essay': return { ...base, lines: 5, answer: '' };
        default: return base;
      }
    };

    // --- Actions ---
    function addQuestion(type) {
      state.worksheet.questions.push(createDefaultQuestion(type));
      saveState();
      render(true); // pass true to scroll to bottom
    }

    function moveQuestion(id, dir) {
      const idx = state.worksheet.questions.findIndex(q => q.id === id);
      const qList = state.worksheet.questions;
      if (dir === 'up' && idx > 0) {
        [qList[idx - 1], qList[idx]] = [qList[idx], qList[idx - 1]];
        saveState();
        render();
      } else if (dir === 'down' && idx < qList.length - 1) {
        [qList[idx + 1], qList[idx]] = [qList[idx], qList[idx + 1]];
        saveState();
        render();
      }
    }

    // --- HTML Generators (Editor) ---
    function getEditorInput(label, value, placeholder, action, dataAttrs, type="text", cls="") {
      return `
        <div class="flex flex-col gap-1.5 ${cls}">
          ${label ? `<label class="text-xs font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest font-heading">${label}</label>` : ''}
          <input type="${type}" data-action="${action}" ${dataAttrs} class="bg-slate-50 dark:bg-slate-900 border-2 border-dark dark:border-slate-600 rounded-xl px-4.5 py-2.5 text-sm font-bold text-dark dark:text-white focus:outline-none focus:border-blue transition-all" value="${esc(value)}" placeholder="${placeholder || ''}" />
        </div>
      `;
    }

    function getEditorTextarea(label, value, placeholder, action, dataAttrs, rows=3) {
      return `
        <div class="flex flex-col gap-1.5 w-full">
          ${label ? `<label class="text-xs font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest font-heading">${label}</label>` : ''}
          <textarea data-action="${action}" ${dataAttrs} class="bg-slate-50 dark:bg-slate-900 border-2 border-dark dark:border-slate-600 rounded-xl px-4.5 py-2.5 text-sm font-bold text-dark dark:text-white focus:outline-none focus:border-blue transition-all resize-y" rows="${rows}" placeholder="${placeholder || ''}">${esc(value)}</textarea>
        </div>
      `;
    }

    function getQuestionImageEditorHTML(q) {
      const src = getWsImageSrc(q.imageId);
      if (!src) {
        return `
          <div class="flex items-center">
            <button type="button" data-action="upload-q-image" data-qid="${q.id}" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-600 text-xs font-bold text-slate-500 dark:text-slate-300 hover:border-blue hover:text-blue transition-colors">
              <i data-lucide="image-plus" class="w-4 h-4"></i> Add Image / Diagram
            </button>
          </div>
        `;
      }
      const curSize = q.imageSize || 'md';
      return `
        <div class="flex flex-wrap items-center gap-3 p-3 rounded-xl border-2 border-dark/15 dark:border-slate-600 bg-slate-50 dark:bg-slate-900">
          <img src="${esc(src)}" alt="" class="h-24 max-w-[220px] object-contain rounded-xl border-2 border-dark bg-white p-1" />
          <div class="flex flex-col gap-2">
            <div class="flex items-center gap-1">
              <span class="text-[10px] font-black uppercase tracking-wider text-slate-400 mr-1 font-heading">Size:</span>
              ${['sm', 'md', 'lg'].map(sz => `
                <button type="button" data-action="set-q-img-size" data-qid="${q.id}" data-size="${sz}" class="px-2 py-0.5 rounded-md border-2 text-[10px] font-heading font-bold uppercase ${curSize === sz ? 'bg-blue text-white border-dark' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-300 dark:border-slate-600'}">${sz === 'sm' ? 'S' : sz === 'md' ? 'M' : 'L'}</button>
              `).join('')}
            </div>
            <div class="flex items-center gap-2">
              <button type="button" data-action="upload-q-image" data-qid="${q.id}" class="px-2.5 py-1 rounded-lg bg-white dark:bg-slate-800 border-2 border-dark dark:border-slate-500 text-xs font-bold flex items-center gap-1 hover:border-blue transition-colors">
                <i data-lucide="refresh-cw" class="w-3 h-3"></i> Replace
              </button>
              <button type="button" data-action="remove-q-image" data-qid="${q.id}" class="px-2.5 py-1 rounded-lg bg-red-50 dark:bg-red-500/10 text-red-600 dark:text-red-400 border-2 border-red-200 dark:border-red-500/30 text-xs font-bold flex items-center gap-1 hover:bg-red-100 transition-colors">
                <i data-lucide="trash-2" class="w-3 h-3"></i> Remove
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function getMCQEditor(q) {
      return `
        <div class="space-y-4">
          ${getEditorTextarea('Question Text', q.text, 'What is the powerhouse of the cell?', 'update-q-text', `data-qid="${q.id}"`)}
          ${getQuestionImageEditorHTML(q)}
          <div class="space-y-3">
            <label class="text-xs font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest font-heading">Options (Check the correct one)</label>
            ${q.options.map((opt, idx) => {
              const optImg = getWsImageSrc(opt.imageId);
              return `
                <div class="flex items-center gap-2.5">
                  <input type="radio" name="mcq-${q.id}" ${opt.isCorrect ? 'checked' : ''} data-action="set-mcq-correct" data-qid="${q.id}" data-optid="${opt.id}" class="w-5 h-5 text-blue dark:bg-slate-900 border-2 border-dark focus:ring-0 shrink-0">
                  ${optImg ? `
                    <div class="relative shrink-0">
                      <img src="${esc(optImg)}" alt="" class="h-10 w-10 object-contain rounded-lg border-2 border-dark bg-white p-0.5" />
                      <button type="button" data-action="remove-opt-image" data-qid="${q.id}" data-optid="${opt.id}" title="Remove option image" class="absolute -top-1.5 -right-1.5 w-4 h-4 rounded-full bg-red-500 text-white text-[9px] font-black flex items-center justify-center border border-dark">×</button>
                    </div>
                  ` : ''}
                  <input type="text" class="flex-1 min-w-0 bg-slate-50 dark:bg-slate-900 border-2 border-dark dark:border-slate-600 rounded-xl px-3 py-2 text-sm font-semibold text-dark dark:text-white focus:border-blue outline-none" value="${esc(opt.text)}" data-action="update-mcq-text" data-qid="${q.id}" data-optid="${opt.id}" placeholder="Option ${idx + 1}">
                  <button type="button" data-action="upload-opt-image" data-qid="${q.id}" data-optid="${opt.id}" title="Attach image to option" class="p-2 rounded-xl border-2 border-slate-300 dark:border-slate-600 text-slate-500 hover:border-blue hover:text-blue transition-colors shrink-0"><i data-lucide="image-plus" class="w-4 h-4"></i></button>
                  <button type="button" data-action="delete-mcq-opt" data-qid="${q.id}" data-optid="${opt.id}" class="text-slate-400 hover:text-red-500 dark:hover:text-red-400 p-1.5 transition-colors shrink-0"><i data-lucide="trash-2" class="w-[18px] h-[18px]"></i></button>

              `;
            }).join('')}
            <button data-action="add-mcq-opt" data-qid="${q.id}" class="text-xs text-blue hover:text-blue/80 font-heading font-black uppercase tracking-wider flex items-center gap-1.5 mt-2">
              <i data-lucide="plus" class="w-4 h-4"></i> Add Option
            </button>
          </div>
        </div>
      `;
    }

    function getFIBEditor(q) {
      return `
        <div class="space-y-4">
          <div class="bg-blue/10 dark:bg-blue/5 border-2 border-blue/20 text-blue dark:text-blue-400 p-4 rounded-xl text-sm mb-4 font-semibold">
            <strong>Tip:</strong> Use three underscores (<code>___</code>) in your question text where you want the blank to appear.
          </div>
          ${getEditorTextarea('Question Text', q.text, '', 'update-q-text', `data-qid="${q.id}"`)}
          ${getQuestionImageEditorHTML(q)}
          ${getEditorInput('Correct Answer (For Key)', q.answer, 'e.g. Mitochondria', 'update-q-ans', `data-qid="${q.id}"`)}
        </div>
      `;
    }

    function getSAEditor(q) {
      return `
        <div class="space-y-4">
          ${getEditorTextarea('Question Text', q.text, '', 'update-q-text', `data-qid="${q.id}"`)}
          ${getQuestionImageEditorHTML(q)}
          ${getEditorTextarea('Correct Answer / Expected Points (For Key)', q.answer, '', 'update-q-ans', `data-qid="${q.id}"`, 2)}
        </div>
      `;
    }

    function getTFEditor(q) {
      return `
        <div class="space-y-4">
          ${getEditorTextarea('Question Text', q.text, '', 'update-q-text', `data-qid="${q.id}"`)}
          ${getQuestionImageEditorHTML(q)}
          <div>
            <label class="text-xs font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest font-heading block mb-2.5">Correct Answer</label>
            <div class="flex gap-6">
              <label class="flex items-center gap-2 cursor-pointer text-sm font-bold">
                <input type="radio" name="tf-${q.id}" ${q.isTrue ? 'checked' : ''} data-action="set-tf" data-val="true" data-qid="${q.id}" class="w-5 h-5 text-blue dark:bg-slate-900 border-2 border-dark focus:ring-0" />

              </label>
              <label class="flex items-center gap-2 cursor-pointer text-sm font-bold">
                <input type="radio" name="tf-${q.id}" ${!q.isTrue ? 'checked' : ''} data-action="set-tf" data-val="false" data-qid="${q.id}" class="w-5 h-5 text-blue dark:bg-slate-900 border-2 border-dark focus:ring-0" />
                <span>False</span>
              </label>
            </div>
          </div>
        </div>
      `;
    }

    function getMatchingEditor(q) {
      return `
        <div class="space-y-4">
          ${getEditorTextarea('Instructions / Context', q.text, 'Match the items...', 'update-q-text', `data-qid="${q.id}"`)}
          ${getQuestionImageEditorHTML(q)}
          <div class="space-y-3">
            <label class="text-xs font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest font-heading flex justify-between">
              <span>Left Side (Prompts)</span>
              <span>Right Side (Matches)</span>
            </label>
            ${q.pairs.map((pair, idx) => {
              const leftImg = getWsImageSrc(pair.leftImageId);
              const rightImg = getWsImageSrc(pair.rightImageId);
              return `
                <div class="flex flex-wrap sm:flex-nowrap items-center gap-2">
                  <div class="flex items-center gap-1.5 flex-1 min-w-0">
                    ${leftImg ? `
                      <div class="relative shrink-0">
                        <img src="${esc(leftImg)}" alt="" class="h-9 w-9 object-contain rounded-lg border-2 border-dark bg-white p-0.5" />
                        <button type="button" data-action="remove-match-image" data-side="left" data-qid="${q.id}" data-pairid="${pair.id}" title="Remove left image" class="absolute -top-1.5 -right-1.5 w-4 h-4 rounded-full bg-red-500 text-white text-[9px] font-black flex items-center justify-center border border-dark">×</button>
                      </div>
                    ` : ''}
                    <input class="flex-1 min-w-0 bg-slate-50 dark:bg-slate-900 border-2 border-dark dark:border-slate-600 rounded-xl px-3 py-2 text-sm font-semibold text-dark dark:text-white focus:border-blue outline-none" value="${esc(pair.left)}" data-action="update-match-left" data-qid="${q.id}" data-pairid="${pair.id}" placeholder="e.g. France" />
                    <button type="button" data-action="upload-match-image" data-side="left" data-qid="${q.id}" data-pairid="${pair.id}" title="Upload left image" class="p-2 rounded-xl border-2 border-slate-300 dark:border-slate-600 text-slate-500 hover:border-blue hover:text-blue transition-colors shrink-0"><i data-lucide="image-plus" class="w-3.5 h-3.5"></i></button>
                  </div>
                  <span class="text-slate-400 font-bold shrink-0">→</span>
                  <div class="flex items-center gap-1.5 flex-1 min-w-0">
                    ${rightImg ? `
                      <div class="relative shrink-0">
                        <img src="${esc(rightImg)}" alt="" class="h-9 w-9 object-contain rounded-lg border-2 border-dark bg-white p-0.5" />
                        <button type="button" data-action="remove-match-image" data-side="right" data-qid="${q.id}" data-pairid="${pair.id}" title="Remove right image" class="absolute -top-1.5 -right-1.5 w-4 h-4 rounded-full bg-red-500 text-white text-[9px] font-black flex items-center justify-center border border-dark">×</button>
                      </div>
                    ` : ''}
                    <input class="flex-1 min-w-0 bg-slate-50 dark:bg-slate-900 border-2 border-dark dark:border-slate-600 rounded-xl px-3 py-2 text-sm font-semibold text-dark dark:text-white focus:border-blue outline-none" value="${esc(pair.right)}" data-action="update-match-right" data-qid="${q.id}" data-pairid="${pair.id}" placeholder="e.g. Paris" />
                    <button type="button" data-action="upload-match-image" data-side="right" data-qid="${q.id}" data-pairid="${pair.id}" title="Upload right image" class="p-2 rounded-xl border-2 border-slate-300 dark:border-slate-600 text-slate-500 hover:border-blue hover:text-blue transition-colors shrink-0"><i data-lucide="image-plus" class="w-3.5 h-3.5"></i></button>
                  </div>
                  <button type="button" data-action="delete-match-pair" data-qid="${q.id}" data-pairid="${pair.id}" class="text-slate-400 hover:text-red-500 dark:hover:text-red-400 p-1.5 transition-colors shrink-0"><i data-lucide="trash-2" class="w-[18px] h-[18px]"></i></button>
                </div>
              `;
            }).join('')}
            <button data-action="add-match-pair" data-qid="${q.id}" class="text-xs text-blue hover:text-blue/80 font-heading font-black uppercase tracking-wider flex items-center gap-1.5 mt-2">
              <i data-lucide="plus" class="w-4 h-4"></i> Add Pair
            </button>
          </div>
        </div>
      `;
    }

    function getEssayEditor(q) {
      return `
        <div class="space-y-4">
          ${getEditorTextarea('Question Text', q.text, '', 'update-q-text', `data-qid="${q.id}"`)}
          ${getQuestionImageEditorHTML(q)}
          <div class="flex gap-4">
            ${getEditorInput('Blank Lines to Provide', q.lines, '', 'update-q-lines', `data-qid="${q.id}"`, 'number', 'w-32')}
          </div>
          ${getEditorTextarea('Grading Rubric (For Key)', q.answer, 'Key points the student must mention...', 'update-q-ans', `data-qid="${q.id}"`, 4)}
        </div>
      `;
    }

    // --- HTML Generators (Preview) ---
    function getQuestionText(text) {
      return `<div class="text-base font-medium mb-3 whitespace-pre-wrap">${esc(text)}</div>`;
    }

    function getQuestionImagePreviewHTML(q) {
      const src = getWsImageSrc(q && q.imageId);
      if (!src) return '';
      const clsMap = { sm: 'max-h-28', md: 'max-h-44', lg: 'max-h-64' };
      const sizeCls = clsMap[q.imageSize] || clsMap.md;
      return `<div class="my-2.5"><img src="${esc(src)}" alt="" class="${sizeCls} max-w-full object-contain rounded-lg border border-slate-200 bg-white p-1" /></div>`;
    }

    const fmtPreviewScore = (pts) => `(${pts} pt${pts !== 1 ? 's' : ''})`;

    function getMCQPreview(q, index) {
      const hasOptImg = Array.isArray(q.options) && q.options.some(o => Boolean(getWsImageSrc(o.imageId)));
      return `
        <div class="print-block mb-8">
          <div class="flex gap-2">
            <span class="font-bold">${index}.</span>
            <div class="flex-1">
              <div class="flex justify-between items-baseline gap-4">
                ${getQuestionText(q.text)}
                <span class="text-sm font-semibold text-gray-500 shrink-0 print:text-black">${fmtPreviewScore(q.points)}</span>
              </div>
              ${getQuestionImagePreviewHTML(q)}
              <div class="${hasOptImg ? 'grid grid-cols-1 sm:grid-cols-2 gap-3 pl-2 mt-2' : 'flex flex-col gap-2 pl-2'}">
                ${q.options.map((opt, idx) => {
                  const letter = String.fromCharCode(65 + idx);
                  const isCorrect = state.showAnswers && opt.isCorrect;
                  const circleCls = isCorrect ? 'border-blue-600 text-blue-600 bg-blue-50' : 'border-slate-400 text-slate-600';
                  const textCls = isCorrect ? 'text-blue-800 font-semibold' : 'text-slate-800';
                  const optImg = getWsImageSrc(opt.imageId);
                  return `
                    <div class="flex items-start gap-3">
                      <span class="flex-shrink-0 w-6 h-6 rounded-full border flex items-center justify-center text-sm font-medium ${circleCls}">${letter}</span>
                      <div class="flex flex-col gap-1.5 pt-0.5">
                        ${optImg ? `<img src="${esc(optImg)}" alt="" class="max-h-28 max-w-[180px] object-contain rounded border border-slate-200 bg-white p-1" />` : ''}
                        ${(opt.text || !optImg) ? `<span class="${textCls}">${esc(opt.text) || '...'}</span>` : ''}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function getFIBPreview(q, index) {
      let displayHtml = esc(q.text);
      if (state.showAnswers && q.text.includes('___')) {
        displayHtml = displayHtml.replace(/___/g, `<strong class="text-blue-600 font-bold border-b-2 border-blue-600 px-2">${esc(q.answer) || 'Answer'}</strong>`);
      } else if (q.text.includes('___')) {
        displayHtml = displayHtml.replace(/___/g, `_________________`);
      }
      
      const extraLine = !q.text.includes('___') ? `
        <div class="mt-4 border-b border-black w-64 h-6">
          ${state.showAnswers ? `<span class="text-blue-600 font-bold">${esc(q.answer)}</span>` : ''}
        </div>
      ` : '';

      return `
        <div class="print-block mb-8">
          <div class="flex gap-2">
            <span class="font-bold">${index}.</span>
            <div class="flex-1">
              <div class="flex justify-between items-baseline gap-4">
                <div class="text-base font-medium leading-relaxed">${displayHtml}</div>
                <span class="text-sm font-semibold text-gray-500 shrink-0 print:text-black">${fmtPreviewScore(q.points)}</span>
              </div>
              ${getQuestionImagePreviewHTML(q)}
              ${extraLine}
            </div>
          </div>
        </div>
      `;
    }

    function getSAPreview(q, index) {
      const answerArea = state.showAnswers ? 
        `<div class="mt-2 text-blue-600 font-medium italic">Answer: ${esc(q.answer) || 'No answer key provided.'}</div>` :
        `<div class="mt-6 flex flex-col gap-8">
          <div class="w-full border-b border-slate-400"></div>
          <div class="w-full border-b border-slate-400"></div>
          <div class="w-full border-b border-slate-400"></div>
         </div>`;

      return `
        <div class="print-block mb-8">
          <div class="flex gap-2">
            <span class="font-bold">${index}.</span>
            <div class="flex-1 w-full">
              <div class="flex justify-between items-baseline gap-4">
                ${getQuestionText(q.text)}
                <span class="text-sm font-semibold text-gray-500 shrink-0 print:text-black">${fmtPreviewScore(q.points)}</span>
              </div>
              ${getQuestionImagePreviewHTML(q)}
              ${answerArea}
            </div>
          </div>
        </div>
      `;
    }

    function getTFPreview(q, index) {
      const trueCls = (state.showAnswers && q.isTrue) ? 'border-blue-600 text-blue-700 bg-blue-50' : 'border-transparent';
      const falseCls = (state.showAnswers && !q.isTrue) ? 'border-blue-600 text-blue-700 bg-blue-50' : 'border-transparent';

      return `
        <div class="print-block mb-8">
          <div class="flex gap-2">
            <span class="font-bold">${index}.</span>
            <div class="flex-1">
              <div class="flex justify-between items-baseline gap-4">
                ${getQuestionText(q.text)}
                <span class="text-sm font-semibold text-gray-500 shrink-0 print:text-black">${fmtPreviewScore(q.points)}</span>
              </div>
              ${getQuestionImagePreviewHTML(q)}
              <div class="flex gap-6 mt-3 font-semibold text-slate-700">
                <span class="px-3 py-1 rounded-full border-2 ${trueCls}">True</span>
                <span class="px-3 py-1 rounded-full border-2 ${falseCls}">False</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function getMatchingPreview(q, index) {
      // Stable shuffle right items based on ID
      const rightItems = [...q.pairs].sort((a,b) => a.id.localeCompare(b.id));
      const labels = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
      const rightItemsWithLabels = rightItems.map((item, i) => ({ ...item, label: labels[i % labels.length] }));

      return `
        <div class="print-block mb-8">
          <div class="flex gap-2">
            <span class="font-bold">${index}.</span>
            <div class="flex-1 w-full">
              <div class="flex justify-between items-baseline gap-4">
                ${getQuestionText(q.text || 'Match the following items:')}
                <span class="text-sm font-semibold text-gray-500 shrink-0 print:text-black">${fmtPreviewScore(q.points)}</span>
              </div>
              ${getQuestionImagePreviewHTML(q)}
              <div class="flex gap-8 w-full mt-4">
                <div class="flex-1 flex flex-col gap-4 border-r border-slate-200 pr-4">
                  ${q.pairs.map((pair, idx) => {
                    const correctRight = rightItemsWithLabels.find(r => r.id === pair.id);
                    const leftImg = getWsImageSrc(pair.leftImageId);
                    return `
                      <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2">
                          <span>${idx + 1}.</span>
                          ${leftImg ? `<img src="${esc(leftImg)}" alt="" class="max-h-20 max-w-[140px] object-contain rounded border border-slate-200 bg-white p-1" />` : ''}
                          ${pair.left ? `<span>${esc(pair.left)}</span>` : ''}
                        </div>
                        <span class="w-10 border-b border-slate-800 text-center inline-block ml-4 h-6 relative top-1 shrink-0">
                          ${state.showAnswers ? `<span class="text-blue-600 font-bold leading-none">${correctRight?.label || ''}</span>` : ''}
                        </span>
                      </div>
                    `;
                  }).join('')}
                </div>
                <div class="flex-1 flex flex-col gap-4">
                  ${rightItemsWithLabels.map(item => {
                    const rightImg = getWsImageSrc(item.rightImageId);
                    return `
                      <div class="flex items-center gap-2">
                        <span class="font-semibold">${item.label}.</span>
                        ${rightImg ? `<img src="${esc(rightImg)}" alt="" class="max-h-20 max-w-[140px] object-contain rounded border border-slate-200 bg-white p-1" />` : ''}
                        ${item.right ? `<span>${esc(item.right)}</span>` : ''}
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

    function hydrateWorksheetQuestions(rawQuestions) {
      if (!Array.isArray(rawQuestions)) return [];
      return rawQuestions.map((raw) => {
        const type = ['mcq', 'fib', 'sa', 'tf', 'matching', 'essay'].includes(raw && raw.type) ? raw.type : 'sa';
        const base = {
          id: generateId(),
          type,
          text: String((raw && raw.text) || ''),
          points: typeof (raw && raw.points) === 'number' && !isNaN(raw.points) ? Math.max(0, raw.points) : 1,
          imageId: String((raw && raw.imageId) || ''),
          imageSize: ['sm', 'md', 'lg'].includes(raw && raw.imageSize) ? raw.imageSize : 'md'
        };
        if (type === 'mcq') {
          const opts = Array.isArray(raw.options) && raw.options.length > 0
            ? raw.options.map((o, idx) => ({ id: generateId(), text: String((o && o.text) || ''), isCorrect: Boolean(o && o.isCorrect) || (!raw.options.some(x => x && x.isCorrect) && idx === 0), imageId: String((o && o.imageId) || '') }))
            : [{ id: generateId(), text: 'Option A', isCorrect: true, imageId: '' }, { id: generateId(), text: 'Option B', isCorrect: false, imageId: '' }];
          return { ...base, options: opts };
        }
        if (type === 'fib' || type === 'sa') {
          return { ...base, answer: String((raw && raw.answer) || '') };
        }
        if (type === 'tf') {
          return { ...base, isTrue: raw && typeof raw.isTrue === 'boolean' ? raw.isTrue : true };
        }
        if (type === 'matching') {
          const pairs = Array.isArray(raw.pairs) && raw.pairs.length > 0
            ? raw.pairs.map(p => ({ id: generateId(), left: String((p && p.left) || ''), right: String((p && p.right) || ''), leftImageId: String((p && p.leftImageId) || ''), rightImageId: String((p && p.rightImageId) || '') }))
            : [{ id: generateId(), left: '', right: '', leftImageId: '', rightImageId: '' }, { id: generateId(), left: '', right: '', leftImageId: '', rightImageId: '' }];
          return { ...base, pairs };
        }
        if (type === 'essay') {
          return { ...base, lines: Math.max(1, parseInt(raw && raw.lines, 10) || 5), answer: String((raw && raw.answer) || '') };
        }
        return base;
      });
    }

                      ${preset.level ? `<span class="text-[9px] font-black px-1.5 py-0.5 rounded border ${toneCls}">${esc(preset.level)}</span>` : ''}
