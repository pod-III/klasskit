  <script>
    // Theme sync with system/localStorage
    function syncTheme() {
      const toolTheme = localStorage.getItem('theme_worksheet-maker');
      const hubTheme = localStorage.getItem('theme_hub');
      if (toolTheme === 'dark' || (!toolTheme && hubTheme === 'dark') || (!toolTheme && !hubTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }
    syncTheme();
    window.addEventListener('storage', (e) => {
      if (e.key === 'theme_hub' || e.key === 'theme_worksheet-maker') {
        syncTheme();
      }
    });
  </script>

<body class="flex flex-col md:flex-row min-h-screen md:h-screen md:overflow-hidden text-brand-dark dark:text-white transition-colors duration-300">

  <div id="app" class="w-full flex-1 flex flex-col md:flex-row min-w-0 min-h-0"></div>
  <input type="file" id="ws-hidden-image-input" accept="image/*" class="hidden">
  <input type="file" id="ws-hidden-json-input" accept=".json,application/json" class="hidden">

  <script>
    // --- State & Config ---
    const generateId = () => Math.random().toString(36).substr(2, 9);
    
    // Simple HTML escaper to prevent breakage in strings
    const esc = str => (str || '').toString().replace(/[&<>'"]/g, 
      tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag)
    );

    const QUESTION_TYPES = {
      MCQ: { id: 'mcq', label: 'Multiple Choice', icon: 'check-square' },
      FIB: { id: 'fib', label: 'Fill in the Blank', icon: 'type' },
      SA: { id: 'sa', label: 'Short Answer', icon: 'align-left' },
      TF: { id: 'tf', label: 'True / False', icon: 'check-circle' },
      MATCHING: { id: 'matching', label: 'Matching', icon: 'split-square-horizontal' },
      ESSAY: { id: 'essay', label: 'Essay / Long Answer', icon: 'file-edit' },
    };

    const DEFAULT_WS_SETTINGS = {
      showHeaderFields: true,
      showTotalScore: true,
      showWordBank: false,
      fontSize: 'md'
    };

    let state = {
      viewMode: 'edit', // 'edit' | 'preview'
      showAnswers: false,
      updatedAt: 0,
      worksheet: {
        title: 'Untitled Worksheet',
        instructions: 'Please read each question carefully and provide the best possible answer.',
        questions: [],
        settings: { ...DEFAULT_WS_SETTINGS }
      }
    };

    // ── IndexedDB for Worksheet Sets & Images ──────────────────────────────────
    const DB_NAME = 'klasskit_worksheet_db';
    const DB_VERSION = 2;
    const STORE_SETS = 'worksheet_sets';
    const STORE_IMAGES = 'worksheet_images';
    const wsImageCache = new Map();
    let dbInstance = null;
    let dbInitPromise = null;

    function initDB() {
      if (dbInstance) return Promise.resolve(dbInstance);
      if (dbInitPromise) return dbInitPromise;
      dbInitPromise = new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const idb = e.target.result;
          if (!idb.objectStoreNames.contains(STORE_SETS)) {
            idb.createObjectStore(STORE_SETS, { keyPath: 'id' });
          }
          if (!idb.objectStoreNames.contains(STORE_IMAGES)) {
            idb.createObjectStore(STORE_IMAGES);
          }
        };
        request.onblocked = () => {
          console.warn('[WorksheetDB] Upgrade blocked by another tab; continuing once unblocked.');
        };
        request.onsuccess = (e) => {
          dbInstance = e.target.result;
          dbInstance.onversionchange = () => {
            if (dbInstance) {
              dbInstance.close();
              dbInstance = null;
              dbInitPromise = null;
            }
          };
          resolve(dbInstance);
        };
        request.onerror = (e) => {
          dbInitPromise = null;
          reject(e.target.error);
        };
      });
      return dbInitPromise;
    }

    async function saveWsImageToDB(id, dataUrl) {
      if (!id || !dataUrl) return;
      wsImageCache.set(id, dataUrl);
      try {
        const localDb = await initDB();
        if (!localDb.objectStoreNames.contains(STORE_IMAGES)) return;
        await new Promise((resolve, reject) => {
          const tx = localDb.transaction(STORE_IMAGES, 'readwrite');
          const req = tx.objectStore(STORE_IMAGES).put(dataUrl, id);
          req.onsuccess = () => resolve();
          req.onerror = (e) => reject(e.target.error);
        });
      } catch (err) {
        console.warn('[WorksheetImageDB] save failed:', err);
      }
    }

    async function loadWsImageFromDB(id) {
      if (!id) return null;
      if (wsImageCache.has(id)) return wsImageCache.get(id);
      try {
        const localDb = await initDB();
        if (!localDb.objectStoreNames.contains(STORE_IMAGES)) return null;
        const val = await new Promise((resolve, reject) => {
          const tx = localDb.transaction(STORE_IMAGES, 'readonly');
          const req = tx.objectStore(STORE_IMAGES).get(id);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = (e) => reject(e.target.error);
        });
        if (val) wsImageCache.set(id, val);
        return val;
      } catch (err) {
        console.warn('[WorksheetImageDB] load failed:', err);
        return null;
      }
    }

    async function deleteWsImageFromDB(id) {
      if (!id) return;
      wsImageCache.delete(id);
      try {
        const localDb = await initDB();
        if (!localDb.objectStoreNames.contains(STORE_IMAGES)) return;
        await new Promise((resolve) => {
          const tx = localDb.transaction(STORE_IMAGES, 'readwrite');
          tx.objectStore(STORE_IMAGES).delete(id);
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        });
      } catch (err) {}
    }

    function isStrippedMediaToken(val) {
      return typeof val === 'string' && /^\[STRIPPED_FOR_CLOUD_SECURITY/i.test(val.trim());
    }

    function getWsImageSrc(imageId) {
      if (!imageId) return '';
      const raw = String(imageId).trim();
      if (!raw || isStrippedMediaToken(raw)) return '';
      if (wsImageCache.has(raw)) return wsImageCache.get(raw);
      if (/^(https?:|data:)/i.test(raw)) return raw;
      return '';
    }

    function compressWsImageFile(file, maxDim = 900) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith('image/')) {
          reject(new Error('Invalid image file'));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Failed to read image'));
        reader.onload = (ev) => {
          const img = new Image();
          img.onerror = () => reject(new Error('Failed to decode image'));
          img.onload = () => {
            let w = img.naturalWidth || img.width || maxDim;
            let h = img.naturalHeight || img.height || maxDim;
            if (w > maxDim || h > maxDim) {
              const ratio = Math.min(maxDim / w, maxDim / h);
              w = Math.max(1, Math.round(w * ratio));
              h = Math.max(1, Math.round(h * ratio));
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            let out = '';
            try {
              out = canvas.toDataURL('image/webp', 0.88);
              if (!out.startsWith('data:image/webp')) out = canvas.toDataURL('image/png');
            } catch (e) {
              out = canvas.toDataURL('image/png');
            }
            resolve(out);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function migrateInlineImagesToDB(worksheet) {
      const qs = (worksheet && Array.isArray(worksheet.questions)) ? worksheet.questions : [];
      let migrated = false;
      const stashIfDataUrl = async (val) => {
        if (typeof val === 'string' && /^data:image\//i.test(val.trim())) {
          const imgId = 'wsimg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
          await saveWsImageToDB(imgId, val.trim());
          migrated = true;
          return imgId;
        }
        return null;
      };

      for (const q of qs) {
        if (!q || typeof q !== 'object') continue;
        const nextQImg = await stashIfDataUrl(q.imageId);
        if (nextQImg) q.imageId = nextQImg;

        if (Array.isArray(q.options)) {
          for (const opt of q.options) {
            if (!opt || typeof opt !== 'object') continue;
            const nextOptImg = await stashIfDataUrl(opt.imageId);
            if (nextOptImg) opt.imageId = nextOptImg;
          }
        }
        if (Array.isArray(q.pairs)) {
          for (const pair of q.pairs) {
            if (!pair || typeof pair !== 'object') continue;
            const nextLeftImg = await stashIfDataUrl(pair.leftImageId);
            if (nextLeftImg) pair.leftImageId = nextLeftImg;
            const nextRightImg = await stashIfDataUrl(pair.rightImageId);
            if (nextRightImg) pair.rightImageId = nextRightImg;
          }
        }
      }
      return migrated;
    }

    async function hydrateWorksheetImages() {
      const ids = new Set();
      const qs = (state.worksheet && state.worksheet.questions) || [];
      qs.forEach((q) => {
        if (q && q.imageId && !/^(https?:|data:)/i.test(q.imageId) && !isStrippedMediaToken(q.imageId) && !wsImageCache.has(q.imageId)) {
          ids.add(q.imageId);
        }
        if (Array.isArray(q && q.options)) {
          q.options.forEach((o) => {
            if (o && o.imageId && !/^(https?:|data:)/i.test(o.imageId) && !isStrippedMediaToken(o.imageId) && !wsImageCache.has(o.imageId)) {
              ids.add(o.imageId);
            }
          });
        }
        if (Array.isArray(q && q.pairs)) {
          q.pairs.forEach((p) => {
            if (p && p.leftImageId && !/^(https?:|data:)/i.test(p.leftImageId) && !isStrippedMediaToken(p.leftImageId) && !wsImageCache.has(p.leftImageId)) {
              ids.add(p.leftImageId);
            }
            if (p && p.rightImageId && !/^(https?:|data:)/i.test(p.rightImageId) && !isStrippedMediaToken(p.rightImageId) && !wsImageCache.has(p.rightImageId)) {
              ids.add(p.rightImageId);
            }
          });
        }
      });
      if (ids.size === 0) return false;
      await Promise.all(Array.from(ids).map((id) => loadWsImageFromDB(id)));
      return true;
    }

    let pendingWsImageHandler = null;
    function pickWorksheetImage(onImageSaved) {
      pendingWsImageHandler = onImageSaved;
      const inp = document.getElementById('ws-hidden-image-input');
      if (inp) inp.click();
    }

    document.getElementById('ws-hidden-image-input')?.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      const handler = pendingWsImageHandler;
      pendingWsImageHandler = null;
      if (!file || !handler) return;
      try {
        const dataUrl = await compressWsImageFile(file, 900);
        const imgId = 'wsimg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
        await saveWsImageToDB(imgId, dataUrl);
        handler(imgId);
      } catch (err) {
        console.warn('[WorksheetImage] Upload failed:', err);
        alert('Could not process that image file.');
      }
    });

    // ── Backwards-Compatible Question & State Normalization ───────────────────
    const LEGACY_TYPE_ALIASES = {
      mcq: 'mcq',
      'multiple-choice': 'mcq',
      multiple_choice: 'mcq',
      mc: 'mcq',
      choice: 'mcq',
      fib: 'fib',
      fill: 'fib',
      'fill-in-the-blank': 'fib',
      fill_in_the_blank: 'fib',
      blank: 'fib',
      blanks: 'fib',
      cloze: 'fib',
      sa: 'sa',
      short: 'sa',
      'short-answer': 'sa',
      short_answer: 'sa',
      open: 'sa',
      text: 'sa',
      tf: 'tf',
      truefalse: 'tf',
      'true/false': 'tf',
      'true-false': 'tf',
      true_false: 'tf',
      boolean: 'tf',
      bool: 'tf',
      matching: 'matching',
      match: 'matching',
      pairs: 'matching',
      essay: 'essay',
      long: 'essay',
      'long-answer': 'essay',
      long_answer: 'essay',
      paragraph: 'essay'
    };

    function sanitizeImageRef(val) {
      if (typeof val !== 'string') return '';
      const trimmed = val.trim();
      return (!trimmed || isStrippedMediaToken(trimmed)) ? '' : trimmed;
    }

    function claimUniqueId(candidate, usedIds, forceNew = false) {
      let id = (!forceNew && candidate !== undefined && candidate !== null && String(candidate).trim())
        ? String(candidate).trim()
        : generateId();
      while (usedIds.has(id)) {
        id = generateId();
      }
      usedIds.add(id);
      return id;
    }

    function inferQuestionType(raw) {
      if (!raw || typeof raw !== 'object') return 'sa';
      const rawType = String(raw.type || '').trim().toLowerCase();
      if (LEGACY_TYPE_ALIASES[rawType]) return LEGACY_TYPE_ALIASES[rawType];
      if (Array.isArray(raw.pairs) || Array.isArray(raw.items) || Array.isArray(raw.matches)) return 'matching';
      if (Array.isArray(raw.options) || Array.isArray(raw.choices)) return 'mcq';
      if (typeof raw.isTrue === 'boolean' || typeof raw.isTrue === 'string') return 'tf';
      if (raw.lines !== undefined || raw.lineCount !== undefined || raw.rubric !== undefined) return 'essay';
      const txt = String(raw.text ?? raw.question ?? raw.prompt ?? '');
      if (/_{3,}|\[blank\]/i.test(txt)) return 'fib';
      return 'sa';
    }

    function normalizeQuestion(raw, { forceNewIds = false, usedIds = new Set() } = {}) {
      const src = (raw && typeof raw === 'object') ? raw : {};
      const type = inferQuestionType(src);
      const rawPts = src.points ?? src.score ?? src.marks;
      const parsedPts = Number(rawPts);
      const points = (rawPts !== '' && rawPts !== null && rawPts !== undefined && Number.isFinite(parsedPts))
        ? Math.max(0, parsedPts)
        : 1;

      const base = {
        id: claimUniqueId(src.id, usedIds, forceNewIds),
        type,
        text: String(src.text ?? src.question ?? src.prompt ?? ''),
        points,
        imageId: sanitizeImageRef(src.imageId || src.image || src.imageUrl || src.img || ''),
        imageSize: ['sm', 'md', 'lg'].includes(src.imageSize) ? src.imageSize : 'md'
      };

      if (type === 'mcq') {
        const rawOpts = Array.isArray(src.options)
          ? src.options
          : (Array.isArray(src.choices) ? src.choices : []);
        const opts = rawOpts.map((o, idx) => {
          if (typeof o === 'string' || typeof o === 'number') {
            const optText = String(o);
            const matchByVal = src.correctAnswer !== undefined && optText === String(src.correctAnswer);
            const matchByAns = src.answer !== undefined && optText === String(src.answer);
            const matchByIdx = typeof src.correctIndex === 'number' && src.correctIndex === idx;
            return {
              id: claimUniqueId(null, usedIds, true),
              text: optText,
              isCorrect: Boolean(matchByVal || matchByAns || matchByIdx),
              imageId: ''
            };
          }
          const optObj = (o && typeof o === 'object') ? o : {};
          const optText = String(optObj.text ?? optObj.label ?? optObj.value ?? '');
          const matchByVal = src.correctAnswer !== undefined && optText !== '' && optText === String(src.correctAnswer);
          const matchByAns = src.answer !== undefined && optText !== '' && optText === String(src.answer);
          const matchByIdx = typeof src.correctIndex === 'number' && src.correctIndex === idx;
          return {
            id: claimUniqueId(optObj.id, usedIds, forceNewIds),
            text: optText,
            isCorrect: Boolean(optObj.isCorrect ?? optObj.correct ?? (matchByVal || matchByAns || matchByIdx)),
            imageId: sanitizeImageRef(optObj.imageId || optObj.image || optObj.imageUrl || optObj.img || '')
          };
        });

        while (opts.length < 2) {
          opts.push({
            id: claimUniqueId(null, usedIds, true),
            text: opts.length === 0 ? 'Option A' : 'Option B',
            isCorrect: false,
            imageId: ''
          });
        }
        if (!opts.some(o => o.isCorrect)) {
          opts[0].isCorrect = true;
        }
        return { ...base, options: opts };
      }

      if (type === 'fib' || type === 'sa') {
        return {
          ...base,
          answer: String(src.answer ?? src.correctAnswer ?? src.expectedAnswer ?? '')
        };
      }

      if (type === 'tf') {
        let isTrue = true;
        const rawBool = src.isTrue ?? src.correct ?? src.answer;
        if (typeof rawBool === 'boolean') {
          isTrue = rawBool;
        } else if (typeof rawBool === 'string') {
          isTrue = rawBool.trim().toLowerCase() !== 'false';
        }
        return { ...base, isTrue };
      }

      if (type === 'matching') {
        const rawPairs = Array.isArray(src.pairs)
          ? src.pairs
          : (Array.isArray(src.items) ? src.items : (Array.isArray(src.matches) ? src.matches : []));
        const pairs = rawPairs.map((p) => {
          if (Array.isArray(p)) {
            return {
              id: claimUniqueId(null, usedIds, true),
              left: String(p[0] ?? ''),
              right: String(p[1] ?? ''),
              leftImageId: '',
              rightImageId: ''
            };
          }
          const pairObj = (p && typeof p === 'object') ? p : {};
          return {
            id: claimUniqueId(pairObj.id, usedIds, forceNewIds),
            left: String(pairObj.left ?? pairObj.term ?? pairObj.prompt ?? pairObj.a ?? ''),
            right: String(pairObj.right ?? pairObj.definition ?? pairObj.match ?? pairObj.b ?? ''),
            leftImageId: sanitizeImageRef(pairObj.leftImageId || pairObj.leftImage || pairObj.leftImageUrl || ''),
            rightImageId: sanitizeImageRef(pairObj.rightImageId || pairObj.rightImage || pairObj.rightImageUrl || '')
          };
        });
        while (pairs.length < 2) {
          pairs.push({ id: claimUniqueId(null, usedIds, true), left: '', right: '', leftImageId: '', rightImageId: '' });
        }
        return { ...base, pairs };
      }

      if (type === 'essay') {
        const rawLines = parseInt(src.lines ?? src.lineCount, 10);
        return {
          ...base,
          lines: Number.isFinite(rawLines) && rawLines >= 1 ? rawLines : 5,
          answer: String(src.answer ?? src.rubric ?? src.expectedAnswer ?? '')
        };
      }

      return base;
    }

    function normalizeWorksheetSettings(rawSettings) {
      const s = (rawSettings && typeof rawSettings === 'object') ? rawSettings : {};
      return {
        showHeaderFields: typeof s.showHeaderFields === 'boolean' ? s.showHeaderFields : DEFAULT_WS_SETTINGS.showHeaderFields,
        showTotalScore: typeof s.showTotalScore === 'boolean' ? s.showTotalScore : DEFAULT_WS_SETTINGS.showTotalScore,
        showWordBank: typeof s.showWordBank === 'boolean' ? s.showWordBank : DEFAULT_WS_SETTINGS.showWordBank,
        fontSize: ['sm', 'md', 'lg'].includes(s.fontSize) ? s.fontSize : DEFAULT_WS_SETTINGS.fontSize
      };
    }

    function normalizeWorksheetState(rawPayload, { forceNewIds = false } = {}) {
      const usedIds = new Set();
      let srcState = {};
      let srcWs = {};

      if (Array.isArray(rawPayload)) {
        srcWs = { questions: rawPayload };
      } else if (rawPayload && typeof rawPayload === 'object') {
        srcState = rawPayload;
        if (rawPayload.worksheet && typeof rawPayload.worksheet === 'object') {
          srcWs = rawPayload.worksheet;
        } else if (Array.isArray(rawPayload.questions) || rawPayload.title !== undefined || rawPayload.titleText !== undefined) {
          srcWs = rawPayload;
        }
      }

      const rawQs = Array.isArray(srcWs.questions) ? srcWs.questions : [];
      const normalizedQuestions = rawQs.map(q => normalizeQuestion(q, { forceNewIds, usedIds }));

      return {
        activeSetId: srcState.activeSetId || null,
        viewMode: ['edit', 'split', 'preview'].includes(srcState.viewMode) ? srcState.viewMode : 'edit',
        showAnswers: Boolean(srcState.showAnswers),
        updatedAt: typeof srcState.updatedAt === 'number' ? srcState.updatedAt : 0,
        worksheet: {
          title: typeof srcWs.title === 'string'
            ? srcWs.title
            : (typeof srcWs.titleText === 'string' ? srcWs.titleText : 'Untitled Worksheet'),
          instructions: typeof srcWs.instructions === 'string'
            ? srcWs.instructions
            : (typeof srcWs.topic === 'string' ? srcWs.topic : 'Please read each question carefully and provide the best possible answer.'),
          questions: normalizedQuestions,
          settings: normalizeWorksheetSettings(srcWs.settings)
        }
      };
    }

    // ── Cloud & Hybrid Local Set Management ───────────────────────────────────
    let activeSetId = null;
    let activeSetName = null;
    let allSets = [];
    let sortMode = 'recent';

    function checkValidUuid(id) {
      if (typeof id !== 'string') return false;
      if (typeof isValidUuid === 'function') return isValidUuid(id);
      return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id);
    }

    async function migrateLegacyLocalSetsToIDB() {
      const legacyKeys = ['worksheet-maker_sets', 'klasskit_worksheet_sets'];
      for (const key of legacyKeys) {
        const raw = localStorage.getItem(key);
        if (!raw) continue;
        try {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) {
            const localDb = await initDB();
            if (localDb.objectStoreNames.contains(STORE_SETS)) {
              const tx = localDb.transaction(STORE_SETS, 'readwrite');
              const store = tx.objectStore(STORE_SETS);
              for (const item of parsed) {
                if (!item || typeof item !== 'object') continue;
                const normalizedData = normalizeWorksheetState(item.stateData || item.state || item.worksheet || item);
                const id = String(item.id || ('ws_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8)));
                store.put({
                  id,
                  name: String(item.name || normalizedData.worksheet.title || 'Imported Set').slice(0, 100),
                  stateData: normalizedData,
                  createdAt: item.createdAt || Date.now(),
                  lastUsed: item.lastUsed || item.updatedAt || Date.now(),
                  usageCount: item.usageCount || 0
                });
              }
              await new Promise(r => { tx.oncomplete = r; tx.onerror = r; });
            }
          }
          localStorage.removeItem(key);
        } catch (err) {
          console.warn('[LegacySetsMigration] skipped key:', key, err);
        }
      }
    }

    async function saveSetLocallyToIDB(setRecord) {
      try {
        const localDb = await initDB();
        if (!localDb.objectStoreNames.contains(STORE_SETS)) return setRecord.id;
        return new Promise((resolve) => {
          const tx = localDb.transaction(STORE_SETS, 'readwrite');
          const store = tx.objectStore(STORE_SETS);
          store.put(setRecord);
          tx.oncomplete = () => resolve(setRecord.id);
          tx.onerror = () => resolve(setRecord.id);
        });
      } catch (err) {
        console.warn('[WorksheetSet] Local IDB mirror failed:', err);
        return setRecord.id;
      }
    }

    async function removeSetLocallyFromIDB(id) {
      if (!id) return;
      try {
        const localDb = await initDB();
        if (!localDb.objectStoreNames.contains(STORE_SETS)) return;
        const tx = localDb.transaction(STORE_SETS, 'readwrite');
        tx.objectStore(STORE_SETS).delete(id);
        await new Promise(r => { tx.oncomplete = r; tx.onerror = r; });
      } catch (err) {}
    }

    async function saveWorksheetSetToDB(name, stateData, existingId = null) {
      const normalizedData = normalizeWorksheetState(stateData);
      await migrateInlineImagesToDB(normalizedData.worksheet);
      normalizedData.updatedAt = Date.now();

      if (!isSandbox() && typeof db !== 'undefined') {
        try {
          const { data: { user } } = await db.auth.getUser();
          if (user) {
            const set = {
              user_id: user.id,
              name,
              state_data: typeof sanitizeCloudPayload === 'function' ? sanitizeCloudPayload(normalizedData) : normalizedData,
              last_used: new Date().toISOString()
            };

            if (existingId && checkValidUuid(existingId)) {
              const { data, error } = await db.from('tools_worksheetmaker')
                .update({ name, state_data: set.state_data, last_used: set.last_used })
                .eq('id', existingId)
                .select('id').single();
              if (!error && data) {
                await saveSetLocallyToIDB({
                  id: data.id,
                  name,
                  stateData: normalizedData,
                  createdAt: Date.now(),
                  lastUsed: Date.now(),
                  usageCount: 1
                });
                return data.id;
              }
            } else {
              const { data, error } = await db.from('tools_worksheetmaker')
                .insert([set])
                .select('id').single();
              if (!error && data) {
                if (existingId && !checkValidUuid(existingId)) {
                  await removeSetLocallyFromIDB(existingId);
                }
                await saveSetLocallyToIDB({
                  id: data.id,
                  name,
                  stateData: normalizedData,
                  createdAt: Date.now(),
                  lastUsed: Date.now(),
                  usageCount: 1
                });
                return data.id;
              }
            }
          }
        } catch (err) {
          console.error('[WorksheetSet] Cloud save error, falling back to local IndexedDB:', err);
        }
      }

      // Local IndexedDB fallback
      const localDb = await initDB();
      const tx = localDb.transaction(STORE_SETS, 'readwrite');
      const store = tx.objectStore(STORE_SETS);

      const set = {
        name,
        stateData: normalizedData,
        createdAt: Date.now(),
        lastUsed: Date.now(),
        usageCount: 1
      };

      if (existingId) {
        return new Promise((resolve) => {
          const req = store.get(existingId);
          req.onsuccess = () => {
            const old = req.result;
            if (old) {
              set.id = existingId;
              set.createdAt = old.createdAt || Date.now();
              set.usageCount = (old.usageCount || 0) + 1;
            } else {
              set.id = existingId;
            }
            store.put(set);
            tx.oncomplete = () => resolve(set.id);
          };
          req.onerror = () => {
            set.id = existingId;
            store.put(set);
            tx.oncomplete = () => resolve(set.id);
          };
        });
      }

      set.id = 'ws_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      const req = store.add(set);
      return new Promise(r => {
        req.onsuccess = () => r(set.id);
        req.onerror = () => r(null);
      });
    }

    async function updateWorksheetSetMetadata(id, data) {
      const normalizedState = data.stateData ? normalizeWorksheetState(data.stateData) : null;
      if (!isSandbox() && typeof db !== 'undefined' && checkValidUuid(id)) {
        try {
          const updateData = {};
          if (data.lastUsed) updateData.last_used = new Date().toISOString();
          if (normalizedState) {
            updateData.state_data = typeof sanitizeCloudPayload === 'function' ? sanitizeCloudPayload(normalizedState) : normalizedState;
          }
          if (data.name) updateData.name = data.name;
          if (data.usageCount !== undefined) {
            updateData.usage_count = data.usageCount;
            updateData.last_used = new Date().toISOString();
          }

          const { error } = await db.from('tools_worksheetmaker').update(updateData).eq('id', id);
          if (error) console.error('[WorksheetSet] Update metadata failed:', error);
        } catch (err) {
          console.error('[WorksheetSet] Update metadata exception:', err);
        }
      }

      try {
        const localDb = await initDB();
        if (!localDb.objectStoreNames.contains(STORE_SETS)) return;
        const tx = localDb.transaction(STORE_SETS, 'readwrite');
        const store = tx.objectStore(STORE_SETS);

        await new Promise((resolve) => {
          const req = store.get(id);
          req.onsuccess = () => {
            const item = req.result;
            if (item) {
              const updated = {
                ...item,
                ...data,
                ...(normalizedState ? { stateData: normalizedState } : {}),
                lastUsed: Date.now()
              };
              if (data.usageCount !== undefined) updated.usageCount = data.usageCount;
              store.put(updated);
            }
            resolve();
          };
          req.onerror = () => resolve();
        });
      } catch (err) {}
    }

    async function getLocalIndexedDBSets() {
      try {
        const localDb = await initDB();
        if (!localDb.objectStoreNames.contains(STORE_SETS)) return [];
        return new Promise((res) => {
          const r = localDb.transaction(STORE_SETS, 'readonly').objectStore(STORE_SETS).getAll();
          r.onsuccess = () => {
            const sets = (r.result || []).map(set => ({
              ...set,
              lastUsed: set.lastUsed || set.createdAt || Date.now(),
              usageCount: set.usageCount || 0
            }));
            res(sets);
          };
          r.onerror = () => res([]);
        });
      } catch (e) { return []; }
    }

    async function getAllWorksheetSets() {
      await migrateLegacyLocalSetsToIDB();
      const localSets = await getLocalIndexedDBSets();
      let cloudSets = [];

      if (!isSandbox() && typeof db !== 'undefined') {
        try {
          const { data, error } = await db.from('tools_worksheetmaker')
            .select('*')
            .order('last_used', { ascending: false });
          if (!error && Array.isArray(data)) {
            cloudSets = data.map(d => ({
              id: d.id,
              name: d.name,
              stateData: d.state_data,
              usageCount: d.usage_count || 0,
              lastUsed: new Date(d.last_used).getTime() || Date.now(),
              createdAt: new Date(d.created_at).getTime() || Date.now()
            }));
          } else if (error) {
            console.error('[WorksheetSet] Cloud fetch error:', error);
          }
        } catch (err) {
          console.error('[WorksheetSet] Cloud fetch exception:', err);
        }
      }

      if (cloudSets.length === 0) return localSets;

      const merged = new Map();
      localSets.forEach(s => merged.set(s.id, s));
      cloudSets.forEach(s => {
        const prev = merged.get(s.id);
        merged.set(s.id, {
          ...prev,
          ...s,
          usageCount: Math.max(s.usageCount || 0, prev ? (prev.usageCount || 0) : 0)
        });
      });
      return Array.from(merged.values());
    }

    async function deleteWorksheetSet(id) {
      if (!isSandbox() && typeof db !== 'undefined' && checkValidUuid(id)) {
        try {
          const { data: { user } } = await db.auth.getUser();
          if (user) {
            await db.from('tools_worksheetmaker').delete().eq('id', id);
          }
        } catch (err) {
          console.error('[WorksheetSet] Cloud delete error:', err);
        }
      }
      await removeSetLocallyFromIDB(id);
    }

    let saveTimeout = null;
    async function saveState() {
      const now = Date.now();
      state.updatedAt = now;
      state.worksheet.settings = normalizeWorksheetSettings(state.worksheet.settings);

      const stateToSave = {
        activeSetId,
        viewMode: state.viewMode,
        showAnswers: state.showAnswers,
        updatedAt: now,
        worksheet: state.worksheet
      };

      const serialized = JSON.stringify(stateToSave);
      try {
        localStorage.setItem('prog_worksheet-maker', serialized);
        localStorage.setItem('worksheet-maker_state', serialized);
      } catch (e) {
        console.warn('[SaveState] localStorage write failed:', e);
      }

      // Auto-save to library if active set
      if (activeSetId) {
        try {
          await updateWorksheetSetMetadata(activeSetId, { stateData: stateToSave });
        } catch (err) {
          console.error('[SaveState] Failed to update library metadata:', err);
        }
      }

      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        if (typeof saveProgress === 'function') {
          saveProgress('worksheet-maker', stateToSave).catch(err => {
            console.error('[Cloud Save] Error:', err);
          });
        }
      }, 1000);
    }

    async function loadState() {
      allSets = await getAllWorksheetSets();

      let cloudRaw = null;
      if (typeof loadProgress === 'function') {
        try {
          cloudRaw = await loadProgress('worksheet-maker');
        } catch (e) {}
      }

      let localRaw = null;
      const rawProg = localStorage.getItem('prog_worksheet-maker');
      const rawLegacy = localStorage.getItem('worksheet-maker_state');
      for (const candidate of [rawProg, rawLegacy]) {
        if (!candidate) continue;
        try {
          const parsed = JSON.parse(candidate);
          if (parsed && typeof parsed === 'object') {
            localRaw = parsed;
            break;
          }
        } catch (e) {}
      }

      const cloudNorm = cloudRaw ? normalizeWorksheetState(cloudRaw) : null;
      const localNorm = localRaw ? normalizeWorksheetState(localRaw) : null;

      let chosen = null;
      if (cloudNorm && localNorm) {
        const cloudQs = cloudNorm.worksheet.questions.length;
        const localQs = localNorm.worksheet.questions.length;
        if (cloudQs === 0 && localQs > 0) {
          chosen = localNorm;
        } else if (localNorm.updatedAt && cloudNorm.updatedAt && localNorm.updatedAt > cloudNorm.updatedAt) {
          chosen = localNorm;
        } else {
          chosen = cloudNorm;
        }
      } else {
        chosen = cloudNorm || localNorm;
      }

      if (chosen) {
        activeSetId = chosen.activeSetId || null;
        state.viewMode = chosen.viewMode || 'edit';
        state.showAnswers = chosen.showAnswers || false;
        state.updatedAt = chosen.updatedAt || Date.now();
        state.worksheet = chosen.worksheet;
      }

      if (activeSetId) {
        const activeSet = allSets.find(s => s.id === activeSetId);
        if (activeSet) {
          activeSetName = activeSet.name;
          updateActiveIndicator();
        } else {
          activeSetId = null;
        }
      }

      const migrated = await migrateInlineImagesToDB(state.worksheet);
      await hydrateWorksheetImages();
      if (migrated) saveState();
      renderLibrary();
    }

    // ── Library Workflows (Following sets_management_pattern.md) ──────────────

    async function createNewSet() {
      state.worksheet = {
        title: 'Untitled Worksheet',
        instructions: 'Please read each question carefully and provide the best possible answer.',
        questions: [],
        settings: { ...DEFAULT_WS_SETTINGS }
      };
      state.viewMode = 'edit';
      state.showAnswers = false;
      activeSetId = null;
      activeSetName = null;

      const nameInput = document.getElementById('set-name-input');
      if (nameInput) nameInput.value = '';

      updateActiveIndicator();
      render();
      saveState();
    }

    async function saveCurrentSet() {
      const nameInput = document.getElementById('set-name-input');
      const typedName = nameInput ? nameInput.value.trim() : '';
      const name = typedName || activeSetName || state.worksheet.title || '';
      if (!name || name.length > 100) {
        alert('Please enter a valid worksheet set name (1-100 characters)');
        return;
      }

      const stateData = {
        activeSetId,
        viewMode: state.viewMode,
        showAnswers: state.showAnswers,
        updatedAt: Date.now(),
        worksheet: state.worksheet
      };

      const targetExistingId = (!typedName || typedName === activeSetName) ? activeSetId : null;
      const newId = await saveWorksheetSetToDB(name, stateData, targetExistingId);
      if (newId) {
        activeSetId = newId;
        activeSetName = name;
        if (nameInput) nameInput.value = '';
        updateActiveIndicator();
        allSets = await getAllWorksheetSets();
        renderLibrary();
        if (typeof showConfirmModal === 'function') {
          await showConfirmModal(`Worksheet "${name}" has been saved to your library.`, {
            title: 'Worksheet Saved',
            confirmText: 'Nice!',
            cancelText: '',
            icon: 'check-circle',
            iconColor: 'green'
          });
        }
      }
    }

    async function loadSetFromList(id) {
      let stateData = null;
      let freshSet = null;

      if (!isSandbox() && typeof db !== 'undefined' && checkValidUuid(id)) {
        try {
          const { data: { user } } = await db.auth.getUser();
          if (user) {
            const { data } = await db.from('tools_worksheetmaker')
              .select('*')
              .eq('id', id)
              .single();
            if (data) {
              stateData = data.state_data;
              freshSet = { name: data.name, usageCount: data.usage_count || 0 };
            }
          }
        } catch (e) {}
      }

      if (!stateData) {
        const localSet = await loadSetFromLibrary(id);
        if (localSet) {
          stateData = localSet.stateData || localSet.state || localSet.worksheet || localSet;
          freshSet = { name: localSet.name, usageCount: localSet.usageCount || 0 };
        }
      }

      if (!stateData) {
        const cachedSet = allSets.find(s => s.id === id);
        if (cachedSet) {
          stateData = cachedSet.stateData;
          freshSet = { name: cachedSet.name, usageCount: cachedSet.usageCount || 0 };
        }
      }

      if (freshSet) {
        await updateWorksheetSetMetadata(id, { usageCount: freshSet.usageCount + 1 });
      }

      if (stateData && freshSet) {
        await loadWorksheetSet(stateData, id, freshSet.name);
      }
    }

    async function loadSetFromLibrary(id) {
      try {
        const localDb = await initDB();
        if (!localDb.objectStoreNames.contains(STORE_SETS)) return null;
        return new Promise((res) => {
          const tx = localDb.transaction(STORE_SETS, 'readonly');
          const store = tx.objectStore(STORE_SETS);
          const req = store.get(id);
          req.onsuccess = () => res(req.result);
          req.onerror = () => res(null);
        });
      } catch (e) {
        return null;
      }
    }

    async function loadWorksheetSet(stateData, id = null, name = '') {
      const normalized = normalizeWorksheetState(stateData);
      activeSetId = id;
      activeSetName = name;
      state.viewMode = normalized.viewMode || 'edit';
      state.showAnswers = normalized.showAnswers || false;
      state.worksheet = normalized.worksheet;

      const nameInput = document.getElementById('set-name-input');
      if (nameInput) nameInput.value = '';

      await migrateInlineImagesToDB(state.worksheet);
      await hydrateWorksheetImages();
      updateActiveIndicator();
      render();
      saveState();
    }

    function updateActiveIndicator() {
      const indicator = document.getElementById('active-set-indicator');
      const nameEl = document.getElementById('active-set-name');
      const saveBtn = document.getElementById('save-btn');

      if (indicator && nameEl) {
        if (activeSetId && activeSetName) {
          indicator.classList.remove('hidden');
          nameEl.textContent = activeSetName;
          if (saveBtn) saveBtn.innerHTML = '<i data-lucide="copy" class="w-3.5 h-3.5"></i> Save As';
        } else {
          indicator.classList.add('hidden');
          if (saveBtn) saveBtn.innerHTML = '<i data-lucide="save" class="w-3.5 h-3.5"></i> Save';
        }
        lucide.createIcons();
      }
    }

    function closeActiveSet() {
      activeSetId = null;
      activeSetName = null;
      updateActiveIndicator();
      renderLibrary();
    }

    function changeSetsSort() {
      const sortSelect = document.getElementById('sets-sort');
      if (sortSelect) {
        sortMode = sortSelect.value;
        renderLibrary();
      }
    }

    function renderLibrary() {
      const list = document.getElementById('sets-list');
      if (!list) return;

      let sorted = [...allSets];
      if (sortMode === 'recent') sorted.sort((a, b) => b.lastUsed - a.lastUsed);
      else if (sortMode === 'alpha') sorted.sort((a, b) => a.name.localeCompare(b.name));
      else if (sortMode === 'popular') sorted.sort((a, b) => b.usageCount - a.usageCount);

      if (sorted.length === 0) {
        list.innerHTML = '<p class="text-slate-400 dark:text-slate-500 text-[10px] italic p-2">No saved worksheets yet.</p>';
        return;
      }

      list.innerHTML = sorted.map(set => {
        const isActive = activeSetId === set.id;
        const qCount = set.stateData?.worksheet?.questions?.length || 0;
        const date = new Date(set.lastUsed).toLocaleDateString();

    async function deleteWorksheetSetPrompt(id) {

    const createDefaultQuestion = (type) => {
      const base = { id: generateId(), type, text: '', points: 1, imageId: '', imageSize: 'md' };
      switch (type) {
        case 'mcq': return { ...base, options: [{ id: generateId(), text: '', isCorrect: true, imageId: '' }, { id: generateId(), text: '', isCorrect: false, imageId: '' }] };
        case 'fib': return { ...base, text: 'The capital of Japan is ___ .', answer: 'Tokyo' };
        case 'sa': return { ...base, answer: '' };
        case 'tf': return { ...base, isTrue: true };
        case 'matching': return { ...base, pairs: [{ id: generateId(), left: '', right: '', leftImageId: '', rightImageId: '' }, { id: generateId(), left: '', right: '', leftImageId: '', rightImageId: '' }] };
        case 'essay': return { ...base, lines: 5, answer: '' };
        default: return base;
      }
    };

    // --- Actions & Helpers ---
    function collectAllUsedIds() {
      const used = new Set();
      (state.worksheet.questions || []).forEach(q => {
        if (q.id) used.add(String(q.id));
        if (Array.isArray(q.options)) q.options.forEach(o => { if (o.id) used.add(String(o.id)); });
        if (Array.isArray(q.pairs)) q.pairs.forEach(p => { if (p.id) used.add(String(p.id)); });
      });
      return used;
    }

    function getWorksheetSettings() {
      state.worksheet.settings = normalizeWorksheetSettings(state.worksheet.settings);
      return state.worksheet.settings;
    }

    function getTotalPoints() {
      return (state.worksheet.questions || []).reduce((sum, q) => sum + (Number(q.points) || 0), 0);
    }

    function addQuestion(type) {
      state.worksheet.questions.push(createDefaultQuestion(type));
      saveState();
      render(true); // pass true to scroll to bottom
    }

    function duplicateQuestion(id) {
      const idx = state.worksheet.questions.findIndex(q => q.id === id);
      if (idx < 0) return;
      const usedIds = collectAllUsedIds();
      const clone = normalizeQuestion(JSON.parse(JSON.stringify(state.worksheet.questions[idx])), {
        forceNewIds: true,
        usedIds
      });
      state.worksheet.questions.splice(idx + 1, 0, clone);
      saveState();
      render();
    }

    function changeQuestionType(id, nextType) {
      if (!Object.values(QUESTION_TYPES).some(t => t.id === nextType)) return;
      const idx = state.worksheet.questions.findIndex(q => q.id === id);
      if (idx < 0) return;
      const cur = state.worksheet.questions[idx];
      if (cur.type === nextType) return;

      let derivedAnswer = cur.answer || '';
      if (!derivedAnswer && cur.type === 'mcq' && Array.isArray(cur.options)) {
        const corr = cur.options.find(o => o.isCorrect) || cur.options[0];
        derivedAnswer = corr ? corr.text : '';
      } else if (!derivedAnswer && cur.type === 'tf') {
        derivedAnswer = cur.isTrue ? 'True' : 'False';
      }

      const nextRaw = {
        id: cur.id,
        type: nextType,
        text: cur.text || '',
        points: cur.points ?? 1,
        imageId: cur.imageId || '',
        imageSize: cur.imageSize || 'md'
      };

      if (nextType === 'mcq') {
        if (Array.isArray(cur.options) && cur.options.length > 0) {
          nextRaw.options = cur.options;
        } else {
          nextRaw.options = [
            { id: generateId(), text: derivedAnswer || 'Option A', isCorrect: true, imageId: '' },
            { id: generateId(), text: 'Option B', isCorrect: false, imageId: '' }
          ];
        }
      } else if (nextType === 'fib') {
        nextRaw.text = cur.text || 'Complete the sentence: ___ .';
        nextRaw.answer = derivedAnswer;
      } else if (nextType === 'sa') {
        nextRaw.answer = derivedAnswer;
      } else if (nextType === 'tf') {
        nextRaw.isTrue = typeof cur.isTrue === 'boolean'
          ? cur.isTrue
          : String(derivedAnswer).trim().toLowerCase() !== 'false';
      } else if (nextType === 'matching') {
        if (Array.isArray(cur.pairs) && cur.pairs.length > 0) {
          nextRaw.pairs = cur.pairs;
        } else if (Array.isArray(cur.options) && cur.options.length >= 2) {
          nextRaw.pairs = cur.options.slice(0, 4).map(o => ({
            id: generateId(),
            left: o.text || '',
            right: '',
            leftImageId: o.imageId || '',
            rightImageId: ''
          }));
        } else {
          nextRaw.pairs = [
            { id: generateId(), left: cur.text || '', right: derivedAnswer || '', leftImageId: '', rightImageId: '' },
            { id: generateId(), left: '', right: '', leftImageId: '', rightImageId: '' }
          ];
        }
      } else if (nextType === 'essay') {
        nextRaw.lines = cur.lines || 5;
        nextRaw.answer = derivedAnswer;
      }

      const usedIds = collectAllUsedIds();
      usedIds.delete(cur.id);
      state.worksheet.questions[idx] = normalizeQuestion(nextRaw, { forceNewIds: false, usedIds });
      saveState();
      render();
    }

    function moveQuestion(id, dir) {
      const idx = state.worksheet.questions.findIndex(q => q.id === id);
      const qList = state.worksheet.questions;
      if (dir === 'up' && idx > 0) {
        [qList[idx - 1], qList[idx]] = [qList[idx], qList[idx - 1]];
        saveState();
        render();
      } else if (dir === 'down' && idx < qList.length - 1) {
        [qList[idx + 1], qList[idx]] = [qList[idx], qList[idx + 1]];
        saveState();
        render();
      }
    }

    async function exportWorksheetJSON() {
      const embeddedImages = {};
      const qs = state.worksheet.questions || [];
      const collectId = async (imgId) => {
        const clean = sanitizeImageRef(imgId);
        if (!clean || embeddedImages[clean]) return;
        if (/^data:image\//i.test(clean)) {
          embeddedImages[clean] = clean;
          return;
        }
        if (!/^https?:/i.test(clean)) {
          const dataUrl = wsImageCache.get(clean) || await loadWsImageFromDB(clean);
          if (dataUrl) embeddedImages[clean] = dataUrl;
        }
      };

      for (const q of qs) {
        await collectId(q.imageId);
        if (Array.isArray(q.options)) {
          for (const opt of q.options) await collectId(opt.imageId);
        }
        if (Array.isArray(q.pairs)) {
          for (const pair of q.pairs) {
            await collectId(pair.leftImageId);
            await collectId(pair.rightImageId);
          }
        }
      }

      const payload = {
        format: 'klasskit-worksheet',
        version: 2,
        exportedAt: new Date().toISOString(),
        name: activeSetName || state.worksheet.title || 'Worksheet',
        worksheet: state.worksheet,
        embeddedImages
      };

      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const slug = (state.worksheet.title || 'worksheet').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'worksheet';
      a.href = url;
      a.download = `${slug}.worksheet.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function handleImportJsonFile(file) {
      if (!file) return;
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);

        if (parsed && typeof parsed === 'object' && parsed.embeddedImages && typeof parsed.embeddedImages === 'object') {
          for (const [imgId, dataUrl] of Object.entries(parsed.embeddedImages)) {
            if (imgId && typeof dataUrl === 'string' && /^data:image\//i.test(dataUrl)) {
              await saveWsImageToDB(imgId, dataUrl);
            }
          }
        }

        const candidate = (parsed && parsed.stateData) ? parsed.stateData : parsed;
        const normalized = normalizeWorksheetState(candidate, { forceNewIds: true });
        if (!normalized.worksheet || normalized.worksheet.questions.length === 0) {
          const confirmEmpty = await showConfirmModal(
            'No questions were found inside this JSON file. Load its title and instructions anyway?',
            { title: 'Empty Worksheet JSON', confirmText: 'Load Anyway', cancelText: 'Cancel', icon: 'alert-circle', iconColor: 'orange' }
          );
          if (!confirmEmpty) return;
        }

        activeSetId = null;
        activeSetName = null;
        loadedPresetId = null;
        state.viewMode = 'edit';
        state.showAnswers = false;
        state.worksheet = normalized.worksheet;

        await migrateInlineImagesToDB(state.worksheet);
        await hydrateWorksheetImages();
        saveState();
        render();

        const nameInput = document.getElementById('set-name-input');
        if (nameInput) nameInput.value = parsed.name || state.worksheet.title || '';
      } catch (err) {
        console.error('[WorksheetImportJSON] Failed:', err);
        alert('Could not read that JSON file. Please make sure it is a valid Worksheet Maker JSON export.');
      }
    }

          <div class="flex gap-4">
            ${getEditorInput('Blank Lines to Provide', q.lines, '', 'update-q-lines', `data-qid="${q.id}"`, 'number', 'w-32')}

    // --- HTML Generators (Preview) ---
    function getPreviewScaleMeta() {
      const settings = getWorksheetSettings();
      const map = {
        sm: { text: 'text-sm', blockGap: 'mb-5', wrapperText: 'text-base' },
        md: { text: 'text-base', blockGap: 'mb-8', wrapperText: 'text-lg' },
        lg: { text: 'text-lg', blockGap: 'mb-10', wrapperText: 'text-xl' }
      };
      return map[settings.fontSize] || map.md;
    }

    function getQuestionText(text) {
      const scale = getPreviewScaleMeta();
      return `<div class="${scale.text} font-medium mb-3 whitespace-pre-wrap">${esc(text)}</div>`;
    }

    function getQuestionImagePreviewHTML(q) {
      const src = getWsImageSrc(q && q.imageId);
      if (!src) return '';
      const clsMap = { sm: 'max-h-28', md: 'max-h-44', lg: 'max-h-64' };
      const sizeCls = clsMap[q.imageSize] || clsMap.md;
      return `<div class="my-2.5"><img src="${esc(src)}" alt="" class="${sizeCls} max-w-full object-contain rounded-lg border border-slate-200 bg-white p-1" /></div>`;
    }

    const fmtPreviewScore = (pts) => `(${pts} pt${pts !== 1 ? 's' : ''})`;

    function getPreviewWordBankHTML() {
      const settings = getWorksheetSettings();
      if (!settings.showWordBank) return '';
      const rawAnswers = [];
      const seen = new Set();
      (state.worksheet.questions || []).forEach((q) => {
        if (q.type !== 'fib' || !q.answer) return;
        const word = String(q.answer).trim();
        if (!word) return;
        const key = word.toLowerCase();
        if (!seen.has(key)) {
          seen.add(key);
          rawAnswers.push(word);
        }
      });
      if (rawAnswers.length === 0) return '';
      rawAnswers.sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
      return `
        <div class="mb-7 p-3.5 border-2 border-dashed border-gray-500 rounded bg-gray-50">
          <div class="text-xs font-bold uppercase tracking-wider text-gray-700 mb-2">Word Bank</div>
          <div class="flex flex-wrap gap-2">
            ${rawAnswers.map(w => `<span class="px-2.5 py-1 border border-gray-400 rounded bg-white text-sm font-semibold">${esc(w)}</span>`).join('')}
          </div>
        </div>
      `;
    }

    function getMCQPreview(q, index) {
      const scale = getPreviewScaleMeta();
      const hasOptImg = Array.isArray(q.options) && q.options.some(o => Boolean(getWsImageSrc(o.imageId)));
      return `
        <div class="print-block ${scale.blockGap}">
          <div class="flex gap-2">
            <span class="font-bold">${index}.</span>
            <div class="flex-1">
              <div class="flex justify-between items-baseline gap-4">
                ${getQuestionText(q.text)}
                <span class="text-sm font-semibold text-gray-500 shrink-0 print:text-black">${fmtPreviewScore(q.points)}</span>
              </div>
              ${getQuestionImagePreviewHTML(q)}
              <div class="${hasOptImg ? 'grid grid-cols-1 sm:grid-cols-2 gap-3 pl-2 mt-2' : 'flex flex-col gap-2 pl-2'}">
                ${q.options.map((opt, idx) => {
                  const letter = String.fromCharCode(65 + idx);
                  const isCorrect = state.showAnswers && opt.isCorrect;
                  const circleCls = isCorrect ? 'border-blue-600 text-blue-600 bg-blue-50' : 'border-slate-400 text-slate-600';
                  const textCls = isCorrect ? 'text-blue-800 font-semibold' : 'text-slate-800';
                  const optImg = getWsImageSrc(opt.imageId);
                  return `
                    <div class="flex items-start gap-3">
                      <span class="flex-shrink-0 w-6 h-6 rounded-full border flex items-center justify-center text-sm font-medium ${circleCls}">${letter}</span>
                      <div class="flex flex-col gap-1.5 pt-0.5">
                        ${optImg ? `<img src="${esc(optImg)}" alt="" class="max-h-28 max-w-[180px] object-contain rounded border border-slate-200 bg-white p-1" />` : ''}
                        ${(opt.text || !optImg) ? `<span class="${textCls}">${esc(opt.text) || '...'}</span>` : ''}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function getFIBPreview(q, index) {
      const scale = getPreviewScaleMeta();
      const rawText = String(q.text || '');
      const hasBlank = /_{3,}|\[blank\]/i.test(rawText);
      let displayHtml = esc(rawText);
      if (state.showAnswers && hasBlank) {
        displayHtml = displayHtml.replace(/_{3,}|\[blank\]/gi, `<strong class="text-blue-600 font-bold border-b-2 border-blue-600 px-2">${esc(q.answer) || 'Answer'}</strong>`);
      } else if (hasBlank) {
        displayHtml = displayHtml.replace(/_{3,}|\[blank\]/gi, `_________________`);
      }
      
      const extraLine = !hasBlank ? `
        <div class="mt-4 border-b border-black w-64 h-6">
          ${state.showAnswers ? `<span class="text-blue-600 font-bold">${esc(q.answer)}</span>` : ''}
        </div>
      ` : '';

      return `
        <div class="print-block ${scale.blockGap}">
          <div class="flex gap-2">
            <span class="font-bold">${index}.</span>
            <div class="flex-1">
              <div class="flex justify-between items-baseline gap-4">
                <div class="${scale.text} font-medium leading-relaxed whitespace-pre-wrap">${displayHtml}</div>
                <span class="text-sm font-semibold text-gray-500 shrink-0 print:text-black">${fmtPreviewScore(q.points)}</span>
              </div>
              ${getQuestionImagePreviewHTML(q)}
              ${extraLine}
            </div>
          </div>
        </div>
      `;
    }

    function getSAPreview(q, index) {
      const scale = getPreviewScaleMeta();
      const answerArea = state.showAnswers ? 
        `<div class="mt-2 text-blue-600 font-medium italic">Answer: ${esc(q.answer) || 'No answer key provided.'}</div>` :
        `<div class="mt-6 flex flex-col gap-8">
          <div class="w-full border-b border-slate-400"></div>
          <div class="w-full border-b border-slate-400"></div>
          <div class="w-full border-b border-slate-400"></div>
         </div>`;

      return `
        <div class="print-block ${scale.blockGap}">
          <div class="flex gap-2">
            <span class="font-bold">${index}.</span>
            <div class="flex-1 w-full">
              <div class="flex justify-between items-baseline gap-4">
                ${getQuestionText(q.text)}
                <span class="text-sm font-semibold text-gray-500 shrink-0 print:text-black">${fmtPreviewScore(q.points)}</span>
              </div>
              ${getQuestionImagePreviewHTML(q)}
              ${answerArea}
            </div>
          </div>

    }

    function getTFPreview(q, index) {
      const scale = getPreviewScaleMeta();
      const trueCls = (state.showAnswers && q.isTrue) ? 'border-blue-600 text-blue-700 bg-blue-50' : 'border-transparent';
      const falseCls = (state.showAnswers && !q.isTrue) ? 'border-blue-600 text-blue-700 bg-blue-50' : 'border-transparent';

      return `
        <div class="print-block ${scale.blockGap}">
          <div class="flex gap-2">
            <span class="font-bold">${index}.</span>
            <div class="flex-1">
              <div class="flex justify-between items-baseline gap-4">
                ${getQuestionText(q.text)}
                <span class="text-sm font-semibold text-gray-500 shrink-0 print:text-black">${fmtPreviewScore(q.points)}</span>
              </div>
              ${getQuestionImagePreviewHTML(q)}
              <div class="flex gap-6 mt-3 font-semibold text-slate-700">
                <span class="px-3 py-1 rounded-full border-2 ${trueCls}">True</span>
                <span class="px-3 py-1 rounded-full border-2 ${falseCls}">False</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function getMatchingPreview(q, index) {
      const scale = getPreviewScaleMeta();
      // Stable shuffle right items based on ID (safe for missing/non-string legacy IDs)
      const rightItems = [...(q.pairs || [])].sort((a, b) => String(a && a.id || '').localeCompare(String(b && b.id || '')));
      const labels = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
      const rightItemsWithLabels = rightItems.map((item, i) => ({ ...item, label: labels[i % labels.length] }));

      return `
        <div class="print-block ${scale.blockGap}">
          <div class="flex gap-2">
            <span class="font-bold">${index}.</span>
            <div class="flex-1 w-full">
              <div class="flex justify-between items-baseline gap-4">
                ${getQuestionText(q.text || 'Match the following items:')}
                <span class="text-sm font-semibold text-gray-500 shrink-0 print:text-black">${fmtPreviewScore(q.points)}</span>
              </div>
              ${getQuestionImagePreviewHTML(q)}
              <div class="flex gap-8 w-full mt-4">
                <div class="flex-1 flex flex-col gap-4 border-r border-slate-200 pr-4">
                  ${(q.pairs || []).map((pair, idx) => {
                    const correctRight = rightItemsWithLabels.find(r => r.id === pair.id);
                    const leftImg = getWsImageSrc(pair.leftImageId);
                    return `
                      <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2">
                          <span>${idx + 1}.</span>
                          ${leftImg ? `<img src="${esc(leftImg)}" alt="" class="max-h-20 max-w-[140px] object-contain rounded border border-slate-200 bg-white p-1" />` : ''}
                          ${pair.left ? `<span>${esc(pair.left)}</span>` : ''}
                        </div>
                        <span class="w-10 border-b border-slate-800 text-center inline-block ml-4 h-6 relative top-1 shrink-0">
                          ${state.showAnswers ? `<span class="text-blue-600 font-bold leading-none">${correctRight?.label || ''}</span>` : ''}
                        </span>
                      </div>
                    `;
                  }).join('')}
                </div>
                <div class="flex-1 flex flex-col gap-4">
                  ${rightItemsWithLabels.map(item => {
                    const rightImg = getWsImageSrc(item.rightImageId);
                    return `
                      <div class="flex items-center gap-2">
                        <span class="font-semibold">${item.label}.</span>
                        ${rightImg ? `<img src="${esc(rightImg)}" alt="" class="max-h-20 max-w-[140px] object-contain rounded border border-slate-200 bg-white p-1" />` : ''}
                        ${item.right ? `<span>${esc(item.right)}</span>` : ''}
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function getEssayPreview(q, index) {
      const scale = getPreviewScaleMeta();
      const lineHtml = `<div class="w-full border-b border-slate-400"></div>`.repeat(Math.max(1, q.lines));
      const answerArea = state.showAnswers ? `
        <div class="mt-4 border border-blue-200 bg-blue-50 text-blue-800 p-4 rounded-md text-sm whitespace-pre-wrap">
          <strong class="block mb-2 text-blue-900 uppercase text-xs tracking-wider">Teacher Rubric / Expected Elements:</strong>
          ${esc(q.answer) || 'No rubric provided.'}

      return `
        <div class="print-block ${scale.blockGap}">
          <div class="flex gap-2">
            <span class="font-bold">${index}.</span>
            <div class="flex-1 w-full">
              <div class="flex justify-between items-baseline gap-4">

                <span class="text-sm font-semibold text-gray-500 shrink-0 print:text-black">${fmtPreviewScore(q.points)}</span>

    // --- Zoom & Sidebar UI State ---
    let currentZoomMode = localStorage.getItem('worksheet_zoom') || '1';
    let sidebarCollapsed = false;

    function setPreviewZoom(mode) {
      currentZoomMode = String(mode);
      try { localStorage.setItem('worksheet_zoom', currentZoomMode); } catch (e) {}
      applyPreviewZoom();
    }

    function applyPreviewZoom() {
      const wrapper = document.getElementById('a4-zoom-wrapper');
      const sheetPane = document.getElementById('print-sheet-container');
      const area = document.getElementById('previewArea');
      if (wrapper) {
        let zoomVal = 1;
        if (currentZoomMode === 'fit') {
          const host = (sheetPane && sheetPane.clientWidth > 0) ? sheetPane : area;
          const availW = host ? Math.max(240, host.clientWidth - 40) : 794;
          zoomVal = Math.min(1, Math.max(0.35, +(availW / 810).toFixed(2)));
        } else if (state.viewMode === 'split') {
          // If Split View is active and 100% would overflow horizontally, still honor explicit zoom
          zoomVal = parseFloat(currentZoomMode) || 1;
        } else {
          zoomVal = parseFloat(currentZoomMode) || 1;
        }
        wrapper.style.zoom = String(zoomVal);
      }
      ['0.5', '0.75', '1', 'fit'].forEach((k) => {
        const btn = document.getElementById(`zoom-${k}`);
        if (!btn) return;
        const active = currentZoomMode === k;
        btn.classList.toggle('bg-brand-blue', active);
        btn.classList.toggle('text-white', active);
        btn.classList.toggle('text-slate-600', !active);
        btn.classList.toggle('dark:text-slate-300', !active);
      });
    }

    function toggleSidebar() {
      sidebarCollapsed = !sidebarCollapsed;
      const aside = document.getElementById('ws-sidebar');
      if (aside) {
        if (window.innerWidth < 768) {
          aside.classList.toggle('hidden', sidebarCollapsed);
        } else {
          aside.classList.toggle('hidden-panel-desktop', sidebarCollapsed);
        }
        setTimeout(() => applyPreviewZoom(), 260);
      }
    }

        if (q.type === 'sa') return getSAPreview(q, i + 1);
        if (q.type === 'tf') return getTFPreview(q, i + 1);

          if (Array.isArray(data)) starterPresets = data;

      } catch (e) {
        console.warn('Could not load worksheet presets:', e);
      }

        A1: 'bg-[#1ea7fd]/15 text-[#0369a1] dark:text-[#5cc0ff] border-[#1ea7fd]/40',
